function syncRoleFromUser(){
  if(currentUser && currentUser.role){
    state.role = currentUser.role;
    if(currentUser.role === 'profesor' && currentUser.categoria) state.profesorCategoria = currentUser.categoria;
  } else {
    state.role = 'visitante';
  }
}
function renderChrome(){
  var desktop = document.getElementById('chromeDesktop');
  var mobile = document.getElementById('chromeMobile');
  desktop.innerHTML = '';
  mobile.innerHTML = '';

  // --- acceso staff (login / usuario actual) ---
  var staffHtml =
    (currentUser
      ? ('<span class="staff-email" title="' + currentUser.email + '">' + currentUser.email + '</span>' +
         '<span class="staff-role">' + (currentUser.role ? ROLE_LABELS[currentUser.role] : 'Sin permisos asignados') + '</span>' +
         (currentUser.role==='admin' ? '<button class="staff-link" data-act="panel">Administradores</button>' : '') +
         '<button class="staff-link" data-act="logout">Cerrar sesión</button>')
      : '<button class="staff-link" data-act="login">Acceso staff</button>');
  [desktop, mobile].forEach(function(target){
    var box = document.createElement('div');
    box.className = 'staff-box';
    box.innerHTML = staffHtml;
    var loginBtn = box.querySelector('[data-act="login"]');
    if(loginBtn) loginBtn.onclick = openLoginModal;
    var logoutBtn = box.querySelector('[data-act="logout"]');
    if(logoutBtn) logoutBtn.onclick = function(){ auth.signOut(); };
    var panelBtn = box.querySelector('[data-act="panel"]');
    if(panelBtn) panelBtn.onclick = openStaffPanel;
    target.appendChild(box);
  });

  // --- selector de categoría ---
  if(state.role==='profesor'){
    var locked = document.createElement('div');
    locked.className = 'cat-locked';
    locked.textContent = 'Categoría: ' + state.profesorCategoria + ' (asignada)';
    desktop.appendChild(locked);
  } else {
    [desktop, mobile].forEach(function(target, idx){
      var wrap = idx===0 ? document.createElement('div') : null;
      var sel = document.createElement('select');
      sel.className = 'cat-select';
      CATEGORIES.forEach(function(cat){
        var o = document.createElement('option');
        o.value = cat; o.textContent = cat;
        if(activeCategoria()===cat) o.selected = true;
        sel.appendChild(o);
      });
      sel.onchange = function(){
        if(state.role==='visitante'){ visitorCategoria = sel.value; render(); }
        else { state.selectedCategoria = sel.value; persist(); render(); }
      };
      if(wrap){ wrap.className='cat-select-wrap'; wrap.appendChild(sel); target.appendChild(wrap); }
      else target.appendChild(sel);
    });
  }

  document.getElementById('brandTag').textContent = activeCategoria() + ' · ' + ROLE_LABELS[state.role];
}

/* ============ RENDER: NAV ============ */
function renderNav(){
  var descTop = document.getElementById('tabsDesktop');
  var descMob = document.getElementById('tabsMobile');
  descTop.innerHTML = '';
  descMob.innerHTML = '';
  visibleViews().forEach(function(v){
    var b1 = document.createElement('button');
    b1.className = 'tab-btn' + (currentView===v.id?' active':'');
    b1.innerHTML = '<span class="dot"></span>' + v.label;
    b1.onclick = function(){ currentView = v.id; render(); };
    descTop.appendChild(b1);

    var b2 = b1.cloneNode(true);
    b2.onclick = function(){ currentView = v.id; render(); };
    descMob.appendChild(b2);
  });
}

/* ============ RENDER: ENTRENAMIENTO ============ */
function renderEntrenamiento(){
  var el = document.createElement('div');
  var day = getTrainingDay(trainingDate);
  var wd = weekdayOf(trainingDate);
  var programado = scheduleFor(activeCategoria()).indexOf(wd) !== -1;

  el.innerHTML =
    '<div class="view-head">' +
      '<div><span class="pill">' + (programado ? 'Día programado' : 'Día no programado') + '</span>' +
      '<h1 style="margin-top:8px;">Entrenamiento del día</h1>' +
      '<p>Configura qué días entrena el equipo, elige la fecha y marca si hubo entrenamiento ese día — puede que un día programado no se dé, o que se agregue uno extra.</p></div>' +
    '</div>' +
    '<div class="focus-box">' +
      '<div class="focus-title">Días de entrenamiento programados</div>' +
      '<div class="focus-chips" id="scheduleChips"></div>' +
    '</div>' +
    '<div class="focus-box">' +
      '<div class="focus-title">Fecha a registrar</div>' +
      '<input type="date" id="trainingDateInput" class="cat-select" value="' + trainingDate + '" style="margin-bottom:12px;" />' +
      '<div><div class="attend-toggle" style="display:inline-flex;">' +
        '<button class="on-yes' + (day.held===true?' sel':'') + '" id="heldYes">Hubo entrenamiento</button>' +
        '<button class="on-no' + (day.held===false?' sel':'') + '" id="heldNo">No hubo entrenamiento</button>' +
      '</div></div>' +
      (day.held===false ? '<textarea class="fb-textarea" id="reasonInput" style="margin-top:10px;" placeholder="¿Por qué no hubo entrenamiento? (opcional — aplazado, lluvia, festivo…)">' + (day.reason||'') + '</textarea>' : '') +
    '</div>';

  var schedWrap = el.querySelector('#scheduleChips');
  WEEKDAYS.forEach(function(label, idx){
    var chip = document.createElement('button');
    chip.className = 'focus-chip' + (scheduleFor(activeCategoria()).indexOf(idx)!==-1 ? ' on':'');
    chip.textContent = label;
    chip.onclick = function(){
      var sched = scheduleFor(activeCategoria());
      var pos = sched.indexOf(idx);
      if(pos===-1) sched.push(idx); else sched.splice(pos,1);
      persist();
      render();
    };
    schedWrap.appendChild(chip);
  });

  el.querySelector('#trainingDateInput').onchange = function(e){
    trainingDate = e.target.value;
    render();
  };
  el.querySelector('#heldYes').onclick = function(){ day.held = true; persist(); render(); };
  el.querySelector('#heldNo').onclick = function(){ day.held = false; persist(); render(); };
  var reasonInput = el.querySelector('#reasonInput');
  if(reasonInput){ reasonInput.oninput = function(){ day.reason = reasonInput.value; persist(); }; }

  if(day.held===true){
    var summary = computeDayReport(trainingDate, day);
    if(summary){
      var summaryBox = document.createElement('div');
      summaryBox.className = 'focus-box';
      var qualityCls = summary.quality.indexOf('Buen')===0 ? 'up' : (summary.quality.indexOf('flojo')!==-1 ? 'down' : '');
      summaryBox.innerHTML =
        '<div class="focus-title">Resumen del día' + (day.finalized ? ' · <span style="color:var(--good);">Registro finalizado ✓</span>' : '') + '</div>' +
        '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px;">' +
          '<span class="attr-chip ' + qualityCls + '">' + summary.quality + '</span>' +
          '<span class="attr-chip">' + summary.presentes + ' asistieron</span>' +
          '<span class="attr-chip">' + summary.ausentes + ' faltaron</span>' +
          (summary.sinMarcar ? '<span class="attr-chip">' + summary.sinMarcar + ' sin marcar</span>' : '') +
        '</div>' +
        '<div style="font-size:13px;color:var(--ink-muted);">' +
          (summary.avgRating!=null ? 'Calificación promedio del día: <b style="color:var(--white);">' + summary.avgRating.toFixed(1) + '/10</b>. ' : '') +
          (summary.focusLabels.length ? 'Se trabajó: <b style="color:var(--white);">' + summary.focusLabels.join(', ') + '</b>.' : 'No se marcó qué se trabajó ese día.') +
        '</div>';
      el.appendChild(summaryBox);
    }

    if(day.finalized){
      var rosterBox = document.createElement('div');
      rosterBox.className = 'focus-box';
      var entries = categoryPlayers().map(function(p){
        var h = p.historial.find(function(x){ return x.type==='entrenamiento' && x.date===trainingDate; });
        return h ? {p:p, h:h} : null;
      }).filter(Boolean);
      rosterBox.innerHTML =
        '<div class="focus-title">Jugadores registrados este día (' + entries.length + ')</div>' +
        (entries.length ? entries.map(function(e){
          var deltaTxt = (sessionXp(e.h, e.p.categoria)>=0?'+':'') + sessionXp(e.h, e.p.categoria) + ' progreso';
          return '<div class="tl-item"><div class="tl-date"><b>' + e.p.name + '</b> · ' + posName(e.p.pos) + ' · Calificación ' + e.h.rating + '/10 · <span class="tl-delta ' + (sessionXp(e.h, e.p.categoria)>=0?'up':'down') + '">' + deltaTxt + '</span></div>' +
            (e.h.comment ? '<div class="tl-comment">' + e.h.comment + '</div>' : '') + '</div>';
        }).join('') : '<div style="font-size:12.5px;color:var(--ink-faint);">Nadie quedó registrado con calificación este día.</div>') +
        '<div class="save-row" style="margin-top:14px;"><button class="btn-save-player" id="reopenBtn" style="background:var(--navy-700);">Reabrir edición</button></div>';
      el.appendChild(rosterBox);
      el.querySelector('#reopenBtn').onclick = function(){ day.finalized = false; persist(); render(); };
      return el;
    }

    var focusBox = document.createElement('div');
    focusBox.className = 'focus-box';
    focusBox.innerHTML = '<div class="focus-title">¿Qué se trabajó este día? (empieza vacío — marca solo lo que aplique)</div><div class="focus-chips" id="focusChips"></div>';
    el.appendChild(focusBox);
    var chipsWrap = focusBox.querySelector('#focusChips');
    ATTRS.forEach(function(a){
      var chip = document.createElement('button');
      chip.className = 'focus-chip' + (day.focus[a.key] ? ' on':'');
      chip.textContent = a.label;
      chip.onclick = function(){
        day.focus[a.key] = !day.focus[a.key];
        persist();
        render();
      };
      chipsWrap.appendChild(chip);
    });

    var rowsWrap = document.createElement('div');
    el.appendChild(rowsWrap);
    categoryPlayers().forEach(function(p){
      rowsWrap.appendChild(renderTrainingRow(p, trainingDate, day));
    });

    var finalizeRow = document.createElement('div');
    finalizeRow.className = 'save-row';
    finalizeRow.style.marginTop = '16px';
    finalizeRow.innerHTML = '<button class="btn-save-player" id="finalizeBtn">Finalizar registro del día</button>';
    el.appendChild(finalizeRow);
    el.querySelector('#finalizeBtn').onclick = function(){ day.finalized = true; persist(); render(); };
  } else if(day.held===false){
    var note = document.createElement('div');
    note.className = 'empty-note';
    note.style.marginTop = '18px';
    note.textContent = 'No se registra asistencia ni calificación para este día.';
    el.appendChild(note);
  }
  return el;
}

function computeDayReport(dateStr, day){
  var players = categoryPlayers();
  var entries = players.map(function(p){
    return p.historial.find(function(h){ return h.type==='entrenamiento' && h.date===dateStr; });
  }).filter(Boolean);
  var presentes = 0, ausentes = 0;
  presentes = players.filter(function(p){ return day.attendance[p.id]===true; }).length;
  ausentes = players.filter(function(p){ return day.attendance[p.id]===false; }).length;
  var sinMarcar = players.length - presentes - ausentes;
  if(presentes===0 && ausentes===0) return null; // nada registrado todavía este día
  var avgRating = entries.length ? entries.reduce(function(s,e){return s+e.rating;},0)/entries.length : null;
  var quality = 'Sin calificaciones registradas todavía';
  if(avgRating!=null){
    var bd = baseDelta(Math.round(avgRating));
    quality = bd > 0 ? 'Buen entrenamiento' : (bd < 0 ? 'Entrenamiento flojo' : 'Entrenamiento parejo');
  }
  var focusLabels = ATTRS.filter(function(a){ return day.focus[a.key]; }).map(function(a){ return a.label; });
  return { presentes:presentes, ausentes:ausentes, sinMarcar:sinMarcar, avgRating:avgRating, quality:quality, focusLabels:focusLabels };
}

function renderTrainingRow(p, dateStr, day){
  var focus = day.focus;
  var existingEntry = p.historial.find(function(h){ return h.type==='entrenamiento' && h.date===dateStr; });
  var attendanceMark = day.attendance[p.id];
  var draft = {
    asistio: existingEntry ? true : (typeof attendanceMark==='boolean' ? attendanceMark : null),
    rating: existingEntry ? existingEntry.rating : null,
    feedback: existingEntry ? (existingEntry.feedback||'') : '',
    quick: existingEntry ? Object.assign({}, existingEntry.quickValues||{}) : {}
  };

  var row = document.createElement('div');
  row.className = 'player-row' + (existingEntry ? ' done' : '');

  var initials = avatarInner(p);

  row.innerHTML =
    '<div class="player-row-top">' +
      '<div class="avatar">' + initials + '</div>' +
      '<div class="player-name-block">' +
        '<div class="player-name">' + p.name + (existingEntry ? ' <span style="font-size:11px;color:var(--ink-faint);font-weight:400;">(ya registrado — editable)</span>' : '') + '</div>' +
        '<div class="player-meta">' + posName(p.pos) + ' · Valoración actual ' + p.valoracion + '</div>' +
      '</div>' +
      '<div class="attend-toggle">' +
        '<button class="on-yes' + (draft.asistio===true?' sel':'') + '">Asistió</button>' +
        '<button class="on-no' + (draft.asistio===false?' sel':'') + '">No asistió</button>' +
      '</div>' +
    '</div>' +
    '<div class="rating-body" style="display:' + (draft.asistio===true?'block':'none') + '"></div>';

  var btnYes = row.querySelector('.on-yes');
  var btnNo = row.querySelector('.on-no');
  var ratingBody = row.querySelector('.rating-body');

  btnYes.onclick = function(){ draft.asistio = true; day.attendance[p.id] = true; persist(); renderRatingBody(); refreshRowChrome(); };
  btnNo.onclick = function(){
    draft.asistio = false; draft.rating=null; draft.feedback=''; day.attendance[p.id] = false;
    if(existingEntry){ // si ya estaba calificado, ese registro se quita
      p.historial = p.historial.filter(function(h){ return h!==existingEntry; });
      existingEntry = null; row.classList.remove('done');
    }
    persist(); ratingBody.style.display='none'; refreshRowChrome();
  };

  function refreshRowChrome(){
    btnYes.className = 'on-yes' + (draft.asistio===true?' sel':'');
    btnNo.className = 'on-no' + (draft.asistio===false?' sel':'');
    ratingBody.style.display = draft.asistio===true ? 'block' : 'none';
  }

  function renderRatingBody(){
    var quickAttrs = quickAttrsFor(p.pos, focus);

    ratingBody.innerHTML =
      '<div class="rating-block">' +
        '<div class="rating-label">¿Qué tal fue su entrenamiento en general? (1 a 10)</div>' +
        '<div class="rating-scale"></div>' +
        '<div class="rating-label" style="margin-top:14px;">Calificación rápida — solo lo que este puesto necesita y se marcó como trabajado hoy</div>' +
        '<div class="quick-attrs"></div>' +
        '<div class="rating-label" style="margin-top:14px;">Retroalimentación escrita (opcional, para algo que las opciones de arriba no cubran)</div>' +
        '<textarea class="fb-textarea" placeholder="Ej: hoy también mostró liderazgo con los más nuevos…"></textarea>' +
        '<div class="save-row"><button class="btn-save-player">' + (existingEntry ? 'Actualizar' : 'Guardar') + '</button></div>' +
      '</div>';

    var scale = ratingBody.querySelector('.rating-scale');
    for(var i=1;i<=RATING_MAX;i++){
      (function(i){
        var b = document.createElement('button');
        b.textContent = i;
        if(draft.rating===i) b.classList.add('sel');
        b.onclick = function(){
          draft.rating = i;
          scale.querySelectorAll('button').forEach(function(x){x.classList.remove('sel');});
          b.classList.add('sel');
        };
        scale.appendChild(b);
      })(i);
    }

    var quickWrap = ratingBody.querySelector('.quick-attrs');
    if(quickAttrs.length===0){
      quickWrap.innerHTML = '<div style="font-size:12px;color:var(--ink-faint);">Nada de lo marcado en "¿Qué se trabajó este día?" aplica a este puesto — puede quedar solo con la calificación general y, si quiere, un comentario.</div>';
    } else {
      quickAttrs.forEach(function(a){
        var qrow = document.createElement('div');
        qrow.className = 'quick-attr-row';
        qrow.innerHTML = '<div class="quick-attr-label">' + a.label + '</div><div class="quick-attr-scale"></div>';
        var qscale = qrow.querySelector('.quick-attr-scale');
        for(var i=1;i<=RATING_MAX;i++){
          (function(i){
            var qb = document.createElement('button');
            qb.textContent = i;
            if(draft.quick[a.key]===i) qb.classList.add('sel');
            qb.onclick = function(){
              draft.quick[a.key] = i;
              qscale.querySelectorAll('button').forEach(function(x){x.classList.remove('sel');});
              qb.classList.add('sel');
            };
            qscale.appendChild(qb);
          })(i);
        }
        quickWrap.appendChild(qrow);
      });
    }

    var textarea = ratingBody.querySelector('.fb-textarea');
    textarea.value = draft.feedback || '';
    textarea.oninput = function(){ draft.feedback = textarea.value; };

    var saveBtn = ratingBody.querySelector('.btn-save-player');
    saveBtn.disabled = false;
    saveBtn.onclick = function(){
      if(draft.rating==null){ return; }
      var quickKeys = Object.keys(draft.quick);
      var quickRatings = quickKeys.map(function(k){
        return {key:k, value:draft.quick[k], weight:profileFor(p.categoria, draft.pos || p.pos)[k]};
      });
      var hits = analyzeFeedback(draft.feedback||'', draft.pos || p.pos, quickKeys);
      var newDelta = computeDelta(draft.rating, hits, quickRatings);
      var attrsHitLabels = quickRatings.map(function(q){
        var a = ATTRS.find(function(x){return x.key===q.key;});
        return a.label + ' (' + q.value + '/10)';
      }).concat(hits.map(function(h){return h.label + ' (texto)';}));
      var displayComment = draft.feedback || (quickRatings.length ? '(calificado por atributos, sin comentario escrito)' : '(sin comentario)');
      var quickValuesObj = {};
      quickKeys.forEach(function(k){ quickValuesObj[k] = draft.quick[k]; });

      if(existingEntry){
        p.valoracion += (newDelta - existingEntry.delta);
        existingEntry.rating = draft.rating;
        existingEntry.delta = newDelta;
        existingEntry.feedback = draft.feedback||'';
        existingEntry.comment = displayComment;
        existingEntry.attrsHit = attrsHitLabels;
        existingEntry.quickValues = quickValuesObj;
      } else {
        p.valoracion += newDelta;
        existingEntry = {
          type:'entrenamiento', date: dateStr, asistio:true,
          rating: draft.rating, delta: newDelta,
          feedback: draft.feedback||'', comment: displayComment,
          quickValues: quickValuesObj, attrsHit: attrsHitLabels
        };
        p.historial.unshift(existingEntry);
      }
      existingEntry.pos = draft.pos || p.pos; persist();
      saveBtn.textContent = 'Guardado ✓';
      saveBtn.classList.add('saved');
      row.classList.add('done');
    };
    setupAutoSave(ratingBody, draft, existingEntry);
  }

  if(draft.asistio===true) renderRatingBody();
  return row;
}

/* ============ RENDER: PARTIDO DEL DÍA ============ */
// Guardado automático de una fila (entrenamiento o partido): cada toque se guarda solo; el texto, al dejar de escribir.
function setupAutoSave(ratingBody, draft, existingEntry){
  var btn = ratingBody.querySelector('.btn-save-player');
  if(btn && !btn.classList.contains('saved')) btn.textContent = existingEntry ? 'Guardado ✓' : 'Se guarda solo al calificar';
  if(existingEntry && btn) btn.classList.add('saved');
  if(ratingBody.__autoSave) return; // los escuchas se ponen una sola vez por fila
  ratingBody.__autoSave = true;
  var timer = null;
  function schedule(delay){
    clearTimeout(timer);
    timer = setTimeout(function(){
      var b = ratingBody.querySelector('.btn-save-player');
      if(b && draft.rating!=null) b.onclick();
    }, delay);
  }
  ratingBody.addEventListener('click', function(e){
    if(e.target.tagName==='BUTTON' && !e.target.classList.contains('btn-save-player')) schedule(0);
  });
  ratingBody.addEventListener('input', function(e){
    var b = ratingBody.querySelector('.btn-save-player');
    if(b && draft.rating!=null){ b.textContent = 'Guardando…'; b.classList.remove('saved'); }
    schedule(e.target.tagName==='TEXTAREA' ? 900 : 350);
  });
  ratingBody.addEventListener('change', function(e){ if(e.target.tagName==='SELECT') schedule(0); });
}
// Posiciones para el partido: primero las del jugador, luego las demás
function playerPositions(p){ return [p.pos].concat((p.posExtra||[]).filter(function(c){ return c!==p.pos; })); }
function matchPosOptions(p, sel){
  var mine = playerPositions(p);
  var others = POSITIONS.map(function(x){ return x.code; }).filter(function(c){ return mine.indexOf(c)===-1; });
  function opt(c){ return '<option value="' + c + '"' + (c===sel?' selected':'') + '>' + posName(c) + '</option>'; }
  return '<optgroup label="Sus posiciones">' + mine.map(opt).join('') + '</optgroup><optgroup label="Otras posiciones">' + others.map(opt).join('') + '</optgroup>';
}
function allMatchDates(){
  var set = {};
  categoryPlayers().forEach(function(p){
    p.historial.forEach(function(h){ if(h.type==='partido') set[h.date] = true; });
  });
  return Object.keys(set).sort().reverse();
}

function renderPartido(){
  var el = document.createElement('div');
  var loggedDates = allMatchDates();
  el.innerHTML =
    '<div class="view-head">' +
      '<div><h1>Partido del día</h1>' +
      '<p>Mismo modelo que el entrenamiento, pero para partido: aquí sí se pregunta por todo lo que le exige el puesto (en un partido, de una u otra forma, todo se pone a prueba), y además se suman goles y asistencias. Puede registrar más de un partido en la semana — cada uno con su propia fecha.</p></div>' +
    '</div>' +
    '<div class="focus-box">' +
      '<div class="focus-title">Fecha del partido</div>' +
      '<input type="date" id="matchDateInput" class="cat-select" value="' + matchDate + '" />' +
      (loggedDates.length ? '<div class="focus-title" style="margin-top:14px;">Partidos ya registrados</div><div class="focus-chips" id="loggedDates"></div>' : '') +
    '</div>' +
    '<div id="matchRows"></div>';

  el.querySelector('#matchDateInput').onchange = function(e){
    matchDate = e.target.value;
    render();
  };
  if(loggedDates.length){
    var chipsWrap = el.querySelector('#loggedDates');
    loggedDates.forEach(function(d){
      var chip = document.createElement('button');
      chip.className = 'focus-chip' + (d===matchDate ? ' on' : '');
      chip.textContent = fmtDate(d);
      chip.onclick = function(){ matchDate = d; render(); };
      chipsWrap.appendChild(chip);
    });
  }

  var rowsWrap = el.querySelector('#matchRows');
  categoryPlayers().forEach(function(p){
    rowsWrap.appendChild(renderMatchRow(p, matchDate));
  });
  return el;
}

function renderMatchRow(p, dateStr){
  var existingEntry = p.historial.find(function(h){ return h.type==='partido' && h.date===dateStr; });
  var draft = {
    convocado: existingEntry ? true : null,
    rating: existingEntry ? existingEntry.rating : null,
    feedback: existingEntry ? (existingEntry.feedback||'') : '',
    goles: existingEntry ? (existingEntry.goles||0) : 0,
    asistencias: existingEntry ? (existingEntry.asistencias||0) : 0,
    pos: existingEntry && existingEntry.pos ? existingEntry.pos : p.pos,
    quick: existingEntry ? Object.assign({}, existingEntry.quickValues||{}) : {}
  };

  var row = document.createElement('div');
  row.className = 'player-row' + (existingEntry ? ' done' : '');

  var initials = avatarInner(p);

  row.innerHTML =
    '<div class="player-row-top">' +
      '<div class="avatar">' + initials + '</div>' +
      '<div class="player-name-block">' +
        '<div class="player-name">' + p.name + (existingEntry ? ' <span style="font-size:11px;color:var(--ink-faint);font-weight:400;">(ya registrado — editable)</span>' : '') + '</div>' +
        '<div class="player-meta">' + posName(p.pos) + ' · Valoración actual ' + p.valoracion + '</div>' +
      '</div>' +
      '<div class="attend-toggle">' +
        '<button class="on-yes' + (draft.convocado===true?' sel':'') + '">Convocado</button>' +
        '<button class="on-no' + (draft.convocado===false?' sel':'') + '">No convocado</button>' +
      '</div>' +
    '</div>' +
    '<div class="rating-body" style="display:' + (draft.convocado===true?'block':'none') + '"></div>';

  var btnYes = row.querySelector('.on-yes');
  var btnNo = row.querySelector('.on-no');
  var ratingBody = row.querySelector('.rating-body');

  btnYes.onclick = function(){ draft.convocado = true; renderRatingBody(); refreshRowChrome(); };
  btnNo.onclick = function(){
    draft.convocado = false; draft.rating=null; draft.feedback='';
    if(existingEntry){ // si ya estaba calificado en este partido, ese registro se quita (con sus goles y asistencias)
      p.goles -= (existingEntry.goles||0); p.asistencias -= (existingEntry.asistencias||0);
      p.historial = p.historial.filter(function(h){ return h!==existingEntry; });
      existingEntry = null; row.classList.remove('done');
      persist();
    }
    ratingBody.style.display='none'; refreshRowChrome();
  };

  function refreshRowChrome(){
    btnYes.className = 'on-yes' + (draft.convocado===true?' sel':'');
    btnNo.className = 'on-no' + (draft.convocado===false?' sel':'');
    ratingBody.style.display = draft.convocado===true ? 'block' : 'none';
  }

  function renderRatingBody(){
    var quickAttrs = quickAttrsFor(draft.pos, null); // partido: sin filtro de "qué se trabajó", va completo, según la posición en que jugó

    ratingBody.innerHTML =
      '<div class="rating-block">' +
        '<div class="rating-label">Posición en la que jugó este partido</div>' +
        '<select class="cat-select match-pos">' + matchPosOptions(p, draft.pos) + '</select>' +
        '<div class="rating-label" style="margin-top:14px;">¿Qué tal fue en el partido? (1 a 10)</div>' +
        '<div class="rating-scale"></div>' +
        '<div class="rating-label" style="margin-top:14px;">Goles y asistencias en este partido (opcional)</div>' +
        '<div class="match-stat-row">' +
          '<label>Goles <input type="number" min="0" class="match-num" id="golesInput" value="' + draft.goles + '" /></label>' +
          '<label>Asistencias <input type="number" min="0" class="match-num" id="asisInput" value="' + draft.asistencias + '" /></label>' +
        '</div>' +
        '<div class="rating-label" style="margin-top:14px;">Calificación rápida — todo lo que le exige este puesto en partido</div>' +
        '<div class="quick-attrs"></div>' +
        '<div class="rating-label" style="margin-top:14px;">Retroalimentación escrita (opcional)</div>' +
        '<textarea class="fb-textarea" placeholder="Ej: bien plantado tácticamente, pero perdió varios duelos aéreos…"></textarea>' +
        '<div class="save-row"><button class="btn-save-player">' + (existingEntry ? 'Actualizar' : 'Guardar') + '</button></div>' +
      '</div>';

    var scale = ratingBody.querySelector('.rating-scale');
    for(var i=1;i<=RATING_MAX;i++){
      (function(i){
        var b = document.createElement('button');
        b.textContent = i;
        if(draft.rating===i) b.classList.add('sel');
        b.onclick = function(){
          draft.rating = i;
          scale.querySelectorAll('button').forEach(function(x){x.classList.remove('sel');});
          b.classList.add('sel');
        };
        scale.appendChild(b);
      })(i);
    }

    var golesInput = ratingBody.querySelector('#golesInput');
    var asisInput = ratingBody.querySelector('#asisInput');
    golesInput.oninput = function(){ draft.goles = parseInt(golesInput.value,10) || 0; };
    asisInput.oninput = function(){ draft.asistencias = parseInt(asisInput.value,10) || 0; };
    ratingBody.querySelector('.match-pos').onchange = function(e){ draft.pos = e.target.value; renderRatingBody(); };

    var quickWrap = ratingBody.querySelector('.quick-attrs');
    if(quickAttrs.length===0){
      quickWrap.innerHTML = '<div style="font-size:12px;color:var(--ink-faint);">Este puesto no tiene atributos por encima del umbral (≥ ' + QUICK_THRESHOLD + '/10) — configúrelo en "Perfil de exigencia".</div>';
    } else {
      quickAttrs.forEach(function(a){
        var qrow = document.createElement('div');
        qrow.className = 'quick-attr-row';
        qrow.innerHTML = '<div class="quick-attr-label">' + a.label + '</div><div class="quick-attr-scale"></div>';
        var qscale = qrow.querySelector('.quick-attr-scale');
        for(var i=1;i<=RATING_MAX;i++){
          (function(i){
            var qb = document.createElement('button');
            qb.textContent = i;
            if(draft.quick[a.key]===i) qb.classList.add('sel');
            qb.onclick = function(){
              draft.quick[a.key] = i;
              qscale.querySelectorAll('button').forEach(function(x){x.classList.remove('sel');});
              qb.classList.add('sel');
            };
            qscale.appendChild(qb);
          })(i);
        }
        quickWrap.appendChild(qrow);
      });
    }

    var textarea = ratingBody.querySelector('.fb-textarea');
    textarea.value = draft.feedback || '';
    textarea.oninput = function(){ draft.feedback = textarea.value; };

    var saveBtn = ratingBody.querySelector('.btn-save-player');
    saveBtn.disabled = false;
    saveBtn.onclick = function(){
      if(draft.rating==null){ return; }
      var quickKeys = Object.keys(draft.quick);
      var quickRatings = quickKeys.map(function(k){
        return {key:k, value:draft.quick[k], weight:profileFor(p.categoria, draft.pos || p.pos)[k]};
      });
      var hits = analyzeFeedback(draft.feedback||'', draft.pos || p.pos, quickKeys);
      var newDelta = computeDelta(draft.rating, hits, quickRatings);
      var attrsHitLabels = quickRatings.map(function(q){
        var a = ATTRS.find(function(x){return x.key===q.key;});
        return a.label + ' (' + q.value + '/10)';
      }).concat(hits.map(function(h){return h.label + ' (texto)';}));
      var displayComment = draft.feedback || (quickRatings.length ? '(calificado por atributos, sin comentario escrito)' : '(sin comentario)');
      var quickValuesObj = {};
      quickKeys.forEach(function(k){ quickValuesObj[k] = draft.quick[k]; });

      if(existingEntry){
        p.valoracion += (newDelta - existingEntry.delta);
        p.goles += (draft.goles - (existingEntry.goles||0));
        p.asistencias += (draft.asistencias - (existingEntry.asistencias||0));
        existingEntry.rating = draft.rating;
        existingEntry.delta = newDelta;
        existingEntry.goles = draft.goles;
        existingEntry.asistencias = draft.asistencias;
        existingEntry.feedback = draft.feedback||'';
        existingEntry.comment = displayComment;
        existingEntry.attrsHit = attrsHitLabels;
        existingEntry.quickValues = quickValuesObj;
      } else {
        p.valoracion += newDelta;
        p.goles += draft.goles;
        p.asistencias += draft.asistencias;
        existingEntry = {
          type:'partido', date: dateStr, asistio:true,
          rating: draft.rating, delta: newDelta,
          goles: draft.goles, asistencias: draft.asistencias,
          feedback: draft.feedback||'', comment: displayComment,
          quickValues: quickValuesObj, attrsHit: attrsHitLabels
        };
        p.historial.unshift(existingEntry);
      }
      existingEntry.pos = draft.pos || p.pos; persist();
      saveBtn.textContent = 'Guardado ✓';
      saveBtn.classList.add('saved');
      row.classList.add('done');
    };
    setupAutoSave(ratingBody, draft, existingEntry);
  }

  if(draft.convocado===true) renderRatingBody();
  return row;
}

/* ============ RENDER: CARTAS ============ */
function sparkPath(hist){
  if(hist.length<2) return '';
  var vals = hist.slice().reverse().map(function(h){return h.delta;});
  var running = [];
  var acc = 0;
  vals.forEach(function(v){ acc+=v; running.push(acc); });
  var min = Math.min.apply(null, running), max = Math.max.apply(null, running);
  var range = (max-min)||1;
  var w=200, h=26, step = w/(running.length-1);
  var pts = running.map(function(v,i){
    var x = i*step;
    var y = h - ((v-min)/range)*h;
    return x.toFixed(1)+','+y.toFixed(1);
  });
  return pts.join(' ');
}

function formBadge(hist){
  var recent = hist.slice(0,3);
  if(!recent.length) return {label:'Sin registros aún', cls:''};
  var sum = recent.reduce(function(s,h){return s+(h.delta||0);},0);
  if(sum > 1) return {label:'Buen momento', cls:'up'};
  if(sum < -1) return {label:'En construcción', cls:'down'};
  return {label:'Rendimiento constante', cls:''};
}
function bestAttribute(hist){
  var avgs = attributeAverages(hist);
  return avgs.length ? avgs[0] : null;
}
function recentHighlight(hist){
  var found = hist.find(function(h){ return h.delta > 0 && h.feedback && h.feedback.trim().length > 3; });
  return found || null;
}

/* ============ RENDER: PERFIL DE EXIGENCIA ============ */
var perfilUi = {scope:'club'};
function renderPerfil(){
  var el = document.createElement('div');
  var isAdmin = state.role==='admin';
  var scope = isAdmin ? perfilUi.scope : state.profesorCategoria;
  if(isAdmin && scope!=='club' && state.categories.indexOf(scope)===-1) scope = perfilUi.scope = 'club';
  // el administrador edita el predeterminado del club y ve el de cada categoría; cada profesor edita solo el suyo
  var editable = isAdmin ? scope==='club' : true;
  function overrides(){ return scope==='club' ? {} : ((state.categoryProfiles||{})[scope] || {}); }
  el.innerHTML =
    '<div class="view-head"><div>' +
      '<h1>Perfil de exigencia por posición</h1>' +
      '<p>' + (isAdmin
        ? (scope==='club'
            ? 'Este es el perfil predeterminado del club. Cada categoría arranca con él y su profesor lo ajusta a su manera.'
            : 'Así tiene configurado su perfil ' + escHtml(scope) + '. Solo su profesor lo edita; aquí lo ves como referencia.')
        : 'Este es el perfil de ' + escHtml(scope) + '. Arranca igual al del club y lo puedes ajustar posición por posición: tus cambios solo afectan a tu categoría.') + '</p>' +
    '</div>' +
    (isAdmin ? '<div><select class="cat-select" id="perfilScope"><option value="club"' + (scope==='club'?' selected':'') + '>Predeterminado del club</option>' +
      state.categories.map(function(c){
        var n = Object.keys((state.categoryProfiles||{})[c] || {}).length;
        return '<option value="' + escHtml(c) + '"' + (c===scope?' selected':'') + '>' + escHtml(c) + (n ? ' · ' + n + (n===1?' posición personalizada':' posiciones personalizadas') : ' · igual al club') + '</option>';
      }).join('') + '</select></div>' : '') +
    '</div>' +
    '<div class="perfil-layout">' +
      '<div class="pos-list" id="posList"></div>' +
      '<div class="perfil-panel" id="perfilPanel"></div>' +
    '</div>';
  var scopeSel = el.querySelector('#perfilScope');
  if(scopeSel) scopeSel.onchange = function(){ perfilUi.scope = scopeSel.value; render(); };

  var posList = el.querySelector('#posList');
  POSITIONS.forEach(function(pos){
    var item = document.createElement('div');
    item.className = 'pos-item' + (state.activePos===pos.code?' active':'');
    item.innerHTML = pos.name + '<small>' + (overrides()[pos.code] ? 'Personalizado' : pos.short) + '</small>';
    item.onclick = function(){ state.activePos = pos.code; renderPerfilPanel(); posList.querySelectorAll('.pos-item').forEach(function(x){x.classList.remove('active');}); item.classList.add('active'); };
    posList.appendChild(item);
  });

  var panel = el.querySelector('#perfilPanel');
  function renderPerfilPanel(){
    var pos = POSITIONS.find(function(p){return p.code===state.activePos;});
    var custom = !!overrides()[pos.code];
    var profile = scope==='club' ? state.profiles[pos.code] : profileFor(scope, pos.code);
    panel.innerHTML = '<h3>' + pos.name + '</h3>' +
      (scope!=='club' ? '<span class="pill" style="margin-bottom:10px;">' + (custom ? 'Personalizado para ' + escHtml(scope) : 'Igual al predeterminado del club') + '</span>' : '') +
      '<div class="desc">' + pos.short + ' — ' + (editable ? 'mueva cada barra de 0 a 10 según qué tanto le exige a un jugador en este puesto.' : 'solo lectura.') + ' Desde ' + QUICK_THRESHOLD + '/10, esa cualidad le aparece al profesor como pregunta rápida durante el entrenamiento, sin que tenga que escribir nada.</div>';
    ATTRS.forEach(function(a){
      var row = document.createElement('div');
      row.className = 'attr-row';
      row.innerHTML =
        '<div class="attr-row-top"><span class="name">' + a.label + '</span><span class="val">' + profile[a.key] + '/10</span></div>' +
        '<input type="range" min="0" max="10" step="1" value="' + profile[a.key] + '"' + (editable?'':' disabled') + ' />';
      var input = row.querySelector('input');
      var valSpan = row.querySelector('.val');
      input.oninput = function(){
        if(!editable) return;
        if(scope!=='club' && !custom){
          // primer cambio en esta posición: la categoría se queda con su propia copia
          state.categoryProfiles = state.categoryProfiles || {};
          state.categoryProfiles[scope] = state.categoryProfiles[scope] || {};
          state.categoryProfiles[scope][pos.code] = Object.assign({}, profile);
          profile = state.categoryProfiles[scope][pos.code];
          custom = true;
        }
        profile[a.key] = parseInt(input.value,10);
        valSpan.textContent = profile[a.key] + '/10';
        persist();
        updateSummary();
      };
      panel.appendChild(row);
    });
    var summary = document.createElement('div');
    summary.className = 'summary-box';
    panel.appendChild(summary);
    if(scope!=='club' && editable){
      var resetRow = document.createElement('div');
      resetRow.className = 'save-row';
      resetRow.innerHTML = '<button class="pl-btn ghost small">Volver al predeterminado del club</button>';
      resetRow.querySelector('button').onclick = function(){
        if(!overrides()[pos.code]) return;
        delete state.categoryProfiles[scope][pos.code];
        persist(); render();
      };
      panel.appendChild(resetRow);
    }
    function updateSummary(){
      var sorted = ATTRS.slice().sort(function(x,y){ return profile[y.key]-profile[x.key]; });
      var quick = sorted.filter(function(a){ return profile[a.key] >= QUICK_THRESHOLD; });
      var low = sorted.slice(-1)[0];
      var quickTxt = quick.length ? quick.map(function(a){return a.label.toLowerCase();}).join(', ') : 'ninguna todavía';
      summary.innerHTML = 'En "Entrenamiento del día", a un jugador de <b>' + pos.name + '</b> se le va a preguntar directamente por: <b>' + quickTxt + '</b>. Lo que quede por debajo de ' + QUICK_THRESHOLD + '/10 (como <b>' + low.label.toLowerCase() + '</b>, en ' + profile[low.key] + '/10) solo suma si el profesor lo escribe aparte.';
    }
    updateSummary();
  }
  renderPerfilPanel();
  return el;
}

/* ============ RENDER: INFORME SEMESTRAL ============ */
function attributeAverages(hist){
  var sums = {}, counts = {};
  ATTRS.forEach(function(a){ sums[a.key]=0; counts[a.key]=0; });
  hist.forEach(function(h){
    var qv = h.quickValues || {};
    Object.keys(qv).forEach(function(k){
      if(sums[k]===undefined) return;
      sums[k] += qv[k]; counts[k] += 1;
    });
  });
  return ATTRS.filter(function(a){ return counts[a.key] > 0; })
    .map(function(a){ return {key:a.key, label:a.label, avg: sums[a.key]/counts[a.key], count: counts[a.key]}; })
    .sort(function(x,y){ return y.avg-x.avg; });
}

function renderInforme(){

    var o = document.createElement('option');
    o.value = p.id; o.textContent = p.name;
    sel.appendChild(o);
  });
  var body = el.querySelector('#informeBody');

  function renderFor(id){
    var p = players.find(function(x){return x.id===id;});
    var hist = p.historial;
    var entrenamientos = hist.filter(function(h){return h.type==='entrenamiento';});
    var partidos = hist.filter(function(h){return h.type==='partido';});
    var asistidos = entrenamientos.length;
    var diasRegistrados = 0, diasAsistidos = 0;
    Object.keys(state.trainingDays).forEach(function(k){
      if(k.indexOf(activeCategoria()+'::')!==0) return;
      var mark = state.trainingDays[k].attendance ? state.trainingDays[k].attendance[p.id] : undefined;
      if(typeof mark === 'boolean'){ diasRegistrados++; if(mark) diasAsistidos++; }
    });
    var pct = diasRegistrados ? Math.round(diasAsistidos/diasRegistrados*100) : (entrenamientos.length ? 100 : 0);
    pct = Math.max(0, Math.min(100, pct)); // nunca puede pasarse de 100%, así el dato de origen esté incompleto
    var promedio = hist.length ? (hist.reduce(function(s,h){return s+h.rating;},0)/hist.length).toFixed(1) : '—';
    var mejorSesion = hist.slice().sort(function(a,b){return b.delta-a.delta;})[0];
    var startVal = hist.length ? ratingBefore(p, hist.reduce(function(m,h){ return h.date<m ? h.date : m; }, hist[0].date)) : p.valoracion;

    var mentionCount = {};
    hist.forEach(function(h){ (h.attrsHit||[]).forEach(function(a){ mentionCount[a] = (mentionCount[a]||0)+1; }); });
    var topMention = Object.keys(mentionCount).sort(function(a,b){return mentionCount[b]-mentionCount[a];})[0];

    var chron = hist.slice().reverse(); // más antiguo primero, para ver evolución
    var half = Math.ceil(chron.length/2);
    var firstHalf = chron.slice(0, half), secondHalf = chron.slice(half);
    function avgRating(list){ return list.length ? list.reduce(function(s,h){return s+h.rating;},0)/list.length : null; }
    var avgFirst = avgRating(firstHalf), avgSecond = avgRating(secondHalf);
    var tendenciaTxt = 'aún no hay suficientes registros para ver una tendencia clara';
    if(avgFirst!=null && avgSecond!=null && secondHalf.length>=2){
      if(avgSecond - avgFirst >= 0.5) tendenciaTxt = 'ha ido mejorando: pasó de un promedio de ' + avgFirst.toFixed(1) + '/10 a ' + avgSecond.toFixed(1) + '/10 entre la primera y la segunda mitad del semestre';
      else if(avgFirst - avgSecond >= 0.5) tendenciaTxt = 'ha bajado un poco: pasó de un promedio de ' + avgFirst.toFixed(1) + '/10 a ' + avgSecond.toFixed(1) + '/10 entre la primera y la segunda mitad del semestre';
      else tendenciaTxt = 'se ha mantenido estable, alrededor de ' + avgSecond.toFixed(1) + '/10, durante todo el semestre';
    }

    var avgPartidos = avgRating(partidos);
    var mejorPartido = partidos.slice().sort(function(a,b){return b.rating-a.rating;})[0];
    var pctTxt = pct + '%';
    var pctNarrativeTxt = diasRegistrados
      ? ('asistió a ' + diasAsistidos + ' de ' + diasRegistrados + ' entrenamientos programados (' + pct + '%)')
      : (entrenamientos.length ? ('registra ' + entrenamientos.length + ' entrenamientos, todos con asistencia (' + pct + '%) — aún no hay días marcados como "no asistió" en el calendario') : 'todavía no tiene entrenamientos registrados');

    var attrAvgs = attributeAverages(hist);
    var fortalezas = attrAvgs.filter(function(a){ return a.avg >= 7; }).slice(0,3);
    var mejorar = attrAvgs.filter(function(a){ return a.avg < 6; }).sort(function(a,b){return a.avg-b.avg;}).slice(0,3);
    var fortalezasTxt = fortalezas.length ? fortalezas.map(function(a){return a.label + ' (' + a.avg.toFixed(1) + '/10)';}).join(', ') : 'todavía no hay suficientes calificaciones por atributo para destacar una';
    var mejorarTxt = mejorar.length ? mejorar.map(function(a){return a.label + ' (' + a.avg.toFixed(1) + '/10)';}).join(', ') : 'ningún atributo calificado está por debajo de 6/10 todavía';

    function attrListHtml(list, emptyTxt){
      if(!list.length) return '<div style="font-size:12.5px;color:var(--ink-faint);">' + emptyTxt + '</div>';
      return list.map(function(a){
        return '<div class="attr-row-top" style="margin-bottom:6px;"><span class="name">' + a.label + '</span><span class="val">' + a.avg.toFixed(1) + '/10</span></div>';
      }).join('');
    }

    function fullTimelineHtml(){
      if(!hist.length) return '<div style="font-size:12.5px;color:var(--ink-faint);">Todavía no hay entrenamientos ni partidos registrados.</div>';
      return hist.map(function(h){
        var deltaCls = sessionXp(h, p.categoria)>=0?'up':'down';
        var deltaTxt = (sessionXp(h, p.categoria)>=0?'+':'') + sessionXp(h, p.categoria);
        var tipoLabel = h.type==='partido' ? 'Partido' : 'Entrenamiento';
        var golesTxt = h.type==='partido' ? ' · ' + (h.goles||0) + ' gol(es), ' + (h.asistencias||0) + ' asist.' : '';
        return '<div class="tl-item">' +
          '<div class="tl-date"><b>' + tipoLabel + '</b> · ' + fmtDate(h.date) + ' · Calificación ' + h.rating + '/10' + golesTxt + ' · <span class="tl-delta ' + deltaCls + '">' + deltaTxt + ' progreso</span></div>' +
          '<div class="tl-comment">' + h.comment + '</div>' +
          (h.attrsHit && h.attrsHit.length ? '<div style="margin-top:5px;">' + h.attrsHit.map(function(a){return '<span class="attr-chip">' + a + '</span>';}).join('') + '</div>' : '') +
        '</div>';
      }).join('');
    }

    body.innerHTML =
      '<div class="informe-card">' +
        '<div class="informe-header">' +
          '<div><h2>' + p.name + '</h2><div class="sub">' + posName(p.pos) + ' · ' + p.categoria + ' · Semestre en curso</div></div>' +
          '<span class="pill">Valoración ' + startVal + ' → ' + p.valoracion + '</span>' +
        '</div>' +
        '<div class="informe-grid">' +
          '<div class="informe-stat"><div class="n">' + p.goles + '</div><div class="l">Goles</div></div>' +
          '<div class="informe-stat"><div class="n">' + p.asistencias + '</div><div class="l">Asistencias</div></div>' +
          '<div class="informe-stat"><div class="n">' + pctTxt + '</div><div class="l">Asistencia a entreno</div></div>' +
          '<div class="informe-stat"><div class="n">' + promedio + '</div><div class="l">Calificación promedio</div></div>' +
        '</div>' +
        '<svg class="trend-svg" viewBox="0 0 200 40" preserveAspectRatio="none"><polyline points="' + sparkPath(hist).split(' ').map(function(pt){ var xy=pt.split(','); return xy[0]+','+(parseFloat(xy[1])*1.5); }).join(' ') + '" fill="none" stroke="#f65334" stroke-width="2.5"/></svg>' +
        '<div class="informe-narrative">' +
          '<p><b>' + p.name + '</b> juega como <b>' + posName(p.pos) + '</b> en ' + p.categoria + '. En lo que va del semestre acumula ' + hist.length + ' registros — ' + entrenamientos.length + ' entrenamientos y ' + partidos.length + ' partidos — y su valoración pasó de ' + startVal + ' a ' + p.valoracion + ' puntos.</p>' +
          '<p><b>En los entrenamientos:</b> promedia ' + (avgRating(entrenamientos)!=null ? avgRating(entrenamientos).toFixed(1) : '—') + '/10 en calificación general, y ' + tendenciaTxt + '. En cuanto a asistencia, ' + pctNarrativeTxt + '.' + (topMention ? ' La cualidad que más se repitió en las retroalimentaciones del profesor fue <b>' + topMention + '</b>.' : '') + '</p>' +
          (partidos.length ? '<p><b>En los partidos:</b> jugó ' + partidos.length + ' con una calificación promedio de ' + avgPartidos.toFixed(1) + '/10, sumando ' + p.goles + ' goles y ' + p.asistencias + ' asistencias.' + (mejorPartido ? ' Su mejor actuación fue el ' + fmtDate(mejorPartido.date) + ', con calificación ' + mejorPartido.rating + '/10.' : '') + '</p>' : '<p><b>En los partidos:</b> todavía no tiene partidos registrados este semestre.</p>') +
          '<p><b>Fortalezas:</b> ' + fortalezasTxt + '. <b>Puntos a mejorar:</b> ' + mejorarTxt + '.</p>' +
          (mejorSesion ? '<p>Su mejor registro individual fue el ' + fmtDate(mejorSesion.date) + (mejorSesion.type==='partido'?' (partido)':' (entrenamiento)') + ': "' + mejorSesion.comment + '"</p>' : '') +
        '</div>' +
        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px;">' +
          '<div>' +
            '<div class="attr-row-top" style="margin-bottom:8px;"><span class="name">Fortalezas</span></div>' +
            attrListHtml(fortalezas, 'Aún no hay suficientes calificaciones por atributo.') +
          '</div>' +
          '<div>' +
            '<div class="attr-row-top" style="margin-bottom:8px;"><span class="name">Puntos a mejorar</span></div>' +
            attrListHtml(mejorar, 'No hay atributos por debajo de 6/10 todavía.') +
          '</div>' +
        '</div>' +
        '<div style="margin-top:22px;padding-top:16px;border-top:1px solid var(--border);">' +
          '<div class="attr-row-top" style="margin-bottom:10px;"><span class="name">Historial completo — cada entrenamiento y cada partido</span></div>' +
          '<div class="timeline" style="max-height:none;">' + fullTimelineHtml() + '</div>' +
        '</div>' +
      '</div>';
  }
  sel.onchange = function(){ renderFor(sel.value); };
  renderFor(players[0].id);
  return el;
}

function render(){
  if(!sessionEnteredClub){
    document.getElementById('appRoot').style.display = 'none';
    document.getElementById('landingRoot').style.display = 'block';
    renderLanding();
    return;
  }
  document.getElementById('landingRoot').style.display = 'none';
  document.getElementById('appRoot').style.display = '';
  syncRoleFromUser();

  var vv = visibleViews();
  if(!vv.some(function(v){return v.id===currentView;})) currentView = vv[0].id;
  renderChrome();
  renderNav();
  var main = document.getElementById('mainView');
  main.innerHTML = '';
  var inner = document.createElement('div');
  inner.className = 'main-inner';
  main.appendChild(inner);
  var view;
  if(currentView==='entrenamiento') view = renderEntrenamiento();
  else if(currentView==='partido') view = renderPartido();
  else if(currentView==='cartas') view = renderCartas();
  else if(currentView==='perfil') view = renderPerfil();
  else if(currentView==='plantel') view = renderPlantel();
  else view = renderInforme();
  inner.appendChild(view);

  var backTopbar = document.querySelector('.topbar-mobile');
  var backSidebar = document.querySelector('.brand');
  if(backTopbar) backTopbar.onclick = goToLanding;
  if(backSidebar) backSidebar.onclick = goToLanding;
}

/* ============ VALORACIÓN CON BARRA DE PROGRESO ============ */
// Todos arrancan en 50 y el máximo es 99. Cada sesión da progreso (asistir ya suma algo, jugar bien suma más);
// llenar la barra sube 1 punto y cada tramo de 10 cuesta más. La exigencia depende de la categoría.
// Calibrado para que en un semestre un jugador promedio llegue a ~80 y uno muy bueno pueda llegar a 99 en el año.
var VAL_MIN = 50, VAL_MAX = 99;
var XP_BASE = 10, XP_PER_DELTA = 8;        // progreso de una sesión = 10 + 8 × puntaje de la sesión
var LEVEL_COSTS = [20, 28, 37, 70, 133];    // progreso para subir 1 punto en los 50s, 60s, 70s, 80s y 90s (nivel medio)
var LEVELS = {
  infantil:    {label:'Infantil',    mult:0.7},
  medio:       {label:'Medio',       mult:1},
  competitivo: {label:'Competitivo', mult:1.35},
  maxima:      {label:'Máxima',      mult:1.8}
};
function defaultLevel(cat){
  var m = String(cat||'').match(/^sub-(\d+)$/i);
  if(!m) return 'medio';
  var n = +m[1];
  return n<=8 ? 'infantil' : (n<=12 ? 'medio' : 'competitivo');
}
function categoryLevel(cat, levels){
  levels = levels || (state && state.categoryLevels) || {};
  return LEVELS[levels[cat]] ? levels[cat] : defaultLevel(cat);
}
function levelMult(cat, levels){ return LEVELS[categoryLevel(cat, levels)].mult; }
function levelCost(v, mult){ return Math.round(LEVEL_COSTS[Math.max(0, Math.min(4, Math.floor((v-50)/10)))] * (mult||1)); }
// Tope por sesión: ni un partido espectacular ni uno malo mueven demasiado la valoración de una sola vez
var XP_CAP_UP = 45, XP_CAP_DOWN = -30;
// Qué sube más la valoración en cada categoría (lo decide su profesor)
var WEIGHT_MODES = {
  igual:    {label:'Entrenos y partidos pesan igual', entrenamiento:1,    partido:1},
  partidos: {label:'Pesan más los partidos',          entrenamiento:0.85, partido:1.5},
  entrenos: {label:'Pesan más los entrenamientos',    entrenamiento:1.15, partido:0.6}
};
function weightMode(cat, modes){
  modes = modes || (state && state.categoryWeights) || {};
  return WEIGHT_MODES[modes[cat]] ? modes[cat] : 'igual';
}
function sessionRawXp(h){
  if(!h || h.asistio===false) return 0;
  return Math.max(XP_CAP_DOWN, Math.min(XP_CAP_UP, XP_BASE + (h.delta||0) * XP_PER_DELTA));
}
function sessionXpWith(h, w){ return Math.round(sessionRawXp(h) * (h && h.type==='partido' ? w.partido : w.entrenamiento)); }
function sessionXp(h, cat, modes){ return sessionXpWith(h, WEIGHT_MODES[weightMode(cat, modes)]); }
function replayRating(entries, mult, w){
  w = w || WEIGHT_MODES.igual;
  var v = VAL_MIN, xp = 0;
  entries.slice().sort(function(a,b){ return a.date<b.date ? -1 : (a.date>b.date ? 1 : 0); }).forEach(function(h){
    xp += sessionXpWith(h, w);
    while(v<VAL_MAX && xp>=levelCost(v, mult)){ xp -= levelCost(v, mult); v++; }
    while(xp<0){ if(v<=VAL_MIN){ xp = 0; break; } v--; xp += levelCost(v, mult); }
  });
  if(v>=VAL_MAX){ v = VAL_MAX; xp = 0; }
  return {valoracion:v, xp:xp, cost:levelCost(v, mult)};
}
// la valoración siempre se recalcula desde el historial: editar, reabrir o borrar un registro queda bien solo
function recomputeRating(p, levels, weights){
  var r = replayRating(p.historial||[], levelMult(p.categoria, levels), WEIGHT_MODES[weightMode(p.categoria, weights)]);
  p.valoracion = r.valoracion; p.xp = r.xp; p.xpCost = r.cost;
}
function recomputeAllRatings(){ if(state && Array.isArray(state.players)) state.players.forEach(function(p){ recomputeRating(p, state.categoryLevels, state.categoryWeights); }); }
function ratingBefore(p, dateStr){ return replayRating((p.historial||[]).filter(function(h){ return h.date < dateStr; }), levelMult(p.categoria), WEIGHT_MODES[weightMode(p.categoria)]).valoracion; }
// Nivel de la carta según la valoración: bronce, plata, oro y la especial Élite (90+)
var TIERS = [
  {id:'bronce', label:'Bronce', min:0},
  {id:'plata',  label:'Plata',  min:65},
  {id:'oro',    label:'Oro',    min:75},
  {id:'elite',  label:'Élite',  min:90}
];
function tierOf(v){ var t = TIERS[0]; TIERS.forEach(function(x){ if(v>=x.min) t = x; }); return t; }
var BOLT_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.5 1.5 4 13.2h6.2L9 22.5l10-12.2h-6.3z"/></svg>';
function xpBar(p){
  if(p.valoracion>=VAL_MAX) return '<div class="xp"><div class="xp-bar"><i style="width:100%"></i></div><div class="xp-txt">Valoración máxima</div></div>';
  var pct = Math.max(0, Math.min(100, Math.floor((p.xp||0) / (p.xpCost||levelCost(p.valoracion, levelMult(p.categoria))) * 100)));
  return '<div class="xp"><div class="xp-bar"><i style="width:' + pct + '%"></i></div><div class="xp-txt">' + pct + '% hacia ' + (p.valoracion+1) + '</div></div>';
}

/* ============ FOTOS DE JUGADORES ============ */
// Cada foto va en su propio documento (colección fotosJugadores/{id del jugador}), comprimida a 320x320,
// así no engorda el documento principal ni hace falta Firebase Storage.
var photoMap = {};
function initialsOf(name){
  var n = String(name||'').trim();
  if(/^Jugador \d+$/.test(n)) return '#' + n.split(' ')[1];
  var w = n.split(/\s+/);
  return (((w[0]||'')[0]||'') + ((w[1]||'')[0]||'')).toUpperCase();
}
function avatarInner(p){ var src = photoMap[p.id]; return src ? '<img src="' + src + '" alt="" />' : escHtml(initialsOf(p.name)); }
function compressPhoto(file, size){
  size = size || 480; // más resolución porque ahora la foto ocupa casi toda la carta
  return new Promise(function(resolve, reject){
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function(){
      var s = Math.min(img.naturalWidth, img.naturalHeight);
      var sx = (img.naturalWidth - s) / 2;
      var sy = (img.naturalHeight - s) / 2 * 0.5; // en fotos verticales recorta más abajo que arriba, para no cortar la cabeza
      var c = document.createElement('canvas'); c.width = size; c.height = size;
      c.getContext('2d').drawImage(img, sx, sy, s, s, 0, 0, size, size);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = function(){ URL.revokeObjectURL(url); reject(new Error('No se pudo abrir la imagen')); };
    img.src = url;
  });
}
function savePhoto(playerId, dataUrl){
  photoMap[playerId] = dataUrl;
  var owner = state && state.players.find(function(x){ return x.id===playerId; });
  if(window.db) return db.collection('fotosJugadores').doc(playerId).set({data:dataUrl, categoria: owner ? owner.categoria : '', actualizada:Date.now()});
  return Promise.resolve();
}
function deletePhoto(playerId){
  delete photoMap[playerId];
  if(window.db) db.collection('fotosJugadores').doc(playerId).delete().catch(function(){});
}
// "juan-esteban-ortiz.jpg", "Ortiz Juan.png" o "umbria.jpeg" -> el jugador que corresponde (o null si hay duda)
function matchPhotoToPlayer(fileName, players){
  var tokens = nameKey(String(fileName).replace(/\.[^.]+$/,'').replace(/[_\-.]+/g,' ')).split(' ')
    .filter(function(t){ return t.length>1 && !/^\d+$/.test(t) && ['img','foto','wa','jpg','jpeg','png'].indexOf(t)===-1; });
  if(!tokens.length) return null;
  var best = null, bestScore = 0, tie = false;
  players.forEach(function(p){
    var pt = nameKey(p.name).split(' ');
    var score = tokens.filter(function(t){ return pt.indexOf(t)!==-1; }).length;
    if(score > bestScore){ best = p; bestScore = score; tie = false; }
    else if(score && score===bestScore){ tie = true; }
  });
  if(tie || !best) return null;
  if(bestScore>=2 || (bestScore===1 && tokens.length===1)) return best;
  return null;
}

/* ============ RENDER: PLANTEL Y CATEGORÍAS (solo administrador) ============ */
function escHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function toTitleName(raw){
  var small = ['de','del','la','las','los','y'];
  return String(raw||'').trim().replace(/\s+/g,' ').toLowerCase().split(' ').map(function(w,i){
    if(i>0 && small.indexOf(w)!==-1) return w;
    return w.charAt(0).toUpperCase() + w.slice(1);
  }).join(' ');
}
function normalizeCategoryName(raw){
  var t = String(raw||'').trim().replace(/\//g,'-').replace(/\s+/g,' ');
  var m = t.match(/^sub[\s\-_]*(\d{1,2})$/i);
  return m ? 'Sub-' + m[1] : t;
}
function nameKey(n){ return String(n||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim(); }
function newPlayerId(){ return 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function makePlayer(name, pos, categoria){
  return {id:newPlayerId(), name:name, categoria:categoria, pos:pos, goles:0, asistencias:0, valoracion:VAL_MIN, xp:0, xpCost:levelCost(VAL_MIN, levelMult(categoria)), historial:[]};
}
function posOrder(code){ var i = POSITIONS.map(function(p){return p.code;}).indexOf(code); return i===-1 ? 99 : i; }
function posOptions(selected, withEmpty){
  return (withEmpty ? '<option value=""' + (selected?'':' selected') + '>— elegir —</option>' : '') +
    POSITIONS.map(function(p){ return '<option value="' + p.code + '"' + (p.code===selected?' selected':'') + '>' + p.name + '</option>'; }).join('');
}

// "LI/EX", "LI - EX", "LI, EX" o "lateral izquierdo y extremo" -> ['LI','EXT'] (la primera es la principal)
function splitPositions(raw){
  var s = String(raw||'').trim();
  if(!s) return [];
  var whole = normalizePos(s);
  var parts = s.split(/\s*[\/,;\-]\s*|\s+y\s+/i).map(normalizePos).filter(Boolean);
  if(parts.length<=1 && whole) parts = [whole];
  return parts.filter(function(c, i, a){ return a.indexOf(c)===i; });
}
// Texto como llega por WhatsApp: "SUB 11" como encabezado y "• NOMBRE (PT)" por jugador
function parseRosterText(text){
  var out = {categoria:null, rows:[]};
  String(text||'').split(/\r?\n/).forEach(function(line){
    var l = line.replace(/^[\s\u2022\u00b7\-\*\u2013\u2014]+/, '').replace(/^\d+\s*[\.\)\-]\s*/, '').trim();
    if(!l) return;
    var catM = l.match(/^sub[\s\-_]*(\d{1,2})\s*:?$/i);
    if(catM){ out.categoria = 'Sub-' + catM[1]; return; }
    var m = l.match(/^(.*?)\s*[\(\[]\s*([^\)\]]{1,20})\s*[\)\]]\s*$/) || l.match(/^(.*?)\s+[\-\u2013\u2014:]\s+([A-Za-z\u00c0-\u017f ]{1,20})$/);
    var name = (m ? m[1] : l).replace(/[\s\-\u2013\u2014:,]+$/,'').trim();
    var posRaw = m ? m[2].trim() : '';
    if(!name) return;
    var pp = splitPositions(posRaw);
    out.rows.push({name: toTitleName(name), posRaw: posRaw, pos: pp[0] || null, posExtra: pp.slice(1), categoria: null});
  });
  return out;
}
// Filas de Excel/CSV: columnas Nombre (o Jugador), Posición y, opcional, Categoría
function parseRosterSheet(rows){
  var out = {categoria:null, rows:[]};
  rows.forEach(function(r){
    var keys = Object.keys(r);
    function pick(prefixes){
      for(var i=0;i<keys.length;i++){
        var k = nameKey(keys[i]);
        if(prefixes.some(function(p){ return k.indexOf(p)===0; })) return r[keys[i]];
      }
      return '';
    }
    var name = String(pick(['nombre','jugador','name'])||'').trim();
    if(!name) return;
    var posRaw = String(pick(['pos'])||'').trim();
    var cat = String(pick(['categ'])||'').trim();
    var pp = splitPositions(posRaw);
    out.rows.push({name: toTitleName(name), posRaw: posRaw, pos: pp[0] || null, posExtra: pp.slice(1), categoria: cat ? normalizeCategoryName(cat) : null});
  });
  return out;
}

function renameCategory(oldName, newName){
  var i = state.categories.indexOf(oldName);
  if(i===-1) return;
  state.categories[i] = newName;
  if(state.categoryLevels && state.categoryLevels[oldName]){ state.categoryLevels[newName] = state.categoryLevels[oldName]; delete state.categoryLevels[oldName]; }
  if(state.categoryWeights && state.categoryWeights[oldName]){ state.categoryWeights[newName] = state.categoryWeights[oldName]; delete state.categoryWeights[oldName]; }
  state.players.forEach(function(p){ if(p.categoria===oldName) p.categoria = newName; });
  Object.keys(state.trainingDays).forEach(function(k){
    if(k.indexOf(oldName+'::')===0){ state.trainingDays[newName + k.slice(oldName.length)] = state.trainingDays[k]; delete state.trainingDays[k]; }
  });
  if(state.selectedCategoria===oldName) state.selectedCategoria = newName;
  if(state.profesorCategoria===oldName) state.profesorCategoria = newName;
  if(visitorCategoria===oldName) visitorCategoria = newName;
  // los profesores asignados a esa categoría la siguen teniendo con el nombre nuevo
  if(window.db){
    db.collection('staff').where('categoria','==',oldName).get().then(function(snap){
      snap.forEach(function(d){ d.ref.update({categoria:newName}); });
    }).catch(function(){});
  }
}
function deleteCategory(name){
  if(state.categoryLevels) delete state.categoryLevels[name];
  if(state.categoryWeights) delete state.categoryWeights[name];
  state.players.forEach(function(p){ if(p.categoria===name) deletePhoto(p.id); });
  state.categories = state.categories.filter(function(c){ return c!==name; });
  state.players = state.players.filter(function(p){ return p.categoria!==name; });
  Object.keys(state.trainingDays).forEach(function(k){ if(k.indexOf(name+'::')===0) delete state.trainingDays[k]; });
  if(state.selectedCategoria===name) state.selectedCategoria = state.categories[0];
  if(state.profesorCategoria===name) state.profesorCategoria = state.categories[0];
}
function sortCategories(list){
  function num(c){ var m = String(c).match(/^sub-(\d+)$/i); return m ? +m[1] : 999; }
  return list.slice().sort(function(a,b){ return num(a)-num(b) || a.localeCompare(b); });
}

      });
      tr.querySelector('[data-f="photo"]').onchange = function(e){
        var f = e.target.files && e.target.files[0];
        if(!f) return;
        compressPhoto(f).then(function(url){ return savePhoto(id, url); }).then(function(){ drawRoster(); })
          .catch(function(err){ window.alert('No se pudo guardar la foto (' + (err && err.message ? err.message : 'error') + '). Si es una foto de iPhone en formato HEIC, mándatela por WhatsApp y descárgala de ahí, que llega como JPG.'); });
      };
      tr.querySelector('[data-f="del"]').onclick = function(){
        if(!window.confirm('¿Quitar a ' + p.name + ' del plantel?' + (p.historial.length ? ' Se borran también sus ' + p.historial.length + ' registros.' : ''))) return;
        state.players = state.players.filter(function(x){ return x.id!==id; });
        deletePhoto(id);
        persist(); drawRoster();
      };
    });
  }
  drawRoster();

  // ---------- fotos en lote ----------
  var photoPrev = el.querySelector('#plPhotoPreview');
  el.querySelector('#plPhotos').onchange = function(e){
    var files = Array.prototype.slice.call(e.target.files || []);
    e.target.value = '';
    if(!files.length) return;
    var players = state.players.filter(function(p){ return p.categoria===plantelUi.cat; });
    photoPrev.innerHTML = '<div class="pl-summary">Preparando ' + files.length + ' foto' + (files.length===1?'':'s') + '…</div>';
    var items = [];
    files.reduce(function(chain, f){
      return chain.then(function(){
        return compressPhoto(f).then(function(url){
          var m = matchPhotoToPlayer(f.name, players);
          items.push({file:f.name, url:url, playerId: m ? m.id : '', auto: !!m});
        }).catch(function(){ items.push({file:f.name, url:null, playerId:'', auto:false}); });
      });
    }, Promise.resolve()).then(function(){
      var used = {}; // si dos fotos apuntan al mismo jugador, solo la primera queda asignada
      items.forEach(function(it){ if(it.playerId){ if(used[it.playerId]){ it.playerId = ''; it.auto = false; } else used[it.playerId] = true; } });
      drawPhotoPreview(items, players);
    });
  };
  function drawPhotoPreview(items, players){
    var sorted = players.slice().sort(function(a,b){ return a.name.localeCompare(b.name); });
    function opts(sel){
      return '<option value="">— no asignar —</option>' + sorted.map(function(p){
        return '<option value="' + escHtml(p.id) + '"' + (p.id===sel?' selected':'') + '>' + escHtml(p.name) + (photoMap[p.id]?' (ya tiene foto)':'') + '</option>';
      }).join('');
    }
    photoPrev.innerHTML = '<table class="pl-table"><thead><tr><th>Foto</th><th>Archivo</th><th>Jugador de ' + escHtml(plantelUi.cat) + '</th></tr></thead><tbody>' +
      items.map(function(it, i){
        return '<tr data-i="' + i + '"><td><div class="pl-thumb">' + (it.url ? '<img src="' + it.url + '" alt="" />' : '?') + '</div></td>' +
          '<td class="pl-count">' + escHtml(it.file) + ' ' + (it.url ? (it.auto ? '<span class="pl-status ok">asignada sola</span>' : '<span class="pl-status warn">elige el jugador</span>') : '<span class="pl-status warn">no se pudo abrir</span>') + '</td>' +
          '<td>' + (it.url ? '<select data-f="pl">' + opts(it.playerId) + '</select>' : '') + '</td></tr>';
      }).join('') + '</tbody></table>' +
      '<div class="pl-inline"><button class="pl-btn" id="plSavePhotos"></button><button class="pl-btn ghost" id="plCancelPhotos">Cancelar</button></div>';
    function refresh(){
      var n = items.filter(function(it){ return it.url && it.playerId; }).length;
      var b = photoPrev.querySelector('#plSavePhotos');
      b.textContent = 'Guardar ' + n + ' foto' + (n===1?'':'s');
      b.disabled = !n;
    }
    photoPrev.querySelectorAll('select[data-f="pl"]').forEach(function(sel){
      sel.onchange = function(){ items[+sel.closest('tr').getAttribute('data-i')].playerId = sel.value; refresh(); };
    });
    photoPrev.querySelector('#plCancelPhotos').onclick = function(){ photoPrev.innerHTML = ''; };
    photoPrev.querySelector('#plSavePhotos').onclick = function(){
      var todo = items.filter(function(it){ return it.url && it.playerId; });
      var btn = photoPrev.querySelector('#plSavePhotos');
      btn.disabled = true; btn.textContent = 'Guardando…';
      Promise.all(todo.map(function(it){ return savePhoto(it.playerId, it.url); })).then(function(){
        photoPrev.innerHTML = '<div class="pl-msg">Listo: se guardaron ' + todo.length + ' foto' + (todo.length===1?'':'s') + '.</div>';
        drawRoster();
      }).catch(function(err){
        photoPrev.insertAdjacentHTML('beforeend', '<div class="pl-msg err">No se pudieron guardar todas: ' + escHtml(err && err.message) + '</div>');
        btn.disabled = false; btn.textContent = 'Reintentar';
      });
    };
    refresh();
  }
  return el;
}

  body.innerHTML =
    '<button class="modal-close" id="closeModal">✕</button>' +
    '<h2>Primer administrador</h2>' +
    '<div class="sub">Este correo y esta clave quedarán como el primer administrador de la plataforma.</div>' +
    '<div class="staff-form">' +
      '<label>Correo<input type="email" id="bsEmail" autocomplete="username" /></label>' +
      '<label>Clave (mínimo 6 caracteres)<input type="password" id="bsPass" autocomplete="new-password" /></label>' +
      '<div class="staff-error" id="bsError" style="display:none;"></div>' +
      '<button class="staff-submit" id="bsSubmit">Crear administrador</button>' +
      '<div class="staff-divider">o</div>' +
      '<button class="staff-google-btn" id="bsGoogle" type="button">' + GOOGLE_ICON_SVG + ' Registrarme con Google</button>' +

    }).then(function(){
      overlay.classList.remove('show');
    }).catch(function(err){
      errBox.textContent = 'No se pudo crear la cuenta: ' + (err && err.message ? err.message : '');
      errBox.style.display = 'block';
    });
  };
  body.querySelector('#bsGoogle').onclick = function(){
    var errBox = body.querySelector('#bsError');
    errBox.style.display = 'none';
    auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).then(function(cred){
      return db.collection('staff').doc(cred.user.email.toLowerCase()).set({role:'admin', modo:'google.com'});
    }).then(function(){
      overlay.classList.remove('show');
    }).catch(function(err){
      errBox.textContent = 'No se pudo registrar con Google: ' + (err && err.message ? err.message : '');
      errBox.style.display = 'block';
    });
  };
  overlay.classList.add('show');
  body.querySelector('#closeModal').onclick = function(){ overlay.classList.remove('show'); };
  overlay.onclick = function(e){ if(e.target===overlay) overlay.classList.remove('show'); };
}

function openStaffPanel(){
  var overlay = document.getElementById('modalOverlay');
  var body = document.getElementById('modalBody');
  body.innerHTML =
    '<button class="modal-close" id="closeModal">✕</button>' +
    '<h2>Administradores y profesores</h2>' +
    '<div class="sub">Crea el acceso de un nuevo administrador o profesor.</div>' +
    '<div class="staff-form">' +
      '<label>Correo<input type="email" id="staffEmail" autocomplete="off" /></label>' +
      '<label>Cómo va a entrar' +
        '<select id="staffMode">' +
          '<option value="password">Le creo un correo y una clave</option>' +
          '<option value="google">Va a entrar con su propia cuenta de Google</option>' +
        '</select>' +
      '</label>' +
      '<label id="staffPassWrap">Clave (mínimo 6 caracteres)<input type="password" id="staffPass" autocomplete="new-password" /></label>' +
      '<label>Rol' +
        '<select id="staffRole">' +
          '<option value="profesor">Profesor</option>' +
          '<option value="admin">Administrador</option>' +
        '</select>' +
      '</label>' +
      '<label id="staffCatWrap">Categoría asignada' +
        '<select id="staffCat">' + CATEGORIES.map(function(c){return '<option value="' + c + '">' + c + '</option>';}).join('') + '</select>' +
      '</label>' +
      '<div class="staff-error" id="staffError" style="display:none;"></div>' +
      '<button class="staff-submit" id="staffSubmit">Crear acceso</button>' +
    '</div>';
  var roleSel = body.querySelector('#staffRole');
  var catWrap = body.querySelector('#staffCatWrap');
  function syncCatVisibility(){ catWrap.style.display = roleSel.value==='profesor' ? '' : 'none'; }
  roleSel.onchange = syncCatVisibility;
  syncCatVisibility();

  var modeSel = body.querySelector('#staffMode');
  var passWrap = body.querySelector('#staffPassWrap');
  function syncModeVisibility(){ passWrap.style.display = modeSel.value==='password' ? '' : 'none'; }
  modeSel.onchange = syncModeVisibility;
  syncModeVisibility();

  body.querySelector('#staffSubmit').onclick = function(){
    var email = body.querySelector('#staffEmail').value.trim();
    var mode = modeSel.value;
    var pass = body.querySelector('#staffPass').value;
    var role = roleSel.value;
    var cat = body.querySelector('#staffCat').value;
    var errBox = body.querySelector('#staffError');
    errBox.style.display = 'none';
    if(!email){
      errBox.textContent = 'Escribe un correo.';
      errBox.style.display = 'block';
      return;
    }
    if(mode==='password' && pass.length < 6){
      errBox.textContent = 'Escribe una clave de al menos 6 caracteres.';
      errBox.style.display = 'block';
      return;
    }
    var doc = {role: role, modo: mode==='google' ? 'google.com' : 'password'};
    if(role==='profesor') doc.categoria = cat;
    if(mode==='google'){
      db.collection('staff').doc(email.toLowerCase()).set(doc).then(function(){
        overlay.classList.remove('show');
      }).catch(function(err){
        errBox.textContent = 'No se pudo guardar el acceso: ' + (err && err.message ? err.message : '');
        errBox.style.display = 'block';
      });
      return;
    }
    var secondary = firebase.apps.some(function(a){return a.name==='secondary';})
      ? firebase.app('secondary')
      : firebase.initializeApp(window.FIREBASE_CONFIG, 'secondary');
    secondary.auth().createUserWithEmailAndPassword(email, pass).then(function(){
      return secondary.auth().signOut();
    }).then(function(){
      return db.collection('staff').doc(email.toLowerCase()).set(doc);
    }).then(function(){
      overlay.classList.remove('show');
    }).catch(function(err){
      errBox.textContent = 'No se pudo crear el acceso: ' + (err && err.message ? err.message : '');
      errBox.style.display = 'block';
    });
  };
  overlay.classList.add('show');
  body.querySelector('#closeModal').onclick = function(){ overlay.classList.remove('show'); };
  overlay.onclick = function(e){ if(e.target===overlay) overlay.classList.remove('show'); };
}

function showBrokenDataScreen(){
  try{ localStorage.removeItem(STORAGE_KEY); }catch(e2){}
  document.getElementById('mainView').innerHTML =
    '<div style="max-width:420px;margin:60px auto;text-align:center;">' +
      '<p style="color:var(--ink-muted);font-size:14px;margin-bottom:16px;">Esta vista previa tenía datos guardados de una versión anterior y no cargó bien. Se limpiaron esos datos de prueba — recarga la página para empezar de cero.</p>' +
      '<button onclick="location.reload()" style="background:var(--orange-500);border:none;color:white;font-weight:600;padding:10px 20px;border-radius:8px;cursor:pointer;">Recargar</button>' +
    '</div>';
}
function safeRender(){
  try{ render(); }catch(e){ showBrokenDataScreen(); }
}

document.getElementById('landingRoot').innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--ink-faint);font-size:13px;">Cargando…</div>';
document.getElementById('landingRoot').style.display = 'block';

if(window.firebase && window.FIREBASE_CONFIG){
  try{
    firebase.initializeApp(window.FIREBASE_CONFIG);
    window.db = firebase.firestore();
    window.auth = firebase.auth();
    try{ localStorage.removeItem(STORAGE_KEY); }catch(e){} // con Firebase no se guardan copias locales de datos privados

    db.doc('club/general').onSnapshot(function(d){
      if(d.exists){ remote.general = d.data(); remote.generalMissing = false; }
      else { remote.general = null; remote.generalMissing = true; }
      if(!d.metadata.hasPendingWrites) scheduleRebuild();
    }, function(err){
      console.error('No se pudo leer el club', err);
      if(!state){ state = normalizeState({players:[], categories:[]}); safeRender(); }
    });
    db.collection('publico').onSnapshot(function(snap){
      remote.pub = {};
      snap.forEach(function(d){ remote.pub[d.id] = d.data(); });
      if(!snap.metadata.hasPendingWrites) scheduleRebuild();
    }, function(err){ console.error('No se pudieron leer las cartas públicas', err); });

    auth.onAuthStateChanged(function(user){
      detachPrivate();
      if(user){
        var prov = (user.providerData && user.providerData[0] && user.providerData[0].providerId) || 'password';
        db.collection('staff').doc(user.email.toLowerCase()).get().then(function(doc){
          var d = doc.exists ? doc.data() : null;
          currentUser = {email:user.email, role: d ? d.role : null, categoria: d ? d.categoria : null};
          if(d && !d.modo) doc.ref.update({modo:prov}).catch(function(){}); // cuentas anteriores: anotar con qué método entran
          attachPrivate();
          if(remote.generalMissing) tryMigrate();
          if(state) safeRender();
        }).catch(function(){
          currentUser = {email:user.email, role:null, categoria:null};
          if(state) safeRender();
        });
      } else {
        currentUser = null;
        scheduleRebuild(); // vuelve a mostrar solo lo público
      }
    });
    db.collection('fotosJugadores').onSnapshot(function(snap){
      var m = {};
      snap.forEach(function(d){ var v = d.data(); if(v && v.data) m[d.id] = v.data; });
      photoMap = m;
      var a = document.activeElement;
      var typing = a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.type!=='file';
      var pp = document.getElementById('plPhotoPreview');
      if(state && !typing && !(pp && pp.innerHTML)) safeRender();
    }, function(err){ console.error('No se pudieron leer las fotos', err); });
  }catch(e){
    console.error('Firebase no se pudo inicializar, usando solo almacenamiento local', e);
    bootFromLocalOrFresh();
    safeRender();
  }
} else {
  bootFromLocalOrFresh();
  safeRender();
}
})();
</script>
