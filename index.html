/* ---------- semanas y meses ---------- */
function f2Iso(d){ return d.toISOString().slice(0,10); }
function f2Periodo(tipo, n){
  var hoy = new Date(); hoy.setHours(12,0,0,0);
  if(tipo==='semana'){
    var l = new Date(hoy); l.setDate(l.getDate() - ((l.getDay()+6)%7) - 7*n);
    var f = new Date(l); f.setDate(f.getDate()+6);
    return {tipo:tipo, n:n, key:'s'+f2Iso(l), ini:f2Iso(l), fin:f2Iso(f),
      label: n===0 ? 'Esta semana' : n===1 ? 'Semana pasada' : 'Semana del ' + fmtDate(f2Iso(l))};
  }
  var m = new Date(hoy.getFullYear(), hoy.getMonth()-n, 1, 12), fm = new Date(m.getFullYear(), m.getMonth()+1, 0, 12);
  return {tipo:tipo, n:n, key:'m'+f2Iso(m).slice(0,7), ini:f2Iso(m), fin:f2Iso(fm),
    label: (n===0 ? 'Este mes' : n===1 ? 'Mes pasado' : '') + (n<2 ? ' · ' : '') + F2_MESES[m.getMonth()]};
}
function f2Score(p, per){
  var hs = (p.historial||[]).filter(function(h){ return h.date>=per.ini && h.date<=per.fin && typeof h.rating==='number' && h.asistio!==false; });
  if(!hs.length) return null;
  var s = 0, g = 0;
  hs.forEach(function(h){ s += h.rating; g += h.goles||0; });
  return {prom:s/hs.length, n:hs.length, goles:g};
}
function f2Formacion(cat){
  var F = FORMACIONES[(state.formatoCat||{})[cat]] || FORMACIONES[8];
  return F[Object.keys(F)[0]];
}
function f2Grupo(code){ for(var i=0;i<GRUPOS_POS.length;i++) if(GRUPOS_POS[i].codes.indexOf(code)!==-1) return GRUPOS_POS[i].id; return ''; }
// Se arma solo: el mejor promedio de notas del periodo en cada puesto. El profe puede cambiar a quien quiera.
function f2Equipo(cat, per){
  var mk = cat + '|' + per.key;
  if(f2Memo[mk]) return f2Memo[mk];
  var lista = state.players.filter(function(p){ return p.categoria===cat; })
    .map(function(p){ return {p:p, s:f2Score(p, per)}; }).filter(function(x){ return x.s; })
    .sort(function(a,b){ return b.s.prom-a.s.prom || b.s.n-a.s.n || b.s.goles-a.s.goles; });
  var slots = f2Formacion(cat).map(function(o,i){ return {x:o.x, y:o.y, pos:o.p||'POR', i:i}; });
  var ov = ((state.destacadosCat||{})[cat]||{})[per.key] || {};
  var usados = {}, asign = [];
  function porId(id){ for(var i=0;i<state.players.length;i++) if(state.players[i].id===id && state.players[i].categoria===cat) return state.players[i]; return null; }
  slots.forEach(function(s){ var pp = porId((ov.slots||{})[s.i]); if(pp && !usados[pp.id]){ asign[s.i] = pp; usados[pp.id] = 1; } });
  var orden = slots.slice().sort(function(a,b){ return (a.pos==='POR'?0:1) - (b.pos==='POR'?0:1); });
  [function(x,s){ return x.p.pos===s.pos; },
   function(x,s){ return (x.p.posExtra||[]).indexOf(s.pos)!==-1; },
   function(x,s){ return s.pos!=='POR' && f2Grupo(x.p.pos)===f2Grupo(s.pos); },
   function(x,s){ return s.pos!=='POR' && x.p.pos!=='POR'; }
  ].forEach(function(ok){
    orden.forEach(function(s){
      if(asign[s.i]) return;
      for(var i=0;i<lista.length;i++){ var x = lista[i]; if(!usados[x.p.id] && ok(x,s)){ asign[s.i] = x.p; usados[x.p.id] = 1; return; } }
    });
  });
  var mvp = porId(ov.mvp) || (lista.length ? lista[0].p : null);
  var r = {slots:slots, asign:asign, mvp:mvp, hay:lista.length>0, lista:lista, ov:!!(ov.mvp || Object.keys(ov.slots||{}).length)};
  f2Memo[mk] = r;
  return r;
}
function f2EnEquipo(eq, p){ return eq.asign.some(function(x){ return x && x.id===p.id; }); }
function f2VecesTots(p){
  var k = 'tots|' + p.id;
  if(f2Memo[k]!=null) return f2Memo[k];
  var n = 0, primero = (p.historial||[]).reduce(function(m,h){ return (!m || h.date<m) ? h.date : m; }, '');
  for(var i=1;i<=26;i++){
    var per = f2Periodo('semana', i);
    if(!primero || per.fin < primero) break;
    if(f2EnEquipo(f2Equipo(p.categoria, per), p)) n++;
  }
  return (f2Memo[k] = n);
}
// Lo último que ganó: sirve para la carta para compartir
function f2Logros(p){
  var r = [];
  [['semana',1],['semana',0],['mes',1],['mes',0]].forEach(function(a){
    var per = f2Periodo(a[0], a[1]), eq = f2Equipo(p.categoria, per);
    if(!eq.hay) return;
    if(eq.mvp && eq.mvp.id===p.id) r.push({id:a[0]==='semana'?'jds':'potm', per:per});
    else if(f2EnEquipo(eq, p)) r.push({id:a[0]==='semana'?'tots':'totm', per:per});
  });
  return r;
}

/* ---------- insignias ---------- */
function f2Todas(cat){
  return f2ClubBadges().map(function(b){ var x = f2Clone(b); x.club = 1; return x; })
    .concat(f2CatBadges(cat).map(function(b){ var x = f2Clone(b); x.club = 0; return x; }));
}
function f2Prog(b, p){
  var v = +b.v||0, cur = 0, got = false, hoyM = todayStr().slice(0,7), m;
  if(b.t==='racha'){ var r = f2Racha(p); cur = r.cur; got = r.best>=v; }
  else if(b.t==='mes'){ m = f2PorMes(p); got = Object.keys(m).some(function(k){ return m[k].ents>=4 && m[k].faltas<=v; }); cur = (m[hoyM]||{faltas:0}).faltas; }
  else if(b.t==='goles' || b.t==='asist'){ m = f2PorMes(p); got = Object.keys(m).some(function(k){ return m[k][b.t]>=v; }); cur = (m[hoyM]||{})[b.t]||0; }
  else if(b.t==='sube'){ var antes = ratingBefore(p, trimIni()); cur = typeof antes==='number' ? Math.max(0, p.valoracion-antes) : 0; got = cur>=v; }
  else if(b.t==='nota'){ (p.historial||[]).forEach(function(h){ if(h.type==='partido' && typeof h.rating==='number' && h.asistio!==false && h.rating>cur) cur = h.rating; }); got = cur>=v; }
  else if(b.t==='tots'){ cur = f2VecesTots(p); got = cur>=v; }
  else got = !!((p.dadas||{})[b.id]);
  return {got:got, cur:cur};
}
function f2Regla(b){
  if(b.t==='propia') return b.own ? 'La da el profe a mano: ' + b.own.charAt(0).toLowerCase() + b.own.slice(1) + '.' : 'La da el profe a mano.';
  if(b.t==='mes' && !+b.v) return 'No faltar a ningún entreno del mes.';
  var g = f2Goal(b.t);
  return g.pre + ' ' + b.v + ' ' + g.post + '.';
}
function f2ProgTxt(b, pr){
  if(pr.got) return 'La tiene';
  if(b.t==='propia') return '';
  if(b.t==='racha') return 'Lleva ' + pr.cur + ' seguidos';
  if(b.t==='mes') return 'Este mes: ' + pr.cur + (pr.cur===1 ? ' falta' : ' faltas');
  if(b.t==='goles') return 'Este mes: ' + pr.cur + (pr.cur===1 ? ' gol' : ' goles');
  if(b.t==='asist') return 'Este mes: ' + pr.cur + ' pases de gol';
  if(b.t==='sube') return '+' + pr.cur + ' en el trimestre';
  if(b.t==='nota') return pr.cur ? 'Su mejor nota: ' + String(pr.cur).replace('.',',') : 'Sin partidos calificados';
  return pr.cur + (pr.cur===1 ? ' vez' : ' veces');
}
function f2Med(b, cls){ return '<div class="f2-med mc-' + escHtml(b.c||'oro') + (cls ? ' ' + cls : '') + '"><i>' + escHtml(b.e||'⭐') + '</i></div>'; }
function f2Ganadas(p){ return f2Todas(p.categoria).filter(function(b){ return f2Prog(b,p).got; }); }
function f2MedRow(p){
  var g = f2Ganadas(p);
  if(!g.length) return '';
  return '<div class="f2-mj-row" style="margin:6px 0 12px">' + g.map(function(b){ return '<span title="' + escHtml(b.n) + '">' + f2Med(b,'sm') + '</span>'; }).join('') + '</div>';
}
function f2PuedeClub(){ return clubRole()==='admin'; }

/* ---------- ventana ---------- */
function f2Modal(html){
  var overlay = document.getElementById('modalOverlay'), body = document.getElementById('modalBody');
  body.innerHTML = '<button class="modal-close" id="closeModal">✕</button>' + html;
  overlay.classList.add('show');
  var cerrar = function(){ overlay.classList.remove('show'); };
  body.querySelector('#closeModal').onclick = cerrar;
  overlay.onclick = function(e){ if(e.target===overlay) cerrar(); };
  return {body:body, cerrar:cerrar};
}

            '</div></div>' +
          '<div style="min-width:0;display:flex;flex-direction:column;gap:12px">' +
            '<div class="f2-grpH"><h3>' + titulo + '</h3><span class="f2-mute">' + per.label + (eq.ov ? ' · elegido por el profe' : '') + '</span></div>' +

                var p = eq.asign[s.i], st = 'left:' + s.x + '%;top:' + s.y + '%';

  el.querySelectorAll('[data-n]').forEach(function(b){ b.onclick = function(){ f2UI.n = +b.dataset.n; render(); }; });
  el.querySelectorAll('[data-share]').forEach(function(b){ b.onclick = function(){ var p = state.players.filter(function(x){ return x.id===b.dataset.share; })[0]; if(p) f2Compartir(p, mvpCls); }; });

    state.destacadosCat = state.destacadosCat || {};
    var d = state.destacadosCat[cat] = state.destacadosCat[cat] || {};
    var o = d[per.key] = d[per.key] || {slots:{}, mvp:''};
    fn(o, d);
    persist(); f2Memo = {}; render();
  }
  var edb = el.querySelector('#f2Edit'); if(edb) edb.onclick = function(){ f2UI.edit = !f2UI.edit; render(); };
  var au = el.querySelector('#f2Auto'); if(au) au.onclick = function(){ guardar(function(o,d){ delete d[per.key]; }); };
  function elegir(titulo2, actual, alElegir){

      .map(function(p){ return {p:p, s:f2Score(p, per)}; })
      .sort(function(a,b){ return (b.s?b.s.prom:-1) - (a.s?a.s.prom:-1); });

        (x.s ? ' · nota ' + x.s.prom.toFixed(1).replace('.',',') : ' · sin nota') + '</span></button>'; }).join('') + '</div>');
    m.body.querySelectorAll('[data-p]').forEach(function(b){ b.onclick = function(){ m.cerrar(); alElegir(b.dataset.p); }; });
  }
  if(ed){
    var mv = el.querySelector('[data-mvp]');
    if(mv) mv.onclick = function(){ elegir(tMvp, eq.mvp && eq.mvp.id, function(id){ guardar(function(o){ o.mvp = id; }); }); };
    if(f2UI.edit) el.querySelectorAll('[data-slot]').forEach(function(b){
      b.onclick = function(){
        var i = +b.dataset.slot, s = eq.slots[i], ac = eq.asign[i];
        elegir('Puesto: ' + posName(s.pos), ac && ac.id, function(id){
          guardar(function(o){
            o.slots = o.slots || {};
            Object.keys(o.slots).forEach(function(k){ if(o.slots[k]===id) delete o.slots[k]; }); // nadie queda en dos puestos
            eq.slots.forEach(function(t){ if(!o.slots[t.i] && eq.asign[t.i] && t.i!==i && eq.asign[t.i].id!==id) o.slots[t.i] = eq.asign[t.i].id; });
            o.slots[i] = id;
          });
        });
      };
    });
  }
  return el;
}

// Ver una insignia: quién la tiene, y si se puede, editarla o darla a mano
function f2Insignia(b0, cat){
  var puede = b0.club ? f2PuedeClub() : puedeEscribirA(cat);
  var d = f2Clone(b0), lista = categoryPlayers(), vista = puede ? 'editar' : 'ver';
  function pintar(){
    var gd = f2Goal(d.t), own = d.t==='propia';
    var top = '<div class="f2-ed-top">' + f2Med(d,'big') + '<div><b>' + escHtml(d.n||'Sin nombre') + '</b><span>' + escHtml(f2Regla(d)) + '</span></div></div>';
    var quien = '<div class="f2-who">' + lista.map(function(p){
      var pr = f2Prog(d, p);
      var dar = own && puedeEscribirA(p.categoria) && !d.nueva ? '<button class="f2-btn' + (pr.got ? ' gh' : '') + '" data-dar="' + escHtml(p.id) + '">' + (pr.got ? 'Quitar' : 'Dar') + '</button>' : '';
      return '<div><span>' + escHtml(p.name) + (pr.got ? ' ✓' : '') + '</span>' + (dar || '<small>' + f2ProgTxt(d, pr) + '</small>') + '</div>'; }).join('') + '</div>';
    var tabs = puede && !d.nueva ? '<div class="f2-chips"><button class="f2-chip' + (vista==='editar'?' on':'') + '" data-v="editar">Editar</button><button class="f2-chip' + (vista==='ver'?' on':'') + '" data-v="ver">Quién la tiene</button></div>' : '';
    var form = !puede ? '' :
      '<div class="f2-fld"><label for="f2N">Nombre</label><input class="f2-in" id="f2N" maxlength="24" value="' + escHtml(d.n) + '"></div>' +
      '<div class="f2-fld"><label>Dibujo</label><div class="f2-emo">' + F2_EMOJIS.map(function(e){ return '<button type="button" class="' + (e===d.e?'on':'') + '">' + e + '</button>'; }).join('') + '</div></div>' +
      '<div class="f2-fld"><label>¿Qué tiene que hacer el niño para ganarla?</label><div class="f2-goals">' + F2_GOALS.map(function(g){
        return '<button type="button" data-g="' + g.id + '" class="' + (g.id===d.t?'on':'') + '"><i>' + g.i + '</i>' + g.n + '</button>'; }).join('') + '</div></div>' +
      (own ? '<div class="f2-fld"><label for="f2O">Escríbelo con tus palabras</label><input class="f2-in" id="f2O" maxlength="60" placeholder="Por ejemplo: ayudar a recoger los conos" value="' + escHtml(d.own||'') + '">' +
          '<p class="f2-note">Esta no la mide la app. El profe la da a mano desde aquí, en "Quién la tiene".</p></div>'
        : '<div class="f2-rule">' + ((d.t==='mes' && !+d.v) ? 'No faltar a ningún entreno del mes' : escHtml(gd.pre)) +
          ' <span class="f2-step"><button type="button" data-d="-1" aria-label="Menos">−</button><output>' + d.v + '</output><button type="button" data-d="1" aria-label="Más">+</button></span> ' +
          ((d.t==='mes' && !+d.v) ? '' : escHtml(gd.post)) + '</div>') +
      '<div class="f2-fld"><label>Color</label><div class="f2-cols">' + F2_COLORS.map(function(c){ return '<button type="button" class="mc-' + c + (c===d.c?' on':'') + '" data-c="' + c + '" aria-label="' + c + '"></button>'; }).join('') + '</div></div>' +
      '<div class="f2-act"><button class="f2-btn" id="f2Save">Guardar insignia</button>' + (!d.nueva ? '<button class="f2-btn gh" id="f2Del">Borrar</button>' : '') + '</div>';
    var lock = !puede && b0.club && clubRole() ? '<p class="f2-lock">Esta insignia la puso el director deportivo para todo el club. Solo él la puede cambiar.</p>' : '';
    var m = f2Modal('<div class="f2-ed">' + top + lock + tabs + (vista==='editar' && puede ? form : quien) + '</div>');
    var bd = m.body;
    bd.querySelectorAll('[data-v]').forEach(function(x){ x.onclick = function(){ vista = x.dataset.v; pintar(); }; });
    var n = bd.querySelector('#f2N'); if(n) n.oninput = function(){ d.n = n.value; bd.querySelector('.f2-ed-top b').textContent = d.n || 'Sin nombre'; };
    var o = bd.querySelector('#f2O'); if(o) o.oninput = function(){ d.own = o.value; bd.querySelector('.f2-ed-top span').textContent = f2Regla(d); };
    bd.querySelectorAll('.f2-emo button').forEach(function(x){ x.onclick = function(){ d.e = x.textContent; pintar(); }; });
    bd.querySelectorAll('[data-c]').forEach(function(x){ x.onclick = function(){ d.c = x.dataset.c; pintar(); }; });
    bd.querySelectorAll('[data-g]').forEach(function(x){ x.onclick = function(){ d.t = x.dataset.g; var g = f2Goal(d.t); if(g.d!==undefined) d.v = g.d; pintar(); }; });
    bd.querySelectorAll('[data-d]').forEach(function(x){ x.onclick = function(){ var g = f2Goal(d.t); d.v = Math.max(g.min, Math.min(g.max, (+d.v||0) + (+x.dataset.d))); pintar(); }; });
    bd.querySelectorAll('[data-dar]').forEach(function(x){ x.onclick = function(){
      var p = state.players.filter(function(y){ return y.id===x.dataset.dar; })[0]; if(!p) return;
      p.dadas = p.dadas || {};
      if(p.dadas[d.id]) delete p.dadas[d.id]; else p.dadas[d.id] = todayStr();
      persist(); f2Memo = {}; pintar();
    }; });
    var sv = bd.querySelector('#f2Save');
    if(sv) sv.onclick = function(){
      var limpio = {id:d.id, n:String(d.n||'').replace(/[<>]/g,'').trim() || 'Sin nombre', e:d.e, t:d.t, c:d.c};
      if(d.t==='propia') limpio.own = String(d.own||'').replace(/[<>]/g,'').trim(); else limpio.v = +d.v||0;
      f2GuardarInsignia(limpio, b0.club, cat, false);

    };
    var dl = bd.querySelector('#f2Del');
    if(dl) dl.onclick = function(){
      if(!dl.classList.contains('ok')){ dl.classList.add('ok'); dl.textContent = 'Toca otra vez para borrar'; return; }
      f2GuardarInsignia(d, b0.club, cat, true); m.cerrar(); render();
    };
  }
  pintar();
}
function f2GuardarInsignia(b, esClub, cat, borrar){
  var arr = esClub ? f2Clone(f2ClubBadges()) : f2Clone(f2CatBadges(cat));
  var i = -1; arr.forEach(function(x,j){ if(x.id===b.id) i = j; });
  if(borrar){ if(i>-1) arr.splice(i,1); }
  else if(i>-1) arr[i] = b; else arr.push(b);
  if(esClub) state.clubBadges = arr;
  else { state.catBadges = state.catBadges || {}; state.catBadges[cat] = arr; }
  persist(); f2Memo = {};
}

function f2SobreCheck(p){
  if(!p || document.getElementById('f2Sobre')) return;
  var k = 'arena_sobre_' + sessionEnteredClub + '_' + p.id, antes = null;
  try{ antes = localStorage.getItem(k); }catch(e){ return; }
  if(antes===null){ try{ localStorage.setItem(k, String(p.valoracion)); }catch(e){} return; } // primera vez en este celular: solo se anota
  antes = +antes;
  if(!(p.valoracion > antes)){ if(p.valoracion < antes){ try{ localStorage.setItem(k, String(p.valoracion)); }catch(e){} } return; }
  f2Sobre(p, antes, function(){ try{ localStorage.setItem(k, String(p.valoracion)); }catch(e){} });
}

    '<div class="hint">Toca el sobre</div><div class="walk"></div>' +

  function rise(k, y0, sp){ for(var i=0;i<k;i++) P.push({x:.5+(Math.random()-.5)*sp, y:y0, vx:(Math.random()-.5)*.0016, vy:-.002-Math.random()*.004, r:Math.random()*2.2+.8, life:1, dec:.004+Math.random()*.006, tw:Math.random()*6}); }

      q.vx *= .99; q.vy *= .992; q.x += q.vx + Math.sin(t/400+q.tw)*.0004; q.y += q.vy; q.life -= q.dec;

function f2Img(src){
  return new Promise(function(ok){
    if(!src){ ok(null); return; }
    var im = new Image();
    if(/^https?:/.test(src) && src.indexOf(location.origin)!==0) im.crossOrigin = 'anonymous';
    im.onload = function(){ ok(im); }; im.onerror = function(){ ok(null); };
    im.src = src;
  });
}
function f2Dibujar(cv, p, m, cuadrada, sinExternas){
  var W = 1080, H = cuadrada ? 1080 : 1920, pal = F2_PAL[m.cls] || F2_PAL.oro, club = f2Club();

  var c = cv.getContext('2d');
  var fuentes = document.fonts ? Promise.all([document.fonts.load('700 100px Oswald'), document.fonts.load('600 40px Saira')]).catch(function(){}) : Promise.resolve();

  return Promise.all([fuentes, f2Img(photoMap[p.id]), sinExternas && /^https?:/.test(logo) ? null : f2Img(logo), f2Img(ARENA_LOGO_SRC)]).then(function(r){
    var foto = r[1], esc = r[2], arena = r[3];
    // fondo
    var g = c.createLinearGradient(0,0,0,H); g.addColorStop(0,'#0a1020'); g.addColorStop(1,'#03050b'); c.fillStyle = g; c.fillRect(0,0,W,H);

    c.save(); c.translate(W/2, cyc); c.fillStyle = 'rgba(' + pal.rgb + ',.10)';
    for(var i=0;i<36;i++){ c.rotate(Math.PI*2/36); c.beginPath(); c.moveTo(0,0); c.lineTo(-40, -H); c.lineTo(40, -H); c.closePath(); c.fill(); }
    c.restore();

    c.fillStyle = rg; c.fillRect(0,0,W,H);
    // club arriba
    c.textAlign = 'center'; c.textBaseline = 'middle';
    var ty = cuadrada ? 70 : 120;
    c.font = '600 34px Saira, sans-serif'; c.fillStyle = '#c9d2e3';
    var nom = (club.nombre || '') + ' · ' + p.categoria, tw = c.measureText(nom).width;
    if(esc){ c.save(); c.beginPath(); c.arc(W/2 - tw/2 - 40, ty, 26, 0, 7); c.clip(); c.drawImage(esc, W/2 - tw/2 - 66, ty-26, 52, 52); c.restore(); }
    c.fillText(nom, W/2 + (esc ? 16 : 0), ty);
    // la carta
    var cw = cuadrada ? 470 : 760, ch = cw*1.45, x0 = (W-cw)/2, y0 = cuadrada ? 115 : 205;
    function forma(ins){ var a = cw*ins, w = cw-2*a, h = ch-2*a, x = x0+a, y = y0+a*1.45;
      c.beginPath(); c.moveTo(x+w*.09,y); c.lineTo(x+w*.91,y); c.lineTo(x+w,y+h*.06); c.lineTo(x+w,y+h*.87); c.lineTo(x+w*.5,y+h); c.lineTo(x,y+h*.87); c.lineTo(x,y+h*.06); c.closePath(); }
    c.save(); c.shadowColor = 'rgba(' + pal.rgb + ',.55)'; c.shadowBlur = 70;
    var cg = c.createLinearGradient(x0, y0, x0+cw, y0+ch); cg.addColorStop(0,pal.a); cg.addColorStop(.45,pal.b); cg.addColorStop(1,pal.c);
    forma(0); c.fillStyle = cg; c.fill(); c.restore();
    forma(.032);
    if(pal.in1){ var ig = c.createLinearGradient(x0, y0, x0+cw*.3, y0+ch); ig.addColorStop(0,pal.in1); ig.addColorStop(1,pal.in2); c.fillStyle = ig; }
    else { var ig2 = c.createLinearGradient(x0, y0, x0+cw, y0+ch); ig2.addColorStop(0,pal.a); ig2.addColorStop(.6,pal.b); ig2.addColorStop(1,pal.c); c.fillStyle = ig2; }
    c.fill();
    c.save(); forma(.032); c.clip();
    var hl = c.createRadialGradient(x0+cw*.3, y0+ch*.08, 0, x0+cw*.3, y0+ch*.08, cw*.8); hl.addColorStop(0,'rgba(255,255,255,.35)'); hl.addColorStop(1,'rgba(255,255,255,0)');
    c.fillStyle = hl; c.fillRect(x0, y0, cw, ch);
    // foto o silueta
    var px = x0+cw*.24, py = y0+ch*.13, pw = cw*.70, ph = ch*.46;
    if(foto){
      var s = Math.max(pw/foto.width, ph/foto.height), fw = foto.width*s, fh = foto.height*s;
      c.save(); c.beginPath(); c.rect(px, py, pw, ph); c.clip(); c.drawImage(foto, px+(pw-fw)/2, py+(ph-fh)*.2, fw, fh); c.restore();
      var fd = c.createLinearGradient(0, py+ph*.65, 0, py+ph); fd.addColorStop(0,'rgba(0,0,0,0)'); fd.addColorStop(1, pal.in1 || pal.b); c.fillStyle = fd; c.fillRect(px, py+ph*.65, pw, ph*.36);
    } else {

      c.beginPath(); c.arc(sx+sw*.5, sy+sw*.3, sw*.19, 0, 7); c.fill();
      c.beginPath(); c.moveTo(sx+sw*.14, sy+sw); c.quadraticCurveTo(sx+sw*.18, sy+sw*.6, sx+sw*.5, sy+sw*.58); c.quadraticCurveTo(sx+sw*.82, sy+sw*.6, sx+sw*.86, sy+sw); c.closePath(); c.fill();

function f2Compartir(p, preferido){
  var ms = f2Momentos(p), mi = 0, cuadrada = false, cv = document.createElement('canvas');
  ms.forEach(function(m,i){ if(m.id===preferido) mi = i; });
  var m = f2Modal('<div class="f2-share"><h2 style="margin:0">Compartir la carta de ' + escHtml(f2Nombre1(p)) + '</h2>' +
    '<div class="f2-chips" id="f2Mom">' + ms.map(function(x,i){ return '<button class="f2-chip' + (i===mi?' on':'') + '" data-i="' + i + '">' + escHtml(x.chip) + '</button>'; }).join('') + '</div>' +
    '<div class="f2-chips"><button class="f2-chip on" data-f="h">Historia</button><button class="f2-chip" data-f="c">Cuadrada</button></div>' +
    '<div id="f2Cv"></div>' +
    '<div class="f2-act" style="justify-content:center"><button class="f2-btn" id="f2Go">' + (navigator.canShare ? 'Compartir' : 'Descargar imagen') + F2_SHARE_SVG + '</button></div>' +
    '<p class="f2-mute" style="text-align:center">Solo sale lo público: la carta y el momento. Nunca los comentarios del profe.</p></div>');
  m.body.querySelector('#f2Cv').appendChild(cv);
  var sinExt = false;
  function pintar(){ return f2Dibujar(cv, p, ms[mi], cuadrada, sinExt); }
  m.body.querySelectorAll('[data-i]').forEach(function(b){ b.onclick = function(){ mi = +b.dataset.i; m.body.querySelectorAll('[data-i]').forEach(function(x){ x.classList.toggle('on', x===b); }); pintar(); }; });
  m.body.querySelectorAll('[data-f]').forEach(function(b){ b.onclick = function(){ cuadrada = b.dataset.f==='c'; m.body.querySelectorAll('[data-f]').forEach(function(x){ x.classList.toggle('on', x===b); }); pintar(); }; });
  pintar();
  m.body.querySelector('#f2Go').onclick = function(){
    var go = this;
    function conBlob(blob){
      var nombre = 'carta-' + f2Nombre1(p).toLowerCase().normalize('NFD').replace(/[^a-z0-9]/g,'') + '.png';
      var file = null; try{ file = new File([blob], nombre, {type:'image/png'}); }catch(e){}
      if(file && navigator.canShare && navigator.canShare({files:[file]})){
        navigator.share({files:[file], text:'La carta de ' + f2Nombre1(p) + ' en Perfil de Jugador'}).catch(function(){});
      } else {
        var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nombre;
        document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 2000);
      }
    }
    try{ cv.toBlob(function(b){ if(b) conBlob(b); }, 'image/png'); }
    catch(e){ // un escudo de otro servidor no deja exportar la imagen: se vuelve a dibujar sin él
      sinExt = true; go.disabled = true;
      pintar().then(function(){ go.disabled = false; cv.toBlob(function(b){ if(b) conBlob(b); }, 'image/png'); });
    }
  };
}

// clubes/{club}/mensajes: el profe le escribe a su categoría y la tarea automática
// le manda la notificación a cada familia de esa categoría que tenga los avisos activados.
var MSG_RAPIDOS = [
  {t:'Lluvia', v:'Hoy no hay entrenamiento por lluvia. Nos vemos en el próximo.'},
  {t:'Cambio de horario', v:'Cambio de horario: hoy entrenamos a las '},
  {t:'Convocados', v:'Ya están los convocados para el partido. Llegar 30 minutos antes con uniforme completo.'},
  {t:'Uniforme', v:'Recuerden venir con el uniforme completo y suficiente agua.'}
];
function puedeEscribirA(cat){
  var r = clubRole();
  return r==='admin' || (r==='profesor' && !!state && state.profesorCategoria===cat);
}
function haceTxt(ms){
  var m = Math.round((Date.now()-ms)/60000);
  if(m < 1) return 'ahora';
  if(m < 60) return 'hace ' + m + ' min';
  var h = Math.round(m/60); if(h < 24) return 'hace ' + h + ' h';
  var d = Math.round(h/24); return d===1 ? 'ayer' : 'hace ' + d + ' d\u00edas';
}
function msgCat(cat){
  var lim = Date.now() - 7*864e5;
  var ms = (remote.msgs||[]).filter(function(m){ return m.categoria===cat && (m.creado||0) >= lim; });
  var puede = puedeEscribirA(cat), m = ms[0];
  if(!m && !puede) return '';
  return '<div class="msg" data-cat="' + escHtml(cat) + '">' +
    (m ? '<div class="msg-last"><div class="msg-h"><span class="msg-k">Mensaje del profe</span><span class="msg-t">' + haceTxt(m.creado) + '</span>' +
        (puede ? '<button type="button" class="msg-del" data-id="' + escHtml(m.id) + '">Borrar</button>' : '') + '</div>' +
        '<p>' + escHtml(m.texto) + '</p></div>' : '') +
    (puede ? '<button type="button" class="msg-new">' + (m ? 'Escribir otro mensaje' : 'Escribir al grupo') + '</button>' +
      '<div class="msg-form" hidden><div class="msg-chips">' + MSG_RAPIDOS.map(function(r,i){ return '<button type="button" data-i="' + i + '">' + r.t + '</button>'; }).join('') + '</div>' +
      '<textarea maxlength="280" rows="3" placeholder="Mensaje para las familias de ' + escHtml(cat) + '"></textarea>' +
      '<div class="msg-foot"><span class="msg-n">0/280</span><em class="msg-err"></em><button type="button" class="msg-send">Enviar a las familias</button></div>' +
      '<small class="msg-nota">Les llega una notificaci\u00f3n a las familias que activaron los avisos, y queda aqu\u00ed una semana.</small></div>' : '') +
  '</div>';
}
function msgConectar(el){
  el.querySelectorAll('.msg').forEach(function(box){
    var cat = box.getAttribute('data-cat'), nuevo = box.querySelector('.msg-new'), form = box.querySelector('.msg-form');
    if(nuevo) nuevo.onclick = function(){ form.hidden = !form.hidden; nuevo.hidden = !form.hidden; if(!form.hidden) form.querySelector('textarea').focus(); };
    if(form){
      var ta = form.querySelector('textarea'), n = form.querySelector('.msg-n'), err = form.querySelector('.msg-err'), send = form.querySelector('.msg-send');
      var cuenta = function(){ n.textContent = ta.value.length + '/280'; };
      ta.oninput = cuenta;
      form.querySelectorAll('.msg-chips button').forEach(function(b){
        b.onclick = function(){ ta.value = MSG_RAPIDOS[+b.dataset.i].v; cuenta(); ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); };
      });
      send.onclick = function(){
        var txt = String(ta.value||'').replace(/[<>]/g,'').trim();
        if(!txt){ err.textContent = 'Escribe el mensaje.'; return; }
        if(!window.db){ err.textContent = 'No hay conexi\u00f3n con la base de datos.'; return; }
        send.disabled = true; send.textContent = 'Enviando\u2026'; err.textContent = '';
        var u = window.auth && auth.currentUser;
        if(!navigator.onLine){ senal.pend++; senalPintar(); }
        ta.blur();
        db.collection(clubPath('mensajes')).add({categoria:cat, texto:txt, autor:(u && u.email) || '', creado:Date.now(), enviado:false})
          .catch(function(e){
            console.error('No se pudo enviar el mensaje', e);
            send.disabled = false; send.textContent = 'Enviar a las familias';
            err.textContent = 'No se pudo enviar. Revisa tu sesi\u00f3n e intenta otra vez.';
          });
      };
    }
    box.querySelectorAll('.msg-del').forEach(function(b){
      b.onclick = function(){
        if(!b.classList.contains('ok')){ // dos toques, para no borrar sin querer
          b.classList.add('ok'); b.textContent = '\u00bfBorrar?';
          setTimeout(function(){ b.classList.remove('ok'); b.textContent = 'Borrar'; }, 3000);
          return;
        }
        db.doc(clubPath('mensajes/' + b.dataset.id)).delete().catch(function(){ showToast('No se pudo borrar el mensaje.'); });
      };
    });
  });
}

// Cuánto mueve la carta un 10 y un 1 en esa característica, según su peso
function effTxt(w){
  if(w < QUICK_THRESHOLD) return 'No se califica aparte en este puesto';
  var q = w>=9 ? 'mucho' : (w>=7 ? 'bastante' : 'poco');
  return 'Pesa <b>' + Math.round(w/RATING_MAX*100) + '%</b> · si le va bien sube <b class="up">' + q + '</b> · si le va mal baja <b class="down">' + q + '</b>';
}

var perfilUi = {scope:'club'};
function renderPerfil(){
  var el = document.createElement('div');

        '</span><span class="val">' + v + '/10</span></div>' +
        '<input type="range" min="0" max="10" step="1" value="' + v + '"' + (editable?'':' disabled') + ' />' +
        '<div class="attr-eff">' + effTxt(v) + '</div>';
      var input = row.querySelector('input[type=range]');
      var valSpan = row.querySelector('.val'), eff = row.querySelector('.attr-eff');
      input.oninput = function(){
        if(!editable) return;
        var nv = parseInt(input.value,10);
        setWeight(a.key, nv);
        valSpan.textContent = nv + '/10';

        var inp = nameEl.querySelector('input'); inp.focus(); inp.select();
        function ok(){
          var nl = cleanLabel(inp.value);
          if(nl && nl!==a.label){ attrStore().labels[a.key] = nl; persist(); }
          renderPerfilPanel();
        }
        nameEl.querySelector('[data-ok]').onclick = ok;
        inp.onkeydown = function(e){ if(e.key==='Enter') ok(); if(e.key==='Escape') renderPerfilPanel(); };
      };
      var dl = row.querySelector('[data-act=del]');
      if(dl) dl.onclick = function(){
        if(!dl.classList.contains('sure')){ dl.classList.add('sure'); dl.textContent = '¿Quitar?'; setTimeout(function(){ if(dl.isConnected){ dl.classList.remove('sure'); dl.textContent = '✕'; } }, 3000); return; }
        var st = attrStore();
        st.extra = (st.extra||[]).filter(function(x){ return x.key!==a.key; });
        if(st.labels) delete st.labels[a.key];
        persist(); renderPerfilPanel();
      };
      panel.appendChild(row);
    });
    if(canEditAttrs){
      var addRow = document.createElement('div');
      addRow.className = 'attr-add';

        var key = 'c_' + lbl.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'_').slice(0,20) + '_' + Date.now().toString(36).slice(-4);
        attrStore().extra.push({key:key, label:lbl});
        persist(); renderPerfilPanel();
      }
      addRow.querySelector('button').onclick = add;
      ain.onkeydown = function(e){ if(e.key==='Enter') add(); };
      panel.appendChild(addRow);
      var note = document.createElement('div');
      note.className = 'attr-note';
      note.textContent = scope==='club'
        ? 'Las que agregues aquí le aparecen a todas las categorías del club. Arrancan en 5/10 en cada posición: ajústalas posición por posición.'
        : 'Las que agregues solo aparecen en ' + scope + '. Arrancan en 5/10 en cada posición: ajústalas posición por posición.';
      panel.appendChild(note);
    }
    var summary = document.createElement('div');
    summary.className = 'summary-box';
    panel.appendChild(summary);
    if(scope!=='club' && editable){
      var resetRow = document.createElement('div');
      resetRow.className = 'save-row';
      resetRow.innerHTML = '<button class="pl-btn ghost small">Volver al predeterminado del club</button>';

    }
    updateSummary();
  }
  renderPerfilPanel();
  return el;
}

function attributeAverages(hist){
  var sums = {}, counts = {};
  var LIST = attrsFor(activeCategoria());
  LIST.forEach(function(a){ sums[a.key]=0; counts[a.key]=0; });
  hist.forEach(function(h){
    var qv = h.quickValues || {};
    Object.keys(qv).forEach(function(k){
      if(sums[k]===undefined) return;
      sums[k] += qv[k]; counts[k] += 1;
    });
  });
  return LIST.filter(function(a){ return counts[a.key] > 0; })
    .map(function(a){ return {key:a.key, label:a.label, avg: sums[a.key]/counts[a.key], count: counts[a.key]}; })
    .sort(function(x,y){ return y.avg-x.avg; });
}

  var prom = promValor(list);

      '<div>' + estrellasHtml(estrellasDe(prom)) + '<span>Nivel</span></div>' +

      '<div><b class="ch-x">' + evs.length + '</b><span>Veces calificado</span></div>' +

    }).join('') + '</div>' : '<p style="margin:0;font-size:13px;opacity:.55">El grupo a\u00fan no tiene evaluaci\u00f3n colectiva este trimestre. Se califica desde la portada del club.</p>') +
  '</div>';

function renderInforme(){
  var el = document.createElement('div');
  el.innerHTML =
    '<div class="view-head"><div>' +
      '<h1>Informe trimestral</h1>' +
      '<p>Se genera solo, a partir de todo lo que se ha registrado del jugador durante el trimestre.</p>' +
    '</div></div>' +
    informeGrupo() +
    '<div class="informe-select"><select class="cat-select" id="playerSelect"></select></div>' +
    '<div id="informeBody"></div>';

  var players = categoryPlayers();
  var sel = el.querySelector('#playerSelect');
  players.forEach(function(p){
    var o = document.createElement('option');
    o.value = p.id; o.textContent = p.name;
    sel.appendChild(o);
  });
  var body = el.querySelector('#informeBody');

  function renderFor(id){
    var p = players.find(function(x){return x.id===id;});
    var hist = p.historial;
    var entrenamientos = hist.filter(function(h){return h.type==='entrenamiento';});
    var partidos = hist.filter(function(h){return h.type==='partido';});
    var asistidos = entrenamientos.length;
    var diasRegistrados = 0, diasAsistidos = 0;
    Object.keys(state.trainingDays).forEach(function(k){
      if(k.indexOf(activeCategoria()+'::')!==0) return;
      var mark = state.trainingDays[k].attendance ? state.trainingDays[k].attendance[p.id] : undefined;
      if(typeof mark === 'boolean'){ diasRegistrados++; if(mark) diasAsistidos++; }
    });
    var pct = diasRegistrados ? Math.round(diasAsistidos/diasRegistrados*100) : (entrenamientos.length ? 100 : 0);
    pct = Math.max(0, Math.min(100, pct)); // nunca puede pasarse de 100%, así el dato de origen esté incompleto
    var promedio = hist.length ? (hist.reduce(function(s,h){return s+h.rating;},0)/hist.length).toFixed(1) : '—';
    var mejorSesion = hist.slice().sort(function(a,b){return b.delta-a.delta;})[0];
    var startVal = hist.length ? ratingBefore(p, hist.reduce(function(m,h){ return h.date<m ? h.date : m; }, hist[0].date)) : p.valoracion;

    var mentionCount = {};
    hist.forEach(function(h){ (h.attrsHit||[]).forEach(function(a){ mentionCount[a] = (mentionCount[a]||0)+1; }); });
    var topMention = Object.keys(mentionCount).sort(function(a,b){return mentionCount[b]-mentionCount[a];})[0];

    var chron = hist.slice().reverse(); // más antiguo primero, para ver evolución
    var half = Math.ceil(chron.length/2);
    var firstHalf = chron.slice(0, half), secondHalf = chron.slice(half);
    function avgRating(list){ return list.length ? list.reduce(function(s,h){return s+h.rating;},0)/list.length : null; }
    var avgFirst = avgRating(firstHalf), avgSecond = avgRating(secondHalf);
    var tendenciaTxt = 'aún no hay suficientes registros para ver una tendencia clara';
    if(avgFirst!=null && avgSecond!=null && secondHalf.length>=2){
      if(avgSecond - avgFirst >= 0.5) tendenciaTxt = 'ha ido mejorando: pasó de un promedio de ' + avgFirst.toFixed(1) + '/10 a ' + avgSecond.toFixed(1) + '/10 entre la primera y la segunda mitad del trimestre';
      else if(avgFirst - avgSecond >= 0.5) tendenciaTxt = 'ha bajado un poco: pasó de un promedio de ' + avgFirst.toFixed(1) + '/10 a ' + avgSecond.toFixed(1) + '/10 entre la primera y la segunda mitad del trimestre';
      else tendenciaTxt = 'se ha mantenido estable, alrededor de ' + avgSecond.toFixed(1) + '/10, durante todo el trimestre';
    }

    var avgPartidos = avgRating(partidos);
    var mejorPartido = partidos.slice().sort(function(a,b){return b.rating-a.rating;})[0];
    var pctTxt = pct + '%';
    var pctNarrativeTxt = diasRegistrados
      ? ('asistió a ' + diasAsistidos + ' de ' + diasRegistrados + ' entrenamientos programados (' + pct + '%)')
      : (entrenamientos.length ? ('registra ' + entrenamientos.length + ' entrenamientos, todos con asistencia (' + pct + '%) — aún no hay días marcados como "no asistió" en el calendario') : 'todavía no tiene entrenamientos registrados');

    var attrAvgs = attributeAverages(hist);
    var fortalezas = attrAvgs.filter(function(a){ return a.avg >= 7; }).slice(0,3);
    var mejorar = attrAvgs.filter(function(a){ return a.avg < 6; }).sort(function(a,b){return a.avg-b.avg;}).slice(0,3);
    var fortalezasTxt = fortalezas.length ? fortalezas.map(function(a){return a.label + ' (' + a.avg.toFixed(1) + '/10)';}).join(', ') : 'todavía no hay suficientes calificaciones por atributo para destacar una';
    var mejorarTxt = mejorar.length ? mejorar.map(function(a){return a.label + ' (' + a.avg.toFixed(1) + '/10)';}).join(', ') : 'ningún atributo calificado está por debajo de 6/10 todavía';

    function attrListHtml(list, emptyTxt){
      if(!list.length) return '<div style="font-size:12.5px;color:var(--ink-faint);">' + emptyTxt + '</div>';
      return list.map(function(a){
        return '<div class="attr-row-top" style="margin-bottom:6px;"><span class="name">' + a.label + '</span><span class="val">' + a.avg.toFixed(1) + '/10</span></div>';
      }).join('');
    }

    function fullTimelineHtml(){
      if(!hist.length) return '<div style="font-size:12.5px;color:var(--ink-faint);">Todavía no hay entrenamientos ni partidos registrados.</div>';
      return hist.map(function(h){
        var deltaCls = sessionXp(h, p.categoria)>=0?'up':'down';
        var deltaTxt = (sessionXp(h, p.categoria)>=0?'+':'') + sessionXp(h, p.categoria);
        var tipoLabel = h.type==='partido' ? 'Partido' : 'Entrenamiento';
        var golesTxt = h.type==='partido' ? ' · ' + (h.goles||0) + ' gol(es), ' + (h.asistencias||0) + ' asist.' : '';
        return '<div class="tl-item">' +
          '<div class="tl-date"><b>' + tipoLabel + '</b> · ' + fmtDate(h.date) + ' · Calificación ' + h.rating + '/10' + golesTxt + ' · <span class="tl-delta ' + deltaCls + '">' + deltaTxt + ' progreso</span></div>' +
          '<div class="tl-comment">' + h.comment + '</div>' +
          (h.attrsHit && h.attrsHit.length ? '<div style="margin-top:5px;">' + h.attrsHit.map(function(a){return '<span class="attr-chip">' + a + '</span>';}).join('') + '</div>' : '') +
        '</div>';
      }).join('');
    }

    body.innerHTML =
      '<div class="informe-card">' +
        '<div class="informe-header">' +
          '<div><h2>' + p.name + '</h2><div class="sub">' + posName(p.pos) + ' · ' + p.categoria + ' · Trimestre en curso</div></div>' +
          '<span class="pill">Valoración ' + startVal + ' → ' + p.valoracion + '</span>' +
        '</div>' +
        '<div class="informe-grid">' +
          '<div class="informe-stat"><div class="n">' + p.goles + '</div><div class="l">Goles</div></div>' +
          '<div class="informe-stat"><div class="n">' + p.asistencias + '</div><div class="l">Asistencias</div></div>' +
          '<div class="informe-stat"><div class="n">' + pctTxt + '</div><div class="l">Asistencia a entreno</div></div>' +
          '<div class="informe-stat"><div class="n">' + promedio + '</div><div class="l">Calificación promedio</div></div>' +
        '</div>' +
        (function(){ var tp = sparkPath(hist); if(!tp) return ''; tp = tp.split(' ').map(function(pt){ var xy=pt.split(','); return xy[0]+','+(parseFloat(xy[1])*1.5).toFixed(1); }).join(' '); return '<svg class="trend-svg" viewBox="0 0 200 40" preserveAspectRatio="none"><polygon points="' + tp + ' 200,40 0,40" fill="rgba(246,83,52,.12)" stroke="none"/><polyline points="' + tp + '" fill="none" stroke="#f65334" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>'; })() +
        '<div class="informe-narrative">' +
          '<p><b>' + p.name + '</b> juega como <b>' + posName(p.pos) + '</b> en ' + p.categoria + '. En lo que va del trimestre acumula ' + hist.length + ' registros — ' + entrenamientos.length + ' entrenamientos y ' + partidos.length + ' partidos — y su valoración pasó de ' + startVal + ' a ' + p.valoracion + ' puntos.</p>' +
          '<p><b>En los entrenamientos:</b> promedia ' + (avgRating(entrenamientos)!=null ? avgRating(entrenamientos).toFixed(1) : '—') + '/10 en calificación general, y ' + tendenciaTxt + '. En cuanto a asistencia, ' + pctNarrativeTxt + '.' + (topMention ? ' La cualidad que más se repitió en las retroalimentaciones del profesor fue <b>' + topMention + '</b>.' : '') + '</p>' +
          (partidos.length ? '<p><b>En los partidos:</b> jugó ' + partidos.length + ' con una calificación promedio de ' + avgPartidos.toFixed(1) + '/10, sumando ' + p.goles + ' goles y ' + p.asistencias + ' asistencias.' + (mejorPartido ? ' Su mejor actuación fue el ' + fmtDate(mejorPartido.date) + ', con calificación ' + mejorPartido.rating + '/10.' : '') + '</p>' : '<p><b>En los partidos:</b> todavía no tiene partidos registrados este trimestre.</p>') +
          '<p><b>Fortalezas:</b> ' + fortalezasTxt + '. <b>Puntos a mejorar:</b> ' + mejorarTxt + '.</p>' +
          (mejorSesion ? '<p>Su mejor registro individual fue el ' + fmtDate(mejorSesion.date) + (mejorSesion.type==='partido'?' (partido)':' (entrenamiento)') + ': "' + mejorSesion.comment + '"</p>' : '') +
        '</div>' +
        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px;">' +
          '<div>' +
            '<div class="attr-row-top" style="margin-bottom:8px;"><span class="name">Fortalezas</span></div>' +
            attrListHtml(fortalezas, 'Aún no hay suficientes calificaciones por atributo.') +
          '</div>' +
          '<div>' +
            '<div class="attr-row-top" style="margin-bottom:8px;"><span class="name">Puntos a mejorar</span></div>' +
            attrListHtml(mejorar, 'No hay atributos por debajo de 6/10 todavía.') +
          '</div>' +
        '</div>' +
        '<div style="margin-top:22px;padding-top:16px;border-top:1px solid var(--border);">' +
          '<div class="attr-row-top" style="margin-bottom:10px;"><span class="name">Historial completo — cada entrenamiento y cada partido</span></div>' +
          '<div class="timeline" style="max-height:none;">' + fullTimelineHtml() + '</div>' +
        '</div>' +
      '</div>';
  }
  sel.onchange = function(){ renderFor(sel.value); };
  renderFor(players[0].id);
  return el;
}

function routeFromHash(){
  if(PRIV_ON && location.hash==='#/privacidad'){
    privMode = true; staffMode = false;
    if(sessionEnteredClub){ if(window.db) detachClub(); sessionEnteredClub = null; resetClubTheme(); }
    render(); return;
  }
  privMode = false;

    staffMode = true;
    if(sessionEnteredClub){ if(window.db) detachClub(); sessionEnteredClub = null; resetClubTheme(); }

  }

}

function shadeHex(hex, f){ // f negativo oscurece, positivo aclara
  var n = parseInt(String(hex||'').replace('#',''), 16);
  if(isNaN(n)) return hex;
  var rgb = [(n>>16)&255, (n>>8)&255, n&255].map(function(c){ return Math.round(f<0 ? c*(1+f) : c + (255-c)*f); });
  return '#' + rgb.map(function(c){ return ('0' + Math.max(0, Math.min(255, c)).toString(16)).slice(-2); }).join('');
}
function hexLuma(hex){ var n = parseInt(String(hex||'').replace('#',''), 16); return (0.299*((n>>16)&255) + 0.587*((n>>8)&255) + 0.114*(n&255)) / 255; }
var THEME_VARS = ['--orange-500','--navy-950','--navy-900','--navy-800','--navy-700'];

function loadImage(src){ return new Promise(function(ok, bad){ var i = new Image(); i.onload = function(){ ok(i); }; i.onerror = bad; i.src = src; }); }
function fileToDataUrl(file){ return new Promise(function(ok, bad){ var r = new FileReader(); r.onload = function(){ ok(r.result); }; r.onerror = bad; r.readAsDataURL(file); }); }
function shrinkImage(src, max){
  return loadImage(src).then(function(img){
    var s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    var c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(img.naturalWidth*s)); c.height = Math.max(1, Math.round(img.naturalHeight*s));
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL('image/png');
  });
}
// Saca los dos colores principales del escudo: el más oscuro para el fondo, el más vivo para los detalles
function extractColors(src){
  return loadImage(src).then(function(img){
    var c = document.createElement('canvas'); c.width = 64; c.height = 64;
    var ctx = c.getContext('2d'); ctx.drawImage(img, 0, 0, 64, 64);
    var d = ctx.getImageData(0, 0, 64, 64).data, buckets = {};
    for(var i=0; i<d.length; i+=4){
      var r = d[i], g = d[i+1], b = d[i+2], a = d[i+3];
      var mx = Math.max(r,g,b), mn = Math.min(r,g,b);
      if(a < 200 || mx < 28 || (mx > 235 && mn > 215) || mx - mn < 30) continue; // transparente, negro, blanco o gris
      var key = (r>>5) + ',' + (g>>5) + ',' + (b>>5);
      var bk = buckets[key] || (buckets[key] = {n:0, r:0, g:0, b:0});
      bk.n++; bk.r += r; bk.g += g; bk.b += b;
    }
    var list = Object.keys(buckets).map(function(k){ var x = buckets[k]; return {n:x.n, r:x.r/x.n, g:x.g/x.n, b:x.b/x.n}; }).sort(function(a,b){ return b.n - a.n; });
    function hex(x){ return '#' + [x.r, x.g, x.b].map(function(v){ return ('0' + Math.round(v).toString(16)).slice(-2); }).join(''); }
    function dist(a,b){ return Math.abs(a.r-b.r) + Math.abs(a.g-b.g) + Math.abs(a.b-b.b); }
    function luma(x){ return 0.299*x.r + 0.587*x.g + 0.114*x.b; }
    var picks = [];
    list.forEach(function(x){ if(picks.length < 2 && picks.every(function(p){ return dist(p, x) > 120; })) picks.push(x); });
    if(!picks.length) return {acento:'#f65334', base:'#0e1736'};
    if(picks.length === 1) return {acento:hex(picks[0]), base:'#0e1736'};
    var dark = luma(picks[0]) < luma(picks[1]) ? picks[0] : picks[1];
    return {acento:hex(dark===picks[0] ? picks[1] : picks[0]), base:hex(dark)};
  });
}
function slugify(s){
  return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/^club\s+(deportivo\s+)?/, '').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40);
}

/* ---------- plataforma: migración de Jogo Bonito a la estructura multi-club ---------- */
var clubsLoaded = false, platformMigrating = false;
function migrateToMultiClub(){
  if(platformMigrating || !window.db) return;
  platformMigrating = true;
  var id = DEFAULT_CLUB_ID, base = 'clubes/' + id + '/';
  showToast('Pasando los datos de Jogo Bonito a la plataforma multi-club…');
  db.doc('club/general').get().then(function(g){
    if(g.exists){ // estructura segura anterior: se copia documento por documento
      return Promise.all([db.collection('categorias').get(), db.collection('publico').get(), db.collection('fotosJugadores').get()]).then(function(r){
        var jobs = [db.doc(base + 'datos/general').set(g.data())];
        r[0].forEach(function(d){ jobs.push(db.doc(base + 'categorias/' + d.id).set(d.data())); });
        r[1].forEach(function(d){ jobs.push(db.doc(base + 'publico/' + d.id).set(d.data())); });
        r[2].forEach(function(d){ var v = d.data(); jobs.push(db.doc(base + 'fotos/' + d.id).set({data:v.data, categoria:v.categoria || '', actualizada:v.actualizada || Date.now()})); });
        return Promise.all(jobs);
      });
    }
    return db.doc('appState/perfilJugador').get().then(function(a){ // documento único más antiguo
      var s = a.exists ? normalizeState(a.data()) : null;
      if(!s) return;
      if(Array.isArray(s.trainingSchedule)) s.categories.forEach(function(c){ if(!Array.isArray(s.trainingSchedules[c])) s.trainingSchedules[c] = s.trainingSchedule.slice(); });
      var docs = buildDocs(s);
      return Promise.all(Object.keys(docs).map(function(k){ return db.doc(base + k).set(docs[k]); }));
    });
  }).then(function(){
    return db.collection('staff').get().then(function(snap){ // las cuentas existentes quedan asociadas a Jogo Bonito
      var jobs = [];
      snap.forEach(function(d){ var v = d.data(); if(v.role!=='creador' && !v.club) jobs.push(d.ref.update({club:id})); });
      return Promise.all(jobs);
    });
  }).then(function(){
    // el escudo se reduce para guardarlo; si tarda demasiado, se sigue sin él (la migración nunca se queda colgada)

      '<label>Cupos de jugadores<input type="number" min="0" id="cmCupos" value="' + (club ? (club.cupos||0) : 60) + '" /></label>' +
      '<label>Estado<select id="cmEstado">' + ['activo','prueba','suspendido'].map(function(e){ return '<option value="' + e + '"' + ((club ? club.estado||'activo' : 'prueba')===e?' selected':'') + '>' + {activo:'Activo', prueba:'En prueba', suspendido:'Suspendido (nadie lo ve ni lo edita)'}[e] + '</option>'; }).join('') + '</select></label>' +
      (isNew ?
        '<label>Correo del administrador del club (opcional)<input type="email" id="cmAdmin" autocomplete="off" /></label>' +

        '<label id="cmPassWrap" style="display:none;">Clave (mínimo 6 caracteres)<input type="password" id="cmPass" autocomplete="new-password" /></label>' : '') +

      '<button class="staff-submit" id="cmSave">' + (isNew ? 'Crear club' : 'Guardar cambios') + '</button>' +
    '</div>';
  var errBox = body.querySelector('#cmError');
  function fail(msg){ errBox.textContent = msg; errBox.style.display = 'block'; }
  body.querySelector('#cmEscudo').onchange = function(e){
    var f = e.target.files && e.target.files[0];
    if(!f) return;
    fileToDataUrl(f).then(function(url){ return shrinkImage(url, 160); }).then(function(small){
      escudo = small;
      body.querySelector('#cmImg').src = small;
      return extractColors(small);
    }).then(function(c){
      body.querySelector('#cmAcento').value = c.acento;
      body.querySelector('#cmBase').value = c.base;
    }).catch(function(){ fail('No se pudo abrir esa imagen.'); });
  };
  var modoSel = body.querySelector('#cmModo');
  if(modoSel) modoSel.onchange = function(){ body.querySelector('#cmPassWrap').style.display = modoSel.value==='password' ? '' : 'none'; };
  body.querySelector('#cmSave').onclick = function(){
    errBox.style.display = 'none';
    var nombre = body.querySelector('#cmNombre').value.replace(/[<>&"]/g,'').trim();
    if(!nombre) return fail('Escribe el nombre del club.');
    var id = isNew ? slugify(nombre) : club.id;
    if(!id || id==='staff' || id==='privacidad') return fail('Ese nombre no sirve para la dirección del club; usa otras letras o números.');
    if(isNew && CLUBS.some(function(x){ return x.id===id; })) return fail('Ya existe un club con la dirección #/' + id + '.');
    var data = {
      nombre: nombre,
      tagline: body.querySelector('#cmTag').value.replace(/[<>&"]/g,'').trim(),
      colores: {acento: body.querySelector('#cmAcento').value, base: body.querySelector('#cmBase').value},
      cupos: Math.max(0, parseInt(body.querySelector('#cmCupos').value, 10) || 0),
      estado: body.querySelector('#cmEstado').value,
      actualizado: Date.now()
    };
    if(escudo) data.escudo = escudo;
    if(isNew) data.creado = Date.now();
    var adminEmail = isNew ? body.querySelector('#cmAdmin').value.trim().toLowerCase() : '';
    var modo = isNew ? modoSel.value : null;
    var pass = isNew ? body.querySelector('#cmPass').value : '';
    if(adminEmail && modo==='password' && pass.length < 6) return fail('La clave del administrador debe tener al menos 6 caracteres.');
    var btn = body.querySelector('#cmSave'); btn.disabled = true; btn.textContent = 'Guardando…';
    db.collection('clubes').doc(id).set(data, {merge:true}).then(function(){
      if(!isNew) return;
      return db.doc('clubes/' + id + '/datos/general').set({categories:['Sub-13','Sub-15','Sub-17'], profiles:cleanJson(DEFAULT_PROFILES), v:2});
    }).then(function(){
      if(!adminEmail) return;
      var create = Promise.resolve();
      if(modo==='password'){
        var secondary = firebase.apps.some(function(a){ return a.name==='secondary'; }) ? firebase.app('secondary') : firebase.initializeApp(window.FIREBASE_CONFIG, 'secondary');
        create = secondary.auth().createUserWithEmailAndPassword(adminEmail, pass).then(function(){ return secondary.auth().signOut(); });
      }
      return create.then(function(){ return db.collection('staff').doc(adminEmail).set({role:'admin', club:id, modo: modo==='google' ? 'google.com' : 'password'}); });
    }).then(function(){
      overlay.classList.remove('show');
      showToast(isNew ? 'Club creado. Su dirección es #/' + id : 'Cambios guardados.');
    }).catch(function(err){
      btn.disabled = false; btn.textContent = isNew ? 'Crear club' : 'Guardar cambios';
      fail('No se pudo guardar: ' + (err && err.message ? err.message : ''));
    });
  };
  overlay.classList.add('show');
  body.querySelector('#closeModal').onclick = function(){ overlay.classList.remove('show'); };
  overlay.onclick = function(e){ if(e.target===overlay) overlay.classList.remove('show'); };
}





// ---------- Recordatorios para el profesor ----------
// Lo de cada persona se guarda en avisos/{correo}. El envío lo hace una tarea aparte que lee esos documentos.
var NT_DEF = {activo:true, dias:[], hora:'16:00', antes:30, recordar:true, horaRecordar:'', partido:true};
var ntPrefs = null, ntUnsub = null, ntToken = null, ntBusy = false;
function ntSoportado(){
  return !!(window.firebase && firebase.messaging && firebase.messaging.isSupported && firebase.messaging.isSupported()
    && 'Notification' in window && 'serviceWorker' in navigator);
}
function ntDocRef(){
  if(!window.db || !currentUser || !currentUser.email) return null;
  return db.collection('avisos').doc(currentUser.email.toLowerCase());
}
function ntEscuchar(){
  if(ntUnsub){ ntUnsub(); ntUnsub = null; }
  var ref = ntDocRef();
  if(!ref) { ntPrefs = null; return; }
  ntUnsub = ref.onSnapshot(function(d){
    ntPrefs = d.exists ? d.data() : null;
    if(!isTyping()) safeRender();
  }, function(){});
}
// Lo predeterminado sale del horario que ya tiene su categoría
function ntPorDefecto(){
  var p = JSON.parse(JSON.stringify(NT_DEF));
  var cat = (currentUser && currentUser.categoria) || activeCategoria();
  try{ if(state && cat) p.dias = scheduleFor(cat).slice(); }catch(e){}
  if(!p.dias.length) p.dias = [2,4];
  p.horaRecordar = ntSumarMin(p.hora, 120);
  return p;
}
function ntSumarMin(hhmm, min){
  var a = String(hhmm||'16:00').split(':');
  var t = (+a[0])*60 + (+a[1]) + min;
  t = ((t % 1440) + 1440) % 1440;
  return ('0'+Math.floor(t/60)).slice(-2) + ':' + ('0'+(t%60)).slice(-2);
}
function nt12(hhmm){
  var a = String(hhmm||'').split(':'); if(a.length<2) return '—';
  var h = +a[0], m = a[1], s = h<12 ? 'a. m.' : 'p. m.';
  h = h % 12; if(!h) h = 12;
  return h + ':' + m + ' ' + s;
}
var NT_DIAS = ['D','L','M','X','J','V','S'];
function ntResumen(p){
  if(!p || !p.activo) return 'Recordatorios apagados';
  var d = (p.dias||[]).slice().sort().map(function(i){ return NT_DIAS[i]; }).join(' · ');
  return (d || 'sin días') + ' · ' + nt12(p.hora);
}
// Guardar: el token del celular se renueva cada vez que entra, por si cambió
function ntGuardar(p, conToken){
  var ref = ntDocRef();
  if(!ref) return Promise.resolve();
  var data = {
    activo: !!p.activo, dias: (p.dias||[]).slice(), hora: p.hora, antes: +p.antes,
    recordar: !!p.recordar, horaRecordar: p.horaRecordar || ntSumarMin(p.hora, 120), partido: !!p.partido,
    club: (currentUser && currentUser.club) || DEFAULT_CLUB_ID,
    categoria: (currentUser && currentUser.categoria) || '',
    zona: -5, actualizado: Date.now()
  };
  if(conToken && ntToken) data.token = ntToken;
  return ref.set(data, {merge:true});
}
function ntPedirPermiso(){
  if(!ntSoportado()) return Promise.reject(new Error('nosoporta'));
  return Notification.requestPermission().then(function(r){
    if(r !== 'granted') throw new Error('negado');
    return navigator.serviceWorker.ready;
  }).then(function(reg){
    var m = firebase.messaging();
    return m.getToken({vapidKey: window.VAPID_KEY, serviceWorkerRegistration: reg});
  }).then(function(tok){
    if(!tok) throw new Error('sintoken');
    ntToken = tok;
    return tok;
  });
}
function ntActivar(btnEstado){
  if(ntBusy) return;
  ntBusy = true;
  if(btnEstado) btnEstado('Activando…');
  ntPedirPermiso().then(function(){
    return ntGuardar(ntPorDefecto(), true);
  }).then(function(){
    ntBusy = false;
    var p = ntPorDefecto();
    ntAviso('<div><b>✓ Recordatorios activados</b><br>' + escHtml(ntResumen(p)) + '</div>', 'Editar', function(){ ntAbrirPanel(); });
  }).catch(function(err){
    ntBusy = false;
    var m = String(err && err.message);
    if(btnEstado) btnEstado(null);
    ntAviso('<div>' + (m==='negado'
      ? 'Tu celular bloqueó los avisos. Actívalos en los ajustes del navegador para este sitio.'
      : (m==='nosoporta' ? 'Este navegador no permite recordatorios. En iPhone, primero instala la app desde Safari.'
                         : 'No se pudieron activar. Intenta otra vez.')) + '</div>', 'Entendido', null);
  });
}
function ntAviso(html, btn, fn){
  var old = document.getElementById('ntToast'); if(old) old.remove();
  var box = document.createElement('div');
  box.id = 'ntToast'; box.className = 'nt-toast'; box.innerHTML = html;
  var b = document.createElement('button'); b.textContent = btn || 'Listo';
  b.onclick = function(){ box.classList.remove('on'); setTimeout(function(){ box.remove(); }, 500); if(fn) fn(); };
  box.appendChild(b);
  document.body.appendChild(box);
  requestAnimationFrame(function(){ requestAnimationFrame(function(){ box.classList.add('on'); }); });
  setTimeout(function(){ if(box.isConnected){ box.classList.remove('on'); setTimeout(function(){ box.remove(); }, 500); } }, 9000);
}

function ntConectarCampana(root){

    var hora = body.querySelector('#ntHora'), rec = body.querySelector('#ntRec');

    function sw(id, key, extra){

// Al entrar un profesor: escuchar sus preferencias y refrescar el token del celular

var pwaPrompt = null;
// WhatsApp, Instagram y otras apps abren los enlaces en su propio navegador, donde iOS no deja instalar ni guardar la sesión
function enOtraApp(){
  var u = navigator.userAgent || '';
  if(/FBAN|FBAV|Instagram|Line\/|MicroMessenger|Snapchat|Twitter|TikTok/i.test(u)) return true;
  // WhatsApp en iPhone: Safari sin barra de navegación propia
  if(/WhatsApp/i.test(u)) return true;
  if(esIOSUA() && /Safari/.test(u) === false && /CriOS|FxiOS|EdgiOS/.test(u) === false && /AppleWebKit/.test(u)) return true;
  return false;
}
function esIOSUA(){ return /iphone|ipad|ipod/i.test(navigator.userAgent); }

// La fecha va de lunes a domingo y se publica el lunes siguiente (se queda hasta el otro lunes).
function lpIso(d){ return d.getFullYear() + '-' + ('0'+(d.getMonth()+1)).slice(-2) + '-' + ('0'+d.getDate()).slice(-2); }
function lpWeekRange(cur){
  var hoy = new Date(); hoy.setHours(0,0,0,0);
  var lunes = new Date(hoy); lunes.setDate(hoy.getDate() - ((hoy.getDay()+6)%7));
  // la fecha en curso: del lunes de esta semana hasta hoy
  if(cur){
    var sig = new Date(lunes); sig.setDate(lunes.getDate()+7);
    return {ini:lunes, fin:hoy, prox:sig, iniS:lpIso(lunes), finS:lpIso(hoy), cur:true};
  }
  var ini = new Date(lunes); ini.setDate(lunes.getDate()-7);
  var fin = new Date(lunes); fin.setDate(lunes.getDate()-1);
  var prox = new Date(lunes); prox.setDate(lunes.getDate()+7);
  return {ini:ini, fin:fin, prox:prox, iniS:lpIso(ini), finS:lpIso(fin)};
}

// Lee las cartas públicas de cada club y calcula cuánto subió cada jugador en la fecha
function lpLoadWeekly(clubs){
  if(LP_DEMO){
    if(lpWeekly.key==='demo') return;
    lpWeekly.data = lpDemoData(clubs); lpWeekly.key = 'demo';
    lpFillWeekly(); lpFillFan();
    return;
  }
  if(!window.db) return;
  var wk = lpWeekRange();
  var key = wk.iniS + '|' + clubs.map(function(c){ return c.id; }).join(',');
  if(lpWeekly.key===key || lpWeekly.loading) return;
  lpWeekly.loading = true;
  function lpEscanear(wk){
  return Promise.all(clubs.map(function(club){
    return db.collection('clubes/' + club.id + '/publico').get().then(function(snap){
      var out = [];
      snap.forEach(function(d){
        var doc = d.data() || {}, cat = doc.nombre || d.id;
        var lv = LEVELS[doc.level] ? doc.level : defaultLevel(cat);
        var w = WEIGHT_MODES[doc.weights] || WEIGHT_MODES.igual;
        (doc.players||[]).forEach(function(p){
          var h = p.historial || [];
          var antes = replayRating(h.filter(function(e){ return e.date < wk.iniS; }), LEVELS[lv].mult, w).valoracion;
          var ahora = replayRating(h.filter(function(e){ return e.date <= wk.finS; }), LEVELS[lv].mult, w).valoracion;
          var goles = 0, jugo = false;
          h.forEach(function(e){ if(e.date >= wk.iniS && e.date <= wk.finS){ jugo = true; goles += (e.goles||0); } });
          if(!jugo) return;
          out.push({id:p.id, club:club, name:p.name, categoria:cat, pos:p.pos, v:ahora, antes:antes, u:ahora-antes, g:goles});
        });
      });
      return out;
    }).catch(function(e){ console.error('No se pudieron leer las cartas de ' + club.id, e); return []; });
  })).then(function(res){ return [].concat.apply([], res); });
  }
  lpEscanear(wk).then(function(all){
    // si la semana pasada no tuvo nada registrado, se muestra la fecha en curso
    if(!all.length){ wk = lpWeekRange(true); return lpEscanear(wk); }
    return all;
  }).then(function(all){
    var byU = function(a,b){ return (b.u-a.u) || (b.v-a.v); };
    var data = {
      sube: all.filter(function(x){ return x.u>0; }).sort(byU).slice(0,10),
      carta: all.filter(function(x){ return tierOf(x.v).min > tierOf(x.antes).min; }).sort(byU).slice(0,10),
      gol: all.filter(function(x){ return x.g>0; }).sort(function(a,b){ return (b.g-a.g) || (b.v-a.v); }).slice(0,10),
      top: all.slice().sort(function(a,b){ return b.v-a.v; }).slice(0,3),
      wk: wk
    };
    // solo se descargan las fotos de los jugadores que salen en la portada
    var need = {};
    [data.sube, data.carta, data.gol, data.top].forEach(function(l){ l.forEach(function(x){ need[x.club.id + '/' + x.id] = x; }); });
    return Promise.all(Object.keys(need).map(function(k){
      if(k in lpWeekly.fotos) return null;
      var x = need[k];
      return db.doc('clubes/' + x.club.id + '/fotos/' + x.id).get().then(function(d){
        lpWeekly.fotos[k] = (d.exists && d.data().data) || '';
      }).catch(function(){ lpWeekly.fotos[k] = ''; });
    })).then(function(){
      Object.keys(need).forEach(function(k){ need[k].foto = lpWeekly.fotos[k] || ''; });
      lpWeekly.data = data; lpWeekly.key = key; lpWeekly.loading = false;
      lpFillWeekly(); lpFillFan();
    });
  }).catch(function(e){ console.error(e); lpWeekly.loading = false; });
}

var lpIO = null;
function lpObserve(el, cb){
  if(!el) return;
  if(!('IntersectionObserver' in window)){ el.classList.add('lp-vis'); if(cb) cb(); return; }
  var io = new IntersectionObserver(function(es){
    es.forEach(function(e){ if(!e.isIntersecting) return; e.target.classList.add('lp-vis'); io.unobserve(e.target); if(cb) setTimeout(cb, 450); });
  }, {threshold:.15});
  io.observe(el);
}

// Entrada escalonada al aparecer en pantalla (sin escuchar el scroll: no traba el celular)
function revealOnScroll(root){
  var items = [].slice.call(root.querySelectorAll('.reveal'));
  if(!items.length) return;
  if(!('IntersectionObserver' in window)){ items.forEach(function(el){ el.classList.add('in'); }); return; }
  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(en){
      if(!en.isIntersecting) return;
      var group = en.target.parentNode;
      var sibs = [].slice.call(group.querySelectorAll(':scope > .reveal'));
      var i = Math.max(0, sibs.indexOf(en.target));
      en.target.style.transitionDelay = Math.min(i * 70, 420) + 'ms';
      en.target.classList.add('in');
      io.unobserve(en.target);
    });
  }, {rootMargin:'0px 0px -8% 0px', threshold:.12});
  items.forEach(function(el){ io.observe(el); });
}

/* ============ VALORACIÓN CON BARRA DE PROGRESO ============ */
// Todos arrancan en 50 y el máximo es 99. Cada sesión da progreso (asistir ya suma algo, jugar bien suma más);
// llenar la barra sube 1 punto y cada tramo de 10 cuesta más. La exigencia depende de la categoría.
// Calibrado para que en medio año un jugador promedio llegue a ~80 y uno muy bueno pueda llegar a 99 en el año.
var VAL_MIN = 50, VAL_MAX = 99;
var XP_BASE = 10, XP_PER_DELTA = 8;        // progreso de una sesión = 10 + 8 × puntaje de la sesión
var LEVEL_COSTS = [20, 28, 37, 70, 133];    // progreso para subir 1 punto en los 50s, 60s, 70s, 80s y 90s (nivel medio)
var LEVELS = {
  infantil:    {label:'Infantil',    mult:0.7},
  medio:       {label:'Medio',       mult:1},
  competitivo: {label:'Competitivo', mult:1.35},
  maxima:      {label:'Máxima',      mult:1.8}
};
function defaultLevel(cat){
  var m = String(cat||'').match(/^sub-(\d+)$/i);
  if(!m) return 'medio';
  var n = +m[1];
  return n<=8 ? 'infantil' : (n<=12 ? 'medio' : 'competitivo');
}
function categoryLevel(cat, levels){
  levels = levels || (state && state.categoryLevels) || {};
  return LEVELS[levels[cat]] ? levels[cat] : defaultLevel(cat);
}
function levelMult(cat, levels){ return LEVELS[categoryLevel(cat, levels)].mult; }
function levelCost(v, mult){ return Math.round(LEVEL_COSTS[Math.max(0, Math.min(4, Math.floor((v-50)/10)))] * (mult||1)); }
// Tope por sesión: ni un partido espectacular ni uno malo mueven demasiado la valoración de una sola vez
var XP_CAP_UP = 45, XP_CAP_DOWN = -30;
// Qué sube más la valoración en cada categoría (lo decide su profesor)
var WEIGHT_MODES = {
  igual:    {label:'Entrenos y partidos pesan igual', entrenamiento:1,    partido:1},
  partidos: {label:'Pesan más los partidos',          entrenamiento:0.85, partido:1.5},
  entrenos: {label:'Pesan más los entrenamientos',    entrenamiento:1.15, partido:0.6}
};
function weightMode(cat, modes){
  modes = modes || (state && state.categoryWeights) || {};
  return WEIGHT_MODES[modes[cat]] ? modes[cat] : 'igual';
}
function sessionRawXp(h){
  if(!h || h.asistio===false) return 0;
  return Math.max(XP_CAP_DOWN, Math.min(XP_CAP_UP, XP_BASE + (h.delta||0) * XP_PER_DELTA));
}
function sessionXpWith(h, w){ return Math.round(sessionRawXp(h) * (h && h.type==='partido' ? w.partido : w.entrenamiento)); }
function sessionXp(h, cat, modes){ return sessionXpWith(h, WEIGHT_MODES[weightMode(cat, modes)]); }
function replayRating(entries, mult, w){
  w = w || WEIGHT_MODES.igual;
  var v = VAL_MIN, xp = 0;
  entries.slice().sort(function(a,b){ return a.date<b.date ? -1 : (a.date>b.date ? 1 : 0); }).forEach(function(h){
    xp += sessionXpWith(h, w);
    while(v<VAL_MAX && xp>=levelCost(v, mult)){ xp -= levelCost(v, mult); v++; }
    while(xp<0){ if(v<=VAL_MIN){ xp = 0; break; } v--; xp += levelCost(v, mult); }
  });
  if(v>=VAL_MAX){ v = VAL_MAX; xp = 0; }
  return {valoracion:v, xp:xp, cost:levelCost(v, mult)};
}
// la valoración siempre se recalcula desde el historial: editar, reabrir o borrar un registro queda bien solo
function recomputeRating(p, levels, weights){
  var r = replayRating(p.historial||[], levelMult(p.categoria, levels), WEIGHT_MODES[weightMode(p.categoria, weights)]);
  p.valoracion = r.valoracion; p.xp = r.xp; p.xpCost = r.cost;
}
function recomputeAllRatings(){ if(state && Array.isArray(state.players)) state.players.forEach(function(p){ recomputeRating(p, state.categoryLevels, state.categoryWeights); }); }
function ratingBefore(p, dateStr){ return replayRating((p.historial||[]).filter(function(h){ return h.date < dateStr; }), levelMult(p.categoria), WEIGHT_MODES[weightMode(p.categoria)]).valoracion; }
// Nivel de la carta según la valoración: bronce, plata, oro y la especial Élite (90+)
var TIERS = [
  {id:'bronce', label:'Bronce', min:0},
  {id:'plata',  label:'Plata',  min:65},
  {id:'oro',    label:'Oro',    min:75},
  {id:'elite',  label:'Élite',  min:90}
];
function tierOf(v){ var t = TIERS[0]; TIERS.forEach(function(x){ if(v>=x.min) t = x; }); return t; }

/* ===== Trimestre en curso, grupos por posición y estrellas del equipo ===== */
var TRIM_LABELS = ['Enero – marzo','Abril – junio','Julio – septiembre','Octubre – diciembre'];
function trimIni(){ var d = new Date(); return new Date(d.getFullYear(), Math.floor(d.getMonth()/3)*3, 1).toISOString().slice(0,10); }
function trimLabel(){ var d = new Date(); return TRIM_LABELS[Math.floor(d.getMonth()/3)] + ' ' + d.getFullYear(); }
function histTrim(p){ var ini = trimIni(); return (p.historial||[]).filter(function(h){ return (h.date||'') >= ini; }); }
function sumTrim(p, campo){ return histTrim(p).reduce(function(a,h){ return a + (h[campo]||0); }, 0); }
function fechaHace(dias){ var d = new Date(); d.setDate(d.getDate()-dias); return d.toISOString().slice(0,10); }
// Los grupos de la carta de equipo, al estilo del FIFA
var GRUPOS_POS = [
  {id:'ata', label:'Ataque',   codes:['DC','EXT']},
  {id:'med', label:'Medio',    codes:['MCD','MC','MCO']},
  {id:'def', label:'Defensa',  codes:['DFC','LD','LI']},

];
function promValor(list){ return list.length ? Math.round(list.reduce(function(a,p){ return a + (p.valoracion||0); },0) / list.length) : null; }
function promGrupo(list, codes){ return promValor(list.filter(function(p){ return codes.indexOf(p.pos)!==-1; })); }
// De promedio a estrellas, con medias estrellas: 54 es una, 80 o más son cinco
function estrellasDe(prom){
  if(prom===null) return 0;
  var cortes = [[80,5],[76,4.5],[72,4],[68,3.5],[65,3],[61,2.5],[58,2],[54,1.5]];
  for(var i=0;i<cortes.length;i++) if(prom >= cortes[i][0]) return cortes[i][1];
  return 1;
}
var STAR_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.6l2.9 5.9 6.5.9-4.7 4.6 1.1 6.4L12 17.4 6.2 20.4l1.1-6.4L2.6 9.4l6.5-.9z"/></svg>';
function estrellasHtml(n){

    '<div class="s-on" style="width:' + (n/5*100) + '%">' + cinco + '</div></div>';
}
// Cómo venía el equipo: promedio del grupo semana a semana, reconstruido del historial
function evolucionEquipo(list, semanas){
  var pts = [], i, f, vals;
  for(i=semanas;i>=1;i--){
    f = fechaHace(i*7);
    vals = list.map(function(p){ return ratingBefore(p, f); }).filter(function(v){ return typeof v === 'number'; });
    if(vals.length) pts.push(vals.reduce(function(a,b){ return a+b; },0) / vals.length);
  }
  var hoy = promValor(list);
  if(hoy !== null) pts.push(hoy);
  return pts;
}
function sparkHtml(pts){
  if(pts.length < 3) return '';
  var min = Math.min.apply(null, pts), max = Math.max.apply(null, pts);
  var rango = (max - min) || 1, w = 100, h = 34, d = '', area = '';
  var xy = pts.map(function(v,i){
    return [ (i/(pts.length-1))*w, h - ((v-min)/rango)*(h-6) - 3 ];
  });
  xy.forEach(function(q,i){ d += (i?' L':'M') + q[0].toFixed(1) + ' ' + q[1].toFixed(1); });
  area = d + ' L' + w + ' ' + h + ' L0 ' + h + ' Z';
  return '<svg viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none" aria-hidden="true">' +
    '<path d="' + area + '" fill="rgba(193,248,7,.12)"/>' +
    '<path d="' + d + '" fill="none" stroke="#c1f807" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>' +
  '</svg>';
}

var BOLT_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.5 1.5 4 13.2h6.2L9 22.5l10-12.2h-6.3z"/></svg>';
function xpBar(p){
