/* ============ FOTOS DE JUGADORES ============ */
// Cada foto va en su propio documento (colección fotosJugadores/{id del jugador}), comprimida a 320x320,
// así no engorda el documento principal ni hace falta Firebase Storage.
var photoMap = {};
function initialsOf(name){
  var n = String(name||'').trim();
  if(/^Jugador \d+$/.test(n)) return '#' + n.split(' ')[1];
  var w = n.split(/\s+/);
  return (((w[0]||'')[0]||'') + ((w[1]||'')[0]||'')).toUpperCase();
}
function avatarInner(p){ var src = photoMap[p.id]; return src ? '<img src="' + src + '" alt="" />' : escHtml(initialsOf(p.name)); }
function compressPhoto(file, size){
  size = size || 480; // más resolución porque ahora la foto ocupa casi toda la carta
  return new Promise(function(resolve, reject){
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function(){
      var s = Math.min(img.naturalWidth, img.naturalHeight);
      var sx = (img.naturalWidth - s) / 2;
      var sy = (img.naturalHeight - s) / 2 * 0.5; // en fotos verticales recorta más abajo que arriba, para no cortar la cabeza
      var c = document.createElement('canvas'); c.width = size; c.height = size;
      c.getContext('2d').drawImage(img, sx, sy, s, s, 0, 0, size, size);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = function(){ URL.revokeObjectURL(url); reject(new Error('No se pudo abrir la imagen')); };
    img.src = url;
  });
}
function savePhoto(playerId, dataUrl){
  photoMap[playerId] = dataUrl;
  var owner = state && state.players.find(function(x){ return x.id===playerId; });
  if(window.db) return db.collection(clubPath('fotos')).doc(playerId).set({data:dataUrl, categoria: owner ? owner.categoria : '', actualizada:Date.now()});
  return Promise.resolve();
}
function deletePhoto(playerId){
  delete photoMap[playerId];
  if(window.db) db.collection(clubPath('fotos')).doc(playerId).delete().catch(function(){});
}
// "juan-esteban-ortiz.jpg", "Ortiz Juan.png" o "umbria.jpeg" -> el jugador que corresponde (o null si hay duda)
function matchPhotoToPlayer(fileName, players){
  var tokens = nameKey(String(fileName).replace(/\.[^.]+$/,'').replace(/[_\-.]+/g,' ')).split(' ')
    .filter(function(t){ return t.length>1 && !/^\d+$/.test(t) && ['img','foto','wa','jpg','jpeg','png'].indexOf(t)===-1; });
  if(!tokens.length) return null;
  var best = null, bestScore = 0, tie = false;
  players.forEach(function(p){
    var pt = nameKey(p.name).split(' ');
    var score = tokens.filter(function(t){ return pt.indexOf(t)!==-1; }).length;
    if(score > bestScore){ best = p; bestScore = score; tie = false; }
    else if(score && score===bestScore){ tie = true; }
  });
  if(tie || !best) return null;
  if(bestScore>=2 || (bestScore===1 && tokens.length===1)) return best;
  return null;
}

/* ============ RENDER: PLANTEL Y CATEGORÍAS (solo administrador) ============ */
function escHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function toTitleName(raw){
  var small = ['de','del','la','las','los','y'];
  return String(raw||'').trim().replace(/\s+/g,' ').toLowerCase().split(' ').map(function(w,i){
    if(i>0 && small.indexOf(w)!==-1) return w;
    return w.charAt(0).toUpperCase() + w.slice(1);
  }).join(' ');
}
function normalizeCategoryName(raw){
  var t = String(raw||'').trim().replace(/\//g,'-').replace(/\s+/g,' ');
  var m = t.match(/^sub[\s\-_]*(\d{1,2})$/i);
  return m ? 'Sub-' + m[1] : t;
}
function nameKey(n){ return String(n||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim(); }
function newPlayerId(){ return 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
// Código de la familia: 8 caracteres, sin los que se confunden al copiarlos de un papel (0/O, 1/I/L).
// Son 31^8 combinaciones, así que adivinarlo probando no es viable.
function codigoJugador(){
  var ABC = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  var r = (window.crypto && crypto.getRandomValues) ? crypto.getRandomValues(new Uint32Array(8)) : null;
  var s = '';
  for(var i=0;i<8;i++){
    if(i===4) s += '-';
    s += ABC[(r ? r[i] : Math.floor(Math.random()*1e9)) % ABC.length];
  }
  return s;
}
function makePlayer(name, pos, categoria){
  return {id:newPlayerId(), name:name, categoria:categoria, pos:pos, cod:codigoJugador(), goles:0, asistencias:0, valoracion:VAL_MIN, xp:0, xpCost:levelCost(VAL_MIN, levelMult(categoria)), historial:[]};
}
function posOrder(code){ var i = POSITIONS.map(function(p){return p.code;}).indexOf(code); return i===-1 ? 99 : i; }
function posOptions(selected, withEmpty){
  return (withEmpty ? '<option value=""' + (selected?'':' selected') + '>— elegir —</option>' : '') +
    POSITIONS.map(function(p){ return '<option value="' + p.code + '"' + (p.code===selected?' selected':'') + '>' + p.name + '</option>'; }).join('');
}

// "LI/EX", "LI - EX", "LI, EX" o "lateral izquierdo y extremo" -> ['LI','EXT'] (la primera es la principal)
function splitPositions(raw){
  var s = String(raw||'').trim();
  if(!s) return [];
  var whole = normalizePos(s);
  var parts = s.split(/\s*[\/,;\-]\s*|\s+y\s+/i).map(normalizePos).filter(Boolean);
  if(parts.length<=1 && whole) parts = [whole];
  return parts.filter(function(c, i, a){ return a.indexOf(c)===i; });
}
// Texto como llega por WhatsApp: "SUB 11" como encabezado y "• NOMBRE (PT)" por jugador
function parseRosterText(text){
  var out = {categoria:null, rows:[]};
  String(text||'').split(/\r?\n/).forEach(function(line){
    var l = line.replace(/^[\s\u2022\u00b7\-\*\u2013\u2014]+/, '').replace(/^\d+\s*[\.\)\-]\s*/, '').trim();
    if(!l) return;
    var catM = l.match(/^sub[\s\-_]*(\d{1,2})\s*:?$/i);
    if(catM){ out.categoria = 'Sub-' + catM[1]; return; }
    var m = l.match(/^(.*?)\s*[\(\[]\s*([^\)\]]{1,20})\s*[\)\]]\s*$/) || l.match(/^(.*?)\s+[\-\u2013\u2014:]\s+([A-Za-z\u00c0-\u017f ]{1,20})$/);
    var name = (m ? m[1] : l).replace(/[\s\-\u2013\u2014:,]+$/,'').trim();
    var posRaw = m ? m[2].trim() : '';
    if(!name) return;
    var pp = splitPositions(posRaw);
    out.rows.push({name: toTitleName(name), posRaw: posRaw, pos: pp[0] || null, posExtra: pp.slice(1), categoria: null});
  });
  return out;
}
// Filas de Excel/CSV: columnas Nombre (o Jugador), Posición y, opcional, Categoría
function parseRosterSheet(rows){
  var out = {categoria:null, rows:[]};
  rows.forEach(function(r){
    var keys = Object.keys(r);
    function pick(prefixes){
      for(var i=0;i<keys.length;i++){
        var k = nameKey(keys[i]);
        if(prefixes.some(function(p){ return k.indexOf(p)===0; })) return r[keys[i]];
      }
      return '';
    }
    var name = String(pick(['nombre','jugador','name'])||'').trim();
    if(!name) return;
    var posRaw = String(pick(['pos'])||'').trim();
    var cat = String(pick(['categ'])||'').trim();
    var pp = splitPositions(posRaw);
    out.rows.push({name: toTitleName(name), posRaw: posRaw, pos: pp[0] || null, posExtra: pp.slice(1), categoria: cat ? normalizeCategoryName(cat) : null});
  });
  return out;
}

function renameCategory(oldName, newName){
  var i = state.categories.indexOf(oldName);
  if(i===-1) return;
  state.categories[i] = newName;
  if(state.categoryLevels && state.categoryLevels[oldName]){ state.categoryLevels[newName] = state.categoryLevels[oldName]; delete state.categoryLevels[oldName]; }
  if(state.categoryWeights && state.categoryWeights[oldName]){ state.categoryWeights[newName] = state.categoryWeights[oldName]; delete state.categoryWeights[oldName]; }
  state.players.forEach(function(p){ if(p.categoria===oldName) p.categoria = newName; });
  Object.keys(state.trainingDays).forEach(function(k){
    if(k.indexOf(oldName+'::')===0){ state.trainingDays[newName + k.slice(oldName.length)] = state.trainingDays[k]; delete state.trainingDays[k]; }
  });
  if(state.selectedCategoria===oldName) state.selectedCategoria = newName;
  if(state.profesorCategoria===oldName) state.profesorCategoria = newName;
  if(visitorCategoria===oldName) visitorCategoria = newName;
  // los profesores asignados a esa categoría la siguen teniendo con el nombre nuevo
  if(window.db){
    db.collection('staff').where('club','==',sessionEnteredClub).where('categoria','==',oldName).get().then(function(snap){
      snap.forEach(function(d){ d.ref.update({categoria:newName}); });
    }).catch(function(){});
  }
}
function deleteCategory(name){
  if(state.categoryLevels) delete state.categoryLevels[name];
  if(state.categoryWeights) delete state.categoryWeights[name];
  state.players.forEach(function(p){ if(p.categoria===name) deletePhoto(p.id); });
  state.categories = state.categories.filter(function(c){ return c!==name; });
  state.players = state.players.filter(function(p){ return p.categoria!==name; });
  Object.keys(state.trainingDays).forEach(function(k){ if(k.indexOf(name+'::')===0) delete state.trainingDays[k]; });
  if(state.selectedCategoria===name) state.selectedCategoria = state.categories[0];
  if(state.profesorCategoria===name) state.profesorCategoria = state.categories[0];
}
function sortCategories(list){
  function num(c){ var m = String(c).match(/^sub-(\d+)$/i); return m ? +m[1] : 999; }
  return list.slice().sort(function(a,b){ return num(a)-num(b) || a.localeCompare(b); });
}

      '<p class="pl-help" style="margin-top:10px;">Exigencia de la barra de progreso: <b>Infantil</b> sube más fácil, <b>Medio</b> es el punto intermedio, <b>Competitivo</b> pide más y <b>Máxima</b> es para grupos de alto nivel. Por defecto se asigna por edad (hasta Sub-8 Infantil, Sub-9 a Sub-12 Medio, Sub-13 en adelante Competitivo), pero ' + (isAdmin ? 'el administrador o el profesor de cada categoría la pueden cambiar' : 'la puedes cambiar cuando quieras') + '; la valoración de todos se recalcula al instante. Al lado, cada categoría elige si suben más los entrenamientos, los partidos o los dos por igual. Ninguna sesión sola puede mover demasiado la valoración.</p>' +
      (isAdmin ? '<div class="pl-inline"><input id="plNewCat" placeholder="Nueva categoría, ej. Sub-11" /><button class="pl-btn" id="plAddCat">Agregar categoría</button></div>' : '') +
      (testCount ? '<div class="pl-inline"><button class="pl-btn danger" id="plDelTest">Eliminar los ' + testCount + ' jugadores de prueba</button><span class="pl-count">Los “Jugador 01, 02…” que venían de ejemplo.</span></div>' : '') +
    '</section>' +

    '<section class="pl-card"><h3>Jugadores por categoría</h3>' +
      '<div class="pl-inline" style="margin-top:0;"><select id="plCatSel"></select><span class="pl-count" id="plCount"></span></div>' +
      '<div class="pl-inline"><input id="plOneName" placeholder="Nombre del jugador" style="flex:1;min-width:160px;" /><select id="plOnePos">' + posOptions('', true) + '</select><button class="pl-btn" id="plAddOne">Agregar</button></div>' +
      '<div class="pl-inline"><label class="pl-file">Subir varias fotos<input type="file" id="plPhotos" accept="image/*" multiple /></label><span class="pl-count">Si cada archivo se llama como el jugador (ej. <b>oscar-umbria.jpg</b>) se asignan solas; si no, eliges a quién va cada una. También puedes tocar la foto de un jugador para cambiarla.</span></div>' +
      '<div id="plPhotoPreview"></div>' +
      '<div class="pl-wrap" id="plRoster"></div>' +
    '</section>';

  var pasteBox = el.querySelector('#plPaste');
  pasteBox.value = plantelUi.pasted;
  pasteBox.oninput = function(){ plantelUi.pasted = pasteBox.value; };

  // ---------- categorías ----------
  var catsBox = el.querySelector('#plCats');
  myCats.forEach(function(cat){
    var n = state.players.filter(function(p){ return p.categoria===cat; }).length;
    var row = document.createElement('div');
    row.className = 'pl-cat-row';
    row.innerHTML = '<span class="nm">' + escHtml(cat) + '</span><span class="ct">' + n + ' jugador' + (n===1?'':'es') + '</span>' +
      '<select data-a="lvl" title="Exigencia de la barra de progreso">' + Object.keys(LEVELS).map(function(k){ return '<option value="' + k + '"' + (categoryLevel(cat)===k?' selected':'') + '>' + LEVELS[k].label + (k===defaultLevel(cat)?' (por edad)':'') + '</option>'; }).join('') + '</select>' +
      '<select data-a="wgt" title="Qué hace subir más la valoración">' + Object.keys(WEIGHT_MODES).map(function(k){ return '<option value="' + k + '"' + (weightMode(cat)===k?' selected':'') + '>' + WEIGHT_MODES[k].label + '</option>'; }).join('') + '</select>' +
      (isAdmin ? '<button class="pl-btn ghost small" data-a="ren">Renombrar</button><button class="pl-btn danger small" data-a="del">Eliminar</button>' : '');
    row.querySelector('[data-a="wgt"]').onchange = function(e){
      state.categoryWeights = state.categoryWeights || {};
      state.categoryWeights[cat] = e.target.value;
      commitPlantel();
    };
    row.querySelector('[data-a="lvl"]').onchange = function(e){
      state.categoryLevels = state.categoryLevels || {};
      state.categoryLevels[cat] = e.target.value;
      commitPlantel();
    };
    var renBtn = row.querySelector('[data-a="ren"]');
    if(renBtn) renBtn.onclick = function(){
      var nv = window.prompt('Nuevo nombre para ' + cat + ':', cat);
      if(nv===null) return;
      nv = normalizeCategoryName(nv);
      if(!nv || nv===cat) return;
      if(state.categories.indexOf(nv)!==-1){ window.alert('Ya existe una categoría llamada ' + nv + '.'); return; }
      renameCategory(cat, nv);
      if(plantelUi.cat===cat) plantelUi.cat = nv;
      commitPlantel();
    };
    var delBtn = row.querySelector('[data-a="del"]');
    if(delBtn) delBtn.onclick = function(){
      if(state.categories.length<=1){ window.alert('El club necesita al menos una categoría.'); return; }
      var ok = window.confirm('¿Eliminar la categoría ' + cat + '?' + (n ? ' También se borran sus ' + n + ' jugadores y todo su historial de entrenamientos y partidos. Esto no se puede deshacer.' : ''));
      if(!ok) return;
      deleteCategory(cat);
      commitPlantel();
    };
    catsBox.appendChild(row);
  });
  var addCatBtn = el.querySelector('#plAddCat');
  if(addCatBtn) addCatBtn.onclick = function(){
    var nv = normalizeCategoryName(el.querySelector('#plNewCat').value);
    if(!nv) return;
    if(state.categories.indexOf(nv)!==-1){ window.alert('Esa categoría ya existe.'); return; }
    state.categories.push(nv);
    plantelUi.cat = nv;
    commitPlantel();
  };
  var delTest = el.querySelector('#plDelTest');
  if(delTest) delTest.onclick = function(){
    if(!window.confirm('¿Eliminar los ' + testCount + ' jugadores de ejemplo (“Jugador 01, 02…”) de todas las categorías? Los jugadores reales no se tocan.')) return;
    state.players = state.players.filter(function(p){ return !/^Jugador \d+$/.test(p.name); });
    commitPlantel();
  };

  // ---------- importar ----------
  var previewBox = el.querySelector('#plPreview');
  function showPreview(parsed){
    plantelUi.msg = null;
    if(!isAdmin) parsed.rows.forEach(function(r){ r.categoria = null; }); // el profesor siempre importa a su categoría
    var detected = isAdmin ? parsed.categoria : null;
    var target = detected || plantelUi.cat || state.categories[0] || 'Sub-11';
    var rows = parsed.rows.map(function(r){
      var cat = r.categoria || target;
      var dup = state.players.some(function(p){ return p.categoria===cat && nameKey(p.name)===nameKey(r.name); });
      return {name:r.name, posRaw:r.posRaw, pos:r.pos, posExtra:r.posExtra||[], categoria:r.categoria, dup:dup, include: !!r.pos && !dup};
    });
    plantelUi.preview = {target:target, perRowCat: rows.some(function(r){return r.categoria;}), rows:rows};
    drawPreview();
  }
  function drawPreview(){
    var pv = plantelUi.preview;
    if(!pv){ previewBox.innerHTML = ''; return; }
    if(!pv.rows.length){ previewBox.innerHTML = '<div class="pl-msg err">No encontré jugadores en ese texto o archivo.</div>'; return; }
    var catChoices = isAdmin ? state.categories.slice() : [plantelUi.cat];
    if(catChoices.indexOf(pv.target)===-1) catChoices.push(pv.target);
    var html =
      (pv.perRowCat ? '<div class="pl-summary">El archivo trae la categoría de cada jugador; las que no existan se crean automáticamente.</div>' :
        '<div class="pl-inline"><span class="pl-count">Agregar a la categoría</span><select id="plTarget">' +
          catChoices.map(function(c){ return '<option value="' + escHtml(c) + '"' + (c===pv.target?' selected':'') + '>' + escHtml(c) + (state.categories.indexOf(c)===-1?' (nueva)':'') + '</option>'; }).join('') +
        '</select></div>') +
      '<table class="pl-table"><thead><tr><th></th><th>Nombre</th><th>Posición</th>' + (pv.perRowCat?'<th>Categoría</th>':'') + '<th></th></tr></thead><tbody>' +
      pv.rows.map(function(r, i){
        var status = r.dup ? '<span class="pl-status warn">Ya está en la categoría</span>' :
          (!r.pos ? '<span class="pl-status warn">' + (r.posRaw ? 'No reconocí “' + escHtml(r.posRaw) + '”' : 'Sin posición') + '</span>' : '<span class="pl-status ok">' + (r.posRaw ? escHtml(r.posRaw) + ' → ' : '') + escHtml([r.pos].concat(r.posExtra||[]).map(posName).join(' / ')) + '</span>');
        return '<tr data-i="' + i + '"><td><input type="checkbox" data-f="inc"' + (r.include?' checked':'') + ' /></td>' +
          '<td><input data-f="name" value="' + escHtml(r.name) + '" /></td>' +
          '<td><select data-f="pos">' + posOptions(r.pos, !r.pos) + '</select></td>' +
          (pv.perRowCat ? '<td>' + escHtml(r.categoria || pv.target) + '</td>' : '') +
          '<td>' + status + '</td></tr>';
      }).join('') +
      '</tbody></table>' +
      '<div class="pl-inline"><button class="pl-btn" id="plConfirm"></button><button class="pl-btn ghost" id="plCancel">Cancelar</button></div>';
    previewBox.innerHTML = html;

    function refreshCount(){
      var n = pv.rows.filter(function(r){ return r.include && r.pos && r.name.trim(); }).length;
      var btn = previewBox.querySelector('#plConfirm');
      btn.textContent = 'Agregar ' + n + ' jugador' + (n===1?'':'es');
      btn.disabled = n===0;
    }
    previewBox.querySelectorAll('tr[data-i]').forEach(function(tr){
      var r = pv.rows[+tr.getAttribute('data-i')];
      tr.querySelector('[data-f="inc"]').onchange = function(e){ r.include = e.target.checked; refreshCount(); };
      tr.querySelector('[data-f="name"]').oninput = function(e){ r.name = e.target.value; refreshCount(); };
      tr.querySelector('[data-f="pos"]').onchange = function(e){
        r.pos = e.target.value || null;
        if(r.pos){ r.include = true; tr.querySelector('[data-f="inc"]').checked = true; }
        refreshCount();
      };
    });
    var tSel = previewBox.querySelector('#plTarget');
    if(tSel) tSel.onchange = function(){
      pv.target = tSel.value;
      pv.rows.forEach(function(r){
        var wasDup = r.dup;
        r.dup = state.players.some(function(p){ return p.categoria===pv.target && nameKey(p.name)===nameKey(r.name); });
        if(r.dup) r.include = false; else if(wasDup && r.pos) r.include = true;
      });
      drawPreview();
    };
    previewBox.querySelector('#plCancel').onclick = function(){ plantelUi.preview = null; drawPreview(); };
    previewBox.querySelector('#plConfirm').onclick = function(){
      var added = 0, skipped = 0, cats = {}, libres = cuposRestantes();
      pv.rows.forEach(function(r){
        var nm = toTitleName(r.name);
        if(!r.include || !r.pos || !nm) return;
        if(added >= libres){ skipped++; return; } // sin cupos disponibles
        var cat = r.categoria || pv.target;
        if(state.categories.indexOf(cat)===-1) state.categories.push(cat);
        var np = makePlayer(nm, r.pos, cat);
        np.posExtra = (r.posExtra||[]).filter(function(c){ return c!==r.pos; });
        state.players.push(np);
        cats[cat] = true; added++;
      });
      var catList = Object.keys(cats);
      plantelUi.preview = null;
      plantelUi.pasted = '';
      plantelUi.cat = catList[0] || plantelUi.cat;
      plantelUi.msg = 'Listo: se agregaron ' + added + ' jugador' + (added===1?'':'es') + (catList.length ? ' a ' + catList.join(', ') : '') + '.' + (skipped ? ' ' + skipped + ' no se agregaron porque se acabaron los cupos del club; pide más cupos a Arena Sports.' : '');
      plantelUi.msgErr = skipped > 0;
      commitPlantel();
    };
    refreshCount();
  }
  el.querySelector('#plReview').onclick = function(){ showPreview(parseRosterText(pasteBox.value)); };
  el.querySelector('#plFile').onchange = function(e){
    var file = e.target.files && e.target.files[0];
    if(!file) return;
    if(!window.XLSX){ plantelUi.preview = null; previewBox.innerHTML = '<div class="pl-msg err">No se pudo cargar el lector de Excel. Revisa tu conexión y recarga la página, o pega la lista como texto.</div>'; return; }
    var reader = new FileReader();
    reader.onload = function(ev){
      try{
        var wb = XLSX.read(new Uint8Array(ev.target.result), {type:'array'});
        var sheet = wb.Sheets[wb.SheetNames[0]];
        showPreview(parseRosterSheet(XLSX.utils.sheet_to_json(sheet, {defval:''})));
      }catch(err){
        previewBox.innerHTML = '<div class="pl-msg err">No pude leer ese archivo. Asegúrate de que la primera fila tenga los títulos Nombre y Posición.</div>';
      }
    };
    reader.readAsArrayBuffer(file);
    e.target.value = '';
  };
  el.querySelector('#plTemplate').onclick = function(){
    var csv = '\uFEFFNombre,Posición,Categoría\nJuan Esteban Ortiz,PT,Sub-11\nMatías Caceres,DF,Sub-11\n';
    var blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'plantilla-jugadores.csv';
    document.body.appendChild(a); a.click(); a.remove();
  };
  drawPreview();

  // ---------- jugadores de la categoría ----------
  var catSel = el.querySelector('#plCatSel');
  catSel.innerHTML = myCats.map(function(c){ return '<option value="' + escHtml(c) + '"' + (c===plantelUi.cat?' selected':'') + '>' + escHtml(c) + '</option>'; }).join('');
  catSel.onchange = function(){ plantelUi.cat = catSel.value; drawRoster(); };
  el.querySelector('#plAddOne').onclick = function(){
    var nm = toTitleName(el.querySelector('#plOneName').value);
    var pos = el.querySelector('#plOnePos').value;
    if(!nm || !pos || !plantelUi.cat){ window.alert('Escribe el nombre y elige la posición.'); return; }
    if(cuposRestantes() <= 0){ window.alert('Tu club ya usó todos sus cupos (' + currentClub().cupos + ' jugadores). Para agregar más, pide más cupos a Arena Sports.'); return; }
    state.players.push(makePlayer(nm, pos, plantelUi.cat));
    commitPlantel();
  };
  var rosterBox = el.querySelector('#plRoster');
  function drawRoster(){
    var list = state.players.filter(function(p){ return p.categoria===plantelUi.cat; })
      .sort(function(a,b){ return posOrder(a.pos)-posOrder(b.pos) || a.name.localeCompare(b.name); });
    el.querySelector('#plCount').textContent = list.length + ' jugador' + (list.length===1?'':'es');
    if(!list.length){ rosterBox.innerHTML = '<div class="pl-summary">Todavía no hay jugadores en esta categoría.</div>'; return; }
    rosterBox.innerHTML = '<table class="pl-table"><thead><tr><th>Foto</th><th>Nombre</th><th>Posición</th><th>Código de la familia</th><th>Registros</th><th></th></tr></thead><tbody>' +
      list.map(function(p){
        return '<tr data-id="' + escHtml(p.id) + '"><td><label class="pl-thumb" title="Subir o cambiar foto" style="cursor:pointer;">' + avatarInner(p) + '<input type="file" accept="image/*" data-f="photo" style="display:none;" /></label></td><td><input data-f="name" value="' + escHtml(p.name) + '" /></td>' +
          '<td><select data-f="pos">' + posOptions(p.pos, false) + '</select>' +
            '<div class="pl-pos2">' + (p.posExtra||[]).map(function(c){ return '<span class="pl-chip" data-rm="' + c + '" title="Quitar">' + escHtml(posName(c)) + ' ✕</span>'; }).join('') +
            '<select data-f="addpos"><option value="">+ otra posición</option>' + POSITIONS.filter(function(x){ return x.code!==p.pos && (p.posExtra||[]).indexOf(x.code)===-1; }).map(function(x){ return '<option value="' + x.code + '">' + x.name + '</option>'; }).join('') + '</select></div></td>' +
          '<td>' + (p.cod ? '<span class="pl-cod" data-cod="' + escHtml(p.cod) + '" title="Tocar para copiar">' + escHtml(p.cod) + '</span>' : '<span class="pl-cod vacio">se crea al guardar</span>') + '</td>' +
          '<td class="pl-count">' + p.historial.length + '</td>' +
          '<td><button class="pl-btn danger small" data-f="del">Quitar</button></td></tr>';
      }).join('') + '</tbody></table>';
    rosterBox.querySelectorAll('.pl-cod[data-cod]').forEach(function(sp){
      sp.onclick = function(){
        var t = sp.getAttribute('data-cod');
        var ok = function(){ sp.classList.add('copiado'); setTimeout(function(){ sp.classList.remove('copiado'); }, 1200); };
        if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(ok).catch(ok);
        else ok();
      };
    });
    rosterBox.querySelectorAll('tr[data-id]').forEach(function(tr){
      var id = tr.getAttribute('data-id');
      var p = state.players.find(function(x){ return x.id===id; });
      tr.querySelector('[data-f="name"]').onchange = function(e){
        var nm = toTitleName(e.target.value);
        if(!nm){ e.target.value = p.name; return; }
        p.name = nm; e.target.value = nm; persist();
      };
      tr.querySelector('[data-f="pos"]').onchange = function(e){ p.pos = e.target.value; p.posExtra = (p.posExtra||[]).filter(function(c){ return c!==p.pos; }); persist(); drawRoster(); };
      tr.querySelector('[data-f="addpos"]').onchange = function(e){ if(!e.target.value) return; p.posExtra = (p.posExtra||[]).concat([e.target.value]); persist(); drawRoster(); };
      tr.querySelectorAll('[data-rm]').forEach(function(ch){
        ch.onclick = function(){ var c = ch.getAttribute('data-rm'); p.posExtra = (p.posExtra||[]).filter(function(x){ return x!==c; }); persist(); drawRoster(); };
      });
      tr.querySelector('[data-f="photo"]').onchange = function(e){
        var f = e.target.files && e.target.files[0];
        if(!f) return;
        compressPhoto(f).then(function(url){ return savePhoto(id, url); }).then(function(){ drawRoster(); })
          .catch(function(err){ window.alert('No se pudo guardar la foto (' + (err && err.message ? err.message : 'error') + '). Si es una foto de iPhone en formato HEIC, mándatela por WhatsApp y descárgala de ahí, que llega como JPG.'); });
      };
      tr.querySelector('[data-f="del"]').onclick = function(){
        if(!window.confirm('¿Quitar a ' + p.name + ' del plantel?' + (p.historial.length ? ' Se borran también sus ' + p.historial.length + ' registros.' : ''))) return;
        state.players = state.players.filter(function(x){ return x.id!==id; });
        deletePhoto(id);
        persist(); drawRoster();
      };
    });
  }
  drawRoster();

  // ---------- fotos en lote ----------
  var photoPrev = el.querySelector('#plPhotoPreview');
  el.querySelector('#plPhotos').onchange = function(e){
    var files = Array.prototype.slice.call(e.target.files || []);
    e.target.value = '';
    if(!files.length) return;
    var players = state.players.filter(function(p){ return p.categoria===plantelUi.cat; });
    photoPrev.innerHTML = '<div class="pl-summary">Preparando ' + files.length + ' foto' + (files.length===1?'':'s') + '…</div>';
    var items = [];
    files.reduce(function(chain, f){
      return chain.then(function(){
        return compressPhoto(f).then(function(url){
          var m = matchPhotoToPlayer(f.name, players);
          items.push({file:f.name, url:url, playerId: m ? m.id : '', auto: !!m});
        }).catch(function(){ items.push({file:f.name, url:null, playerId:'', auto:false}); });
      });
    }, Promise.resolve()).then(function(){
      var used = {}; // si dos fotos apuntan al mismo jugador, solo la primera queda asignada
      items.forEach(function(it){ if(it.playerId){ if(used[it.playerId]){ it.playerId = ''; it.auto = false; } else used[it.playerId] = true; } });
      drawPhotoPreview(items, players);
    });
  };
  function drawPhotoPreview(items, players){
    var sorted = players.slice().sort(function(a,b){ return a.name.localeCompare(b.name); });
    function opts(sel){
      return '<option value="">— no asignar —</option>' + sorted.map(function(p){
        return '<option value="' + escHtml(p.id) + '"' + (p.id===sel?' selected':'') + '>' + escHtml(p.name) + (photoMap[p.id]?' (ya tiene foto)':'') + '</option>';
      }).join('');
    }
    photoPrev.innerHTML = '<table class="pl-table"><thead><tr><th>Foto</th><th>Archivo</th><th>Jugador de ' + escHtml(plantelUi.cat) + '</th></tr></thead><tbody>' +
      items.map(function(it, i){
        return '<tr data-i="' + i + '"><td><div class="pl-thumb">' + (it.url ? '<img src="' + it.url + '" alt="" />' : '?') + '</div></td>' +
          '<td class="pl-count">' + escHtml(it.file) + ' ' + (it.url ? (it.auto ? '<span class="pl-status ok">asignada sola</span>' : '<span class="pl-status warn">elige el jugador</span>') : '<span class="pl-status warn">no se pudo abrir</span>') + '</td>' +
          '<td>' + (it.url ? '<select data-f="pl">' + opts(it.playerId) + '</select>' : '') + '</td></tr>';
      }).join('') + '</tbody></table>' +
      '<div class="pl-inline"><button class="pl-btn" id="plSavePhotos"></button><button class="pl-btn ghost" id="plCancelPhotos">Cancelar</button></div>';
    function refresh(){
      var n = items.filter(function(it){ return it.url && it.playerId; }).length;
      var b = photoPrev.querySelector('#plSavePhotos');
      b.textContent = 'Guardar ' + n + ' foto' + (n===1?'':'s');
      b.disabled = !n;
    }
    photoPrev.querySelectorAll('select[data-f="pl"]').forEach(function(sel){
      sel.onchange = function(){ items[+sel.closest('tr').getAttribute('data-i')].playerId = sel.value; refresh(); };
    });
    photoPrev.querySelector('#plCancelPhotos').onclick = function(){ photoPrev.innerHTML = ''; };
    photoPrev.querySelector('#plSavePhotos').onclick = function(){
      var todo = items.filter(function(it){ return it.url && it.playerId; });
      var btn = photoPrev.querySelector('#plSavePhotos');
      btn.disabled = true; btn.textContent = 'Guardando…';
      Promise.all(todo.map(function(it){ return savePhoto(it.playerId, it.url); })).then(function(){
        photoPrev.innerHTML = '<div class="pl-msg">Listo: se guardaron ' + todo.length + ' foto' + (todo.length===1?'':'s') + '.</div>';
        drawRoster();
      }).catch(function(err){
        photoPrev.insertAdjacentHTML('beforeend', '<div class="pl-msg err">No se pudieron guardar todas: ' + escHtml(err && err.message) + '</div>');
        btn.disabled = false; btn.textContent = 'Reintentar';
      });
    };
    refresh();
  }
  return el;
}

function openLoginModal(){
  var overlay = document.getElementById('modalOverlay');
  var body = document.getElementById('modalBody');
  body.innerHTML =
    '<button class="modal-close" id="closeModal">✕</button>' +
    '<h2>Acceso staff</h2>' +
    '<div class="sub">Inicia sesión con el correo y la clave que te dio el administrador.</div>' +
    '<div class="staff-form">' +
      '<label>Correo<input type="email" id="loginEmail" autocomplete="username" /></label>' +
      '<label>Clave<input type="password" id="loginPass" autocomplete="current-password" /></label>' +
      '<div class="staff-error" id="loginError" style="display:none;"></div>' +
      '<button class="staff-submit" id="loginSubmit">Entrar</button>' +
      '<div class="staff-divider">o</div>' +
      '<button class="staff-google-btn" id="loginGoogle" type="button">' + GOOGLE_ICON_SVG + ' Continuar con Google</button>' +
    '</div>' +
    '<div class="staff-alt" id="loginAltWrap"></div>';
  var altWrap = body.querySelector('#loginAltWrap');
  if(window.db){
    db.collection('staff').limit(1).get().then(function(snap){
      if(snap.empty){
        altWrap.innerHTML = '<div class="staff-hint">Todavía no hay ningún administrador configurado. <a href="#" id="linkBootstrap">Regístrate como el primer administrador</a>.</div>';
        altWrap.querySelector('#linkBootstrap').onclick = function(e){ e.preventDefault(); openBootstrapModal(); };
      }
    }).catch(function(){});
  }
  body.querySelector('#loginSubmit').onclick = function(){
    var email = body.querySelector('#loginEmail').value.trim();

    });
  };
  body.querySelector('#loginGoogle').onclick = function(){
    var errBox = body.querySelector('#loginError');
    errBox.style.display = 'none';

function openStaffPanel(){
  var overlay = document.getElementById('modalOverlay');
  var body = document.getElementById('modalBody');
  body.innerHTML =
    '<button class="modal-close" id="closeModal">✕</button>' +
    '<h2>Administradores y profesores</h2>' +
    '<div class="sub">Crea el acceso de un nuevo administrador o profesor.</div>' +
    '<div class="staff-form">' +
      '<label>Correo<input type="email" id="staffEmail" autocomplete="off" /></label>' +
      '<label>Cómo va a entrar' +
        '<select id="staffMode">' +
          '<option value="password">Le creo un correo y una clave</option>' +
          '<option value="google">Va a entrar con su propia cuenta de Google</option>' +
        '</select>' +
      '</label>' +
      '<label id="staffPassWrap">Clave (mínimo 6 caracteres)<input type="password" id="staffPass" autocomplete="new-password" /></label>' +
      '<label>Rol' +
        '<select id="staffRole">' +
          '<option value="profesor">Profesor</option>' +
          '<option value="admin">Administrador</option>' +
        '</select>' +
      '</label>' +
      '<label id="staffCatWrap">Categoría asignada' +
        '<select id="staffCat">' + ((state && state.categories && state.categories.length) ? state.categories : CATEGORIES).map(function(c){return '<option value="' + escHtml(c) + '">' + escHtml(c) + '</option>';}).join('') + '</select>' +
      '</label>' +
      '<div class="staff-error" id="staffError" style="display:none;"></div>' +
      '<button class="staff-submit" id="staffSubmit">Crear acceso</button>' +
    '</div>';
  var roleSel = body.querySelector('#staffRole');
  var catWrap = body.querySelector('#staffCatWrap');
  function syncCatVisibility(){ catWrap.style.display = roleSel.value==='profesor' ? '' : 'none'; }
  roleSel.onchange = syncCatVisibility;
  syncCatVisibility();

  var modeSel = body.querySelector('#staffMode');
  var passWrap = body.querySelector('#staffPassWrap');
  function syncModeVisibility(){ passWrap.style.display = modeSel.value==='password' ? '' : 'none'; }
  modeSel.onchange = syncModeVisibility;
  syncModeVisibility();

  body.querySelector('#staffSubmit').onclick = function(){
    var email = body.querySelector('#staffEmail').value.trim();
    var mode = modeSel.value;
    var pass = body.querySelector('#staffPass').value;
    var role = roleSel.value;
    var cat = body.querySelector('#staffCat').value;
    var errBox = body.querySelector('#staffError');
    errBox.style.display = 'none';
    if(!email){
      errBox.textContent = 'Escribe un correo.';
      errBox.style.display = 'block';
      return;
    }
    if(mode==='password' && pass.length < 6){
      errBox.textContent = 'Escribe una clave de al menos 6 caracteres.';
      errBox.style.display = 'block';
      return;
    }
    var doc = {role: role, club: sessionEnteredClub, modo: mode==='google' ? 'google.com' : 'password'};
    if(role==='profesor') doc.categoria = cat;
    if(mode==='google'){
      db.collection('staff').doc(email.toLowerCase()).set(doc).then(function(){
        overlay.classList.remove('show');
      }).catch(function(err){
        errBox.textContent = 'No se pudo guardar el acceso: ' + (err && err.message ? err.message : '');
        errBox.style.display = 'block';
      });
      return;
    }
    var secondary = firebase.apps.some(function(a){return a.name==='secondary';})
      ? firebase.app('secondary')
      : firebase.initializeApp(window.FIREBASE_CONFIG, 'secondary');
    secondary.auth().createUserWithEmailAndPassword(email, pass).then(function(){
      return secondary.auth().signOut();
    }).then(function(){
      return db.collection('staff').doc(email.toLowerCase()).set(doc);
    }).then(function(){
      overlay.classList.remove('show');
    }).catch(function(err){
      errBox.textContent = 'No se pudo crear el acceso: ' + (err && err.message ? err.message : '');
      errBox.style.display = 'block';
    });
  };
  overlay.classList.add('show');
  body.querySelector('#closeModal').onclick = function(){ overlay.classList.remove('show'); };
  overlay.onclick = function(e){ if(e.target===overlay) overlay.classList.remove('show'); };
}

function showBrokenDataScreen(){
  try{ localStorage.removeItem(STORAGE_KEY); }catch(e2){}
  document.getElementById('mainView').innerHTML =
    '<div style="max-width:420px;margin:60px auto;text-align:center;">' +
      '<p style="color:var(--ink-muted);font-size:14px;margin-bottom:16px;">Esta vista previa tenía datos guardados de una versión anterior y no cargó bien. Se limpiaron esos datos de prueba — recarga la página para empezar de cero.</p>' +
      '<button onclick="location.reload()" style="background:var(--orange-500);border:none;color:white;font-weight:600;padding:10px 20px;border-radius:8px;cursor:pointer;">Recargar</button>' +
    '</div>';
}
function safeRender(){
  try{ render(); }catch(e){ showBrokenDataScreen(); }
}

document.getElementById('landingRoot').innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--ink-faint);font-size:13px;">Cargando…</div>';
document.getElementById('landingRoot').style.display = 'block';

// La app instalada en el celular de un profe abre directo en su acceso, no en la portada pública
// La de una familia abre en su club. Sin nada guardado (en iPhone la app instalada no comparte memoria
// con Safari) abre la portada, que tiene la lista de clubes y el acceso del staff.
if(!location.hash && yaInstalada()){
  var famClubIni = ''; try{ famClubIni = localStorage.getItem('arena_fam_club') || ''; }catch(e){}
  if(famClubIni) history.replaceState(null, '', '#/' + famClubIni);
  else if(pwaGuardado('arena_staff')){ history.replaceState(null, '', '#/staff'); staffMode = true; }
}
if(window.firebase && window.FIREBASE_CONFIG){
  try{
    firebase.initializeApp(window.FIREBASE_CONFIG);
    window.db = firebase.firestore();
    // Sin señal en la cancha: el profesor sigue viendo su categoría y lo que registre se guarda
    // en el celular; apenas vuelve el internet, se sube solo. synchronizeTabs permite varias pestañas.
    try{
      db.enablePersistence({synchronizeTabs:true}).catch(function(e){
        console.warn('Sin modo sin conexión:', e && e.code);
      });
    }catch(e){ console.warn('Sin modo sin conexión', e); }
    window.auth = firebase.auth();
    try{ localStorage.removeItem(STORAGE_KEY); }catch(e){} // con Firebase no se guardan copias locales de datos privados
    // App Check: bloquea pedidos que no vengan de esta página (se activa al pegar la clave de reCAPTCHA arriba)
    if(window.APPCHECK_SITE_KEY && firebase.appCheck){
      try{ firebase.appCheck().activate(window.APPCHECK_SITE_KEY, true); }catch(e){ console.error('App Check no se pudo activar', e); }
    }

    // Lista de clubes de la plataforma (pública: la página de inicio la necesita)
    // Sin internet: timeout de 4s para no quedarse en "Cargando…" para siempre
    var clubsTimer = setTimeout(function(){
      if(!clubsLoaded){ clubsLoaded = true; safeRender(); }
    }, 4000);
    db.collection('clubes').onSnapshot(function(snap){
      clearTimeout(clubsTimer);
      CLUBS = [];
      snap.forEach(function(d){ CLUBS.push(Object.assign({id:d.id}, d.data())); });
      CLUBS.sort(function(a,b){ return String(a.nombre).localeCompare(String(b.nombre)); });
      clubsLoaded = true;
      if(isCreador() && !CLUBS.some(function(c){ return c.id===DEFAULT_CLUB_ID; })) migrateToMultiClub();
      if(sessionEnteredClub) applyClubTheme(currentClub());
      if(!isTyping()) safeRender();
    }, function(err){ clearTimeout(clubsTimer); console.error('No se pudo leer la lista de clubes', err); clubsLoaded = true; safeRender(); });

    function afterAuthChange(){
      authReady = true;
      ntAlEntrar();
      if(staffMode && staffRedirect()) return;
      if(isCreador() && clubsLoaded && !CLUBS.some(function(c){ return c.id===DEFAULT_CLUB_ID; })) migrateToMultiClub();
      if(sessionEnteredClub){ attachPrivate(); attachPhotos(); scheduleRebuild(); }
      safeRender();
    }
    auth.onAuthStateChanged(function(user){
      detachPrivate();
      if(user){
        var prov = (user.providerData && user.providerData[0] && user.providerData[0].providerId) || 'password';
        db.collection('staff').doc(user.email.toLowerCase()).get().then(function(doc){
          var d = doc.exists ? doc.data() : null;
          currentUser = {email:user.email, role: d ? d.role : null, categoria: d ? d.categoria : null, club: d ? (d.club || null) : null};
          if(d && !d.modo) doc.ref.update({modo:prov}).catch(function(){}); // cuentas anteriores: anotar con qué método entran
          afterAuthChange();
        }).catch(function(){
          currentUser = {email:user.email, role:null, categoria:null, club:null};
          afterAuthChange();
        });
      } else {
        currentUser = null;
        afterAuthChange(); // vuelve a mostrar solo lo público
      }
    });
    routeFromHash(); // si el enlace trae #/club, se abre directo ese club
    safeRender();
  }catch(e){
    console.error('Firebase no se pudo inicializar, usando solo almacenamiento local', e);
    bootFromLocalOrFresh();
    safeRender();
  }
} else {
  bootFromLocalOrFresh();
  routeFromHash();
  if(staffMode) authReady = true; // sin Firebase no hay sesión que esperar
  safeRender();
}
})();
</script>
</body>
</html>
