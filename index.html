<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Jogo Bonito — Cartas &amp; Entrenamientos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-950:#080c24;
    --navy-900:#0e1736;
    --navy-800:#141f4a;
    --navy-700:#1b2a5e;
    --orange-500:#f65334;
    --orange-600:#d63f22;
    --orange-100:#ffd9cc;
    --lime:#c1f807;
    --lime-dim:#7ea800;
    --white:#ffffff;
    --ink:#eef0fa;
    --ink-muted:#93a0c9;
    --ink-faint:#5c6796;
    --card-bg:#101a3f;
    --card-bg-raised:#162252;
    --border:rgba(255,255,255,0.09);
    --border-strong:rgba(255,255,255,0.16);
    --good:#5fd39b;
    --bad:#ef6a6a;
    --radius-s:8px;
    --radius-m:14px;
    --radius-l:22px;
    --font-display:'Oswald', sans-serif;
    --font-body:'Inter', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:radial-gradient(1200px 800px at 15% -10%, #142055 0%, var(--navy-950) 55%), var(--navy-950);
    color:var(--ink);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  ::selection{background:var(--orange-500);color:white;}

  a{color:inherit;}
  button{font-family:inherit;}

  /* ---------- Shell ---------- */
  .shell{
    display:flex;
    min-height:100vh;
    max-width:1400px;
    margin:0 auto;
  }
  .sidebar{
    width:248px;
    flex-shrink:0;
    padding:28px 18px;
    display:flex;
    flex-direction:column;
    gap:28px;
    border-right:1px solid var(--border);
    position:sticky;
    top:0;
    align-self:flex-start;
    height:100vh;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:12px;
    padding:0 4px;
    cursor:pointer;
  }
  .brand img{
    width:46px;height:46px;border-radius:50%;
    box-shadow:0 0 0 2px var(--orange-500), 0 4px 14px rgba(0,0,0,.4);
  }
  .brand-text .club{
    font-family:var(--font-display);
    font-size:15px;
    font-weight:600;
    letter-spacing:.02em;
    line-height:1.15;
  }
  .brand-text .tag{
    font-size:11px;
    color:var(--ink-faint);
    margin-top:2px;
  }
  nav.tabs{display:flex;flex-direction:column;gap:4px;}
  .tab-btn{
    display:flex;align-items:center;gap:11px;
    background:transparent;border:none;color:var(--ink-muted);
    padding:11px 12px;border-radius:var(--radius-s);
    font-size:14.5px;font-weight:500;text-align:left;cursor:pointer;
    transition:background .15s ease, color .15s ease;
  }
  .tab-btn .dot{width:6px;height:6px;border-radius:50%;background:transparent;flex-shrink:0;}
  .tab-btn:hover{background:rgba(255,255,255,.05);color:var(--ink);}
  .tab-btn.active{background:var(--card-bg-raised);color:var(--white);}
  .tab-btn.active .dot{background:var(--orange-500);}
  .sidebar-foot{
    margin-top:auto;font-size:11.5px;color:var(--ink-faint);line-height:1.5;
    padding:12px 4px;border-top:1px solid var(--border);
  }
  .chrome-block{margin-bottom:6px;}
  .chrome-label{font-size:10.5px;color:var(--ink-faint);text-transform:none;margin:0 4px 6px;}
  .role-switch{display:flex;flex-direction:column;gap:4px;margin-bottom:16px;}
  .role-btn{
    display:flex;align-items:center;gap:8px;background:transparent;border:1px solid var(--border);
    color:var(--ink-muted);padding:8px 10px;border-radius:var(--radius-s);font-size:12.5px;font-weight:600;
    cursor:pointer;text-align:left;
  }
  .role-btn.active{background:var(--orange-500);border-color:var(--orange-500);color:white;}
  .staff-box{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;font-size:12px;}
  .staff-email{color:var(--ink-muted);font-weight:600;word-break:break-all;}
  .staff-role{color:var(--ink-faint);}
  .staff-link{
    background:transparent;border:1px solid var(--border);color:var(--ink-muted);
    padding:6px 10px;border-radius:var(--radius-s);font-size:11.5px;font-weight:600;
    cursor:pointer;text-align:left;
  }
  .staff-link:hover{border-color:var(--orange-500);color:var(--white);}
  .staff-form{display:flex;flex-direction:column;gap:12px;margin-top:6px;}
  .staff-form label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--ink-muted);font-weight:600;}
  .staff-form input, .staff-form select{
    background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius-s);
    color:var(--ink);padding:9px 10px;font-size:14px;font-family:var(--font-body);
  }
  .staff-submit{
    background:var(--orange-500);border:none;color:white;font-weight:700;padding:10px 16px;
    border-radius:var(--radius-s);cursor:pointer;font-size:13px;
  }
  .staff-error{color:var(--bad);font-size:12.5px;}
  .staff-hint, .staff-alt{font-size:12px;color:var(--ink-faint);margin-top:12px;}
  .staff-alt a{color:var(--lime);text-decoration:none;font-weight:600;}
  .staff-divider{text-align:center;color:var(--ink-faint);font-size:11px;margin:-2px 0;}
  /* ---- Plantel y categorías ---- */
  .pl-card{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius-l);padding:18px 20px;margin-bottom:18px;}
  .pl-card h3{font-family:var(--font-display);font-size:17px;font-weight:600;margin:0 0 12px;letter-spacing:.02em;}
  .pl-help{font-size:12.5px;color:var(--ink-muted);margin:0 0 10px;line-height:1.5;}
  .pl-help code{background:rgba(255,255,255,.07);padding:1px 6px;border-radius:4px;font-size:12px;}
  .pl-inline{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px;}
  .pl-card input, .pl-card textarea, .pl-card select{
    background:var(--navy-950);border:1px solid var(--border-strong);color:var(--ink);
    border-radius:var(--radius-s);padding:8px 10px;font-size:13.5px;font-family:var(--font-body);
  }
  .pl-card input[type=checkbox]{width:16px;height:16px;padding:0;accent-color:var(--orange-500);}
  .pl-card textarea{width:100%;box-sizing:border-box;resize:vertical;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;}
  .pl-btn{background:var(--orange-500);border:none;color:#fff;font-weight:600;font-size:13px;padding:8px 14px;border-radius:var(--radius-s);cursor:pointer;font-family:var(--font-body);}
  .pl-btn:disabled{opacity:.4;cursor:not-allowed;}
  .pl-btn.ghost, .pl-file{background:transparent;border:1px solid var(--border-strong);color:var(--ink-muted);}
  .pl-btn.danger{background:transparent;border:1px solid rgba(239,106,106,.45);color:var(--bad);}
  .pl-btn.small{padding:5px 10px;font-size:12px;}
  .pl-file{font-weight:600;font-size:13px;padding:8px 14px;border-radius:var(--radius-s);cursor:pointer;}
  .pl-file input{display:none;}
  .pl-cat-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);flex-wrap:wrap;}
  .pl-cat-row .nm{font-weight:600;flex:1;min-width:90px;}
  .pl-cat-row .ct{color:var(--ink-faint);font-size:12px;}
  .pl-wrap{overflow-x:auto;}
  .pl-table{width:100%;border-collapse:collapse;margin-top:12px;font-size:13px;min-width:520px;}
  .pl-table th{text-align:left;color:var(--ink-faint);font-weight:600;font-size:11.5px;padding:6px;border-bottom:1px solid var(--border);}
  .pl-table td{padding:6px;border-bottom:1px solid var(--border);vertical-align:middle;}
  .pl-table td input:not([type=checkbox]){width:100%;box-sizing:border-box;}
  .pl-status{font-size:11.5px;white-space:nowrap;}
  .pl-status.ok{color:var(--good);}
  .pl-status.warn{color:#f0b429;}
  .pl-summary{margin-top:12px;font-size:13px;color:var(--ink-muted);}
  .pl-msg{margin-top:10px;font-size:12.5px;color:var(--good);}
  .pl-msg.err{color:var(--bad);}
  .pl-count{font-size:12px;color:var(--ink-faint);}
  .pl-pos2{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;align-items:center;}
  .pl-chip{font-size:11.5px;padding:3px 8px;border-radius:999px;background:rgba(246,83,52,.14);color:var(--ink);border:1px solid rgba(246,83,52,.35);cursor:pointer;white-space:nowrap;}
  .pl-chip:hover{border-color:var(--bad);}
  .pl-pos2 select{padding:4px 8px !important;font-size:12px !important;}
  .staff-google-btn{
    display:flex;align-items:center;justify-content:center;gap:8px;
    background:#fff;color:#3c4043;border:1px solid var(--border-strong);
    padding:9px 14px;border-radius:var(--radius-s);font-weight:600;font-size:13px;cursor:pointer;
  }
  .staff-google-btn:hover{box-shadow:0 1px 3px rgba(0,0,0,.35);}
  .cat-select-wrap{margin-bottom:16px;}
  .cat-select-wrap select.cat-select{width:100%;}
  .cat-locked{
    font-size:12.5px;color:var(--ink-muted);background:var(--card-bg);border:1px solid var(--border);
    border-radius:var(--radius-s);padding:8px 10px;margin-bottom:16px;
  }
  .chrome-mobile{display:none;}

  .topbar-mobile{display:none;cursor:pointer;}

  /* ---------- Main ---------- */
  main{flex:1;min-width:0;padding:30px 34px 80px;}
  .main-inner{max-width:1080px;margin:0 auto;}

  /* ---------- Landing (Arena Sports) ---------- */
  .landing{min-height:100vh;display:flex;flex-direction:column;background:
    radial-gradient(1000px 560px at 82% -12%, rgba(193,248,7,.13), transparent 60%),
    radial-gradient(700px 500px at 8% 105%, rgba(193,248,7,.06), transparent 55%),
    linear-gradient(180deg, #0a0a0a 0%, #050505 100%);
  }
  .landing-hero{
    display:flex;flex-direction:column;align-items:center;
    text-align:center;padding:34px 24px 22px;max-width:680px;margin:0 auto;
  }
  .landing-hero .hero-logo{
    width:128px;height:auto;margin-bottom:14px;
    filter:drop-shadow(0 0 26px rgba(193,248,7,.25));
    opacity:0;transform:scale(.9) translateY(8px);
    animation:heroReveal .7s cubic-bezier(.2,.8,.2,1) .1s forwards;
  }
  @keyframes heroReveal{ to{ opacity:1; transform:scale(1) translateY(0); } }
  @media (prefers-reduced-motion: reduce){
    .landing-hero .hero-logo{ animation:none; opacity:1; transform:none; }
  }
  .landing-hero .eyebrow{
    font-size:12.5px;color:var(--lime);font-weight:600;margin-bottom:10px;letter-spacing:.01em;
  }
  .landing-hero h1{
    font-family:var(--font-display);font-size:clamp(28px,4.2vw,42px);line-height:1.1;
    margin:0 0 14px;font-weight:600;
  }
  .landing-hero p{
    font-size:15px;color:var(--ink-muted);line-height:1.6;max-width:50ch;margin:0 auto;
  }
  .landing-clubs{
    padding:4px 24px 56px;max-width:1180px;margin:0 auto;width:100%;
  }
  .landing-clubs h2{
    font-family:var(--font-display);font-size:13px;font-weight:600;color:var(--ink-faint);
    margin:0 0 16px;
  }
  .club-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;}
  .landing .club-card{
    position:relative;overflow:hidden;
    background:linear-gradient(155deg,#171717,#0c0c0c 70%);
    border:1px solid rgba(255,255,255,.08);border-radius:var(--radius-l);
    padding:28px 26px;display:flex;align-items:center;gap:18px;cursor:pointer;
    transition:transform .18s ease, border-color .18s ease, box-shadow .18s ease;
  }
  .club-card::before{
    content:'';position:absolute;top:0;left:0;bottom:0;width:5px;
    background:linear-gradient(var(--lime),var(--lime-dim));
    transform:skewX(-8deg);transform-origin:top left;
  }
  .club-card:hover{transform:translateY(-3px);border-color:rgba(193,248,7,.35);box-shadow:0 14px 32px rgba(0,0,0,.35);}
  .club-card img{width:64px;height:64px;border-radius:50%;box-shadow:0 0 0 2px var(--lime);flex-shrink:0;background:#0b1330;}
  .club-card .name{font-family:var(--font-display);font-size:19px;margin-bottom:4px;}
  .club-card .meta{font-size:12.5px;color:var(--ink-faint);}
  .club-card .enter{
    margin-left:auto;flex-shrink:0;font-size:12px;font-weight:700;color:var(--navy-950);
    background:var(--lime);padding:8px 14px;border-radius:100px;white-space:nowrap;
  }
  .landing .club-card-add{
    border:1.5px dashed rgba(255,255,255,.16);background:transparent;border-radius:var(--radius-l);
    padding:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;gap:6px;color:var(--ink-faint);transition:border-color .18s ease;
  }
  .landing .club-card-add:hover{border-color:rgba(193,248,7,.5);}
  .club-card-add b{color:var(--ink-muted);font-size:14px;}
  .club-card-add a{color:var(--lime);text-decoration:none;font-size:12.5px;font-weight:600;}
  .landing-foot{
    text-align:center;padding:26px 24px;font-size:11.5px;color:var(--ink-faint);
    border-top:1px solid var(--border);display:flex;flex-direction:column;gap:12px;align-items:center;
  }
  .social-row{display:flex;gap:14px;}
  .social-row a{
    display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;
    border:1px solid var(--border-strong);color:var(--ink-muted);transition:color .15s ease, border-color .15s ease;
  }
  .social-row a:hover{color:var(--lime);border-color:var(--lime);}
  .social-row svg{width:16px;height:16px;fill:currentColor;}
  .view-head{
    display:flex;justify-content:space-between;align-items:flex-end;gap:16px;
    margin-bottom:22px;flex-wrap:wrap;
  }
  .view-head h1{
    font-family:var(--font-display);
    font-size:26px;font-weight:600;margin:0 0 6px;letter-spacing:.01em;
  }
  .view-head p{margin:0;color:var(--ink-muted);font-size:13.5px;max-width:52ch;}
  .cat-select{
    background:var(--card-bg);border:1px solid var(--border-strong);color:var(--ink);
    padding:9px 14px;border-radius:var(--radius-s);font-size:13.5px;font-family:var(--font-body);
  }

  .pill{
    display:inline-flex;align-items:center;gap:6px;
    font-size:11.5px;font-weight:600;color:var(--orange-500);
    background:rgba(246,83,52,.12);border:1px solid rgba(246,83,52,.35);
    padding:4px 10px;border-radius:100px;letter-spacing:.02em;
  }

  /* ---------- Training view ---------- */
  .focus-box{
    background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius-m);
    padding:14px 16px;margin-bottom:18px;
  }
  .focus-title{font-size:12.5px;color:var(--ink-muted);margin-bottom:9px;}
  .focus-chips{display:flex;flex-wrap:wrap;gap:7px;}
  .focus-chip{
    background:var(--navy-950);border:1px solid var(--border-strong);color:var(--ink-faint);
    font-size:12px;font-weight:600;padding:6px 12px;border-radius:100px;cursor:pointer;
  }
  .focus-chip.on{background:var(--orange-500);border-color:var(--orange-500);color:white;}
  .match-stat-row{display:flex;gap:22px;margin-bottom:4px;}
  .match-stat-row label{font-size:12px;color:var(--ink-muted);display:flex;flex-direction:column;gap:5px;}
  .match-num{
    width:70px;background:var(--navy-950);border:1px solid var(--border-strong);border-radius:var(--radius-s);
    color:var(--ink);padding:7px 9px;font-family:var(--font-body);font-size:14px;
  }

  .player-row{
    background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius-m);
    padding:16px 18px;margin-bottom:12px;
    transition:border-color .15s ease;
  }
  .player-row.done{border-color:rgba(95,211,155,.4);}
  .player-row-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .avatar{
    width:42px;height:42px;border-radius:50%;flex-shrink:0;
    background:linear-gradient(145deg,var(--navy-700),var(--navy-800));
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-display);font-size:15px;color:var(--orange-500);border:1px solid var(--border-strong);
  }
  .player-name-block{flex:1;min-width:140px;}
  .player-name{font-weight:600;font-size:15px;}
  .player-meta{font-size:12px;color:var(--ink-faint);margin-top:1px;}
  .attend-toggle{
    display:flex;background:var(--navy-950);border:1px solid var(--border-strong);
    border-radius:100px;padding:3px;gap:2px;flex-shrink:0;
  }
  .attend-toggle button{
    border:none;background:transparent;color:var(--ink-muted);
    font-size:12.5px;font-weight:600;padding:6px 13px;border-radius:100px;cursor:pointer;
  }
  .attend-toggle button.on-yes.sel{background:var(--good);color:#08170f;}
  .attend-toggle button.on-no.sel{background:var(--bad);color:#2a0808;}

  .rating-block{margin-top:14px;padding-top:14px;border-top:1px dashed var(--border);}
  .rating-label{font-size:12px;color:var(--ink-muted);margin-bottom:8px;}
  .rating-scale{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;}
  .rating-scale button{
    width:32px;height:32px;border-radius:8px;border:1px solid var(--border-strong);
    background:var(--navy-950);color:var(--ink-muted);font-weight:700;cursor:pointer;font-size:13px;
  }
  .rating-scale button.sel{background:var(--orange-500);border-color:var(--orange-500);color:white;}
  .quick-attrs{display:flex;flex-direction:column;gap:10px;margin-bottom:4px;}
  .quick-attr-row{background:var(--navy-950);border:1px solid var(--border);border-radius:var(--radius-s);padding:9px 11px;}
  .quick-attr-label{font-size:12.5px;font-weight:600;margin-bottom:7px;}
  .quick-attr-scale{display:flex;gap:5px;flex-wrap:wrap;}
  .quick-attr-scale button{
    width:27px;height:27px;border-radius:7px;border:1px solid var(--border-strong);
    background:var(--navy-900);color:var(--ink-muted);font-weight:700;cursor:pointer;font-size:11.5px;
  }
  .quick-attr-scale button.sel{background:var(--orange-500);border-color:var(--orange-500);color:white;}
  .fb-textarea{
    width:100%;min-height:64px;resize:vertical;
    background:var(--navy-950);border:1px solid var(--border-strong);border-radius:var(--radius-s);
    color:var(--ink);padding:10px 12px;font-family:var(--font-body);font-size:13.5px;line-height:1.5;
  }
  .fb-textarea::placeholder{color:var(--ink-faint);}
  .analysis-box{
    margin-top:10px;font-size:12.5px;color:var(--ink-muted);
    background:rgba(246,83,52,.07);border:1px solid rgba(246,83,52,.2);
    border-radius:var(--radius-s);padding:9px 12px;display:none;
  }
  .analysis-box.show{display:block;}
  .analysis-box b{color:var(--orange-500);}
  .attr-chip{
    display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;
    background:var(--navy-950);border:1px solid var(--border-strong);border-radius:100px;
    padding:3px 9px;margin:3px 4px 0 0;
  }
  .attr-chip.up{color:var(--good);}
  .attr-chip.down{color:var(--bad);}
  .save-row{display:flex;justify-content:flex-end;margin-top:12px;}
  .btn-save-player{
    background:var(--orange-500);border:none;color:white;font-weight:600;font-size:13px;
    padding:8px 16px;border-radius:var(--radius-s);cursor:pointer;
  }
  .btn-save-player:disabled{opacity:.35;cursor:not-allowed;}
  .btn-save-player.saved{background:var(--good);color:#08170f;}

  /* ---------- Cards / Cartas view ---------- */
  .cards-grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:16px;
  }
  .card-player{
    background:linear-gradient(160deg,var(--card-bg-raised),var(--card-bg) 70%);
    border:1px solid var(--border);border-radius:var(--radius-l);
    padding:18px;cursor:pointer;position:relative;overflow:hidden;
    transition:transform .15s ease, border-color .15s ease;
  }
  .card-player:hover{transform:translateY(-3px);border-color:var(--border-strong);}
  .card-player::after{
    content:'';position:absolute;top:-40px;right:-40px;width:120px;height:120px;border-radius:50%;
    background:radial-gradient(circle, rgba(246,83,52,.16), transparent 70%);
  }
  .card-pos{font-size:11px;font-weight:700;color:var(--orange-500);letter-spacing:.03em;}
  .card-name{font-family:var(--font-display);font-size:19px;margin:4px 0 10px;}
  .card-val-row{display:flex;align-items:baseline;gap:6px;}
  .card-val{font-family:var(--font-display);font-size:38px;color:var(--white);}
  .card-val-max{font-size:12px;color:var(--ink-faint);}
  .card-stats{display:flex;gap:14px;margin-top:12px;font-size:12px;color:var(--ink-muted);}
  .card-stats span b{color:var(--ink);font-size:13px;}
  .spark{margin-top:12px;height:26px;}
  .avatar{overflow:hidden;}
  .avatar img, .card-photo img, .modal-photo img, .pl-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .card-top{display:flex;gap:12px;align-items:center;margin-bottom:4px;}
  .card-top .card-name{margin:3px 0 0;}
  .card-photo, .modal-photo, .pl-thumb{
    flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(145deg,var(--navy-700),var(--navy-800));border:1px solid var(--border-strong);
    font-family:var(--font-display);color:var(--orange-500);
  }
  .card-photo{width:58px;height:58px;border-radius:14px;font-size:19px;}
  .modal-photo{width:76px;height:76px;border-radius:18px;font-size:24px;}
  .pl-thumb{width:36px;height:36px;border-radius:9px;font-size:12px;}
  .modal-head{display:flex;gap:14px;align-items:center;margin-bottom:10px;}
  .xp{margin-top:10px;}
  .xp-bar{height:6px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden;}
  .xp-bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--orange-500),var(--lime));}
  .xp-txt{font-size:11px;color:var(--ink-faint);margin-top:4px;}
  .modal .xp{margin:0 0 16px;}
  /* ---- Carta estilo FIFA: la foto es la protagonista ---- */
  .card-player{padding:10px 10px 16px;}
  .fut-photo{
    position:relative;z-index:1;aspect-ratio:4/5;border-radius:14px;overflow:hidden;
    background:radial-gradient(circle at 50% 30%, var(--navy-700), var(--navy-950) 80%);
    border:1px solid var(--border-strong);
  }
  .fut-photo img{width:100%;height:100%;object-fit:cover;object-position:center 22%;display:block;transition:transform .35s ease;}
  .card-player:hover .fut-photo img{transform:scale(1.04);}
  .fut-photo.no-photo{display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:68px;color:rgba(246,83,52,.45);letter-spacing:.02em;}
  .fut-photo::after{
    content:'';position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(180deg, rgba(4,7,22,.62) 0%, rgba(4,7,22,0) 30%, rgba(4,7,22,0) 52%, rgba(4,7,22,.94) 100%);
  }
  .fut-rating{position:absolute;top:10px;left:12px;z-index:2;display:flex;flex-direction:column;align-items:center;line-height:1;}
  .fut-rating b{font-family:var(--font-display);font-size:42px;font-weight:600;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.55);}
  .fut-rating span{font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--lime);margin-top:5px;}
  .fut-name{position:absolute;left:12px;right:12px;bottom:11px;z-index:2;}
  .fut-name .card-name{margin:0;font-size:21px;line-height:1.08;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.6);}
  .fut-name .card-pos{margin-top:4px;}
  .card-player .xp, .card-player .card-stats, .card-player .spark{padding:0 6px;}
  .card-player .pill{margin-left:6px;}
  /* ---- Niveles de carta ---- */
  .card-player{--tier-accent:var(--lime);--sheen:rgba(255,255,255,.3);}
  .fut-rating span, .fut-name .card-pos{color:var(--tier-accent);}
  .card-player .xp, .card-player .card-stats, .card-player .spark, .card-player .pill{position:relative;z-index:1;}
  .fut-tier{
    position:absolute;top:12px;right:12px;z-index:2;display:inline-flex;align-items:center;gap:4px;
    font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
    padding:4px 9px;border-radius:999px;background:rgba(0,0,0,.42);color:var(--tier-accent);border:1px solid var(--tier-accent);
  }
  .fut-tier svg{width:12px;height:12px;fill:currentColor;}
  .card-player.t-bronce, .card-player.t-plata, .card-player.t-oro, .card-player.t-elite{
    box-shadow:0 14px 34px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.22);
  }
  .card-player.t-bronce{--tier-accent:#ffd2ab;--sheen:rgba(255,220,190,.32);background:linear-gradient(155deg,#c98b5a 0%,#8a5a36 38%,#4a2e1a 100%);border:1.5px solid #e0a574;}
  .card-player.t-plata{--tier-accent:#f2f5fa;--sheen:rgba(255,255,255,.42);background:linear-gradient(155deg,#d9dee6 0%,#8d96a3 38%,#4e5561 100%);border:1.5px solid #eef2f7;}
  .card-player.t-oro{--tier-accent:#fff0b8;--sheen:rgba(255,245,200,.48);background:linear-gradient(155deg,#f4d36b 0%,#b8871e 38%,#6b4a0e 100%);border:1.5px solid #ffe596;}
  .card-player.t-elite{
    --tier-accent:#f2c94c;--sheen:rgba(255,215,110,.38);
    background:linear-gradient(155deg,#1b2350 0%,#0b0f24 45%,#040612 100%);border:1.5px solid #f2c94c;
    box-shadow:0 0 0 1px rgba(242,201,76,.35), 0 0 26px rgba(242,201,76,.26), 0 14px 34px rgba(0,0,0,.5);
  }
  .card-player.t-elite .fut-photo{border-color:rgba(242,201,76,.55);}
  .card-player.t-bronce::after, .card-player.t-plata::after, .card-player.t-oro::after{display:none;}
  .card-player.t-elite::after{ /* rayas doradas diagonales: sello de la carta especial */
    content:'';position:absolute;inset:0;top:0;right:0;width:auto;height:auto;border-radius:0;z-index:0;pointer-events:none;opacity:.1;
    background:repeating-linear-gradient(135deg,#f2c94c 0 2px,transparent 2px 14px);
  }
  .card-player.t-bronce::before, .card-player.t-plata::before, .card-player.t-oro::before, .card-player.t-elite::before{
    content:'';position:absolute;inset:-40% -60%;z-index:0;pointer-events:none;
    background:linear-gradient(115deg,transparent 42%,var(--sheen) 50%,transparent 58%);
    animation:cardSheen 5.5s ease-in-out infinite;
  }
  @keyframes cardSheen{0%,60%{transform:translateX(-35%);}100%{transform:translateX(35%);}}
  @media (prefers-reduced-motion:reduce){.card-player::before{animation:none !important;}}
  .fut-bolt{position:absolute;right:-14px;bottom:-18px;width:120px;height:120px;z-index:0;pointer-events:none;opacity:.14;}
  .fut-bolt svg{width:100%;height:100%;fill:#f2c94c;}
  .card-player[class*="t-"] .card-stats, .card-player[class*="t-"] .xp-txt{color:rgba(255,255,255,.88);}
  .card-player[class*="t-"] .card-stats span b{color:#fff;}
  .card-player[class*="t-"] .xp-bar{background:rgba(0,0,0,.35);}
  .card-player[class*="t-"] .xp-bar i{background:linear-gradient(90deg,var(--tier-accent),#fff);}

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(4,6,20,.72);backdrop-filter:blur(3px);
    display:none;align-items:flex-start;justify-content:center;padding:5vh 16px;z-index:50;overflow-y:auto;
  }
  .modal-overlay.show{display:flex;}
  .modal{
    background:var(--navy-900);border:1px solid var(--border-strong);border-radius:var(--radius-l);
    max-width:560px;width:100%;padding:26px 26px 22px;position:relative;
  }
  .modal-close{
    position:absolute;top:16px;right:16px;background:var(--navy-950);border:1px solid var(--border-strong);
    color:var(--ink-muted);width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:15px;
  }
  .modal h2{font-family:var(--font-display);font-size:24px;margin:0 0 2px;}
  .modal .sub{color:var(--ink-muted);font-size:13px;margin-bottom:18px;}
  .modal-stats{display:flex;gap:22px;margin-bottom:18px;flex-wrap:wrap;}
  .modal-stats div{font-size:12px;color:var(--ink-faint);}
  .modal-stats div b{display:block;color:var(--white);font-family:var(--font-display);font-size:20px;}
  .timeline{border-top:1px solid var(--border);padding-top:14px;max-height:280px;overflow-y:auto;}
  .tl-item{padding:10px 0;border-bottom:1px solid var(--border);font-size:13px;}
  .tl-item:last-child{border-bottom:none;}
  .tl-date{font-size:11px;color:var(--ink-faint);margin-bottom:3px;}
  .tl-comment{color:var(--ink-muted);margin-top:4px;line-height:1.5;}
  .tl-delta{font-weight:700;}
  .tl-delta.up{color:var(--good);}
  .tl-delta.down{color:var(--bad);}

  /* ---------- Perfil view ---------- */
  .perfil-layout{display:flex;gap:22px;flex-wrap:wrap;}
  .pos-list{
    display:flex;flex-direction:column;gap:5px;width:230px;flex-shrink:0;
  }
  .pos-item{
    padding:10px 13px;border-radius:var(--radius-s);border:1px solid var(--border);
    background:var(--card-bg);cursor:pointer;font-size:13.5px;font-weight:500;color:var(--ink-muted);
  }
  .pos-item.active{background:var(--card-bg-raised);border-color:var(--orange-500);color:var(--white);}
  .pos-item small{display:block;font-size:11px;color:var(--ink-faint);font-weight:400;margin-top:1px;}
  .perfil-panel{
    flex:1;min-width:280px;background:var(--card-bg);border:1px solid var(--border);
    border-radius:var(--radius-l);padding:22px 24px;
  }
  .perfil-panel h3{font-family:var(--font-display);font-size:20px;margin:0 0 4px;}
  .perfil-panel .desc{color:var(--ink-muted);font-size:13px;margin-bottom:20px;}
  .attr-row{margin-bottom:18px;}
  .attr-row-top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:7px;}
  .attr-row-top .name{font-weight:600;}
  .attr-row-top .val{font-family:var(--font-display);color:var(--orange-500);}
  input[type=range]{
    width:100%;-webkit-appearance:none;appearance:none;height:7px;border-radius:100px;
    background:var(--navy-950);outline:none;border:1px solid var(--border-strong);
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;width:19px;height:19px;border-radius:50%;
    background:var(--orange-500);border:3px solid var(--navy-900);box-shadow:0 0 0 1px var(--orange-500);cursor:pointer;
  }
  input[type=range]::-moz-range-thumb{
    width:19px;height:19px;border-radius:50%;background:var(--orange-500);border:3px solid var(--navy-900);cursor:pointer;
  }
  .summary-box{
    margin-top:8px;background:var(--navy-950);border:1px solid var(--border);border-radius:var(--radius-s);
    padding:13px 15px;font-size:13px;color:var(--ink-muted);line-height:1.6;
  }
  .summary-box b{color:var(--white);}

  /* ---------- Informe view ---------- */
  .informe-select{margin-bottom:20px;}
  .informe-card{
    background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius-l);
    padding:26px 28px;
  }
  .informe-header{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:16px;margin-bottom:20px;}
  .informe-header h2{font-family:var(--font-display);font-size:24px;margin:0 0 4px;}
  .informe-header .sub{color:var(--ink-muted);font-size:13px;}
  .informe-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:14px;margin-bottom:22px;}
  .informe-stat{background:var(--navy-950);border:1px solid var(--border);border-radius:var(--radius-s);padding:14px;}
  .informe-stat .n{font-family:var(--font-display);font-size:26px;color:var(--orange-500);}
  .informe-stat .l{font-size:11.5px;color:var(--ink-faint);margin-top:2px;}
  .informe-narrative{
    background:var(--navy-950);border:1px solid var(--border);border-radius:var(--radius-m);
    padding:18px 20px;font-size:13.5px;line-height:1.7;color:var(--ink-muted);
  }
  .informe-narrative b{color:var(--white);}
  .trend-svg{width:100%;height:80px;margin:8px 0 4px;}

  .empty-note{
    font-size:12px;color:var(--ink-faint);margin-top:26px;text-align:center;padding-bottom:10px;
  }

  /* ---------- Mobile ---------- */
  @media (max-width:880px){
    .shell{flex-direction:column;}
    .sidebar{
      display:none;
    }
    .topbar-mobile{
      display:flex;align-items:center;gap:10px;
      padding:14px 16px calc(10px + env(safe-area-inset-top,0px));
      border-bottom:1px solid var(--border);
      position:sticky;top:0;background:var(--navy-950);z-index:20;
    }
    .topbar-mobile img{width:34px;height:34px;border-radius:50%;box-shadow:0 0 0 2px var(--orange-500);}
    .topbar-mobile .club{font-family:var(--font-display);font-size:14px;font-weight:600;}
    .chrome-mobile{
      display:flex;gap:8px;padding:10px 16px;border-bottom:1px solid var(--border);
      background:var(--navy-950);position:sticky;top:63px;z-index:19;flex-wrap:wrap;
    }
    .chrome-mobile select{flex:1;min-width:120px;}
    .tabs-mobile{top:calc(63px + 52px);}
    .tabs-mobile{
      display:flex;gap:6px;overflow-x:auto;padding:10px 16px 12px;
      border-bottom:1px solid var(--border);position:sticky;top:63px;background:var(--navy-950);z-index:19;
    }
    .tabs-mobile .tab-btn{white-space:nowrap;background:var(--card-bg);border:1px solid var(--border);}
    .tabs-mobile .tab-btn.active{background:var(--orange-500);color:white;}
    .tabs-mobile .tab-btn.active .dot{background:white;}
    main{padding:20px 16px 60px;}
    .perfil-layout{flex-direction:column;}
    .pos-list{width:100%;flex-direction:row;flex-wrap:wrap;}
    .pos-item{flex:1 1 45%;}
  }
</style>
</head>

function seedPlayers(categoria){
  var today = new Date();
  function daysAgo(n){ var d=new Date(today); d.setDate(d.getDate()-n); return d.toISOString().slice(0,10); }
  var seedHist = [
    {pos:'DFC1', comments:['Muy sólido marcando, recuperó muchos balones y mantuvo buena actitud todo el entrenamiento.', 'Le costó un poco el pase largo, pero defendió bien uno contra uno.']},
    {pos:'MCO', comments:['Excelente visión de juego, varios pases entre líneas y buena resistencia durante todo el trabajo.', 'Bajó el ritmo en el segundo tiempo del entrenamiento, se cansó rápido.']},
    {pos:'DC', comments:['Definición muy clara, dos remates a portería en el trabajo de finalización.', 'Poca participación en la recuperación, pero es esperable en su posición.']},
    {pos:'ED', comments:['Muy rápido en las bandas, generó desborde constante.', 'Necesita mejorar la actitud al momento de replegar en defensa.']}
  ];
  return NAMES.map(function(name, i){
    var pos = POSITIONS[i % POSITIONS.length].code;
    var base = 58 + Math.round(Math.random()*14);
    var hist = [];
    var val = base;
    for(var d=5; d>=1; d--){
      var delta = [3,-1,4,2,-2][d-1] || 2;
      val += delta;
      var sample = seedHist[i % seedHist.length];
      var txt = sample.comments[d % sample.comments.length];
      hist.push({
        type:'entrenamiento',
        date: daysAgo(d*4),
        asistio:true,
        rating: 6 + (delta>0?2:0),
        delta: delta,
        feedback: txt,
        comment: txt,
        quickValues: {},
        attrsHit: []
      });
    }
    return {
      id: categoria + '-p' + i,
      name:name,
      categoria: categoria,
      pos:pos,
      goles: Math.round(Math.random()*6),
      asistencias: Math.round(Math.random()*5),
      valoracion: val,
      historial: hist
    };
  });
}

function normalizeState(s){
  if(!s || !Array.isArray(s.players)) return null;
  try{
    if(!Array.isArray(s.categories) || !s.categories.length) s.categories = ['Sub-13','Sub-15','Sub-17'];
    s.players.forEach(function(p){
      if(!p.categoria) p.categoria = s.categories[0];
      if(s.categories.indexOf(p.categoria)===-1) s.categories.push(p.categoria); // nunca se borra un jugador por tener una categoría desconocida
      p.pos = normalizePos(p.pos) || 'MC';
      p.posExtra = (Array.isArray(p.posExtra) ? p.posExtra : []).map(normalizePos).filter(function(c, i, a){ return c && c!==p.pos && a.indexOf(c)===i; });
      if(typeof p.valoracion !== 'number') p.valoracion = 60;
      if(typeof p.goles !== 'number') p.goles = 0;
      if(typeof p.asistencias !== 'number') p.asistencias = 0;
      if(!Array.isArray(p.historial)) p.historial = [];
      p.historial.forEach(function(h){
        if(!h.type) h.type = 'entrenamiento';
        if(!h.quickValues) h.quickValues = {};
        if(typeof h.feedback !== 'string') h.feedback = (h.comment && h.comment.indexOf('(')!==0) ? h.comment : '';
      });
    });
    if(!s.profiles) s.profiles = {};
    if(!s.profiles.DFC && s.profiles.DFC1) s.profiles.DFC = s.profiles.DFC1;
    if(!s.profiles.EXT && s.profiles.ED) s.profiles.EXT = s.profiles.ED;
    POSITIONS.forEach(function(pos){
      var def = DEFAULT_PROFILES[pos.code];
      var cur = s.profiles[pos.code] || {};
      ATTRS.forEach(function(a){ if(typeof cur[a.key] !== 'number') cur[a.key] = def[a.key]; });
      s.profiles[pos.code] = cur;
    });
    s.activePos = normalizePos(s.activePos) || 'MCO';
    if(!Array.isArray(s.trainingSchedule)) s.trainingSchedule = [1,3,5]; // lun, mié, vie por defecto
    if(!s.trainingDays || typeof s.trainingDays !== 'object') s.trainingDays = {};
    if(['admin','profesor','visitante'].indexOf(s.role)===-1) s.role = 'admin';
    if(!s.selectedCategoria || s.categories.indexOf(s.selectedCategoria)===-1) s.selectedCategoria = s.categories[0];
    if(!s.profesorCategoria || s.categories.indexOf(s.profesorCategoria)===-1) s.profesorCategoria = s.categories[0];
    if(typeof s.enteredClub === 'undefined') s.enteredClub = null;
    if(!s.categoryLevels || typeof s.categoryLevels !== 'object') s.categoryLevels = {};
    if(!s.categoryWeights || typeof s.categoryWeights !== 'object') s.categoryWeights = {};
    if(!s.categoryProfiles || typeof s.categoryProfiles !== 'object') s.categoryProfiles = {};
    if(!s.trainingSchedules || typeof s.trainingSchedules !== 'object') s.trainingSchedules = {};
    s.players.forEach(function(p){ recomputeRating(p, s.categoryLevels, s.categoryWeights); });
    syncCategories(s.categories);
    return s;
  }catch(e){ return null; }
}

/* ============ GUARDADO SEGURO EN FIRESTORE ============ */
// Los datos se guardan en piezas separadas, cada una con su propio permiso en las reglas de Firebase:
//   club/general            categorías y perfil de exigencia predeterminado — lo lee cualquiera, lo edita solo el administrador
//   categorias/{categoría}  todo lo privado de una categoría (comentarios, asistencia, horario, exigencia, perfil propio)
//                           — solo lo leen y editan el administrador y el profesor de esa categoría
//   publico/{categoría}     lo que muestran las cartas públicas, sin comentarios privados — lo lee cualquiera
var remote = {general:null, generalMissing:false, pub:{}, priv:{}, privReady:false, privUnsub:null};
var syncedJson = {};      // lo que creemos que ya está guardado, para escribir solo lo que cambió
var pendingRebuild = false, migrating = false;
function cleanJson(o){ return JSON.parse(JSON.stringify(o)); }
function publicPlayer(p){
  var hl = recentHighlight(p.historial||[]); // el único comentario que se publica es el destacado positivo que ya se mostraba
  return {id:p.id, name:p.name, categoria:p.categoria, pos:p.pos, posExtra:p.posExtra||[], goles:p.goles||0, asistencias:p.asistencias||0,
    historial:(p.historial||[]).map(function(h){
      return {type:h.type, date:h.date, delta:h.delta, rating:h.rating, asistio:h.asistio, pos:h.pos||p.pos, quickValues:h.quickValues||{},
        attrsHit:h.attrsHit||[], goles:h.goles||0, asistencias:h.asistencias||0,
        feedback: h===hl ? (h.feedback||'') : '', comment: h===hl ? (h.comment||'') : ''};
    })};
}
function buildDocs(s){
  var docs = {};
  docs['club/general'] = cleanJson({categories:s.categories, profiles:s.profiles, v:2});
  s.categories.forEach(function(cat){
    var players = s.players.filter(function(p){ return p.categoria===cat; });
    var td = {};
    Object.keys(s.trainingDays||{}).forEach(function(k){ if(k.indexOf(cat+'::')===0) td[k.slice(cat.length+2)] = s.trainingDays[k]; });
    var level = (s.categoryLevels||{})[cat] || null;
    var weights = (s.categoryWeights||{})[cat] || null;
    docs['categorias/'+cat] = cleanJson({nombre:cat, players:players, trainingDays:td, level:level, weights:weights,
      profile:(s.categoryProfiles||{})[cat] || {}, schedule:(s.trainingSchedules||{})[cat] || null});
    docs['publico/'+cat] = cleanJson({nombre:cat, level:level, weights:weights, players:players.map(publicPlayer)});
  });
  return docs;
}
function canWriteDoc(path){
  if(!currentUser || !currentUser.role) return false;
  if(currentUser.role==='admin') return path==='club/general' || remote.privReady;
  if(currentUser.role==='profesor' && currentUser.categoria){
    return remote.privReady && (path==='categorias/'+currentUser.categoria || path==='publico/'+currentUser.categoria);
  }
  return false;
}
function syncToFirestore(){
  if(!window.db || !state) return;
  var docs = buildDocs(state);
  var batch = db.batch(), n = 0;
  Object.keys(docs).forEach(function(path){
    var js = JSON.stringify(docs[path]);
    if(syncedJson[path]===js || !canWriteDoc(path)) return;
    batch.set(db.doc(path), docs[path]); syncedJson[path] = js; n++;
  });
  if(currentUser && currentUser.role==='admin' && remote.privReady){
    Object.keys(syncedJson).forEach(function(path){ // categorías borradas o renombradas
      if(!docs[path] && /^(categorias|publico)\//.test(path)){ batch.delete(db.doc(path)); delete syncedJson[path]; n++; }
    });
  }
  if(n) batch.commit().catch(function(err){ console.error('No se pudo guardar', err); showToast('No se pudo guardar el último cambio (sin permiso o sin conexión). Recarga la página.'); });
}
function showToast(msg){
  var t = document.createElement('div');
  t.textContent = msg;
  t.style.cssText = 'position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#2a0d0d;color:#ffd7d7;border:1px solid rgba(239,106,106,.5);padding:10px 16px;border-radius:10px;font-size:13px;z-index:9999;max-width:90vw;';
  document.body.appendChild(t);
  setTimeout(function(){ t.remove(); }, 6000);
}
function isTyping(){ var a = document.activeElement; return !!(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.type!=='file'); }
function scheduleRebuild(){
  if(isTyping()){ // no reemplazar los datos mientras alguien escribe o mueve una barra; se aplica al salir del campo
    if(!pendingRebuild){
      pendingRebuild = true;
      document.addEventListener('focusout', function h(){ document.removeEventListener('focusout', h); setTimeout(function(){ pendingRebuild = false; rebuildFromRemote(); }, 0); });
    }
    return;
  }
  rebuildFromRemote();
}
function rebuildFromRemote(){
  if(!remote.general){ if(remote.generalMissing) tryMigrate(); return; }
  var g = remote.general, old = state || {};
  var s = {categories:(g.categories||[]).slice(), profiles:cleanJson(g.profiles||{}), players:[], trainingDays:{},
    categoryLevels:{}, categoryWeights:{}, categoryProfiles:{}, trainingSchedules:{},
    activePos:old.activePos, selectedCategoria:old.selectedCategoria, profesorCategoria:old.profesorCategoria, role:old.role, enteredClub:null};
  s.categories.forEach(function(cat){
    var priv = remote.priv[cat], src = priv || remote.pub[cat];
    if(!src) return;
    s.players = s.players.concat(cleanJson(src.players||[]));
    if(src.level) s.categoryLevels[cat] = src.level;
    if(src.weights) s.categoryWeights[cat] = src.weights;
    if(priv){
      Object.keys(priv.trainingDays||{}).forEach(function(d){ s.trainingDays[cat+'::'+d] = cleanJson(priv.trainingDays[d]); });
      if(priv.profile && Object.keys(priv.profile).length) s.categoryProfiles[cat] = cleanJson(priv.profile);
      if(Array.isArray(priv.schedule)) s.trainingSchedules[cat] = priv.schedule.slice();
    }
  });
  var n = normalizeState(s);
  if(!n) return;
  state = n;
  var docs = buildDocs(state);
  syncedJson = {};
  Object.keys(docs).forEach(function(path){
    var cat = path.split('/')[1];
    var exists = path==='club/general' || (path.indexOf('categorias/')===0 ? !!remote.priv[cat] : !!remote.pub[cat]);
    if(exists) syncedJson[path] = JSON.stringify(docs[path]);
  });
  safeRender();
}
// Primera vez con la estructura nueva: el administrador pasa los datos del documento único anterior a las piezas separadas
function tryMigrate(){
  if(migrating || !remote.generalMissing) return;
  if(!currentUser || currentUser.role!=='admin'){
    if(!state){ state = normalizeState({players:[], categories:[]}); safeRender(); }
    return;
  }
  migrating = true;
  db.collection('appState').doc('perfilJugador').get().then(function(doc){
    var s = doc.exists ? normalizeState(doc.data()) : null;
    if(!s){ s = freshState(); s.players = []; }
    if(Array.isArray(s.trainingSchedule)) s.categories.forEach(function(c){ if(!Array.isArray(s.trainingSchedules[c])) s.trainingSchedules[c] = s.trainingSchedule.slice(); });
    state = s;
    remote.privReady = true;
    syncedJson = {};
    syncToFirestore();
    Object.keys(photoMap).forEach(function(id){ // las fotos anotan a qué categoría pertenecen, para sus permisos
      var p = state.players.find(function(x){ return x.id===id; });
      if(p) db.collection('fotosJugadores').doc(id).set({categoria:p.categoria}, {merge:true}).catch(function(){});
    });
    migrating = false;
    safeRender();
  }).catch(function(err){ migrating = false; console.error('No se pudo migrar', err); showToast('No se pudieron pasar los datos a la nueva estructura. Recarga la página.'); });
}
function detachPrivate(){
  if(remote.privUnsub) remote.privUnsub();
  remote.privUnsub = null; remote.priv = {}; remote.privReady = false;
}
function attachPrivate(){
  detachPrivate();
  if(!currentUser || !currentUser.role) return;
  var onErr = function(err){ console.error('Sin acceso a los datos privados', err); showToast('Tu cuenta no tiene acceso a estos datos. Pide al administrador que revise tu registro.'); };
  if(currentUser.role==='admin'){
    remote.privUnsub = db.collection('categorias').onSnapshot(function(snap){
      remote.priv = {};
      snap.forEach(function(d){ remote.priv[d.id] = d.data(); });
      var first = !remote.privReady; remote.privReady = true;
      if(first || !snap.metadata.hasPendingWrites) scheduleRebuild();
    }, onErr);
  } else if(currentUser.role==='profesor' && currentUser.categoria){
    var cat = currentUser.categoria;
    remote.privUnsub = db.collection('categorias').doc(cat).onSnapshot(function(d){
      remote.priv = {};
      if(d.exists) remote.priv[cat] = d.data();
      var first = !remote.privReady; remote.privReady = true;
      if(first || !d.metadata.hasPendingWrites) scheduleRebuild();
    }, onErr);
  }
}
function persist(){
  recomputeAllRatings();
  if(window.db){ syncToFirestore(); return; }
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){} // solo sin Firebase (vista previa)
}

/* ============ HELPERS ============ */
function todayStr(){ return new Date().toISOString().slice(0,10); }
var WEEKDAYS = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
function weekdayOf(dateStr){ return new Date(dateStr+'T00:00:00').getDay(); }
function getTrainingDay(dateStr){
  var key = activeCategoria() + '::' + dateStr;
  if(!state.trainingDays[key]){
    var focus = {};
    ATTRS.forEach(function(a){ focus[a.key] = false; }); // todos apagados por defecto — el profesor marca lo que sí se trabajó
    state.trainingDays[key] = { held: null, reason:'', focus: focus, attendance: {}, finalized: false };
  }
  if(!state.trainingDays[key].attendance) state.trainingDays[key].attendance = {};
  return state.trainingDays[key];
}
function posName(code){ var p=POSITIONS.find(function(x){return x.code===code;}); return p?p.name:code; }
function fmtDate(iso){
  var d = new Date(iso+'T00:00:00');
  return d.toLocaleDateString('es-CO', {day:'2-digit', month:'short'});
}
// El perfil de exigencia y el horario son de cada categoría. Si el profesor no ha tocado una posición, se usa la del club.
function profileFor(cat, posCode){
  var ov = state.categoryProfiles && state.categoryProfiles[cat] && state.categoryProfiles[cat][posCode];
  return ov || state.profiles[posCode];
}
function scheduleFor(cat){
  state.trainingSchedules = state.trainingSchedules || {};
  if(!Array.isArray(state.trainingSchedules[cat])) state.trainingSchedules[cat] = (Array.isArray(state.trainingSchedule) ? state.trainingSchedule : [1,3,5]).slice();
  return state.trainingSchedules[cat];
}
function quickAttrsFor(posCode, focus){
  var profile = profileFor(activeCategoria(), posCode);
  return ATTRS.filter(function(a){
    if(profile[a.key] < QUICK_THRESHOLD) return false;
    if(focus && !focus[a.key]) return false; // no se trabajó ese día / no aplica
    return true;
  }).sort(function(a,b){ return profile[b.key]-profile[a.key]; });
}
function analyzeFeedback(text, posCode, skipKeys){
  var profile = profileFor(activeCategoria(), posCode);
  var lower = text.toLowerCase();
  var hits = [];
  ATTRS.forEach(function(a){
    if(skipKeys && skipKeys.indexOf(a.key)!==-1) return; // ya se calificó por atributo, no duplicar
    var words = KEYWORDS[a.key];
    var matched = words.some(function(w){ return lower.indexOf(w) !== -1; });
    if(matched){
      var weight = profile[a.key];
      var tier = weight >= 7 ? 'up' : (weight <= 3 ? 'down' : 'neutral');
      hits.push({key:a.key, label:a.label, weight:weight, tier:tier});
    }
  });
  return hits;
}
// Escalones acordados: 4 o menos ya empieza a bajar, 5 es neutro, 6/7 empieza a subir, 10 sube más.
var RATING_STEPS = {1:-2, 2:-2, 3:-1, 4:-1, 5:0, 6:1, 7:1, 8:2, 9:2, 10:3};
function baseDelta(rating){ return RATING_STEPS[rating] !== undefined ? RATING_STEPS[rating] : 0; }
function computeDelta(rating, hits, quickRatings){
  var d = baseDelta(rating);
  (quickRatings||[]).forEach(function(q){
    d += Math.round(baseDelta(q.value) * (q.weight/RATING_MAX) * 0.6);
  });
  hits.forEach(function(h){
    if(h.tier==='up') d += 1; // mención en texto de algo clave para el puesto: bono chico
    // neutral o no-clave: sin bono, para no duplicar lo que ya califican los atributos rápidos
  });
  return d;
}
