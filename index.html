/* ============ VALORACIÓN CON BARRA DE PROGRESO ============ */
// Todos arrancan en 50 y el máximo es 99. Cada sesión da progreso (asistir ya suma algo, jugar bien suma más);
// llenar la barra sube 1 punto y cada tramo de 10 cuesta más. La exigencia depende de la categoría.
// Calibrado para que en un semestre un jugador promedio llegue a ~80 y uno muy bueno pueda llegar a 99 en el año.
var VAL_MIN = 50, VAL_MAX = 99;
var XP_BASE = 10, XP_PER_DELTA = 8;        // progreso de una sesión = 10 + 8 × puntaje de la sesión
var LEVEL_COSTS = [20, 28, 37, 70, 133];    // progreso para subir 1 punto en los 50s, 60s, 70s, 80s y 90s (nivel medio)
var LEVELS = {
  infantil:    {label:'Infantil',    mult:0.7},
  medio:       {label:'Medio',       mult:1},
  competitivo: {label:'Competitivo', mult:1.35},
  maxima:      {label:'Máxima',      mult:1.8}
};
function defaultLevel(cat){
  var m = String(cat||'').match(/^sub-(\d+)$/i);
  if(!m) return 'medio';
  var n = +m[1];
  return n<=8 ? 'infantil' : (n<=12 ? 'medio' : 'competitivo');
}
function categoryLevel(cat, levels){
  levels = levels || (state && state.categoryLevels) || {};
  return LEVELS[levels[cat]] ? levels[cat] : defaultLevel(cat);
}
function levelMult(cat, levels){ return LEVELS[categoryLevel(cat, levels)].mult; }
function levelCost(v, mult){ return Math.round(LEVEL_COSTS[Math.max(0, Math.min(4, Math.floor((v-50)/10)))] * (mult||1)); }
// Tope por sesión: ni un partido espectacular ni uno malo mueven demasiado la valoración de una sola vez
var XP_CAP_UP = 45, XP_CAP_DOWN = -30;
// Qué sube más la valoración en cada categoría (lo decide su profesor)
var WEIGHT_MODES = {
  igual:    {label:'Entrenos y partidos pesan igual', entrenamiento:1,    partido:1},
  partidos: {label:'Pesan más los partidos',          entrenamiento:0.85, partido:1.5},
  entrenos: {label:'Pesan más los entrenamientos',    entrenamiento:1.15, partido:0.6}
};
function weightMode(cat, modes){
  modes = modes || (state && state.categoryWeights) || {};
  return WEIGHT_MODES[modes[cat]] ? modes[cat] : 'igual';
}
function sessionRawXp(h){
  if(!h || h.asistio===false) return 0;
  return Math.max(XP_CAP_DOWN, Math.min(XP_CAP_UP, XP_BASE + (h.delta||0) * XP_PER_DELTA));
}
function sessionXpWith(h, w){ return Math.round(sessionRawXp(h) * (h && h.type==='partido' ? w.partido : w.entrenamiento)); }
function sessionXp(h, cat, modes){ return sessionXpWith(h, WEIGHT_MODES[weightMode(cat, modes)]); }
function replayRating(entries, mult, w){
  w = w || WEIGHT_MODES.igual;
  var v = VAL_MIN, xp = 0;
  entries.slice().sort(function(a,b){ return a.date<b.date ? -1 : (a.date>b.date ? 1 : 0); }).forEach(function(h){
    xp += sessionXpWith(h, w);
    while(v<VAL_MAX && xp>=levelCost(v, mult)){ xp -= levelCost(v, mult); v++; }
    while(xp<0){ if(v<=VAL_MIN){ xp = 0; break; } v--; xp += levelCost(v, mult); }
  });
  if(v>=VAL_MAX){ v = VAL_MAX; xp = 0; }
  return {valoracion:v, xp:xp, cost:levelCost(v, mult)};
}
// la valoración siempre se recalcula desde el historial: editar, reabrir o borrar un registro queda bien solo
function recomputeRating(p, levels, weights){
  var r = replayRating(p.historial||[], levelMult(p.categoria, levels), WEIGHT_MODES[weightMode(p.categoria, weights)]);
  p.valoracion = r.valoracion; p.xp = r.xp; p.xpCost = r.cost;
}
function recomputeAllRatings(){ if(state && Array.isArray(state.players)) state.players.forEach(function(p){ recomputeRating(p, state.categoryLevels, state.categoryWeights); }); }
function ratingBefore(p, dateStr){ return replayRating((p.historial||[]).filter(function(h){ return h.date < dateStr; }), levelMult(p.categoria), WEIGHT_MODES[weightMode(p.categoria)]).valoracion; }
// Nivel de la carta según la valoración: bronce, plata, oro y la especial Élite (90+)
var TIERS = [
  {id:'bronce', label:'Bronce', min:0},
  {id:'plata',  label:'Plata',  min:65},
  {id:'oro',    label:'Oro',    min:75},
  {id:'elite',  label:'Élite',  min:90}
];
function tierOf(v){ var t = TIERS[0]; TIERS.forEach(function(x){ if(v>=x.min) t = x; }); return t; }
var BOLT_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.5 1.5 4 13.2h6.2L9 22.5l10-12.2h-6.3z"/></svg>';
function xpBar(p){
  if(p.valoracion>=VAL_MAX) return '<div class="xp"><div class="xp-bar"><i style="width:100%"></i></div><div class="xp-txt">Valoración máxima</div></div>';
  var pct = Math.max(0, Math.min(100, Math.floor((p.xp||0) / (p.xpCost||levelCost(p.valoracion, levelMult(p.categoria))) * 100)));
  return '<div class="xp"><div class="xp-bar"><i style="width:' + pct + '%"></i></div><div class="xp-txt">' + pct + '% hacia ' + (p.valoracion+1) + '</div></div>';
}

/* ============ FOTOS DE JUGADORES ============ */
// Cada foto va en su propio documento (colección fotosJugadores/{id del jugador}), comprimida a 320x320,
// así no engorda el documento principal ni hace falta Firebase Storage.
var photoMap = {};
function initialsOf(name){
  var n = String(name||'').trim();
  if(/^Jugador \d+$/.test(n)) return '#' + n.split(' ')[1];
  var w = n.split(/\s+/);
  return (((w[0]||'')[0]||'') + ((w[1]||'')[0]||'')).toUpperCase();
}
function avatarInner(p){ var src = photoMap[p.id]; return src ? '<img src="' + src + '" alt="" />' : escHtml(initialsOf(p.name)); }
function compressPhoto(file, size){
  size = size || 480; // más resolución porque ahora la foto ocupa casi toda la carta
  return new Promise(function(resolve, reject){
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function(){
      var s = Math.min(img.naturalWidth, img.naturalHeight);
      var sx = (img.naturalWidth - s) / 2;
      var sy = (img.naturalHeight - s) / 2 * 0.5; // en fotos verticales recorta más abajo que arriba, para no cortar la cabeza
      var c = document.createElement('canvas'); c.width = size; c.height = size;
      c.getContext('2d').drawImage(img, sx, sy, s, s, 0, 0, size, size);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = function(){ URL.revokeObjectURL(url); reject(new Error('No se pudo abrir la imagen')); };
    img.src = url;
  });
}
function savePhoto(playerId, dataUrl){
  photoMap[playerId] = dataUrl;
  var owner = state && state.players.find(function(x){ return x.id===playerId; });
  if(window.db) return db.collection(clubPath('fotos')).doc(playerId).set({data:dataUrl, categoria: owner ? owner.categoria : '', actualizada:Date.now()});
  return Promise.resolve();
}
function deletePhoto(playerId){
  delete photoMap[playerId];
  if(window.db) db.collection(clubPath('fotos')).doc(playerId).delete().catch(function(){});
}
// "juan-esteban-ortiz.jpg", "Ortiz Juan.png" o "umbria.jpeg" -> el jugador que corresponde (o null si hay duda)
function matchPhotoToPlayer(fileName, players){
  var tokens = nameKey(String(fileName).replace(/\.[^.]+$/,'').replace(/[_\-.]+/g,' ')).split(' ')
    .filter(function(t){ return t.length>1 && !/^\d+$/.test(t) && ['img','foto','wa','jpg','jpeg','png'].indexOf(t)===-1; });
  if(!tokens.length) return null;
  var best = null, bestScore = 0, tie = false;
  players.forEach(function(p){
    var pt = nameKey(p.name).split(' ');
    var score = tokens.filter(function(t){ return pt.indexOf(t)!==-1; }).length;
    if(score > bestScore){ best = p; bestScore = score; tie = false; }
    else if(score && score===bestScore){ tie = true; }
  });
  if(tie || !best) return null;
  if(bestScore>=2 || (bestScore===1 && tokens.length===1)) return best;
  return null;
}

/* ============ RENDER: PLANTEL Y CATEGORÍAS (solo administrador) ============ */
function escHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function toTitleName(raw){
  var small = ['de','del','la','las','los','y'];
  return String(raw||'').trim().replace(/\s+/g,' ').toLowerCase().split(' ').map(function(w,i){
    if(i>0 && small.indexOf(w)!==-1) return w;
    return w.charAt(0).toUpperCase() + w.slice(1);
  }).join(' ');
}
function normalizeCategoryName(raw){
  var t = String(raw||'').trim().replace(/\//g,'-').replace(/\s+/g,' ');
  var m = t.match(/^sub[\s\-_]*(\d{1,2})$/i);
  return m ? 'Sub-' + m[1] : t;
}
function nameKey(n){ return String(n||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim(); }
function newPlayerId(){ return 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function makePlayer(name, pos, categoria){
  return {id:newPlayerId(), name:name, categoria:categoria, pos:pos, goles:0, asistencias:0, valoracion:VAL_MIN, xp:0, xpCost:levelCost(VAL_MIN, levelMult(categoria)), historial:[]};
}
function posOrder(code){ var i = POSITIONS.map(function(p){return p.code;}).indexOf(code); return i===-1 ? 99 : i; }
function posOptions(selected, withEmpty){
  return (withEmpty ? '<option value=""' + (selected?'':' selected') + '>— elegir —</option>' : '') +
    POSITIONS.map(function(p){ return '<option value="' + p.code + '"' + (p.code===selected?' selected':'') + '>' + p.name + '</option>'; }).join('');
}

// "LI/EX", "LI - EX", "LI, EX" o "lateral izquierdo y extremo" -> ['LI','EXT'] (la primera es la principal)
function splitPositions(raw){
  var s = String(raw||'').trim();
  if(!s) return [];
  var whole = normalizePos(s);
  var parts = s.split(/\s*[\/,;\-]\s*|\s+y\s+/i).map(normalizePos).filter(Boolean);
  if(parts.length<=1 && whole) parts = [whole];
  return parts.filter(function(c, i, a){ return a.indexOf(c)===i; });
}
// Texto como llega por WhatsApp: "SUB 11" como encabezado y "• NOMBRE (PT)" por jugador
function parseRosterText(text){
  var out = {categoria:null, rows:[]};
  String(text||'').split(/\r?\n/).forEach(function(line){
    var l = line.replace(/^[\s\u2022\u00b7\-\*\u2013\u2014]+/, '').replace(/^\d+\s*[\.\)\-]\s*/, '').trim();
    if(!l) return;
    var catM = l.match(/^sub[\s\-_]*(\d{1,2})\s*:?$/i);
    if(catM){ out.categoria = 'Sub-' + catM[1]; return; }
    var m = l.match(/^(.*?)\s*[\(\[]\s*([^\)\]]{1,20})\s*[\)\]]\s*$/) || l.match(/^(.*?)\s+[\-\u2013\u2014:]\s+([A-Za-z\u00c0-\u017f ]{1,20})$/);
    var name = (m ? m[1] : l).replace(/[\s\-\u2013\u2014:,]+$/,'').trim();
    var posRaw = m ? m[2].trim() : '';
    if(!name) return;
    var pp = splitPositions(posRaw);
    out.rows.push({name: toTitleName(name), posRaw: posRaw, pos: pp[0] || null, posExtra: pp.slice(1), categoria: null});
  });
  return out;
}
// Filas de Excel/CSV: columnas Nombre (o Jugador), Posición y, opcional, Categoría
function parseRosterSheet(rows){
  var out = {categoria:null, rows:[]};
  rows.forEach(function(r){
    var keys = Object.keys(r);
    function pick(prefixes){
      for(var i=0;i<keys.length;i++){
        var k = nameKey(keys[i]);
        if(prefixes.some(function(p){ return k.indexOf(p)===0; })) return r[keys[i]];
      }
      return '';
    }
    var name = String(pick(['nombre','jugador','name'])||'').trim();
    if(!name) return;
    var posRaw = String(pick(['pos'])||'').trim();
    var cat = String(pick(['categ'])||'').trim();
    var pp = splitPositions(posRaw);
    out.rows.push({name: toTitleName(name), posRaw: posRaw, pos: pp[0] || null, posExtra: pp.slice(1), categoria: cat ? normalizeCategoryName(cat) : null});
  });
  return out;
}

function renameCategory(oldName, newName){
  var i = state.categories.indexOf(oldName);
  if(i===-1) return;
  state.categories[i] = newName;
  if(state.categoryLevels && state.categoryLevels[oldName]){ state.categoryLevels[newName] = state.categoryLevels[oldName]; delete state.categoryLevels[oldName]; }
  if(state.categoryWeights && state.categoryWeights[oldName]){ state.categoryWeights[newName] = state.categoryWeights[oldName]; delete state.categoryWeights[oldName]; }
  state.players.forEach(function(p){ if(p.categoria===oldName) p.categoria = newName; });
  Object.keys(state.trainingDays).forEach(function(k){
    if(k.indexOf(oldName+'::')===0){ state.trainingDays[newName + k.slice(oldName.length)] = state.trainingDays[k]; delete state.trainingDays[k]; }
  });
  if(state.selectedCategoria===oldName) state.selectedCategoria = newName;
  if(state.profesorCategoria===oldName) state.profesorCategoria = newName;
  if(visitorCategoria===oldName) visitorCategoria = newName;
  // los profesores asignados a esa categoría la siguen teniendo con el nombre nuevo
  if(window.db){
    db.collection('staff').where('club','==',sessionEnteredClub).where('categoria','==',oldName).get().then(function(snap){
      snap.forEach(function(d){ d.ref.update({categoria:newName}); });
    }).catch(function(){});
  }
}
function deleteCategory(name){
  if(state.categoryLevels) delete state.categoryLevels[name];
  if(state.categoryWeights) delete state.categoryWeights[name];
  state.players.forEach(function(p){ if(p.categoria===name) deletePhoto(p.id); });
  state.categories = state.categories.filter(function(c){ return c!==name; });
  state.players = state.players.filter(function(p){ return p.categoria!==name; });
  Object.keys(state.trainingDays).forEach(function(k){ if(k.indexOf(name+'::')===0) delete state.trainingDays[k]; });
  if(state.selectedCategoria===name) state.selectedCategoria = state.categories[0];
  if(state.profesorCategoria===name) state.profesorCategoria = state.categories[0];
}
function sortCategories(list){
  function num(c){ var m = String(c).match(/^sub-(\d+)$/i); return m ? +m[1] : 999; }
  return list.slice().sort(function(a,b){ return num(a)-num(b) || a.localeCompare(b); });
}
function commitPlantel(){ state.categories = sortCategories(state.categories); syncCategories(state.categories); persist(); render(); }
// Cupos de jugadores que el Creador le asignó al club (el Creador no tiene límite)
function cuposRestantes(){
  var c = currentClub();
  if(!c || !c.cupos || isCreador()) return Infinity;
  return Math.max(0, c.cupos - state.players.length);
}

      });
      drawPreview();
    };
    previewBox.querySelector('#plCancel').onclick = function(){ plantelUi.preview = null; drawPreview(); };
    previewBox.querySelector('#plConfirm').onclick = function(){
      var added = 0, skipped = 0, cats = {}, libres = cuposRestantes();
      pv.rows.forEach(function(r){
        var nm = toTitleName(r.name);
        if(!r.include || !r.pos || !nm) return;
        if(added >= libres){ skipped++; return; } // sin cupos disponibles
        var cat = r.categoria || pv.target;
        if(state.categories.indexOf(cat)===-1) state.categories.push(cat);
        var np = makePlayer(nm, r.pos, cat);
        np.posExtra = (r.posExtra||[]).filter(function(c){ return c!==r.pos; });
        state.players.push(np);
        cats[cat] = true; added++;
      });
      var catList = Object.keys(cats);
      plantelUi.preview = null;
      plantelUi.pasted = '';
      plantelUi.cat = catList[0] || plantelUi.cat;
      plantelUi.msg = 'Listo: se agregaron ' + added + ' jugador' + (added===1?'':'es') + (catList.length ? ' a ' + catList.join(', ') : '') + '.' + (skipped ? ' ' + skipped + ' no se agregaron porque se acabaron los cupos del club; pide más cupos a Arena Sports.' : '');
      plantelUi.msgErr = skipped > 0;
      commitPlantel();
    };
    refreshCount();
  }
  el.querySelector('#plReview').onclick = function(){ showPreview(parseRosterText(pasteBox.value)); };
  el.querySelector('#plFile').onchange = function(e){
    var file = e.target.files && e.target.files[0];
    if(!file) return;
    if(!window.XLSX){ plantelUi.preview = null; previewBox.innerHTML = '<div class="pl-msg err">No se pudo cargar el lector de Excel. Revisa tu conexión y recarga la página, o pega la lista como texto.</div>'; return; }
    var reader = new FileReader();
    reader.onload = function(ev){
      try{
        var wb = XLSX.read(new Uint8Array(ev.target.result), {type:'array'});
        var sheet = wb.Sheets[wb.SheetNames[0]];
        showPreview(parseRosterSheet(XLSX.utils.sheet_to_json(sheet, {defval:''})));
      }catch(err){
        previewBox.innerHTML = '<div class="pl-msg err">No pude leer ese archivo. Asegúrate de que la primera fila tenga los títulos Nombre y Posición.</div>';
      }
    };
    reader.readAsArrayBuffer(file);
    e.target.value = '';
  };
  el.querySelector('#plTemplate').onclick = function(){
    var csv = '\uFEFFNombre,Posición,Categoría\nJuan Esteban Ortiz,PT,Sub-11\nMatías Caceres,DF,Sub-11\n';
    var blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'plantilla-jugadores.csv';
    document.body.appendChild(a); a.click(); a.remove();
  };
  drawPreview();

  // ---------- jugadores de la categoría ----------
  var catSel = el.querySelector('#plCatSel');
  catSel.innerHTML = myCats.map(function(c){ return '<option value="' + escHtml(c) + '"' + (c===plantelUi.cat?' selected':'') + '>' + escHtml(c) + '</option>'; }).join('');
  catSel.onchange = function(){ plantelUi.cat = catSel.value; drawRoster(); };
  el.querySelector('#plAddOne').onclick = function(){
    var nm = toTitleName(el.querySelector('#plOneName').value);
    var pos = el.querySelector('#plOnePos').value;
    if(!nm || !pos || !plantelUi.cat){ window.alert('Escribe el nombre y elige la posición.'); return; }
    if(cuposRestantes() <= 0){ window.alert('Tu club ya usó todos sus cupos (' + currentClub().cupos + ' jugadores). Para agregar más, pide más cupos a Arena Sports.'); return; }
    state.players.push(makePlayer(nm, pos, plantelUi.cat));
    commitPlantel();
  };
  var rosterBox = el.querySelector('#plRoster');
  function drawRoster(){
    var list = state.players.filter(function(p){ return p.categoria===plantelUi.cat; })
      .sort(function(a,b){ return posOrder(a.pos)-posOrder(b.pos) || a.name.localeCompare(b.name); });
    el.querySelector('#plCount').textContent = list.length + ' jugador' + (list.length===1?'':'es');
    if(!list.length){ rosterBox.innerHTML = '<div class="pl-summary">Todavía no hay jugadores en esta categoría.</div>'; return; }
    rosterBox.innerHTML = '<table class="pl-table"><thead><tr><th>Foto</th><th>Nombre</th><th>Posición</th><th>Registros</th><th></th></tr></thead><tbody>' +
      list.map(function(p){
        return '<tr data-id="' + escHtml(p.id) + '"><td><label class="pl-thumb" title="Subir o cambiar foto" style="cursor:pointer;">' + avatarInner(p) + '<input type="file" accept="image/*" data-f="photo" style="display:none;" /></label></td><td><input data-f="name" value="' + escHtml(p.name) + '" /></td>' +
          '<td><select data-f="pos">' + posOptions(p.pos, false) + '</select>' +
            '<div class="pl-pos2">' + (p.posExtra||[]).map(function(c){ return '<span class="pl-chip" data-rm="' + c + '" title="Quitar">' + escHtml(posName(c)) + ' ✕</span>'; }).join('') +
            '<select data-f="addpos"><option value="">+ otra posición</option>' + POSITIONS.filter(function(x){ return x.code!==p.pos && (p.posExtra||[]).indexOf(x.code)===-1; }).map(function(x){ return '<option value="' + x.code + '">' + x.name + '</option>'; }).join('') + '</select></div></td>' +
          '<td class="pl-count">' + p.historial.length + '</td>' +
          '<td><button class="pl-btn danger small" data-f="del">Quitar</button></td></tr>';
      }).join('') + '</tbody></table>';
    rosterBox.querySelectorAll('tr[data-id]').forEach(function(tr){
      var id = tr.getAttribute('data-id');
      var p = state.players.find(function(x){ return x.id===id; });
      tr.querySelector('[data-f="name"]').onchange = function(e){
        var nm = toTitleName(e.target.value);
        if(!nm){ e.target.value = p.name; return; }
        p.name = nm; e.target.value = nm; persist();
      };
      tr.querySelector('[data-f="pos"]').onchange = function(e){ p.pos = e.target.value; p.posExtra = (p.posExtra||[]).filter(function(c){ return c!==p.pos; }); persist(); drawRoster(); };
      tr.querySelector('[data-f="addpos"]').onchange = function(e){ if(!e.target.value) return; p.posExtra = (p.posExtra||[]).concat([e.target.value]); persist(); drawRoster(); };
      tr.querySelectorAll('[data-rm]').forEach(function(ch){
        ch.onclick = function(){ var c = ch.getAttribute('data-rm'); p.posExtra = (p.posExtra||[]).filter(function(x){ return x!==c; }); persist(); drawRoster(); };
      });
      tr.querySelector('[data-f="photo"]').onchange = function(e){
        var f = e.target.files && e.target.files[0];
        if(!f) return;
        compressPhoto(f).then(function(url){ return savePhoto(id, url); }).then(function(){ drawRoster(); })
          .catch(function(err){ window.alert('No se pudo guardar la foto (' + (err && err.message ? err.message : 'error') + '). Si es una foto de iPhone en formato HEIC, mándatela por WhatsApp y descárgala de ahí, que llega como JPG.'); });
      };
      tr.querySelector('[data-f="del"]').onclick = function(){
        if(!window.confirm('¿Quitar a ' + p.name + ' del plantel?' + (p.historial.length ? ' Se borran también sus ' + p.historial.length + ' registros.' : ''))) return;
        state.players = state.players.filter(function(x){ return x.id!==id; });
        deletePhoto(id);
        persist(); drawRoster();
      };
    });
  }
  drawRoster();

  // ---------- fotos en lote ----------
  var photoPrev = el.querySelector('#plPhotoPreview');
  el.querySelector('#plPhotos').onchange = function(e){
    var files = Array.prototype.slice.call(e.target.files || []);
    e.target.value = '';
    if(!files.length) return;
    var players = state.players.filter(function(p){ return p.categoria===plantelUi.cat; });
    photoPrev.innerHTML = '<div class="pl-summary">Preparando ' + files.length + ' foto' + (files.length===1?'':'s') + '…</div>';
    var items = [];
    files.reduce(function(chain, f){
      return chain.then(function(){
        return compressPhoto(f).then(function(url){
          var m = matchPhotoToPlayer(f.name, players);
          items.push({file:f.name, url:url, playerId: m ? m.id : '', auto: !!m});
        }).catch(function(){ items.push({file:f.name, url:null, playerId:'', auto:false}); });
      });
    }, Promise.resolve()).then(function(){
      var used = {}; // si dos fotos apuntan al mismo jugador, solo la primera queda asignada
      items.forEach(function(it){ if(it.playerId){ if(used[it.playerId]){ it.playerId = ''; it.auto = false; } else used[it.playerId] = true; } });
      drawPhotoPreview(items, players);
    });
  };
  function drawPhotoPreview(items, players){
    var sorted = players.slice().sort(function(a,b){ return a.name.localeCompare(b.name); });
    function opts(sel){
      return '<option value="">— no asignar —</option>' + sorted.map(function(p){
        return '<option value="' + escHtml(p.id) + '"' + (p.id===sel?' selected':'') + '>' + escHtml(p.name) + (photoMap[p.id]?' (ya tiene foto)':'') + '</option>';
      }).join('');
    }
    photoPrev.innerHTML = '<table class="pl-table"><thead><tr><th>Foto</th><th>Archivo</th><th>Jugador de ' + escHtml(plantelUi.cat) + '</th></tr></thead><tbody>' +
      items.map(function(it, i){
        return '<tr data-i="' + i + '"><td><div class="pl-thumb">' + (it.url ? '<img src="' + it.url + '" alt="" />' : '?') + '</div></td>' +
          '<td class="pl-count">' + escHtml(it.file) + ' ' + (it.url ? (it.auto ? '<span class="pl-status ok">asignada sola</span>' : '<span class="pl-status warn">elige el jugador</span>') : '<span class="pl-status warn">no se pudo abrir</span>') + '</td>' +
          '<td>' + (it.url ? '<select data-f="pl">' + opts(it.playerId) + '</select>' : '') + '</td></tr>';
      }).join('') + '</tbody></table>' +
      '<div class="pl-inline"><button class="pl-btn" id="plSavePhotos"></button><button class="pl-btn ghost" id="plCancelPhotos">Cancelar</button></div>';
    function refresh(){
      var n = items.filter(function(it){ return it.url && it.playerId; }).length;
      var b = photoPrev.querySelector('#plSavePhotos');
      b.textContent = 'Guardar ' + n + ' foto' + (n===1?'':'s');
      b.disabled = !n;
    }
    photoPrev.querySelectorAll('select[data-f="pl"]').forEach(function(sel){
      sel.onchange = function(){ items[+sel.closest('tr').getAttribute('data-i')].playerId = sel.value; refresh(); };
    });
    photoPrev.querySelector('#plCancelPhotos').onclick = function(){ photoPrev.innerHTML = ''; };
    photoPrev.querySelector('#plSavePhotos').onclick = function(){
      var todo = items.filter(function(it){ return it.url && it.playerId; });
      var btn = photoPrev.querySelector('#plSavePhotos');
      btn.disabled = true; btn.textContent = 'Guardando…';
      Promise.all(todo.map(function(it){ return savePhoto(it.playerId, it.url); })).then(function(){
        photoPrev.innerHTML = '<div class="pl-msg">Listo: se guardaron ' + todo.length + ' foto' + (todo.length===1?'':'s') + '.</div>';
        drawRoster();
      }).catch(function(err){
        photoPrev.insertAdjacentHTML('beforeend', '<div class="pl-msg err">No se pudieron guardar todas: ' + escHtml(err && err.message) + '</div>');
        btn.disabled = false; btn.textContent = 'Reintentar';
      });
    };
    refresh();
  }
  return el;
}

function safeRender(){
  try{ render(); }catch(e){ showBrokenDataScreen(); }
}

document.getElementById('landingRoot').innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--ink-faint);font-size:13px;">Cargando…</div>';
document.getElementById('landingRoot').style.display = 'block';

if(window.firebase && window.FIREBASE_CONFIG){
  try{
    firebase.initializeApp(window.FIREBASE_CONFIG);
    window.db = firebase.firestore();
    window.auth = firebase.auth();
    try{ localStorage.removeItem(STORAGE_KEY); }catch(e){} // con Firebase no se guardan copias locales de datos privados
    // App Check: bloquea pedidos que no vengan de esta página (se activa al pegar la clave de reCAPTCHA arriba)
    if(window.APPCHECK_SITE_KEY && firebase.appCheck){
      try{ firebase.appCheck().activate(window.APPCHECK_SITE_KEY, true); }catch(e){ console.error('App Check no se pudo activar', e); }
    }

    // Lista de clubes de la plataforma (pública: la página de inicio la necesita)
    db.collection('clubes').onSnapshot(function(snap){
      CLUBS = [];
      snap.forEach(function(d){ CLUBS.push(Object.assign({id:d.id}, d.data())); });
      CLUBS.sort(function(a,b){ return String(a.nombre).localeCompare(String(b.nombre)); });
      clubsLoaded = true;
      if(isCreador() && !CLUBS.some(function(c){ return c.id===DEFAULT_CLUB_ID; })) migrateToMultiClub();
      if(sessionEnteredClub) applyClubTheme(currentClub());
      if(!isTyping()) safeRender();
    }, function(err){ console.error('No se pudo leer la lista de clubes', err); clubsLoaded = true; safeRender(); });

    function afterAuthChange(){
      authReady = true;
      if(staffMode && staffRedirect()) return;
      if(isCreador() && clubsLoaded && !CLUBS.some(function(c){ return c.id===DEFAULT_CLUB_ID; })) migrateToMultiClub();
      if(sessionEnteredClub){ attachPrivate(); attachPhotos(); scheduleRebuild(); }
      safeRender();
    }
    auth.onAuthStateChanged(function(user){
      detachPrivate();
      if(user){
        var prov = (user.providerData && user.providerData[0] && user.providerData[0].providerId) || 'password';
        db.collection('staff').doc(user.email.toLowerCase()).get().then(function(doc){
          var d = doc.exists ? doc.data() : null;
          currentUser = {email:user.email, role: d ? d.role : null, categoria: d ? d.categoria : null, club: d ? (d.club || null) : null};
          if(d && !d.modo) doc.ref.update({modo:prov}).catch(function(){}); // cuentas anteriores: anotar con qué método entran
          afterAuthChange();
        }).catch(function(){
          currentUser = {email:user.email, role:null, categoria:null, club:null};
          afterAuthChange();
        });
      } else {
        currentUser = null;
        afterAuthChange(); // vuelve a mostrar solo lo público
      }
    });
    routeFromHash(); // si el enlace trae #/club, se abre directo ese club
    safeRender();
  }catch(e){
    console.error('Firebase no se pudo inicializar, usando solo almacenamiento local', e);
    bootFromLocalOrFresh();
    safeRender();
  }
} else {
  bootFromLocalOrFresh();
  safeRender();
}
})();
</script>
</body>
</html>
