.ch-ev-list .n{font-weight:800;font-size:16px}
.ch-ev-list p{margin:0;opacity:.85;line-height:1.45}
.mj-av{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:16px 18px;border-radius:18px;margin:0 0 18px;
  border:1px solid rgba(193,248,7,.3);background:linear-gradient(120deg,rgba(193,248,7,.09),rgba(255,255,255,.02) 65%)}
.mj-av.on{border-color:rgba(47,227,122,.35);background:linear-gradient(120deg,rgba(47,227,122,.1),rgba(255,255,255,.02) 65%)}
.mj-av .t{flex:1;min-width:200px}
.mj-av b{display:block;font-size:15px;margin-bottom:3px}
.mj-av.on b{color:#2fe37a}
.mj-av span{display:block;font-size:12.5px;opacity:.65;line-height:1.45}
.mj-av input{margin-top:10px;width:100%;max-width:220px;padding:10px 12px;border-radius:11px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.05);
  color:inherit;font:inherit;font-size:15px;font-weight:700;letter-spacing:3px;text-transform:uppercase}
.mj-av input::placeholder{letter-spacing:0;text-transform:none;font-weight:400;font-size:14px}
.mj-av em{display:block;font-style:normal;font-size:12.5px;color:#ff8f7a;margin-top:6px}
.mj-av em:empty{display:none}
.mj-av-btn{padding:11px 18px;border-radius:12px;border:0;background:#c1f807;color:#0a0f02;font:inherit;font-weight:800;font-size:14px;cursor:pointer}
.mj-av.on .mj-av-btn{background:transparent;color:inherit;border:1px solid rgba(255,255,255,.18);font-weight:600;opacity:.75}
#senalBar{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 10px);transform:translate(-50%,-160%);z-index:9998;
  display:flex;align-items:center;gap:9px;width:max-content;max-width:calc(100vw - 32px);box-sizing:border-box;padding:10px 16px;border-radius:14px;font-size:13px;font-weight:600;line-height:1.35;
  background:#2a2410;color:#f2c94c;border:1px solid rgba(242,201,76,.4);box-shadow:0 10px 30px rgba(0,0,0,.45);transition:transform .35s cubic-bezier(.2,1.2,.4,1)}
#senalBar.on{transform:translate(-50%,0)}
#senalBar i{flex:none;width:8px;height:8px;border-radius:50%;background:currentColor}
#senalBar.off i{animation:senalPulso 1.4s ease-in-out infinite}
#senalBar.sube{background:#0f1a2e;color:#9cc3ff;border-color:rgba(156,195,255,.35)}
#senalBar.ok{background:#0b2216;color:#2fe37a;border-color:rgba(47,227,122,.35)}
@keyframes senalPulso{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){#senalBar{transition:none}#senalBar.off i{animation:none}}
.msg{display:flex;flex-direction:column;gap:12px;margin:0 0 14px}
.ch-hero .msg{grid-column:1/-1;margin:4px 0 0}
.msg-last{position:relative;padding:16px 18px;border-radius:16px;overflow:hidden;
  background:linear-gradient(125deg,rgba(193,248,7,.12),rgba(193,248,7,.03) 55%,rgba(255,255,255,.02));border:1px solid rgba(193,248,7,.28)}
.msg-h{display:flex;align-items:center;gap:10px;margin-bottom:6px;white-space:nowrap}
.msg-k{font-family:'Oswald',sans-serif;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#c1f807;display:flex;align-items:center;gap:7px}
.msg-k::before{content:"";width:7px;height:7px;border-radius:50%;background:#c1f807;box-shadow:0 0 10px #c1f807}
.msg-t{font-size:12px;opacity:.55}
.msg-last p{margin:0;font-size:15.5px;line-height:1.5;font-weight:500;white-space:pre-line}
.msg-del{margin-left:auto;background:transparent;border:0;color:inherit;opacity:.5;font:inherit;font-size:12px;cursor:pointer;padding:2px 4px}
.msg-del.ok{opacity:1;color:#ff8f7a}
.msg-new{align-self:flex-start;padding:10px 16px;border-radius:12px;border:1px dashed rgba(193,248,7,.45);background:transparent;color:#c1f807;font:inherit;font-weight:700;font-size:13.5px;cursor:pointer}
.msg-form{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1)}
.msg-form[hidden]{display:none}
.msg-chips{display:flex;flex-wrap:wrap;gap:6px}
.msg-chips button{padding:6px 11px;border-radius:99px;border:1px solid rgba(255,255,255,.16);background:transparent;color:inherit;font:inherit;font-size:12.5px;cursor:pointer}
.msg-chips button:hover{border-color:#c1f807;color:#c1f807}
.msg-form textarea{width:100%;box-sizing:border-box;resize:vertical;padding:11px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:rgba(0,0,0,.25);color:inherit;font:inherit;font-size:15px;line-height:1.45}
.msg-form textarea:focus{outline:none;border-color:#c1f807}
.msg-foot{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

.msg-err{font-style:normal;font-size:12.5px;color:#ff8f7a}
.msg-send{margin-left:auto;padding:10px 18px;border-radius:12px;border:0;background:#c1f807;color:#0a0f02;font:inherit;font-weight:800;font-size:14px;cursor:pointer}
.msg-send:disabled{opacity:.6;cursor:default}
.msg-nota{font-size:12px;opacity:.5}
/* ================= FASE 2: carta especial, sobre, destacados, insignias ================= */
.f2-card{--w:200px;--a:#fff1b3;--b:#e2b44a;--c:#8a5d12;--ink:#2b1c03;--sub:#5e3f07;--glow:rgba(247,210,100,.55);
  width:var(--w);aspect-ratio:3/4.35;position:relative;flex:none;filter:drop-shadow(0 14px 30px rgba(0,0,0,.55)) drop-shadow(0 0 24px var(--glow))}
.f2-card .sh,.f2-card .ho{position:absolute;inset:0;clip-path:polygon(9% 0,91% 0,100% 6%,100% 87%,50% 100%,0 87%,0 6%)}
.f2-card .sh{background:linear-gradient(160deg,var(--a) 0%,var(--b) 45%,var(--c) 100%)}
.f2-card .sh::before{content:"";position:absolute;inset:3.2%;clip-path:inherit;background:radial-gradient(120% 70% at 30% 10%,rgba(255,255,255,.45),transparent 55%),linear-gradient(160deg,var(--a),var(--b) 60%,var(--c));opacity:.92}
.f2-card .sh::after{content:"";position:absolute;inset:0;clip-path:inherit;background:repeating-linear-gradient(118deg,transparent 0 14px,rgba(255,255,255,.07) 14px 15px)}
.f2-card .ho{background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.5) 45%,transparent 60%);background-size:250% 100%;mix-blend-mode:overlay;animation:f2holo 3.6s cubic-bezier(.45,0,.55,1) infinite}
@keyframes f2holo{0%{background-position:120% 0}60%,100%{background-position:-60% 0}}
.f2-card .in{position:absolute;inset:0;color:var(--ink)}
.f2-card .tp{position:absolute;left:10%;top:9%;display:flex;flex-direction:column;align-items:center;line-height:.85;z-index:2}
.f2-card .ov{font-family:'Oswald',sans-serif;font-weight:700;font-size:calc(var(--w)*.22);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.f2-card .ps{font-family:'Oswald',sans-serif;font-weight:600;font-size:calc(var(--w)*.08);margin-top:3px}
.f2-card .cr{width:calc(var(--w)*.14);height:calc(var(--w)*.14);border-radius:50%;margin-top:calc(var(--w)*.035);overflow:hidden;background:#0b1222;box-shadow:0 0 0 2px rgba(255,255,255,.55)}
.f2-card .cr img{width:100%;height:100%;object-fit:cover;display:block}
.f2-card .tg{position:absolute;right:9%;top:10%;font-family:'Oswald',sans-serif;font-weight:600;font-size:calc(var(--w)*.05);letter-spacing:.1em;padding:.15em .65em;border-radius:99px;border:1.5px solid currentColor;color:var(--sub);z-index:2;text-transform:uppercase}
.f2-card .ph{position:absolute;left:24%;right:6%;top:14%;height:45%;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.f2-card .ph img{width:100%;height:100%;object-fit:cover;object-position:50% 20%;-webkit-mask:linear-gradient(#000 70%,transparent);mask:linear-gradient(#000 70%,transparent)}
.f2-card .ph svg{width:86%;height:auto;fill:var(--sub);opacity:.5}
.f2-card .nm{position:absolute;left:12%;right:12%;top:58.5%;text-align:center;font-family:'Oswald',sans-serif;font-weight:700;font-size:calc(var(--w)*.1);text-transform:uppercase;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.f2-card .rl{position:absolute;left:18%;right:18%;top:68%;height:1.5px;background:currentColor;opacity:.3}
/* los cuatro números en una sola fila, lejos de la punta de la carta */
.f2-card .st{position:absolute;left:14%;right:14%;top:70.5%;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));font-family:'Oswald',sans-serif;font-variant-numeric:tabular-nums}
.f2-card .st span{display:flex;flex-direction:column;align-items:center;line-height:1;min-width:0;position:relative}
.f2-card .st span+span::before{content:"";position:absolute;left:0;top:12%;bottom:12%;width:1px;background:currentColor;opacity:.2}
.f2-card .st b{font-weight:700;font-size:calc(var(--w)*.082)}
.f2-card .st i{font-style:normal;font-weight:500;font-size:calc(var(--w)*.04);letter-spacing:.05em;opacity:.72;margin-top:calc(var(--w)*.012)}
.f2-card.bronce{--a:#f0b98a;--b:#b8743f;--c:#5c3216;--ink:#2d1606;--sub:#5d3015;--glow:rgba(222,140,80,.4)}
.f2-card.plata{--a:#fff;--b:#c6ced9;--c:#727e8e;--ink:#18202c;--sub:#3e4859;--glow:rgba(220,230,245,.4)}
.f2-card.dk .sh::before{opacity:1}
.f2-card.dk .ph svg{opacity:.32}
.f2-card.elite{--ink:#f4ffd0;--sub:#c1f807;--glow:rgba(193,248,7,.45)}
.f2-card.elite .sh{background:linear-gradient(160deg,#c1f807,#2fe3c9 40%,#5b6cff 75%,#c1f807)}
.f2-card.elite .sh::before{background:radial-gradient(90% 60% at 50% 0%,rgba(193,248,7,.28),transparent 60%),linear-gradient(170deg,#121c36,#060a14)}
.f2-card.elite .ph svg{fill:#c1f807}
.f2-card.tots{--ink:#f6d98a;--sub:#f6d98a;--glow:rgba(246,217,138,.45)}
.f2-card.tots .sh{background:linear-gradient(160deg,#fff1b3,#d9a93e 50%,#7a5212)}
.f2-card.tots .sh::before{background:radial-gradient(90% 60% at 50% 0%,rgba(246,217,138,.22),transparent 60%),linear-gradient(170deg,#161a26,#04060b)}
.f2-card.tots .ph svg{fill:#f6d98a}
.f2-card.jds{--ink:#fff;--sub:#c1f807;--glow:rgba(193,248,7,.5)}
.f2-card.jds .sh{background:linear-gradient(160deg,#eaff9a,#c1f807 45%,#4f6b00)}
.f2-card.jds .sh::before{background:linear-gradient(118deg,transparent 46%,rgba(193,248,7,.45) 47%,rgba(193,248,7,.45) 49%,transparent 50%),radial-gradient(90% 60% at 50% 0%,rgba(193,248,7,.2),transparent 60%),linear-gradient(170deg,#11161f,#030508)}
.f2-card.jds .ph svg{fill:#c1f807}
.f2-card.totm{--ink:#e9f3ff;--sub:#9fd2ff;--glow:rgba(120,190,255,.5)}
.f2-card.totm .sh{background:linear-gradient(160deg,#fff,#9fb4cc 45%,#3c4f6b)}
.f2-card.totm .sh::before{background:radial-gradient(70% 50% at 50% 0%,rgba(120,190,255,.35),transparent 60%),linear-gradient(170deg,#0d2246,#040a18)}
.f2-card.totm .ph svg{fill:#9fd2ff}
.f2-card.potm{--ink:#fff3ff;--sub:#ff9cf3;--glow:rgba(255,110,230,.5)}
.f2-card.potm .sh{background:linear-gradient(160deg,#ffb3f5,#b25cff 45%,#3b1a7a)}
.f2-card.potm .sh::before{background:radial-gradient(80% 50% at 80% 10%,rgba(255,120,230,.45),transparent 60%),radial-gradient(70% 50% at 10% 90%,rgba(110,90,255,.45),transparent 60%),linear-gradient(170deg,#2a0f4a,#0b0420)}
.f2-card.potm .ph svg{fill:#ff9cf3}
.f2-card.mini .st,.f2-card.mini .rl,.f2-card.mini .tg,.f2-card.mini .cr{display:none}
.f2-card.mini .nm{top:63%;font-size:calc(var(--w)*.15)}
.f2-card.mini .ov{font-size:calc(var(--w)*.25)}.f2-card.mini .ps{font-size:calc(var(--w)*.12)}

/* ---------- secciones ---------- */
.f2{display:flex;flex-direction:column;gap:28px}
.f2 h3{font-family:'Oswald',sans-serif;font-weight:600;font-size:20px;margin:0}
.f2-chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.f2-chip{padding:8px 14px;border-radius:99px;border:1px solid rgba(255,255,255,.12);background:transparent;color:inherit;font:inherit;font-size:13.5px;font-weight:600;cursor:pointer}
.f2-chip.on{background:#eef2f8;color:#05070f;border-color:#eef2f8}
.f2-mute{font-size:13.5px;opacity:.6;margin:0}
.f2-btn{display:inline-flex;align-items:center;gap:10px;padding:10px 18px;border-radius:999px;border:0;background:#c1f807;color:#0a0f02;font:inherit;font-weight:800;font-size:14px;cursor:pointer;transition:transform .2s cubic-bezier(.32,.72,0,1)}
.f2-btn:active{transform:scale(.97)}
.f2-btn.gh{background:rgba(255,255,255,.07);color:inherit;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);font-weight:600}
.f2-btn .bi{width:28px;height:28px;margin:-4px -10px -4px 0;border-radius:50%;display:grid;place-items:center;background:rgba(10,15,2,.12)}
.f2-btn .bi svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.f2-dest{display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr);gap:32px;align-items:center}
.f2-mvp{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.f2-mvp b{display:block;font-family:'Oswald',sans-serif;font-size:20px}
.f2-mvp span{display:block;font-size:13px;opacity:.65;margin-top:2px}
.f2-pitch{position:relative;width:100%;max-width:560px;aspect-ratio:4/4.4;border-radius:20px;overflow:hidden;justify-self:center;
  background:repeating-linear-gradient(180deg,#0f3a22 0 9%,#0c321d 9% 18%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.f2-pitch::before{content:"";position:absolute;inset:4%;border:1.5px solid rgba(255,255,255,.2);border-radius:6px}
.f2-pitch::after{content:"";position:absolute;left:50%;top:50%;width:22%;aspect-ratio:1;border:1.5px solid rgba(255,255,255,.2);border-radius:50%;transform:translate(-50%,-50%)}
.f2-pitch .hl{position:absolute;left:4%;right:4%;top:50%;border-top:1.5px solid rgba(255,255,255,.2)}
.f2-slot{position:absolute;transform:translate(-50%,-50%);z-index:2;background:none;border:0;padding:0;color:inherit;font:inherit}
.f2-slot .f2-card{--w:72px}
.f2-slot.ed{cursor:pointer}
.f2-slot.ed::after{content:"Cambiar";position:absolute;left:50%;bottom:-16px;transform:translateX(-50%);font-size:10px;font-weight:700;opacity:.7;white-space:nowrap}
.f2-slot.vac{width:56px;height:76px;border-radius:12px;border:1.5px dashed rgba(255,255,255,.3);display:grid;place-items:center;font-size:11px;opacity:.7}
.f2-pick{display:flex;flex-direction:column;gap:6px;max-height:60vh;overflow:auto}
.f2-pick button{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.03);color:inherit;font:inherit;cursor:pointer;text-align:left}
.f2-pick button.on{border-color:#c1f807}
.f2-pick span{opacity:.6;font-size:13px}

/* insignias */
.f2-med{--m1:#fff1b3;--m2:#c8952c;--m3:#6b4710;position:relative;width:64px;height:72px;display:grid;place-items:center;flex:none}
.f2-med::before{content:"";position:absolute;inset:0;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:linear-gradient(160deg,var(--m1),var(--m2) 50%,var(--m3))}
.f2-med::after{content:"";position:absolute;inset:5px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:radial-gradient(circle at 40% 30%,rgba(255,255,255,.35),transparent 55%),linear-gradient(160deg,var(--m3),#0b0f19 80%)}
.f2-med i{position:relative;z-index:1;font-style:normal;font-size:28px;line-height:1}
.f2-med.big{width:110px;height:122px}.f2-med.big i{font-size:52px}.f2-med.big::after{inset:8px}
.f2-med.sm{width:40px;height:45px}.f2-med.sm i{font-size:18px}.f2-med.sm::after{inset:3px}
.f2-med.lk{filter:grayscale(1) brightness(.55)}
.mc-oro{--m1:#fff1b3;--m2:#d9a93e;--m3:#6b4710}.mc-plata{--m1:#fff;--m2:#aab6c6;--m3:#4a5568}.mc-bronce{--m1:#f6c49a;--m2:#b8743f;--m3:#5c3216}
.mc-lima{--m1:#eaff9a;--m2:#c1f807;--m3:#3d5200}.mc-azul{--m1:#cfe9ff;--m2:#4ea3ff;--m3:#123a73}.mc-rosa{--m1:#ffd1f8;--m2:#e05ad1;--m3:#4a1050}
.f2-blist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.f2-bi{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 10px 12px;border-radius:16px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);cursor:pointer;text-align:center;color:inherit;font:inherit}
.f2-bi b{font-size:13.5px;line-height:1.25}
.f2-bi span{font-size:12px;opacity:.6;line-height:1.3}
.f2-bi em{font-style:normal;font-size:11px;font-weight:700;color:#f6d98a}
.f2-bi.add{border-style:dashed;justify-content:center;color:#c1f807;font-weight:700;min-height:140px}
.f2-grp{display:flex;flex-direction:column;gap:12px}
.f2-grpH{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.f2-mine{display:flex;flex-wrap:wrap;gap:12px}
.f2-mine .f2-bi{width:132px;cursor:default}
.f2-ed{display:flex;flex-direction:column;gap:16px}
.f2-ed-top{display:flex;gap:16px;align-items:center}
.f2-ed-top b{display:block;font-family:'Oswald',sans-serif;font-size:24px;line-height:1.1}
.f2-ed-top span{font-size:13.5px;opacity:.7}
.f2-fld{display:flex;flex-direction:column;gap:6px}
.f2-fld>label{font-size:13px;opacity:.65;font-weight:600}
.f2-in{width:100%;box-sizing:border-box;padding:11px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:rgba(0,0,0,.3);color:inherit;font:inherit;font-size:15px}
.f2-emo{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px}
.f2-emo button{aspect-ratio:1;border-radius:10px;border:1px solid transparent;background:rgba(255,255,255,.04);font-size:19px;cursor:pointer;padding:0;line-height:1}
.f2-emo button.on{border-color:#c1f807;background:rgba(193,248,7,.12)}
.f2-goals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.f2-goals button{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.03);color:inherit;font:inherit;font-size:13.5px;font-weight:600;text-align:left;cursor:pointer;line-height:1.25}
.f2-goals button i{font-style:normal;font-size:19px;flex:none}
.f2-goals button.on{border-color:#c1f807;background:rgba(193,248,7,.09)}
.f2-rule{display:flex;align-items:center;flex-wrap:wrap;gap:10px;padding:12px 14px;border-radius:16px;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.08);font-size:15.5px;font-weight:600}
.f2-step{display:inline-flex;align-items:center;border-radius:999px;background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.f2-step button{width:36px;height:36px;border-radius:50%;border:0;background:transparent;color:inherit;font:inherit;font-size:20px;font-weight:700;cursor:pointer}
.f2-step output{min-width:34px;text-align:center;font-family:'Oswald',sans-serif;font-weight:700;font-size:22px;color:#c1f807;font-variant-numeric:tabular-nums}
.f2-cols{display:flex;gap:8px;flex-wrap:wrap}
.f2-cols button{width:32px;height:32px;border-radius:50%;border:2px solid transparent;cursor:pointer;background:linear-gradient(160deg,var(--m1),var(--m2) 50%,var(--m3))}
.f2-cols button.on{border-color:#fff}
.f2-note{font-size:13px;opacity:.75;background:rgba(255,255,255,.04);border-radius:12px;padding:10px 12px;margin:0}
.f2-lock{font-size:13.5px;color:#f6d98a;background:rgba(246,217,138,.08);border:1px solid rgba(246,217,138,.25);border-radius:12px;padding:10px 12px;margin:0}
.f2-act{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.f2-who{display:flex;flex-direction:column;gap:6px}
.f2-who div{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;border-radius:12px;background:rgba(255,255,255,.03)}
.f2-who small{opacity:.6}
/* racha */
.f2-racha{border:1px solid rgba(255,255,255,.08);border-radius:22px;padding:20px;background:rgba(255,255,255,.02);display:flex;flex-direction:column;gap:16px}
.f2-fl{display:flex;align-items:center;gap:14px}
.f2-fl b{font-family:'Oswald',sans-serif;font-weight:700;font-size:56px;line-height:.85;color:#ffb347;text-shadow:0 0 26px rgba(255,140,40,.55)}
.f2-fl span{font-size:14px;opacity:.7;line-height:1.35}
.f2-tr{position:relative;height:8px;border-radius:8px;background:#1a2133;margin:18px 22px 38px}
.f2-tr .fi{position:absolute;left:0;top:0;bottom:0;border-radius:8px;background:linear-gradient(90deg,#ff7a2f,#ffc94d)}
.f2-ms{position:absolute;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center}
.f2-ms i{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:20px;background:#1a2133;border:2px solid #2a3350}
.f2-ms.ok i{background:#3a2410;border-color:#ffb347;box-shadow:0 0 14px rgba(255,160,60,.5)}
.f2-ms small{position:absolute;top:46px;font-size:11.5px;opacity:.65;white-space:nowrap;font-weight:600}
.f2-rk{display:flex;flex-direction:column;gap:6px}
.f2-rk div{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:12px;background:rgba(255,255,255,.03)}
.f2-rk b{margin-left:auto;font-family:'Oswald',sans-serif;color:#ffb347}
.f2-msrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14.5px}
.f2-msrow input{width:60px}
.f2-msrow select{padding:6px 8px;border-radius:10px;background:rgba(0,0,0,.3);color:inherit;border:1px solid rgba(255,255,255,.14);font-size:18px}
.f2-mj{display:flex;flex-direction:column;gap:14px;margin:0 0 18px;padding:16px 18px;border-radius:18px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.02)}
.f2-mj-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.f2-mj-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.f2-mj-row .r{display:flex;align-items:center;gap:8px;margin-right:8px}
.f2-mj-row .r b{font-family:'Oswald',sans-serif;font-size:30px;color:#ffb347;line-height:1}
.f2-mj-row .r span{font-size:12.5px;opacity:.7;line-height:1.2}

/* ---------- compartir ---------- */
.f2-share{display:flex;flex-direction:column;gap:14px;align-items:center}
.f2-share canvas{width:auto;max-width:100%;max-height:56vh;border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.f2-share .f2-chips{justify-content:center}
.f2-share h2{padding:0 40px;text-align:center;text-wrap:balance}

/* ---------- sobre ---------- */
#f2Sobre{--rgb:247,210,100;--cw:220px;--pw:236px;--ph:340px;position:fixed;inset:0;z-index:9990;overflow:hidden;isolation:isolate;
  background:radial-gradient(70% 45% at 50% 46%,rgba(30,50,100,.55),transparent 70%),linear-gradient(180deg,#040814,#02040a 60%,#050a08);
  opacity:0;transition:opacity .3s cubic-bezier(.16,1,.3,1);user-select:none;-webkit-user-select:none;touch-action:manipulation}
#f2Sobre.on{opacity:1}
#f2Sobre .lights{position:absolute;top:calc(env(safe-area-inset-top,0px) + 18px);width:110px;height:32px;display:grid;grid-template-columns:repeat(6,1fr);gap:5px;padding:6px;border-radius:6px;background:#0c1220}
#f2Sobre .lights i{border-radius:50%;background:#fffbe9;box-shadow:0 0 10px 3px rgba(255,251,233,.85),0 0 30px 8px rgba(255,251,233,.25)}
#f2Sobre .lights.l{left:6%;transform:rotate(-8deg)}#f2Sobre .lights.r{right:6%;transform:rotate(8deg)}
#f2Sobre .cone{position:absolute;top:30px;width:60%;height:110%;pointer-events:none;opacity:.5;background:linear-gradient(180deg,rgba(255,251,233,.22),rgba(255,251,233,0) 75%);filter:blur(6px);transition:opacity .9s}
#f2Sobre .cone.l{left:0;clip-path:polygon(10% 0,18% 0,100% 100%,40% 100%)}
#f2Sobre .cone.r{right:0;clip-path:polygon(82% 0,90% 0,60% 100%,0 100%)}
#f2Sobre.focus .cone{opacity:.95}
#f2Sobre .floor{position:absolute;left:-30%;right:-30%;bottom:-8%;height:40%;transform:perspective(500px) rotateX(62deg);transform-origin:50% 100%;opacity:.4;
  background:repeating-linear-gradient(90deg,transparent 0 58px,rgba(193,248,7,.1) 58px 60px),repeating-linear-gradient(0deg,transparent 0 58px,rgba(193,248,7,.1) 58px 60px);-webkit-mask:linear-gradient(transparent,#000 35%);mask:linear-gradient(transparent,#000 35%)}
#f2Sobre .halo{position:absolute;left:50%;top:38%;width:640px;height:640px;margin:-320px 0 0 -320px;pointer-events:none;opacity:0;transition:opacity 1.2s;border-radius:50%;
  background:radial-gradient(circle,rgba(var(--rgb),.38),transparent 45%),repeating-conic-gradient(from 0deg,rgba(var(--rgb),.13) 0 4deg,transparent 4deg 15deg);animation:f2spin 40s linear infinite;-webkit-mask:radial-gradient(circle,#000 0,transparent 68%);mask:radial-gradient(circle,#000 0,transparent 68%)}
@keyframes f2spin{to{transform:rotate(360deg)}}
#f2Sobre.lit .halo{opacity:1}
#f2Sobre .vig{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .9s;background:radial-gradient(60% 55% at 50% 45%,transparent 40%,rgba(0,0,0,.78) 100%)}
#f2Sobre.focus .vig{opacity:1}
#f2Sobre .pillar{position:absolute;left:50%;bottom:50%;width:180px;margin-left:-90px;height:70%;pointer-events:none;transform-origin:50% 100%;transform:scaleY(0);opacity:0;
  background:linear-gradient(0deg,rgba(255,255,255,.95),rgba(var(--rgb),.55) 25%,rgba(var(--rgb),.12) 70%,transparent);filter:blur(10px)}
#f2Sobre.beam .pillar{animation:f2pillar 2.2s cubic-bezier(.32,.72,0,1) forwards}
@keyframes f2pillar{0%{transform:scaleY(0) scaleX(.4);opacity:0}18%{opacity:1}45%{transform:scaleY(1);opacity:1}100%{transform:scaleY(1) scaleX(1.6);opacity:0}}
#f2Sobre .flash{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 38%,rgba(255,255,255,.9),rgba(var(--rgb),.6) 25%,transparent 60%);z-index:20}
#f2Sobre .flash.go{animation:f2flash 1s cubic-bezier(.16,1,.3,1)}
@keyframes f2flash{0%{opacity:0}15%{opacity:1}100%{opacity:0}}
#f2Sobre canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:6}
#f2Sobre .x{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);right:calc(env(safe-area-inset-right,0px) + 14px);z-index:30;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.08);color:#fff;font-size:18px;cursor:pointer}
#f2Sobre .hint{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);left:0;right:0;text-align:center;z-index:8;font-family:'Oswald',sans-serif;font-weight:600;letter-spacing:.2em;font-size:15px;color:#c9d3e6;text-transform:uppercase;animation:f2pulse 1.8s ease-in-out infinite}
@keyframes f2pulse{50%{opacity:.35}}
#f2Sobre .ttl{position:absolute;top:calc(env(safe-area-inset-top,0px) + 70px);left:0;right:0;text-align:center;z-index:8;transition:opacity .4s}
#f2Sobre .ttl b{display:block;font-family:'Oswald',sans-serif;font-size:26px;color:#fff}
#f2Sobre .ttl span{font-size:14px;color:#aab4c8}
#f2Sobre.focus .ttl{opacity:0}
/* paquete */
#f2Sobre .pk3{position:absolute;left:50%;top:50%;width:var(--pw);height:var(--ph);margin:calc(var(--ph) / -2) 0 0 calc(var(--pw) / -2);z-index:5;cursor:pointer;perspective:900px;transition:transform .9s cubic-bezier(.6,0,.8,.4),opacity .7s}
#f2Sobre .sway{position:absolute;inset:0;transform-style:preserve-3d;animation:f2float 4s cubic-bezier(.45,0,.55,1) infinite,f2sway 7s cubic-bezier(.45,0,.55,1) infinite alternate}
@keyframes f2float{50%{translate:0 -9px}}
@keyframes f2sway{from{transform:rotateY(-13deg) rotateZ(-1.5deg)}to{transform:rotateY(13deg) rotateZ(1.5deg)}}
#f2Sobre .pk3.s1 .sway,#f2Sobre .pk3.s2 .sway{animation:none;transform:none;transition:transform .5s cubic-bezier(.32,.72,0,1)}
#f2Sobre .pk{--c1:#fff0b0;--c2:#e0aa38;--c3:#8a5a10;--ink:#3a2604;--ang:0deg;position:absolute;inset:0;transform-style:preserve-3d}
#f2Sobre .pk.bronce{--c1:#f6c7a0;--c2:#c47c45;--c3:#5e3417;--ink:#3b1d08}
#f2Sobre .pk.plata{--c1:#fff;--c2:#bfc9d6;--c3:#6d7a8c;--ink:#1f2836}
#f2Sobre .pk.elite{--ink:#eaffb0;--c1:#c1f807;--c2:#1b2c58;--c3:#070b16}
#f2Sobre .pk .foil,#f2Sobre .pk .crimp,#f2Sobre .pk .tsb{background:linear-gradient(90deg,rgba(0,0,0,.42),transparent 13%,rgba(255,255,255,.16) 34%,transparent 52%,rgba(0,0,0,.08) 80%,rgba(0,0,0,.45)),conic-gradient(from var(--ang) at 50% 45%,var(--c1),var(--c2),var(--c3),var(--c2),var(--c1))}
#f2Sobre .pk.elite .foil,#f2Sobre .pk.elite .tsb,#f2Sobre .pk.elite .crimp{background:linear-gradient(90deg,rgba(0,0,0,.5),transparent 13%,rgba(255,255,255,.1) 34%,transparent 52%,rgba(0,0,0,.5)),conic-gradient(from var(--ang) at 50% 45%,#0e1730,#1b2c58,#0b1226,#16224a,#0e1730)}
#f2Sobre .pk .edge{position:absolute;top:54px;bottom:26px;width:12px;background:linear-gradient(180deg,var(--c2),var(--c3));filter:brightness(.6)}
#f2Sobre .pk .edge.l{left:0;transform-origin:0 50%;transform:rotateY(90deg)}
#f2Sobre .pk .edge.r{right:0;transform-origin:100% 50%;transform:rotateY(-90deg)}
#f2Sobre .pk .foil{position:absolute;left:0;right:0;top:54px;bottom:26px;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25),0 30px 60px rgba(0,0,0,.55),0 0 50px rgba(var(--rgb),.3)}
#f2Sobre .pk .stripe{position:absolute;left:-30%;right:-30%;top:46%;height:58px;transform:rotate(-24deg);background:linear-gradient(90deg,rgba(5,8,16,.92),rgba(12,18,34,.92));box-shadow:0 0 0 3px rgba(193,248,7,.9),0 0 22px rgba(193,248,7,.45)}
#f2Sobre .pk.elite .stripe{background:linear-gradient(90deg,#c1f807,#9fe000);box-shadow:0 0 0 3px rgba(5,8,16,.9),0 0 26px rgba(193,248,7,.6)}
#f2Sobre .pk .badge{position:absolute;left:50%;top:44%;width:112px;height:112px;margin:-56px 0 0 -56px;border-radius:50%;display:grid;place-items:center;z-index:2;background:radial-gradient(circle at 35% 30%,#1c2742,#060a14 72%);box-shadow:0 0 0 4px var(--c1),0 0 0 7px rgba(0,0,0,.35),0 12px 26px rgba(0,0,0,.55),0 0 30px rgba(var(--rgb),.5)}
#f2Sobre .pk.elite .badge{box-shadow:0 0 0 4px #c1f807,0 0 0 7px rgba(0,0,0,.35),0 12px 26px rgba(0,0,0,.55),0 0 30px rgba(193,248,7,.5)}
#f2Sobre .pk .badge img{width:76%;height:auto;display:block}
#f2Sobre .pk .pt{position:absolute;left:0;right:0;top:14px;text-align:center;white-space:nowrap;font-family:'Oswald',sans-serif;font-weight:700;font-size:20px;line-height:1;color:var(--ink)}
#f2Sobre .pk .ed{position:absolute;left:12px;right:12px;bottom:12px;display:flex;justify-content:space-between;align-items:flex-end;font-family:'Oswald',sans-serif;color:var(--ink);z-index:2}
#f2Sobre .pk .ed b{font-size:19px;font-weight:700;line-height:1;text-transform:uppercase}
#f2Sobre .pk .ed span{font-size:11px;letter-spacing:.14em;opacity:.8}
#f2Sobre .pk .crimp{position:absolute;left:0;right:0;height:28px}
#f2Sobre .pk .crimp::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.35) 0 2px,rgba(0,0,0,.28) 2px 5px)}
#f2Sobre .pk .crimp.b{bottom:0;clip-path:var(--zzB)}
#f2Sobre .pk .top{position:absolute;left:0;right:0;top:0;height:58px;transform-origin:100% 100%;transition:transform .85s cubic-bezier(.5,-.3,.6,1.2),opacity .5s;z-index:3}
#f2Sobre .pk .top .crimp{top:0;clip-path:var(--zzT)}
#f2Sobre .pk .tsb{position:absolute;left:0;right:0;top:27px;height:31px;clip-path:var(--zzR)}
#f2Sobre .pk .tsb::after{content:"Abrir aquí";position:absolute;right:10px;top:7px;font-family:'Oswald',sans-serif;font-size:10px;letter-spacing:.16em;color:var(--ink);opacity:.6}
#f2Sobre .pk .rip{position:absolute;left:0;right:0;top:53px;height:4px;z-index:6;transform-origin:0 50%;transform:scaleX(0);opacity:0;border-radius:4px;background:linear-gradient(90deg,rgba(255,255,255,.2),#fff 85%);box-shadow:0 0 14px 4px rgba(var(--rgb),.95),0 0 40px 10px rgba(var(--rgb),.45)}
#f2Sobre .pk3.rip .rip{opacity:1;transform:scaleX(1);transition:transform .55s cubic-bezier(.65,0,.35,1),opacity .15s}
#f2Sobre .pk3.s2 .rip{opacity:0;transition:opacity .4s}
#f2Sobre .pk .spill{position:absolute;left:10%;right:10%;top:44px;height:20px;z-index:2;border-radius:50%;opacity:0;transition:opacity .5s;background:#fff;box-shadow:0 0 30px 12px rgba(var(--rgb),.9),0 -50px 90px 34px rgba(var(--rgb),.45)}
#f2Sobre .pk3.s1 .pk{animation:f2press .5s cubic-bezier(.32,.72,0,1)}
@keyframes f2press{35%{transform:scale(.965)}100%{transform:scale(1.02)}}
#f2Sobre .pk3.s2 .top{transform:translate(70px,-90px) rotate(32deg);opacity:0}
#f2Sobre .pk3.s2 .spill{opacity:1}
#f2Sobre .pk3.s3{transform:translateY(70vh) rotate(6deg);opacity:0}
/* carta */
#f2Sobre .hold{position:absolute;left:50%;top:50%;width:var(--cw);z-index:4;perspective:1100px;opacity:0;
  transform:translate(-50%,-30%) scale(.86);transition:transform 1.25s cubic-bezier(.2,.9,.25,1)}
#f2Sobre.opening .hold{opacity:1}
#f2Sobre.out .hold{transform:translate(-50%,-78%) scale(1)}
#f2Sobre.done .hold{z-index:7}
#f2Sobre .hold .f2-card{--w:var(--cw)}
#f2Sobre .flip{position:relative;transform-style:preserve-3d;transform:rotateY(180deg);transition:transform 1s cubic-bezier(.32,.72,0,1)}
#f2Sobre.flipped .flip{transform:none}
#f2Sobre .face{backface-visibility:hidden;-webkit-backface-visibility:hidden}
#f2Sobre .face.bk{position:absolute;inset:0;transform:rotateY(180deg)}
#f2Sobre .cb{width:var(--cw);aspect-ratio:3/4.35;position:relative;filter:drop-shadow(0 18px 40px rgba(0,0,0,.6)) drop-shadow(0 0 26px rgba(var(--rgb),.5))}
#f2Sobre .cb::before,#f2Sobre .cb::after{content:"";position:absolute;clip-path:polygon(9% 0,91% 0,100% 6%,100% 87%,50% 100%,0 87%,0 6%)}
#f2Sobre .cb::before{inset:0;background:linear-gradient(160deg,rgba(var(--rgb),1),rgba(var(--rgb),.45) 50%,rgba(var(--rgb),1))}
#f2Sobre .cb::after{inset:3.2%;background:radial-gradient(70% 45% at 50% 42%,rgba(var(--rgb),.35),transparent 70%),linear-gradient(170deg,#121a30,#04060d)}
#f2Sobre .cb img{position:absolute;left:50%;top:42%;width:58%;transform:translate(-50%,-50%);z-index:1}
#f2Sobre .delta{position:absolute;right:-44px;top:50px;font-family:'Oswald',sans-serif;font-weight:700;font-size:30px;line-height:1.15;background:#c1f807;color:#0a0f02;padding:0 12px 0 10px;border-radius:10px;transform:scale(0) rotate(-12deg);transition:transform .45s cubic-bezier(.2,1.6,.4,1)}
#f2Sobre.done .delta{transform:scale(1) rotate(-8deg)}
.f2-morph{animation:f2morph .8s cubic-bezier(.16,1,.3,1)}

#f2Sobre .rv{position:absolute;left:0;right:0;top:calc(50% + var(--cw) * .36 + 22px);z-index:8;display:flex;flex-direction:column;align-items:center;gap:14px;padding:0 16px;text-align:center}

<script>
(function(){

/* ============ DATA MODEL ============ */

var BASE_ATTRS = [
  {key:'resistencia', label:'Resistencia'},
  {key:'pase', label:'Pase'},
  {key:'tiro', label:'Tiro'},
  {key:'recuperacion', label:'Recuperación de balón'},
  {key:'defensa', label:'Defensa (marca / achique)'},
  {key:'atajadas', label:'Atajadas (bajo los tres palos)'},
  {key:'actitud', label:'Actitud'},
  {key:'velocidad', label:'Velocidad'}
];
// Características: las de base + las que agregue el club (administrador) o cada categoría (su profesor).
// Cada uno también les puede cambiar el nombre. 'club' = solo lo del club (predeterminado).
function cleanLabel(s){ return String(s||'').replace(/[<>&"]/g,'').replace(/\s+/g,' ').trim().slice(0,40); }
function attrsFor(cat){
  var st = state || {};
  var club = st.clubAttrs || {}, own = (cat && cat!=='club' && st.categoryAttrs && st.categoryAttrs[cat]) || {};
  var labels = Object.assign({}, club.labels||{}, own.labels||{});
  var seen = {};
  return BASE_ATTRS.concat(club.extra||[], own.extra||[]).filter(function(a){
    if(!a || !a.key || seen[a.key]) return false; seen[a.key] = true; return true;
  }).map(function(a){
    var base = BASE_ATTRS.some(function(b){ return b.key===a.key; });
    var origen = base ? 'base' : ((own.extra||[]).some(function(x){ return x.key===a.key; }) ? 'categoria' : 'club');
    return {key:a.key, label:cleanLabel(labels[a.key] || a.label) || a.label, origen:origen};
  });
}
// Peso de una característica en el perfil de una posición (las nuevas arrancan en 5)
function pw(profile, key){ var v = profile && profile[key]; return typeof v==='number' ? v : 5; }
var RATING_MAX = 10;
var QUICK_THRESHOLD = 5;

var KEYWORDS = {
  resistencia: ['resistencia','aguante','cansa','ritmo todo el partido','fondo físico'],
  pase: ['pase','pases','asociación','visión de juego'],
  tiro: ['tiro','tiros','remate','definición','disparo'],
  recuperacion: ['recupero','recuperación','recuperó','presión','robo de balón','robó'],
  defensa: ['defendió','marca personal','marcó bien','cortó','bloqueó','achicó espacios','salió a cortar'],
  atajadas: ['atajada','atajó','achicó el arco','bajo los tres palos','reflejos','estiró','tapó el remate','salvó'],
  actitud: ['actitud','compromiso','liderazgo','ganas','entrega'],
  velocidad: ['velocidad','rápido','rapidez','explosivo','desborde']
};

var POSITIONS = [
  {code:'POR', name:'Portero', short:'Bajo palos'},
  {code:'DFC', name:'Defensa Central', short:'Eje de la defensa'},
  {code:'LD',  name:'Lateral Derecho', short:'Banda derecha, defensa'},

  {code:'EXT', name:'Extremo', short:'Bandas, ataque'},
  {code:'DC',  name:'Delantero Centro', short:'Referencia de ataque'}
];
// abreviaturas que usan los profesores (y códigos viejos de esta app) -> código interno
var POSITION_ALIASES = {
  PT:'POR', POR:'POR', ARQ:'POR', AR:'POR', GK:'POR',
  DF:'DFC', DFC:'DFC', DFC1:'DFC', DFC2:'DFC', CT:'DFC', DEF:'DFC', DC1:'DFC',
  LD:'LD', LI:'LI',
  MCD:'MCD', VC:'MCD', MC:'MC', MED:'MC', MCO:'MCO', MP:'MCO',
  EX:'EXT', EXT:'EXT', ED:'EXT', EI:'EXT',
  DC:'DC', DEL:'DC', DL:'DC', CF:'DC'
};
function normalizePos(raw){
  var s = String(raw||'').trim();
  if(!s) return null;
  var up = s.toUpperCase();
  if(POSITION_ALIASES[up]) return POSITION_ALIASES[up];
  var low = s.toLowerCase();
  for(var i=0;i<POSITIONS.length;i++){ if(POSITIONS[i].name.toLowerCase()===low) return POSITIONS[i].code; }
  if(/portero|arquero/.test(low)) return 'POR';
  if(/lateral.*der/.test(low)) return 'LD';
  if(/lateral.*izq/.test(low)) return 'LI';
  if(/central|defens|zaguero/.test(low)) return 'DFC';
  if(/conten/.test(low)) return 'MCD';

function seedPlayers(categoria){
  var today = new Date();
  function daysAgo(n){ var d=new Date(today); d.setDate(d.getDate()-n); return d.toISOString().slice(0,10); }
  var seedHist = [
    {pos:'DFC1', comments:['Muy sólido marcando, recuperó muchos balones y mantuvo buena actitud todo el entrenamiento.', 'Le costó un poco el pase largo, pero defendió bien uno contra uno.']},
    {pos:'MCO', comments:['Excelente visión de juego, varios pases entre líneas y buena resistencia durante todo el trabajo.', 'Bajó el ritmo en el segundo tiempo del entrenamiento, se cansó rápido.']},
    {pos:'DC', comments:['Definición muy clara, dos remates a portería en el trabajo de finalización.', 'Poca participación en la recuperación, pero es esperable en su posición.']},
    {pos:'ED', comments:['Muy rápido en las bandas, generó desborde constante.', 'Necesita mejorar la actitud al momento de replegar en defensa.']}
  ];
  return NAMES.map(function(name, i){
    var pos = POSITIONS[i % POSITIONS.length].code;
    var base = 58 + Math.round(Math.random()*14);
    var hist = [];
    var val = base;
    for(var d=5; d>=1; d--){
      var delta = [3,-1,4,2,-2][d-1] || 2;
      val += delta;
      var sample = seedHist[i % seedHist.length];
      var txt = sample.comments[d % sample.comments.length];
      hist.push({
        type:'entrenamiento',
        date: daysAgo(d*4),
        asistio:true,
        rating: 6 + (delta>0?2:0),
        delta: delta,
        feedback: txt,
        comment: txt,
        quickValues: {},
        attrsHit: []
      });
    }
    return {
      id: categoria + '-p' + i,
      name:name,
      categoria: categoria,
      pos:pos,
      goles: Math.round(Math.random()*6),
      asistencias: Math.round(Math.random()*5),
      valoracion: val,
      historial: hist
    };
  });
}

      if(typeof p.goles !== 'number') p.goles = 0;
      if(typeof p.asistencias !== 'number') p.asistencias = 0;

      p.historial.forEach(function(h){
        if(!h.type) h.type = 'entrenamiento';
        if(!h.quickValues) h.quickValues = {};

    return s;

    if(!src) return;
    s.players = s.players.concat(cleanJson(src.players||[]));
    if(src.level) s.categoryLevels[cat] = src.level;
    if(src.weights) s.categoryWeights[cat] = src.weights;
    if(src.attrs) s.categoryAttrs[cat] = cleanJson(src.attrs);
    if(Array.isArray(src.insignias)) s.catBadges[cat] = cleanJson(src.insignias);
    if(src.destacados) s.destacadosCat[cat] = cleanJson(src.destacados);
    if(src.formato) s.formatoCat[cat] = src.formato;
    if(priv){
      Object.keys(priv.trainingDays||{}).forEach(function(d){ s.trainingDays[cat+'::'+d] = cleanJson(priv.trainingDays[d]); });
      Object.keys(priv.lineups||{}).forEach(function(d){ s.lineups[cat+'::'+d] = cleanJson(priv.lineups[d]); });
      if(priv.formaciones && Object.keys(priv.formaciones).length) s.formacionesCat[cat] = cleanJson(priv.formaciones);
      if(priv.formato) s.formatoCat[cat] = priv.formato;
      if(priv.profile && Object.keys(priv.profile).length) s.categoryProfiles[cat] = cleanJson(priv.profile);
      if(Array.isArray(priv.schedule)) s.trainingSchedules[cat] = priv.schedule.slice();
      if(Array.isArray(priv.evals)) s.evalsCat[cat] = cleanJson(priv.evals);
    }
  });
  var n = normalizeState(s);
  if(!n) return;
  state = n;
  var docs = buildDocs(state);
  syncedJson = {};
  Object.keys(docs).forEach(function(path){
    var cat = path.split('/')[1];
    var exists = path==='datos/general' || (path.indexOf('categorias/')===0 ? !!remote.priv[cat] : !!remote.pub[cat]);
    if(exists) syncedJson[path] = JSON.stringify(docs[path]);
  });
  if(!clubRole() && photoCat !== visitorCategoria) attachPhotos(); // el visitante ve las fotos de la categoría correcta
  safeRender();
}

/* ============ HELPERS ============ */
function todayStr(){ return new Date().toISOString().slice(0,10); }
var WEEKDAYS = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
function weekdayOf(dateStr){ return new Date(dateStr+'T00:00:00').getDay(); }
function getTrainingDay(dateStr){
  var key = activeCategoria() + '::' + dateStr;
  if(!state.trainingDays[key]){
    var focus = {};
    attrsFor(activeCategoria()).forEach(function(a){ focus[a.key] = false; }); // todos apagados por defecto — el profesor marca lo que sí se trabajó
    state.trainingDays[key] = { held: null, reason:'', focus: focus, attendance: {}, finalized: false };
  }
  if(!state.trainingDays[key].attendance) state.trainingDays[key].attendance = {};
  return state.trainingDays[key];
}
function posName(code){ var p=POSITIONS.find(function(x){return x.code===code;}); return p?p.name:code; }
function fmtDate(iso){
  var d = new Date(iso+'T00:00:00');
  return d.toLocaleDateString('es-CO', {day:'2-digit', month:'short'});
}
// El perfil de exigencia y el horario son de cada categoría. Si el profesor no ha tocado una posición, se usa la del club.
function profileFor(cat, posCode){
  var ov = state.categoryProfiles && state.categoryProfiles[cat] && state.categoryProfiles[cat][posCode];
  return ov || state.profiles[posCode];
}
function scheduleFor(cat){
  state.trainingSchedules = state.trainingSchedules || {};
  if(!Array.isArray(state.trainingSchedules[cat])) state.trainingSchedules[cat] = (Array.isArray(state.trainingSchedule) ? state.trainingSchedule : [1,3,5]).slice();
  return state.trainingSchedules[cat];
}
function quickAttrsFor(posCode, focus){
  var profile = profileFor(activeCategoria(), posCode);
  return attrsFor(activeCategoria()).filter(function(a){
    if(pw(profile, a.key) < QUICK_THRESHOLD) return false;
    if(focus && !focus[a.key]) return false; // no se trabajó ese día / no aplica
    return true;
  }).sort(function(a,b){ return pw(profile, b.key)-pw(profile, a.key); });
}
function analyzeFeedback(text, posCode, skipKeys){
  var profile = profileFor(activeCategoria(), posCode);
  var lower = text.toLowerCase();
  var hits = [];
  attrsFor(activeCategoria()).forEach(function(a){
    if(skipKeys && skipKeys.indexOf(a.key)!==-1) return; // ya se calificó por atributo, no duplicar
    var words = (KEYWORDS[a.key] || []).concat([a.label.toLowerCase()]);
    var matched = words.some(function(w){ return lower.indexOf(w) !== -1; });
    if(matched){
      var weight = pw(profile, a.key);
      var tier = weight >= 7 ? 'up' : (weight <= 3 ? 'down' : 'neutral');
      hits.push({key:a.key, label:a.label, weight:weight, tier:tier});
    }
  });
  return hits;
}
// Escalones acordados: 4 o menos ya empieza a bajar, 5 es neutro, 6/7 empieza a subir, 10 sube más.
var RATING_STEPS = {1:-2, 2:-2, 3:-1, 4:-1, 5:0, 6:1, 7:1, 8:2, 9:2, 10:3};
function baseDelta(rating){ return RATING_STEPS[rating] !== undefined ? RATING_STEPS[rating] : 0; }
function computeDelta(rating, hits, quickRatings){
  var d = baseDelta(rating);
  // Cada característica pesa según el perfil de exigencia: con 10 sube MÁS si le fue bien y baja MÁS si le fue mal;
  // con 5 se mueve la mitad. Ya no se redondea cada una (antes un 7 y un 10 terminaban valiendo lo mismo).
  (quickRatings||[]).forEach(function(q){
    d += baseDelta(q.value) * (q.weight/RATING_MAX) * 0.8;
  });
  hits.forEach(function(h){
    if(h.tier==='up') d += 1; // mención en texto de algo clave para el puesto: bono chico
    // neutral o no-clave: sin bono, para no duplicar lo que ya califican los atributos rápidos
  });
  return Math.round(d*10)/10;
}

        persist();
        render();
      };

    });

}

function computeDayReport(dateStr, day){
  var players = categoryPlayers();
  var entries = players.map(function(p){
    return p.historial.find(function(h){ return h.type==='entrenamiento' && h.date===dateStr; });
  }).filter(Boolean);
  var presentes = 0, ausentes = 0;
  presentes = players.filter(function(p){ return day.attendance[p.id]===true; }).length;
  ausentes = players.filter(function(p){ return day.attendance[p.id]===false; }).length;
  var sinMarcar = players.length - presentes - ausentes;
  if(presentes===0 && ausentes===0) return null; // nada registrado todavía este día
  var avgRating = entries.length ? entries.reduce(function(s,e){return s+e.rating;},0)/entries.length : null;
  var quality = 'Sin calificaciones registradas todavía';
  if(avgRating!=null){
    var bd = baseDelta(Math.round(avgRating));
    quality = bd > 0 ? 'Buen entrenamiento' : (bd < 0 ? 'Entrenamiento flojo' : 'Entrenamiento parejo');
  }
  var focusLabels = attrsFor(activeCategoria()).filter(function(a){ return day.focus[a.key]; }).map(function(a){ return a.label; });
  return { presentes:presentes, ausentes:ausentes, sinMarcar:sinMarcar, avgRating:avgRating, quality:quality, focusLabels:focusLabels };
}

      '</div>' +
    '</div>' +

  var btnYes = row.querySelector('.on-yes');
  var btnNo = row.querySelector('.on-no');

  btnYes.onclick = function(){ draft.asistio = true; day.attendance[p.id] = true; persist(); renderRatingBody(); refreshRowChrome(); };
  btnNo.onclick = function(){
    draft.asistio = false; draft.rating=null; draft.feedback=''; day.attendance[p.id] = false;
    if(existingEntry){ // si ya estaba calificado, ese registro se quita
      p.historial = p.historial.filter(function(h){ return h!==existingEntry; });
      existingEntry = null; row.classList.remove('done');
    }
    persist(); ratingBody.style.display='none'; refreshRowChrome();
  };

  function refreshRowChrome(){
    btnYes.className = 'on-yes' + (draft.asistio===true?' sel':'');
    btnNo.className = 'on-no' + (draft.asistio===false?' sel':'');
    ratingBody.style.display = draft.asistio===true ? 'block' : 'none';
  }

  function renderRatingBody(){
    var quickAttrs = quickAttrsFor(p.pos, focus);

    ratingBody.innerHTML =
      '<div class="rating-block">' +
        '<div class="rating-label">¿Qué tal fue su entrenamiento en general? (1 a 10)</div>' +
        '<div class="rating-scale"></div>' +
        '<div class="rating-label" style="margin-top:14px;">Calificación rápida — solo lo que este puesto necesita y se marcó como trabajado hoy</div>' +
        '<div class="quick-attrs"></div>' +
        '<div class="rating-label" style="margin-top:14px;">Retroalimentación escrita (opcional, para algo que las opciones de arriba no cubran)</div>' +
        '<textarea class="fb-textarea" placeholder="Ej: hoy también mostró liderazgo con los más nuevos…"></textarea>' +
        '<div class="save-row"><button class="btn-save-player">' + (existingEntry ? 'Actualizar' : 'Guardar') + '</button></div>' +
      '</div>';

    var scale = ratingBody.querySelector('.rating-scale');
    for(var i=1;i<=RATING_MAX;i++){
      (function(i){
        var b = document.createElement('button');
        b.textContent = i;
        if(draft.rating===i) b.classList.add('sel');
        b.onclick = function(){
          draft.rating = i;
          scale.querySelectorAll('button').forEach(function(x){x.classList.remove('sel');});
          b.classList.add('sel');
        };
        scale.appendChild(b);
      })(i);
    }

    var quickWrap = ratingBody.querySelector('.quick-attrs');
    if(quickAttrs.length===0){
      quickWrap.innerHTML = '<div style="font-size:12px;color:var(--ink-faint);">Nada de lo marcado en "¿Qué se trabajó este día?" aplica a este puesto — puede quedar solo con la calificación general y, si quiere, un comentario.</div>';
    } else {
      quickAttrs.forEach(function(a){
        var qrow = document.createElement('div');
        qrow.className = 'quick-attr-row';
        qrow.innerHTML = '<div class="quick-attr-label">' + a.label + '</div><div class="quick-attr-scale"></div>';
        var qscale = qrow.querySelector('.quick-attr-scale');
        for(var i=1;i<=RATING_MAX;i++){
          (function(i){
            var qb = document.createElement('button');
            qb.textContent = i;
            if(draft.quick[a.key]===i) qb.classList.add('sel');
            qb.onclick = function(){
              draft.quick[a.key] = i;
              qscale.querySelectorAll('button').forEach(function(x){x.classList.remove('sel');});
              qb.classList.add('sel');
            };
            qscale.appendChild(qb);
          })(i);
        }
        quickWrap.appendChild(qrow);
      });
    }

    var textarea = ratingBody.querySelector('.fb-textarea');
    textarea.value = draft.feedback || '';
    textarea.oninput = function(){ draft.feedback = textarea.value; };

    var saveBtn = ratingBody.querySelector('.btn-save-player');
    saveBtn.disabled = false;
    saveBtn.onclick = function(){
      if(draft.rating==null){ return; }
      var quickKeys = Object.keys(draft.quick);
      var quickRatings = quickKeys.map(function(k){
        return {key:k, value:draft.quick[k], weight:pw(profileFor(p.categoria, draft.pos || p.pos), k)};
      });
      var hits = analyzeFeedback(draft.feedback||'', draft.pos || p.pos, quickKeys);
      var newDelta = computeDelta(draft.rating, hits, quickRatings);
      var attrsHitLabels = quickRatings.map(function(q){
        var a = attrsFor(p.categoria).find(function(x){return x.key===q.key;}) || {label:q.key};
        return a.label + ' (' + q.value + '/10)';
      }).concat(hits.map(function(h){return h.label + ' (texto)';}));
      var displayComment = draft.feedback || (quickRatings.length ? '(calificado por atributos, sin comentario escrito)' : '(sin comentario)');
      var quickValuesObj = {};
      quickKeys.forEach(function(k){ quickValuesObj[k] = draft.quick[k]; });

      if(existingEntry){
        p.valoracion += (newDelta - existingEntry.delta);
        existingEntry.rating = draft.rating;
        existingEntry.delta = newDelta;
        existingEntry.feedback = draft.feedback||'';
        existingEntry.comment = displayComment;
        existingEntry.attrsHit = attrsHitLabels;
        existingEntry.quickValues = quickValuesObj;
      } else {
        p.valoracion += newDelta;
        existingEntry = {
          type:'entrenamiento', date: dateStr, asistio:true,
          rating: draft.rating, delta: newDelta,
          feedback: draft.feedback||'', comment: displayComment,
          quickValues: quickValuesObj, attrsHit: attrsHitLabels
        };
        p.historial.unshift(existingEntry);
      }
      existingEntry.pos = draft.pos || p.pos; persist();
      saveBtn.textContent = 'Guardado ✓';
      saveBtn.classList.add('saved');
      row.classList.add('done');
    };
    setupAutoSave(ratingBody, draft, existingEntry);
  }

  if(draft.asistio===true) renderRatingBody();
  return row;
}

// Guardado automático de una fila (entrenamiento o partido): cada toque se guarda solo; el texto, al dejar de escribir.
function setupAutoSave(ratingBody, draft, existingEntry){
  var btn = ratingBody.querySelector('.btn-save-player');
  if(btn && !btn.classList.contains('saved')) btn.textContent = existingEntry ? 'Guardado ✓' : 'Se guarda solo al calificar';
  if(existingEntry && btn) btn.classList.add('saved');
  if(ratingBody.__autoSave) return; // los escuchas se ponen una sola vez por fila
  ratingBody.__autoSave = true;
  var timer = null;
  function schedule(delay){
    clearTimeout(timer);
    timer = setTimeout(function(){
      var b = ratingBody.querySelector('.btn-save-player');
      if(b && draft.rating!=null) b.onclick();
    }, delay);
  }
  ratingBody.addEventListener('click', function(e){
    if(e.target.tagName==='BUTTON' && !e.target.classList.contains('btn-save-player')) schedule(0);
  });
  ratingBody.addEventListener('input', function(e){
    var b = ratingBody.querySelector('.btn-save-player');
    if(b && draft.rating!=null){ b.textContent = 'Guardando…'; b.classList.remove('saved'); }
    schedule(e.target.tagName==='TEXTAREA' ? 900 : 350);
  });
  ratingBody.addEventListener('change', function(e){ if(e.target.tagName==='SELECT') schedule(0); });
}

// Zonas: donde quede la ficha, ese es el puesto
function puestoPorZona(x,y){
  if(y>=85) return 'POR';
  if(y>=62){ if(x<=24) return 'LI'; if(x>=76) return 'LD'; return 'DFC'; }
  if(y>=36){ if(x<=17 || x>=83) return 'EXT'; if(y>=53) return 'MCD'; if(y>=44) return 'MC'; return 'MCO'; }
  if(x<=27 || x>=73) return 'EXT';
  return 'DC';
}
// Alineado automático: la ficha se pega a la línea o columna de sus compañeros
function acomodarFicha(puestos, i, x, y){
  x=Math.round(x*2)/2; y=Math.round(y*2)/2;
  if(Math.abs(x-50)<=3) x=50;
  puestos.forEach(function(o,j){
    if(j===i) return;
    if(Math.abs(o.y-y)<=4.5) y=o.y;
    if(Math.abs(o.x-x)<=3.5) x=o.x;
    if(Math.abs((100-o.x)-x)<=3.5) x=100-o.x;
  });
  return {x:Math.max(6,Math.min(94,x)), y:Math.max(5,Math.min(95,y))};
}
function matchKey(dateStr){ return activeCategoria() + '::' + dateStr; }
function getLineup(dateStr){
  state.lineups = state.lineups || {};
  var k = matchKey(dateStr);
  if(!state.lineups[k]){
    var f = (state.formatoCat||{})[activeCategoria()] || 8;
    var nom = Object.keys(FORMACIONES[f])[0];
    state.lineups[k] = {formato:f, formacion:nom, puestos:cleanJson(FORMACIONES[f][nom]), asign:{}, entraron:{}};
  }
  var L = state.lineups[k];
  if(!Array.isArray(L.puestos) || !L.puestos.length){ L.puestos = cleanJson(FORMACIONES[L.formato||8][L.formacion] || FORMACIONES[8]['3-3-1']); }
  L.asign = L.asign || {}; L.entraron = L.entraron || {};
  return L;
}
// Quiénes jugaron: titulares de la cancha + suplentes marcados como que entraron
function jugaronEn(dateStr){
  var L = getLineup(dateStr), out = [];
  Object.keys(L.asign).forEach(function(i){
    var p = state.players.find(function(x){ return x.id===L.asign[i]; });
    if(p) out.push({p:p, pos:(L.puestos[i]||{}).p || p.pos, titular:true});
  });
  Object.keys(L.entraron).forEach(function(id){
    if(!L.entraron[id]) return;
    if(out.some(function(o){ return o.p.id===id; })) return;
    var p = state.players.find(function(x){ return x.id===id; });
    if(p && p.categoria===activeCategoria()) out.push({p:p, pos:p.pos, titular:false});
  });
  return out;
}

  function fillForms(){

      return '<option value="' + k + '"' + (k===L.formacion && !L.mia ? ' selected':'') + '>' + k + '</option>'; }).join('');

    formSel.innerHTML = (L.tocada ? '<option value="__x" selected>' + escHtml(L.formacion) + ' (editada)</option>' : '') +
      '<optgroup label="Predeterminadas">' + base + '</optgroup>' +
      (mias ? '<optgroup label="Mis formaciones">' + mias + '</optgroup>' : '');
  }
  fmtSel.onchange = function(){
    L.formato = +fmtSel.value; L.mia = false; L.tocada = false;
    L.formacion = Object.keys(FORMACIONES[L.formato])[0];
    L.puestos = cleanJson(FORMACIONES[L.formato][L.formacion]);
    L.asign = {}; L.entraron = {};
    state.formatoCat = state.formatoCat || {}; state.formatoCat[cat] = L.formato;
    persist(); fillForms(); pintar();
  };
  formSel.onchange = function(){
    var v = formSel.value; if(v==='__x') return;
    L.mia = v.indexOf('M:')===0; L.formacion = L.mia ? v.slice(2) : v; L.tocada = false;
    L.puestos = cleanJson(L.mia ? misFormaciones()[L.formacion] : FORMACIONES[L.formato][L.formacion]);
    persist(); fillForms(); pintar();
  };
  el.querySelector('#luClear').onclick = function(){ L.asign={}; L.entraron={}; pick=null; persist(); pintar(); };
  el.querySelector('#luAuto').onclick = function(){
    L.asign = {};
    var libres = categoryPlayers().slice();
    L.puestos.forEach(function(s,i){
      var k = libres.findIndex(function(p){ return p.pos===s.p || (p.posExtra||[]).indexOf(s.p)>=0; });
      if(k<0 && s.p!=='POR') k = libres.findIndex(function(p){ return p.pos!=='POR'; });
      if(k>=0){ L.asign[i] = libres[k].id; libres.splice(k,1); }
    });
    pick=null; persist(); pintar();
  };
  editBtn.onclick = function(){
    editando = !editando;
    editBtn.classList.toggle('active-btn', editando);
    editBtn.textContent = editando ? '✓ Editando formación' : 'Editar formación';
    saveBtn.style.display = editando ? '' : 'none';
    pintar();
  };
  saveBtn.onclick = function(){
    var nom = window.prompt('Nombre para tu formación:', String(L.formacion).replace(' (editada)','') + ' mía');
    if(!nom) return;
    state.formacionesCat = state.formacionesCat || {};
    state.formacionesCat[cat] = state.formacionesCat[cat] || {};
    state.formacionesCat[cat][L.formato] = state.formacionesCat[cat][L.formato] || {};
    state.formacionesCat[cat][L.formato][nom] = cleanJson(L.puestos);
    L.mia = true; L.tocada = false; L.formacion = nom;
    persist(); fillForms(); pintar();
  };

  function pintar(){
    pitch.classList.toggle('editando', editando);
    [].slice.call(pitch.querySelectorAll('.slot')).forEach(function(e){ e.remove(); });
    L.puestos.forEach(function(s,i){
      var pid = L.asign[i], pl = pid ? state.players.find(function(x){ return x.id===pid; }) : null;
      var d = document.createElement('div');
      d.className = 'slot' + (pl?' filled':'') + (pick && pick.t==='slot' && pick.i===i ? ' sel':'');
      d.style.left = s.x + '%'; d.style.top = s.y + '%';
      d.innerHTML = '<div class="disc">' + (pl ? avatarInner(pl) : '+') + '</div>' +
        '<div class="nm">' + (pl ? escHtml(pl.name.split(' ').slice(0,2).join(' ')) : posName(s.p)) + '</div>' +
        (pl ? '<div class="ps">' + s.p + '</div>' : '');
      engancharArrastre(d, i);
      if(!editando) d.onclick = function(){ tocarSlot(i); };
      pitch.appendChild(d);
    });
    var usados = Object.keys(L.asign).map(function(k){ return L.asign[k]; });
    var lista = categoryPlayers();
    var ents = lista.filter(function(p){ return L.entraron[p.id] && usados.indexOf(p.id)<0; });
    el.querySelector('#luCnt').textContent = usados.length + ' titulares · ' + ents.length + ' entraron · ' +
      (lista.length - usados.length - ents.length) + ' no jugaron';

    var box = el.querySelector('#luList'); box.innerHTML = '';
    function grupo(titulo, arr, tipo){
      var h = document.createElement('div'); h.className='lu-h'; h.textContent = titulo + ' (' + arr.length + ')';
      box.appendChild(h);
      if(!arr.length){ var e2=document.createElement('div'); e2.className='lu-empty'; e2.textContent='—'; box.appendChild(e2); return; }
      arr.forEach(function(p){
        var ent = !!L.entraron[p.id];
        var it = document.createElement('div');
        it.className = 'lu-item' + (pick && pick.t==='player' && pick.id===p.id ? ' sel':'') + (tipo==='banca'&&ent?' entro':'');
        it.innerHTML = '<div class="lu-av">' + avatarInner(p) + '</div>' +
          '<div class="lu-n"><b>' + escHtml(p.name) + '</b><span>' + posName(p.pos) + '</span></div>' +
          (tipo==='tit' ? '<span class="lu-tag tit">TITULAR</span>'
                        : '<button class="lu-in-btn' + (ent?' on':'') + '">' + (ent?'✓ ENTRÓ':'ENTRÓ') + '</button>');
        if(tipo==='banca') it.querySelector('.lu-in-btn').onclick = function(ev){
          ev.stopPropagation(); L.entraron[p.id] = !ent; if(!L.entraron[p.id]) delete L.entraron[p.id];
          persist(); pintar();
        };
        it.onclick = function(){
          if(pick && pick.t==='slot'){
            Object.keys(L.asign).forEach(function(k){ if(L.asign[k]===p.id) delete L.asign[k]; });
            L.asign[pick.i] = p.id; delete L.entraron[p.id]; pick=null;
          } else if(pick && pick.t==='player' && pick.id===p.id){ pick=null; }
          else if(tipo==='tit'){ Object.keys(L.asign).forEach(function(k){ if(L.asign[k]===p.id) delete L.asign[k]; }); pick=null; }
          else pick={t:'player', id:p.id};
          persist(); pintar();
        };
        box.appendChild(it);
      });
    }
    grupo('En cancha', lista.filter(function(p){ return usados.indexOf(p.id)>=0; }), 'tit');
    grupo('Banca', lista.filter(function(p){ return usados.indexOf(p.id)<0; }), 'banca');

    el.querySelector('#luHint').textContent = pick
      ? (pick.t==='player' ? 'Ahora toca una posición en la cancha.' : 'Toca otra posición para intercambiar, o un jugador de la banca.')
      : (editando ? 'Arrastra las fichas: el puesto cambia según la zona.' : 'Toca un jugador y luego una posición. Para mover la formación, activa “Editar formación”.');

    pintarFilas();
  }
  function tocarSlot(i){
    if(pick && pick.t==='player'){
      Object.keys(L.asign).forEach(function(k){ if(L.asign[k]===pick.id) delete L.asign[k]; });
      L.asign[i] = pick.id; delete L.entraron[pick.id]; pick=null;
    } else if(pick && pick.t==='slot'){
      var a=L.asign[pick.i], b=L.asign[i];
      if(b) L.asign[pick.i]=b; else delete L.asign[pick.i];
      if(a) L.asign[i]=a; else delete L.asign[i];
      pick=null;
    } else pick = {t:'slot', i:i};
    persist(); pintar();
  }
  function engancharArrastre(d, i){
    d.addEventListener('pointerdown', function(ev){
      if(ev.button) return;
      if(!editando) return; // sin modo edición el dedo sirve para hacer scroll
      var moved=false, sx=ev.clientX, sy=ev.clientY;
      try{ d.setPointerCapture(ev.pointerId); }catch(_){}
      function mv(e){
        if(!moved && Math.abs(e.clientX-sx)+Math.abs(e.clientY-sy)<6) return;
        if(!moved){ moved=true; d.classList.add('drag'); pitch.classList.add('dragging'); }
        var r = pitch.getBoundingClientRect();
        var pos = acomodarFicha(L.puestos, i, (e.clientX-r.left)/r.width*100, (e.clientY-r.top)/r.height*100);
        L.puestos[i].x = pos.x; L.puestos[i].y = pos.y;
        var np = puestoPorZona(pos.x, pos.y);
        if(np !== L.puestos[i].p){
          L.puestos[i].p = np;
          var et=d.querySelector('.ps'); if(et) et.textContent = np;
          var nm=d.querySelector('.nm'); if(nm && !L.asign[i]) nm.textContent = posName(np);
        }
        d.style.left = pos.x+'%'; d.style.top = pos.y+'%';
      }
      function up(){
        try{ d.releasePointerCapture(ev.pointerId); }catch(_){}
        d.removeEventListener('pointermove', mv); d.removeEventListener('pointerup', up);
        d.classList.remove('drag'); pitch.classList.remove('dragging');
        if(moved){ if(!L.tocada){ L.tocada = true; L.mia = false; fillForms(); } persist(); pintar(); }
        else tocarSlot(i);
      }
      d.addEventListener('pointermove', mv); d.addEventListener('pointerup', up);
    });
  }
  // solo se califica a quienes jugaron
  function pintarFilas(){
    rowsWrap.innerHTML = '';
    var jug = jugaronEn(matchDate);
    if(!jug.length){
      rowsWrap.innerHTML = '<div class="focus-box" style="text-align:center;color:var(--ink-faint);font-size:13px;">' +
        'Arma la alineación arriba y aquí aparecerán los jugadores para calificar.</div>';
      return;
    }
    var h = document.createElement('div');
    h.className = 'focus-title';
    h.style.cssText = 'margin:26px 0 12px;';
    h.textContent = 'Calificación · ' + jug.length + ' jugaron';
    rowsWrap.appendChild(h);
    jug.forEach(function(o){ rowsWrap.appendChild(renderMatchRow(o.p, matchDate, o.pos, o.titular)); });
  }

  fillForms(); pintar();
  return el;
}

function renderMatchRow(p, dateStr, posJugada, esTitular){
  var existingEntry = p.historial.find(function(h){ return h.type==='partido' && h.date===dateStr; });
  var draft = {
    convocado: true,
    rating: existingEntry ? existingEntry.rating : null,
    feedback: existingEntry ? (existingEntry.feedback||'') : '',
    goles: existingEntry ? (existingEntry.goles||0) : 0,
    asistencias: existingEntry ? (existingEntry.asistencias||0) : 0,
    pos: posJugada || (existingEntry && existingEntry.pos) || p.pos,
    quick: existingEntry ? Object.assign({}, existingEntry.quickValues||{}) : {}
  };

  var row = document.createElement('div');
  row.className = 'player-row' + (existingEntry ? ' done' : '');

  var initials = avatarInner(p);

  row.innerHTML =
    '<div class="player-row-top">' +
      '<div class="avatar">' + initials + '</div>' +
      '<div class="player-name-block">' +
        '<div class="player-name">' + p.name + (existingEntry ? ' <span style="font-size:11px;color:var(--ink-faint);font-weight:400;">(ya registrado — editable)</span>' : '') + '</div>' +
        '<div class="player-meta">' + posName(draft.pos) + ' · ' + (esTitular===false ? 'Entró de cambio' : 'Titular') + ' · Valoración actual ' + p.valoracion + '</div>' +
      '</div>' +
      '<div class="attend-toggle">' +
        '<button class="on-yes sel">Jugó</button>' +
        '<button class="on-no">No jugó</button>' +
      '</div>' +
    '</div>' +
    '<div class="rating-body" style="display:block"></div>';

  var btnYes = row.querySelector('.on-yes');
  var btnNo = row.querySelector('.on-no');
  var ratingBody = row.querySelector('.rating-body');

  btnYes.onclick = function(){ draft.convocado = true; renderRatingBody(); refreshRowChrome(); };
  btnNo.onclick = function(){
    draft.convocado = false; draft.rating=null; draft.feedback='';
    if(existingEntry){ // si ya estaba calificado en este partido, ese registro se quita (con sus goles y asistencias)
      p.goles -= (existingEntry.goles||0); p.asistencias -= (existingEntry.asistencias||0);
      p.historial = p.historial.filter(function(h){ return h!==existingEntry; });
      existingEntry = null; row.classList.remove('done');
      persist();
    }
    ratingBody.style.display='none'; refreshRowChrome();
  };

  function refreshRowChrome(){
    btnYes.className = 'on-yes' + (draft.convocado===true?' sel':'');
    btnNo.className = 'on-no' + (draft.convocado===false?' sel':'');
    ratingBody.style.display = draft.convocado===true ? 'block' : 'none';
  }

  function renderRatingBody(){
    var quickAttrs = quickAttrsFor(draft.pos, null); // partido: sin filtro de "qué se trabajó", va completo, según la posición en que jugó

    ratingBody.innerHTML =
      '<div class="rating-block">' +
        '<div class="rating-label">Posición en la que jugó este partido</div>' +
        '<select class="cat-select match-pos">' + matchPosOptions(p, draft.pos) + '</select>' +
        '<div class="rating-label" style="margin-top:14px;">¿Qué tal fue en el partido? (1 a 10)</div>' +
        '<div class="rating-scale"></div>' +
        '<div class="rating-label" style="margin-top:14px;">Goles y asistencias en este partido (opcional)</div>' +
        '<div class="match-stat-row">' +
          '<label>Goles <input type="number" min="0" class="match-num" id="golesInput" value="' + draft.goles + '" /></label>' +
          '<label>Asistencias <input type="number" min="0" class="match-num" id="asisInput" value="' + draft.asistencias + '" /></label>' +
        '</div>' +
        '<div class="rating-label" style="margin-top:14px;">Calificación rápida — todo lo que le exige este puesto en partido</div>' +
        '<div class="quick-attrs"></div>' +
        '<div class="rating-label" style="margin-top:14px;">Retroalimentación escrita (opcional)</div>' +
        '<textarea class="fb-textarea" placeholder="Ej: bien plantado tácticamente, pero perdió varios duelos aéreos…"></textarea>' +
        '<div class="save-row"><button class="btn-save-player">' + (existingEntry ? 'Actualizar' : 'Guardar') + '</button></div>' +
      '</div>';

    var scale = ratingBody.querySelector('.rating-scale');
    for(var i=1;i<=RATING_MAX;i++){
      (function(i){
        var b = document.createElement('button');
        b.textContent = i;
        if(draft.rating===i) b.classList.add('sel');
        b.onclick = function(){
          draft.rating = i;
          scale.querySelectorAll('button').forEach(function(x){x.classList.remove('sel');});
          b.classList.add('sel');
        };
        scale.appendChild(b);
      })(i);
    }

    var golesInput = ratingBody.querySelector('#golesInput');
    var asisInput = ratingBody.querySelector('#asisInput');
    golesInput.oninput = function(){ draft.goles = parseInt(golesInput.value,10) || 0; };
    asisInput.oninput = function(){ draft.asistencias = parseInt(asisInput.value,10) || 0; };
    ratingBody.querySelector('.match-pos').onchange = function(e){ draft.pos = e.target.value; renderRatingBody(); };

    var quickWrap = ratingBody.querySelector('.quick-attrs');
    if(quickAttrs.length===0){
      quickWrap.innerHTML = '<div style="font-size:12px;color:var(--ink-faint);">Este puesto no tiene atributos por encima del umbral (≥ ' + QUICK_THRESHOLD + '/10) — configúrelo en "Perfil de exigencia".</div>';
    } else {
      quickAttrs.forEach(function(a){
        var qrow = document.createElement('div');
        qrow.className = 'quick-attr-row';
        qrow.innerHTML = '<div class="quick-attr-label">' + a.label + '</div><div class="quick-attr-scale"></div>';
        var qscale = qrow.querySelector('.quick-attr-scale');
        for(var i=1;i<=RATING_MAX;i++){
          (function(i){
            var qb = document.createElement('button');
            qb.textContent = i;
            if(draft.quick[a.key]===i) qb.classList.add('sel');
            qb.onclick = function(){
              draft.quick[a.key] = i;
              qscale.querySelectorAll('button').forEach(function(x){x.classList.remove('sel');});
              qb.classList.add('sel');
            };
            qscale.appendChild(qb);
          })(i);
        }
        quickWrap.appendChild(qrow);
      });
    }

    var textarea = ratingBody.querySelector('.fb-textarea');
    textarea.value = draft.feedback || '';
    textarea.oninput = function(){ draft.feedback = textarea.value; };

    var saveBtn = ratingBody.querySelector('.btn-save-player');
    saveBtn.disabled = false;
    saveBtn.onclick = function(){
      if(draft.rating==null){ return; }
      var quickKeys = Object.keys(draft.quick);
      var quickRatings = quickKeys.map(function(k){
        return {key:k, value:draft.quick[k], weight:pw(profileFor(p.categoria, draft.pos || p.pos), k)};
      });
      var hits = analyzeFeedback(draft.feedback||'', draft.pos || p.pos, quickKeys);
      var newDelta = computeDelta(draft.rating, hits, quickRatings);
      var attrsHitLabels = quickRatings.map(function(q){
        var a = attrsFor(p.categoria).find(function(x){return x.key===q.key;}) || {label:q.key};
        return a.label + ' (' + q.value + '/10)';
      }).concat(hits.map(function(h){return h.label + ' (texto)';}));
      var displayComment = draft.feedback || (quickRatings.length ? '(calificado por atributos, sin comentario escrito)' : '(sin comentario)');
      var quickValuesObj = {};
      quickKeys.forEach(function(k){ quickValuesObj[k] = draft.quick[k]; });

      if(existingEntry){
        p.valoracion += (newDelta - existingEntry.delta);
        p.goles += (draft.goles - (existingEntry.goles||0));
        p.asistencias += (draft.asistencias - (existingEntry.asistencias||0));
        existingEntry.rating = draft.rating;
        existingEntry.delta = newDelta;
        existingEntry.goles = draft.goles;
        existingEntry.asistencias = draft.asistencias;
        existingEntry.feedback = draft.feedback||'';
        existingEntry.comment = displayComment;
        existingEntry.attrsHit = attrsHitLabels;
        existingEntry.quickValues = quickValuesObj;
      } else {
        p.valoracion += newDelta;
        p.goles += draft.goles;
        p.asistencias += draft.asistencias;
        existingEntry = {
          type:'partido', date: dateStr, asistio:true,
          rating: draft.rating, delta: newDelta,
          goles: draft.goles, asistencias: draft.asistencias,
          feedback: draft.feedback||'', comment: displayComment,
          quickValues: quickValuesObj, attrsHit: attrsHitLabels
        };
        p.historial.unshift(existingEntry);
      }
      existingEntry.pos = draft.pos || p.pos; persist();
      saveBtn.textContent = 'Guardado ✓';
      saveBtn.classList.add('saved');
      row.classList.add('done');
    };
    setupAutoSave(ratingBody, draft, existingEntry);
  }

  if(draft.convocado===true) renderRatingBody();
  return row;
}

/* ============ RENDER: CARTAS ============ */
function sparkPath(hist){
  // con menos de tres registros la gráfica es una raya recta que no dice nada: mejor no dibujarla
  if(hist.length<3) return '';
  var vals = hist.slice().reverse().map(function(h){return h.delta;});
  var running = [];
  var acc = 0;
  vals.forEach(function(v){ acc+=v; running.push(acc); });
  var min = Math.min.apply(null, running), max = Math.max.apply(null, running);
  var range = (max-min)||1;
  var w=200, h=26, step = w/(running.length-1);
  var pts = running.map(function(v,i){
    var x = i*step;
    var y = h - ((v-min)/range)*h;
    return x.toFixed(1)+','+y.toFixed(1);
  });
  return pts.join(' ');
}

function formBadge(hist){
  var recent = hist.slice(0,3);
  if(!recent.length) return {label:'Sin registros aún', cls:''};
  var sum = recent.reduce(function(s,h){return s+(h.delta||0);},0);
  if(sum > 1) return {label:'Buen momento', cls:'up'};
  if(sum < -1) return {label:'En construcción', cls:'down'};
  return {label:'Rendimiento constante', cls:''};
}
function bestAttribute(hist){
  var avgs = attributeAverages(hist);
  return avgs.length ? avgs[0] : null;
}
function recentHighlight(hist){
  var found = hist.find(function(h){ return h.delta > 0 && h.feedback && h.feedback.trim().length > 3; });
  return found || null;
}

function f2Nombre1(p){ return String(p.name||'').split(' ')[0]; }

/* ---------- números del jugador ---------- */
function f2Racha(p){
  var e = (p.historial||[]).filter(function(h){ return h.type!=='partido'; }).slice().sort(function(a,b){ return String(a.date).localeCompare(String(b.date)); });
  var cur = 0, best = 0;
  e.forEach(function(h){ if(h.asistio===false) cur = 0; else { cur++; if(cur>best) best = cur; } });
  return {cur:cur, best:best};
}
function f2PorMes(p){
  var m = {};
  (p.historial||[]).forEach(function(h){
    var k = String(h.date||'').slice(0,7); if(!k) return;
    var o = m[k] || (m[k] = {ents:0, faltas:0, goles:0, asist:0});
    if(h.type!=='partido'){ o.ents++; if(h.asistio===false) o.faltas++; }
    o.goles += h.goles||0; o.asist += h.asistencias||0;
  });
  return m;
}
function f2Nota(p){
  var c = (p.historial||[]).filter(function(h){ return typeof h.rating==='number' && h.asistio!==false; });
  return c.length ? (c.reduce(function(a,h){ return a+h.rating; },0)/c.length).toFixed(1).replace('.',',') : '—';
}
function f2Stats(p){ return [[p.goles||0,'GOL'],[p.asistencias||0,'ASI'],[f2Nota(p),'NOTA'],[f2Racha(p).cur,'RACHA']]; }

/* ---------- la carta especial ---------- */
function f2Card(p, cls, o){
