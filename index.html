function seedPlayers(categoria){
  var today = new Date();
  function daysAgo(n){ var d=new Date(today); d.setDate(d.getDate()-n); return d.toISOString().slice(0,10); }
  var seedHist = [
    {pos:'DFC1', comments:['Muy sólido marcando, recuperó muchos balones y mantuvo buena actitud todo el entrenamiento.', 'Le costó un poco el pase largo, pero defendió bien uno contra uno.']},
    {pos:'MCO', comments:['Excelente visión de juego, varios pases entre líneas y buena resistencia durante todo el trabajo.', 'Bajó el ritmo en el segundo tiempo del entrenamiento, se cansó rápido.']},
    {pos:'DC', comments:['Definición muy clara, dos remates a portería en el trabajo de finalización.', 'Poca participación en la recuperación, pero es esperable en su posición.']},
    {pos:'ED', comments:['Muy rápido en las bandas, generó desborde constante.', 'Necesita mejorar la actitud al momento de replegar en defensa.']}
  ];
  return NAMES.map(function(name, i){
    var pos = POSITIONS[i % POSITIONS.length].code;
    var base = 58 + Math.round(Math.random()*14);
    var hist = [];
    var val = base;
    for(var d=5; d>=1; d--){
      var delta = [3,-1,4,2,-2][d-1] || 2;
      val += delta;
      var sample = seedHist[i % seedHist.length];
      var txt = sample.comments[d % sample.comments.length];
      hist.push({
        type:'entrenamiento',
        date: daysAgo(d*4),
        asistio:true,
        rating: 6 + (delta>0?2:0),
        delta: delta,
        feedback: txt,
        comment: txt,
        quickValues: {},
        attrsHit: []
      });
    }
    return {
      id: categoria + '-p' + i,
      name:name,
      categoria: categoria,
      pos:pos,
      goles: Math.round(Math.random()*6),
      asistencias: Math.round(Math.random()*5),
      valoracion: val,
      historial: hist
    };
  });
}

var STORAGE_KEY = 'jogobonito_preview_v4';
var state = null;
var sessionEnteredClub = null; // navegación local de esta pestaña — nunca se guarda ni se comparte
var visitorCategoria = CATEGORIES[0]; // categoría que está mirando un visitante — tampoco se comparte
var currentUser = null; // {email, role, categoria} según el inicio de sesión — no se guarda en el estado compartido

// CATEGORIES es el mismo arreglo que usa CLUBS: se actualiza en sitio con lo que haya en la base de datos
function syncCategories(list){
  CATEGORIES.length = 0;
  (list||[]).forEach(function(c){ CATEGORIES.push(c); });
  if(CATEGORIES.indexOf(visitorCategoria)===-1) visitorCategoria = CATEGORIES[0];
}

function normalizeState(s){
  if(!s || !Array.isArray(s.players)) return null;
  try{
    if(!Array.isArray(s.categories) || !s.categories.length) s.categories = ['Sub-13','Sub-15','Sub-17'];
    s.players.forEach(function(p){
      if(!p.categoria) p.categoria = s.categories[0];
      if(s.categories.indexOf(p.categoria)===-1) s.categories.push(p.categoria); // nunca se borra un jugador por tener una categoría desconocida
      p.pos = normalizePos(p.pos) || 'MC';
      p.name = String(p.name||'').replace(/[<>&"]/g,'').trim() || 'Jugador'; // un nombre nunca puede traer código
      p.posExtra = (Array.isArray(p.posExtra) ? p.posExtra : []).map(normalizePos).filter(function(c, i, a){ return c && c!==p.pos && a.indexOf(c)===i; });
      if(typeof p.valoracion !== 'number') p.valoracion = 60;
      if(typeof p.goles !== 'number') p.goles = 0;
      if(typeof p.asistencias !== 'number') p.asistencias = 0;
      if(!Array.isArray(p.historial)) p.historial = [];
      p.historial.forEach(function(h){
        if(!h.type) h.type = 'entrenamiento';
        if(!h.quickValues) h.quickValues = {};
        if(typeof h.feedback !== 'string') h.feedback = (h.comment && h.comment.indexOf('(')!==0) ? h.comment : '';
        h.feedback = h.feedback.replace(/[<>]/g,'');
        if(typeof h.comment === 'string') h.comment = h.comment.replace(/[<>]/g,'');
      });
    });
    if(!s.profiles) s.profiles = {};
    if(!s.profiles.DFC && s.profiles.DFC1) s.profiles.DFC = s.profiles.DFC1;
    if(!s.profiles.EXT && s.profiles.ED) s.profiles.EXT = s.profiles.ED;
    POSITIONS.forEach(function(pos){
      var def = DEFAULT_PROFILES[pos.code];
      var cur = s.profiles[pos.code] || {};
      BASE_ATTRS.forEach(function(a){ if(typeof cur[a.key] !== 'number') cur[a.key] = def[a.key]; });
      s.profiles[pos.code] = cur;
    });
    s.activePos = normalizePos(s.activePos) || 'MCO';
    if(!Array.isArray(s.trainingSchedule)) s.trainingSchedule = [1,3,5]; // lun, mié, vie por defecto
    if(!s.trainingDays || typeof s.trainingDays !== 'object') s.trainingDays = {};
    if(['admin','profesor','visitante'].indexOf(s.role)===-1) s.role = 'admin';
    if(!s.selectedCategoria || s.categories.indexOf(s.selectedCategoria)===-1) s.selectedCategoria = s.categories[0];
    if(!s.profesorCategoria || s.categories.indexOf(s.profesorCategoria)===-1) s.profesorCategoria = s.categories[0];
    if(typeof s.enteredClub === 'undefined') s.enteredClub = null;
    if(!s.categoryLevels || typeof s.categoryLevels !== 'object') s.categoryLevels = {};
    if(!s.categoryWeights || typeof s.categoryWeights !== 'object') s.categoryWeights = {};
    if(!s.lineups || typeof s.lineups !== 'object') s.lineups = {};
    if(!s.formacionesCat || typeof s.formacionesCat !== 'object') s.formacionesCat = {};
    if(!s.formatoCat || typeof s.formatoCat !== 'object') s.formatoCat = {};
    if(!s.categoryProfiles || typeof s.categoryProfiles !== 'object') s.categoryProfiles = {};
    if(!s.trainingSchedules || typeof s.trainingSchedules !== 'object') s.trainingSchedules = {};
    s.players.forEach(function(p){ recomputeRating(p, s.categoryLevels, s.categoryWeights); });
    syncCategories(s.categories);
    return s;
  }catch(e){ return null; }
}

function freshState(){
  var cats = ['Sub-13','Sub-15','Sub-17'];
  var allPlayers = [];
  cats.forEach(function(cat){ allPlayers = allPlayers.concat(seedPlayers(cat)); });
  allPlayers.forEach(function(p){ recomputeRating(p, {}); });
  syncCategories(cats);
  return {
    categories: cats.slice(),
    categoryLevels: {},
    categoryWeights: {},
    categoryProfiles: {},
    trainingSchedules: {},
    players: allPlayers,
    profiles: JSON.parse(JSON.stringify(DEFAULT_PROFILES)),
    activePos:'MCO',
    trainingSchedule: [1,3,5],
    trainingDays: {},
    role: 'admin',
    selectedCategoria: CATEGORIES[0],
    profesorCategoria: CATEGORIES[0],
    enteredClub: null
  };
}

function bootFromLocalOrFresh(){
  var loaded = null;
  try{
    var raw = localStorage.getItem(STORAGE_KEY);
    if(raw) loaded = normalizeState(JSON.parse(raw));
  }catch(e){ loaded = null; }
  state = loaded || freshState();
}

/* ============ GUARDADO SEGURO EN FIRESTORE ============ */
// Los datos se guardan en piezas separadas, cada una con su propio permiso en las reglas de Firebase:
//   club/general            categorías y perfil de exigencia predeterminado — lo lee cualquiera, lo edita solo el administrador
//   categorias/{categoría}  todo lo privado de una categoría (comentarios, asistencia, horario, exigencia, perfil propio)
//                           — solo lo leen y editan el administrador y el profesor de esa categoría
//   publico/{categoría}     lo que muestran las cartas públicas, sin comentarios privados — lo lee cualquiera
var remote = {general:null, generalMissing:false, pub:{}, priv:{}, privReady:false, privUnsub:null};
var syncedJson = {};      // lo que creemos que ya está guardado, para escribir solo lo que cambió
var pendingRebuild = false, migrating = false;
function cleanJson(o){ return JSON.parse(JSON.stringify(o)); }
function publicPlayer(p){
  var hl = recentHighlight(p.historial||[]); // el único comentario que se publica es el destacado positivo que ya se mostraba
  return {id:p.id, name:p.name, categoria:p.categoria, pos:p.pos, posExtra:p.posExtra||[], goles:p.goles||0, asistencias:p.asistencias||0,
    historial:(p.historial||[]).map(function(h){
      return {type:h.type, date:h.date, delta:h.delta, rating:h.rating, asistio:h.asistio, pos:h.pos||p.pos, quickValues:h.quickValues||{},
        attrsHit:h.attrsHit||[], goles:h.goles||0, asistencias:h.asistencias||0,
        feedback: h===hl ? (h.feedback||'') : '', comment: h===hl ? (h.comment||'') : ''};
    })};
}
function buildDocs(s){
  var docs = {};
  docs['datos/general'] = cleanJson({categories:s.categories, profiles:s.profiles, attrs:s.clubAttrs || {extra:[], labels:{}}, v:2});
  s.categories.forEach(function(cat){
    var players = s.players.filter(function(p){ return p.categoria===cat; });
    var td = {};
    Object.keys(s.trainingDays||{}).forEach(function(k){ if(k.indexOf(cat+'::')===0) td[k.slice(cat.length+2)] = s.trainingDays[k]; });
    var lu = {};
    Object.keys(s.lineups||{}).forEach(function(k){ if(k.indexOf(cat+'::')===0) lu[k.slice(cat.length+2)] = s.lineups[k]; });
    var level = (s.categoryLevels||{})[cat] || null;
    var weights = (s.categoryWeights||{})[cat] || null;
    docs['categorias/'+cat] = cleanJson({nombre:cat, players:players, trainingDays:td, level:level, weights:weights,
      lineups:lu, formaciones:(s.formacionesCat||{})[cat] || {}, formato:(s.formatoCat||{})[cat] || null,
      profile:(s.categoryProfiles||{})[cat] || {}, schedule:(s.trainingSchedules||{})[cat] || null,
      attrs:(s.categoryAttrs||{})[cat] || {extra:[], labels:{}}});
    docs['publico/'+cat] = cleanJson({nombre:cat, level:level, weights:weights, attrs:(s.categoryAttrs||{})[cat] || {extra:[], labels:{}}, players:players.map(publicPlayer)});
  });
  return docs;
}
function canWriteDoc(path){
  var role = clubRole();
  if(!role) return false;
  if(role==='admin') return path==='datos/general' || remote.privReady;
  if(role==='profesor' && currentUser.categoria){
    return remote.privReady && (path==='categorias/'+currentUser.categoria || path==='publico/'+currentUser.categoria);
  }
  return false;
}
function syncToFirestore(){
  if(!window.db || !state || !sessionEnteredClub) return;
  var docs = buildDocs(state);
  var batch = db.batch(), n = 0;
  Object.keys(docs).forEach(function(path){
    var js = JSON.stringify(docs[path]);
    if(syncedJson[path]===js || !canWriteDoc(path)) return;
    batch.set(db.doc(clubPath(path)), docs[path]); syncedJson[path] = js; n++;
  });
  if(clubRole()==='admin' && remote.privReady){
    Object.keys(syncedJson).forEach(function(path){ // categorías borradas o renombradas
      if(!docs[path] && /^(categorias|publico)\//.test(path)){ batch.delete(db.doc(clubPath(path))); delete syncedJson[path]; n++; }
    });
  }
  if(n) batch.commit().catch(function(err){ console.error('No se pudo guardar', err); showToast('No se pudo guardar el último cambio (sin permiso o sin conexión). Recarga la página.'); });
}
function showToast(msg){
  var t = document.createElement('div');
  t.textContent = msg;
  t.style.cssText = 'position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#2a0d0d;color:#ffd7d7;border:1px solid rgba(239,106,106,.5);padding:10px 16px;border-radius:10px;font-size:13px;z-index:9999;max-width:90vw;';
  document.body.appendChild(t);
  setTimeout(function(){ t.remove(); }, 6000);
}
function isTyping(){ var a = document.activeElement; return !!(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.type!=='file'); }
function scheduleRebuild(){
  if(isTyping()){ // no reemplazar los datos mientras alguien escribe o mueve una barra; se aplica al salir del campo
    if(!pendingRebuild){
      pendingRebuild = true;
      document.addEventListener('focusout', function h(){ document.removeEventListener('focusout', h); setTimeout(function(){ pendingRebuild = false; rebuildFromRemote(); }, 0); });
    }
    return;
  }
  rebuildFromRemote();
}
function rebuildFromRemote(){
  if(!remote.general){ if(remote.generalMissing) tryMigrate(); return; }
  var g = remote.general, old = state || {};
  var s = {categories:(g.categories||[]).slice(), profiles:cleanJson(g.profiles||{}), players:[], trainingDays:{},
    categoryLevels:{}, categoryWeights:{}, categoryProfiles:{}, trainingSchedules:{}, lineups:{}, formacionesCat:{}, formatoCat:{},
    clubAttrs:cleanJson(g.attrs || {extra:[], labels:{}}), categoryAttrs:{},
    activePos:old.activePos, selectedCategoria:old.selectedCategoria, profesorCategoria:old.profesorCategoria, role:old.role, enteredClub:null};
  s.categories.forEach(function(cat){
    var priv = remote.priv[cat], src = priv || remote.pub[cat];
    if(!src) return;
    s.players = s.players.concat(cleanJson(src.players||[]));
    if(src.level) s.categoryLevels[cat] = src.level;
    if(src.weights) s.categoryWeights[cat] = src.weights;
    if(src.attrs) s.categoryAttrs[cat] = cleanJson(src.attrs);
    if(priv){
      Object.keys(priv.trainingDays||{}).forEach(function(d){ s.trainingDays[cat+'::'+d] = cleanJson(priv.trainingDays[d]); });
      Object.keys(priv.lineups||{}).forEach(function(d){ s.lineups[cat+'::'+d] = cleanJson(priv.lineups[d]); });
      if(priv.formaciones && Object.keys(priv.formaciones).length) s.formacionesCat[cat] = cleanJson(priv.formaciones);
      if(priv.formato) s.formatoCat[cat] = priv.formato;
      if(priv.profile && Object.keys(priv.profile).length) s.categoryProfiles[cat] = cleanJson(priv.profile);
      if(Array.isArray(priv.schedule)) s.trainingSchedules[cat] = priv.schedule.slice();
    }
  });
  var n = normalizeState(s);
  if(!n) return;
  state = n;
  var docs = buildDocs(state);
  syncedJson = {};
  Object.keys(docs).forEach(function(path){
    var cat = path.split('/')[1];
    var exists = path==='datos/general' || (path.indexOf('categorias/')===0 ? !!remote.priv[cat] : !!remote.pub[cat]);
    if(exists) syncedJson[path] = JSON.stringify(docs[path]);
  });
  if(!clubRole() && photoCat !== visitorCategoria) attachPhotos(); // el visitante ve las fotos de la categoría correcta
  safeRender();
}
// Club sin datos todavía (recién creado): se muestra vacío y, si quien entra lo administra, se crea su documento general
function tryMigrate(){
  if(migrating || !remote.generalMissing) return;
  if(!state){ state = normalizeState({players:[], categories:[]}); safeRender(); }
  if(clubRole()==='admin'){ remote.privReady = true; syncedJson = {}; syncToFirestore(); }
}
function detachPrivate(){
  if(remote.privUnsub) remote.privUnsub();
  remote.privUnsub = null; remote.priv = {}; remote.privReady = false;
}
function attachPrivate(){
  detachPrivate();
  var role = clubRole();
  if(!role || !window.db || !sessionEnteredClub) return;
  var onErr = function(err){ console.error('Sin acceso a los datos privados', err); showToast('Tu cuenta no tiene acceso a estos datos. Pide al administrador que revise tu registro.'); };
  if(role==='admin'){
    remote.privUnsub = db.collection(clubPath('categorias')).onSnapshot(function(snap){
      remote.priv = {};
      snap.forEach(function(d){ remote.priv[d.id] = d.data(); });
      var first = !remote.privReady; remote.privReady = true;
      if(first || !snap.metadata.hasPendingWrites) scheduleRebuild();
    }, onErr);
  } else if(role==='profesor' && currentUser.categoria){
    var cat = currentUser.categoria;
    remote.privUnsub = db.collection(clubPath('categorias')).doc(cat).onSnapshot(function(d){
      remote.priv = {};
      if(d.exists) remote.priv[cat] = d.data();
      var first = !remote.privReady; remote.privReady = true;
      if(first || !d.metadata.hasPendingWrites) scheduleRebuild();
    }, onErr);
  }
}
// Fotos: el staff recibe las de todo su club; un visitante solo las de la categoría que está mirando
var photoUnsub = null, photoCat = null;
function detachPhotos(){ if(photoUnsub){ photoUnsub(); photoUnsub = null; } }
function attachPhotos(){
  detachPhotos();
  if(!window.db || !sessionEnteredClub) return;
  var q = db.collection(clubPath('fotos'));
  photoCat = clubRole() ? '*' : (visitorCategoria || '');
  if(!clubRole()) q = q.where('categoria','==', photoCat);
  photoUnsub = q.onSnapshot(function(snap){
    var m = {};
    snap.forEach(function(d){ var v = d.data(); if(v && v.data) m[d.id] = v.data; });
    photoMap = m;
    var pp = document.getElementById('plPhotoPreview');
    if(state && !isTyping() && !(pp && pp.innerHTML)) safeRender();
  }, function(err){ console.error('No se pudieron leer las fotos', err); });
}
// Abrir y cerrar un club: cada club tiene sus propios datos y escuchas
var clubUnsubs = [];
function detachClub(){
  clubUnsubs.forEach(function(u){ try{ u(); }catch(e){} });
  clubUnsubs = [];
  detachPrivate(); detachPhotos();
  remote.general = null; remote.generalMissing = false; remote.pub = {};
  syncedJson = {}; photoMap = {}; state = null;
}
function attachClub(){
  detachClub();
  if(!window.db || !sessionEnteredClub) return;
  clubUnsubs.push(db.doc(clubPath('datos/general')).onSnapshot(function(d){
    if(d.exists){ remote.general = d.data(); remote.generalMissing = false; }
    else { remote.general = null; remote.generalMissing = true; }
    if(!d.metadata.hasPendingWrites) scheduleRebuild();
  }, function(err){
    console.error('No se pudo leer el club', err);
    if(!state){ state = normalizeState({players:[], categories:[]}); safeRender(); }
  }));
  clubUnsubs.push(db.collection(clubPath('publico')).onSnapshot(function(snap){
    remote.pub = {};
    snap.forEach(function(d){ remote.pub[d.id] = d.data(); });
    if(!snap.metadata.hasPendingWrites) scheduleRebuild();
  }, function(err){ console.error('No se pudieron leer las cartas públicas', err); }));
  attachPrivate();
  attachPhotos();

/* ============ HELPERS ============ */
function todayStr(){ return new Date().toISOString().slice(0,10); }
var WEEKDAYS = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
function weekdayOf(dateStr){ return new Date(dateStr+'T00:00:00').getDay(); }
function getTrainingDay(dateStr){
  var key = activeCategoria() + '::' + dateStr;
  if(!state.trainingDays[key]){
    var focus = {};
    attrsFor(activeCategoria()).forEach(function(a){ focus[a.key] = false; }); // todos apagados por defecto — el profesor marca lo que sí se trabajó
    state.trainingDays[key] = { held: null, reason:'', focus: focus, attendance: {}, finalized: false };
  }
  if(!state.trainingDays[key].attendance) state.trainingDays[key].attendance = {};
  return state.trainingDays[key];
}
function posName(code){ var p=POSITIONS.find(function(x){return x.code===code;}); return p?p.name:code; }
function fmtDate(iso){
  var d = new Date(iso+'T00:00:00');
  return d.toLocaleDateString('es-CO', {day:'2-digit', month:'short'});
}
// El perfil de exigencia y el horario son de cada categoría. Si el profesor no ha tocado una posición, se usa la del club.
function profileFor(cat, posCode){
  var ov = state.categoryProfiles && state.categoryProfiles[cat] && state.categoryProfiles[cat][posCode];
  return ov || state.profiles[posCode];
}
function scheduleFor(cat){
  state.trainingSchedules = state.trainingSchedules || {};
  if(!Array.isArray(state.trainingSchedules[cat])) state.trainingSchedules[cat] = (Array.isArray(state.trainingSchedule) ? state.trainingSchedule : [1,3,5]).slice();
  return state.trainingSchedules[cat];
}
function quickAttrsFor(posCode, focus){
  var profile = profileFor(activeCategoria(), posCode);
  return attrsFor(activeCategoria()).filter(function(a){
    if(pw(profile, a.key) < QUICK_THRESHOLD) return false;
    if(focus && !focus[a.key]) return false; // no se trabajó ese día / no aplica
    return true;
  }).sort(function(a,b){ return pw(profile, b.key)-pw(profile, a.key); });
}
function analyzeFeedback(text, posCode, skipKeys){
  var profile = profileFor(activeCategoria(), posCode);
  var lower = text.toLowerCase();
  var hits = [];
  attrsFor(activeCategoria()).forEach(function(a){
    if(skipKeys && skipKeys.indexOf(a.key)!==-1) return; // ya se calificó por atributo, no duplicar
    var words = (KEYWORDS[a.key] || []).concat([a.label.toLowerCase()]);
    var matched = words.some(function(w){ return lower.indexOf(w) !== -1; });
    if(matched){
      var weight = pw(profile, a.key);
      var tier = weight >= 7 ? 'up' : (weight <= 3 ? 'down' : 'neutral');
      hits.push({key:a.key, label:a.label, weight:weight, tier:tier});
    }
  });
  return hits;
}
// Escalones acordados: 4 o menos ya empieza a bajar, 5 es neutro, 6/7 empieza a subir, 10 sube más.
var RATING_STEPS = {1:-2, 2:-2, 3:-1, 4:-1, 5:0, 6:1, 7:1, 8:2, 9:2, 10:3};
function baseDelta(rating){ return RATING_STEPS[rating] !== undefined ? RATING_STEPS[rating] : 0; }
function computeDelta(rating, hits, quickRatings){
  var d = baseDelta(rating);
  // Cada característica pesa según el perfil de exigencia: con 10 sube MÁS si le fue bien y baja MÁS si le fue mal;
  // con 5 se mueve la mitad. Ya no se redondea cada una (antes un 7 y un 10 terminaban valiendo lo mismo).
  (quickRatings||[]).forEach(function(q){
    d += baseDelta(q.value) * (q.weight/RATING_MAX) * 0.8;
  });
  hits.forEach(function(h){
    if(h.tier==='up') d += 1; // mención en texto de algo clave para el puesto: bono chico
    // neutral o no-clave: sin bono, para no duplicar lo que ya califican los atributos rápidos
  });
  return Math.round(d*10)/10;
}

function computeDayReport(dateStr, day){
  var players = categoryPlayers();
  var entries = players.map(function(p){
    return p.historial.find(function(h){ return h.type==='entrenamiento' && h.date===dateStr; });
  }).filter(Boolean);
  var presentes = 0, ausentes = 0;
  presentes = players.filter(function(p){ return day.attendance[p.id]===true; }).length;
  ausentes = players.filter(function(p){ return day.attendance[p.id]===false; }).length;
  var sinMarcar = players.length - presentes - ausentes;
  if(presentes===0 && ausentes===0) return null; // nada registrado todavía este día
  var avgRating = entries.length ? entries.reduce(function(s,e){return s+e.rating;},0)/entries.length : null;
  var quality = 'Sin calificaciones registradas todavía';
  if(avgRating!=null){
    var bd = baseDelta(Math.round(avgRating));
    quality = bd > 0 ? 'Buen entrenamiento' : (bd < 0 ? 'Entrenamiento flojo' : 'Entrenamiento parejo');
  }
  var focusLabels = attrsFor(activeCategoria()).filter(function(a){ return day.focus[a.key]; }).map(function(a){ return a.label; });
  return { presentes:presentes, ausentes:ausentes, sinMarcar:sinMarcar, avgRating:avgRating, quality:quality, focusLabels:focusLabels };
}

    '</div>' +

  var btnYes = row.querySelector('.on-yes');
  var btnNo = row.querySelector('.on-no');

  btnYes.onclick = function(){ draft.asistio = true; day.attendance[p.id] = true; persist(); renderRatingBody(); refreshRowChrome(); };
  btnNo.onclick = function(){
    draft.asistio = false; draft.rating=null; draft.feedback=''; day.attendance[p.id] = false;

      p.historial = p.historial.filter(function(h){ return h!==existingEntry; });
      existingEntry = null; row.classList.remove('done');
    }
    persist(); ratingBody.style.display='none'; refreshRowChrome();
  };

  function refreshRowChrome(){
    btnYes.className = 'on-yes' + (draft.asistio===true?' sel':'');
    btnNo.className = 'on-no' + (draft.asistio===false?' sel':'');
    ratingBody.style.display = draft.asistio===true ? 'block' : 'none';
  }

  function renderRatingBody(){
    var quickAttrs = quickAttrsFor(p.pos, focus);

    ratingBody.innerHTML =
      '<div class="rating-block">' +
        '<div class="rating-label">¿Qué tal fue su entrenamiento en general? (1 a 10)</div>' +
        '<div class="rating-scale"></div>' +

        '<div class="save-row"><button class="btn-save-player">' + (existingEntry ? 'Actualizar' : 'Guardar') + '</button></div>' +
      '</div>';

    var scale = ratingBody.querySelector('.rating-scale');
    for(var i=1;i<=RATING_MAX;i++){
      (function(i){
        var b = document.createElement('button');
        b.textContent = i;
        if(draft.rating===i) b.classList.add('sel');
        b.onclick = function(){
          draft.rating = i;
          scale.querySelectorAll('button').forEach(function(x){x.classList.remove('sel');});
          b.classList.add('sel');
        };
        scale.appendChild(b);
      })(i);
    }

    var quickWrap = ratingBody.querySelector('.quick-attrs');
    if(quickAttrs.length===0){
      quickWrap.innerHTML = '<div style="font-size:12px;color:var(--ink-faint);">Nada de lo marcado en "¿Qué se trabajó este día?" aplica a este puesto — puede quedar solo con la calificación general y, si quiere, un comentario.</div>';
    } else {
      quickAttrs.forEach(function(a){
        var qrow = document.createElement('div');
        qrow.className = 'quick-attr-row';
        qrow.innerHTML = '<div class="quick-attr-label">' + a.label + '</div><div class="quick-attr-scale"></div>';
        var qscale = qrow.querySelector('.quick-attr-scale');
        for(var i=1;i<=RATING_MAX;i++){
          (function(i){
            var qb = document.createElement('button');
            qb.textContent = i;
            if(draft.quick[a.key]===i) qb.classList.add('sel');
            qb.onclick = function(){
              draft.quick[a.key] = i;
              qscale.querySelectorAll('button').forEach(function(x){x.classList.remove('sel');});
              qb.classList.add('sel');
            };
            qscale.appendChild(qb);
          })(i);
        }

    saveBtn.onclick = function(){
      if(draft.rating==null){ return; }
      var quickKeys = Object.keys(draft.quick);
      var quickRatings = quickKeys.map(function(k){
        return {key:k, value:draft.quick[k], weight:pw(profileFor(p.categoria, draft.pos || p.pos), k)};
      });
      var hits = analyzeFeedback(draft.feedback||'', draft.pos || p.pos, quickKeys);
      var newDelta = computeDelta(draft.rating, hits, quickRatings);
      var attrsHitLabels = quickRatings.map(function(q){
        var a = attrsFor(p.categoria).find(function(x){return x.key===q.key;}) || {label:q.key};
        return a.label + ' (' + q.value + '/10)';
      }).concat(hits.map(function(h){return h.label + ' (texto)';}));
      var displayComment = draft.feedback || (quickRatings.length ? '(calificado por atributos, sin comentario escrito)' : '(sin comentario)');
      var quickValuesObj = {};
      quickKeys.forEach(function(k){ quickValuesObj[k] = draft.quick[k]; });

      if(existingEntry){
        p.valoracion += (newDelta - existingEntry.delta);
        existingEntry.rating = draft.rating;
        existingEntry.delta = newDelta;
        existingEntry.feedback = draft.feedback||'';
        existingEntry.comment = displayComment;
        existingEntry.attrsHit = attrsHitLabels;
        existingEntry.quickValues = quickValuesObj;
      } else {
        p.valoracion += newDelta;
        existingEntry = {
          type:'entrenamiento', date: dateStr, asistio:true,
          rating: draft.rating, delta: newDelta,
          feedback: draft.feedback||'', comment: displayComment,
          quickValues: quickValuesObj, attrsHit: attrsHitLabels
        };
        p.historial.unshift(existingEntry);
      }
      existingEntry.pos = draft.pos || p.pos; persist();
      saveBtn.textContent = 'Guardado ✓';
      saveBtn.classList.add('saved');
      row.classList.add('done');
    };
    setupAutoSave(ratingBody, draft, existingEntry);
  }

  if(draft.asistio===true) renderRatingBody();
  return row;
}

// Guardado automático de una fila (entrenamiento o partido): cada toque se guarda solo; el texto, al dejar de escribir.
function setupAutoSave(ratingBody, draft, existingEntry){
  var btn = ratingBody.querySelector('.btn-save-player');
  if(btn && !btn.classList.contains('saved')) btn.textContent = existingEntry ? 'Guardado ✓' : 'Se guarda solo al calificar';
  if(existingEntry && btn) btn.classList.add('saved');
  if(ratingBody.__autoSave) return; // los escuchas se ponen una sola vez por fila
  ratingBody.__autoSave = true;
  var timer = null;
  function schedule(delay){
    clearTimeout(timer);
    timer = setTimeout(function(){
      var b = ratingBody.querySelector('.btn-save-player');
      if(b && draft.rating!=null) b.onclick();
    }, delay);
  }
  ratingBody.addEventListener('click', function(e){
    if(e.target.tagName==='BUTTON' && !e.target.classList.contains('btn-save-player')) schedule(0);
  });
  ratingBody.addEventListener('input', function(e){
    var b = ratingBody.querySelector('.btn-save-player');
    if(b && draft.rating!=null){ b.textContent = 'Guardando…'; b.classList.remove('saved'); }
    schedule(e.target.tagName==='TEXTAREA' ? 900 : 350);
  });
  ratingBody.addEventListener('change', function(e){ if(e.target.tagName==='SELECT') schedule(0); });
}

// Zonas: donde quede la ficha, ese es el puesto
function puestoPorZona(x,y){
  if(y>=85) return 'POR';
  if(y>=62){ if(x<=24) return 'LI'; if(x>=76) return 'LD'; return 'DFC'; }
  if(y>=36){ if(x<=17 || x>=83) return 'EXT'; if(y>=53) return 'MCD'; if(y>=44) return 'MC'; return 'MCO'; }
  if(x<=27 || x>=73) return 'EXT';
  return 'DC';
}
// Alineado automático: la ficha se pega a la línea o columna de sus compañeros
function acomodarFicha(puestos, i, x, y){
  x=Math.round(x*2)/2; y=Math.round(y*2)/2;
  if(Math.abs(x-50)<=3) x=50;
  puestos.forEach(function(o,j){
    if(j===i) return;
    if(Math.abs(o.y-y)<=4.5) y=o.y;
    if(Math.abs(o.x-x)<=3.5) x=o.x;
    if(Math.abs((100-o.x)-x)<=3.5) x=100-o.x;
  });
  return {x:Math.max(6,Math.min(94,x)), y:Math.max(5,Math.min(95,y))};
}
function matchKey(dateStr){ return activeCategoria() + '::' + dateStr; }
function getLineup(dateStr){
  state.lineups = state.lineups || {};
  var k = matchKey(dateStr);
  if(!state.lineups[k]){
    var f = (state.formatoCat||{})[activeCategoria()] || 8;
    var nom = Object.keys(FORMACIONES[f])[0];
    state.lineups[k] = {formato:f, formacion:nom, puestos:cleanJson(FORMACIONES[f][nom]), asign:{}, entraron:{}};
  }
  var L = state.lineups[k];
  if(!Array.isArray(L.puestos) || !L.puestos.length){ L.puestos = cleanJson(FORMACIONES[L.formato||8][L.formacion] || FORMACIONES[8]['3-3-1']); }
  L.asign = L.asign || {}; L.entraron = L.entraron || {};
  return L;
}
// Quiénes jugaron: titulares de la cancha + suplentes marcados como que entraron
function jugaronEn(dateStr){
  var L = getLineup(dateStr), out = [];
  Object.keys(L.asign).forEach(function(i){
    var p = state.players.find(function(x){ return x.id===L.asign[i]; });
    if(p) out.push({p:p, pos:(L.puestos[i]||{}).p || p.pos, titular:true});
  });
  Object.keys(L.entraron).forEach(function(id){
    if(!L.entraron[id]) return;
    if(out.some(function(o){ return o.p.id===id; })) return;
    var p = state.players.find(function(x){ return x.id===id; });
    if(p && p.categoria===activeCategoria()) out.push({p:p, pos:p.pos, titular:false});
  });
  return out;
}

    el.querySelector('#luHint').textContent = pick
      ? (pick.t==='player' ? 'Ahora toca una posición en la cancha.' : 'Toca otra posición para intercambiar, o un jugador de la banca.')
      : (editando ? 'Arrastra las fichas: el puesto cambia según la zona.' : 'Toca un jugador y luego una posición. Para mover la formación, activa “Editar formación”.');

    pintarFilas();
  }
  function tocarSlot(i){
    if(pick && pick.t==='player'){
      Object.keys(L.asign).forEach(function(k){ if(L.asign[k]===pick.id) delete L.asign[k]; });
      L.asign[i] = pick.id; delete L.entraron[pick.id]; pick=null;
    } else if(pick && pick.t==='slot'){
      var a=L.asign[pick.i], b=L.asign[i];
      if(b) L.asign[pick.i]=b; else delete L.asign[pick.i];
      if(a) L.asign[i]=a; else delete L.asign[i];
      pick=null;
    } else pick = {t:'slot', i:i};
    persist(); pintar();
  }
  function engancharArrastre(d, i){
    d.addEventListener('pointerdown', function(ev){
      if(ev.button) return;
      if(!editando) return; // sin modo edición el dedo sirve para hacer scroll
      var moved=false, sx=ev.clientX, sy=ev.clientY;
      try{ d.setPointerCapture(ev.pointerId); }catch(_){}
      function mv(e){
        if(!moved && Math.abs(e.clientX-sx)+Math.abs(e.clientY-sy)<6) return;
        if(!moved){ moved=true; d.classList.add('drag'); pitch.classList.add('dragging'); }
        var r = pitch.getBoundingClientRect();
        var pos = acomodarFicha(L.puestos, i, (e.clientX-r.left)/r.width*100, (e.clientY-r.top)/r.height*100);
        L.puestos[i].x = pos.x; L.puestos[i].y = pos.y;
        var np = puestoPorZona(pos.x, pos.y);
        if(np !== L.puestos[i].p){
          L.puestos[i].p = np;
          var et=d.querySelector('.ps'); if(et) et.textContent = np;
          var nm=d.querySelector('.nm'); if(nm && !L.asign[i]) nm.textContent = posName(np);
        }
        d.style.left = pos.x+'%'; d.style.top = pos.y+'%';
      }
      function up(){
        try{ d.releasePointerCapture(ev.pointerId); }catch(_){}
        d.removeEventListener('pointermove', mv); d.removeEventListener('pointerup', up);
        d.classList.remove('drag'); pitch.classList.remove('dragging');
        if(moved){ if(!L.tocada){ L.tocada = true; L.mia = false; fillForms(); } persist(); pintar(); }
        else tocarSlot(i);
      }
      d.addEventListener('pointermove', mv); d.addEventListener('pointerup', up);
    });
  }
  // solo se califica a quienes jugaron
  function pintarFilas(){
    rowsWrap.innerHTML = '';
    var jug = jugaronEn(matchDate);
    if(!jug.length){
      rowsWrap.innerHTML = '<div class="focus-box" style="text-align:center;color:var(--ink-faint);font-size:13px;">' +
        'Arma la alineación arriba y aquí aparecerán los jugadores para calificar.</div>';
      return;
    }
    var h = document.createElement('div');
    h.className = 'focus-title';
    h.style.cssText = 'margin:26px 0 12px;';
    h.textContent = 'Calificación · ' + jug.length + ' jugaron';
    rowsWrap.appendChild(h);
    jug.forEach(function(o){ rowsWrap.appendChild(renderMatchRow(o.p, matchDate, o.pos, o.titular)); });
  }

  fillForms(); pintar();
  return el;
}

function renderMatchRow(p, dateStr, posJugada, esTitular){
  var existingEntry = p.historial.find(function(h){ return h.type==='partido' && h.date===dateStr; });
  var draft = {
    convocado: true,
    rating: existingEntry ? existingEntry.rating : null,
    feedback: existingEntry ? (existingEntry.feedback||'') : '',
    goles: existingEntry ? (existingEntry.goles||0) : 0,
    asistencias: existingEntry ? (existingEntry.asistencias||0) : 0,
    pos: posJugada || (existingEntry && existingEntry.pos) || p.pos,
    quick: existingEntry ? Object.assign({}, existingEntry.quickValues||{}) : {}
  };

  var row = document.createElement('div');
  row.className = 'player-row' + (existingEntry ? ' done' : '');

  var initials = avatarInner(p);

  row.innerHTML =
    '<div class="player-row-top">' +
      '<div class="avatar">' + initials + '</div>' +
      '<div class="player-name-block">' +
        '<div class="player-name">' + p.name + (existingEntry ? ' <span style="font-size:11px;color:var(--ink-faint);font-weight:400;">(ya registrado — editable)</span>' : '') + '</div>' +
        '<div class="player-meta">' + posName(draft.pos) + ' · ' + (esTitular===false ? 'Entró de cambio' : 'Titular') + ' · Valoración actual ' + p.valoracion + '</div>' +
      '</div>' +
      '<div class="attend-toggle">' +
        '<button class="on-yes sel">Jugó</button>' +
        '<button class="on-no">No jugó</button>' +
      '</div>' +
    '</div>' +
    '<div class="rating-body" style="display:block"></div>';

  var btnYes = row.querySelector('.on-yes');
  var btnNo = row.querySelector('.on-no');
  var ratingBody = row.querySelector('.rating-body');

  btnYes.onclick = function(){ draft.convocado = true; renderRatingBody(); refreshRowChrome(); };
  btnNo.onclick = function(){
    draft.convocado = false; draft.rating=null; draft.feedback='';
    if(existingEntry){ // si ya estaba calificado en este partido, ese registro se quita (con sus goles y asistencias)
      p.goles -= (existingEntry.goles||0); p.asistencias -= (existingEntry.asistencias||0);
      p.historial = p.historial.filter(function(h){ return h!==existingEntry; });
      existingEntry = null; row.classList.remove('done');
      persist();
    }
    ratingBody.style.display='none'; refreshRowChrome();
  };

  function refreshRowChrome(){
    btnYes.className = 'on-yes' + (draft.convocado===true?' sel':'');
    btnNo.className = 'on-no' + (draft.convocado===false?' sel':'');
    ratingBody.style.display = draft.convocado===true ? 'block' : 'none';
  }

  function renderRatingBody(){
    var quickAttrs = quickAttrsFor(draft.pos, null); // partido: sin filtro de "qué se trabajó", va completo, según la posición en que jugó

    ratingBody.innerHTML =
      '<div class="rating-block">' +
        '<div class="rating-label">Posición en la que jugó este partido</div>' +
        '<select class="cat-select match-pos">' + matchPosOptions(p, draft.pos) + '</select>' +
        '<div class="rating-label" style="margin-top:14px;">¿Qué tal fue en el partido? (1 a 10)</div>' +
        '<div class="rating-scale"></div>' +
        '<div class="rating-label" style="margin-top:14px;">Goles y asistencias en este partido (opcional)</div>' +
        '<div class="match-stat-row">' +
          '<label>Goles <input type="number" min="0" class="match-num" id="golesInput" value="' + draft.goles + '" /></label>' +
          '<label>Asistencias <input type="number" min="0" class="match-num" id="asisInput" value="' + draft.asistencias + '" /></label>' +
        '</div>' +
        '<div class="rating-label" style="margin-top:14px;">Calificación rápida — todo lo que le exige este puesto en partido</div>' +
        '<div class="quick-attrs"></div>' +
        '<div class="rating-label" style="margin-top:14px;">Retroalimentación escrita (opcional)</div>' +
        '<textarea class="fb-textarea" placeholder="Ej: bien plantado tácticamente, pero perdió varios duelos aéreos…"></textarea>' +
        '<div class="save-row"><button class="btn-save-player">' + (existingEntry ? 'Actualizar' : 'Guardar') + '</button></div>' +
      '</div>';

    var scale = ratingBody.querySelector('.rating-scale');
    for(var i=1;i<=RATING_MAX;i++){
      (function(i){
        var b = document.createElement('button');
        b.textContent = i;
        if(draft.rating===i) b.classList.add('sel');
        b.onclick = function(){
          draft.rating = i;
          scale.querySelectorAll('button').forEach(function(x){x.classList.remove('sel');});
          b.classList.add('sel');
        };
        scale.appendChild(b);
      })(i);
    }

    var golesInput = ratingBody.querySelector('#golesInput');
    var asisInput = ratingBody.querySelector('#asisInput');
    golesInput.oninput = function(){ draft.goles = parseInt(golesInput.value,10) || 0; };
    asisInput.oninput = function(){ draft.asistencias = parseInt(asisInput.value,10) || 0; };
    ratingBody.querySelector('.match-pos').onchange = function(e){ draft.pos = e.target.value; renderRatingBody(); };

    var quickWrap = ratingBody.querySelector('.quick-attrs');
    if(quickAttrs.length===0){
      quickWrap.innerHTML = '<div style="font-size:12px;color:var(--ink-faint);">Este puesto no tiene atributos por encima del umbral (≥ ' + QUICK_THRESHOLD + '/10) — configúrelo en "Perfil de exigencia".</div>';
    } else {
      quickAttrs.forEach(function(a){
        var qrow = document.createElement('div');
        qrow.className = 'quick-attr-row';
        qrow.innerHTML = '<div class="quick-attr-label">' + a.label + '</div><div class="quick-attr-scale"></div>';
        var qscale = qrow.querySelector('.quick-attr-scale');
        for(var i=1;i<=RATING_MAX;i++){
          (function(i){
            var qb = document.createElement('button');
            qb.textContent = i;
            if(draft.quick[a.key]===i) qb.classList.add('sel');
            qb.onclick = function(){
              draft.quick[a.key] = i;
              qscale.querySelectorAll('button').forEach(function(x){x.classList.remove('sel');});
              qb.classList.add('sel');
            };
            qscale.appendChild(qb);
          })(i);
        }
        quickWrap.appendChild(qrow);
      });
    }

    var textarea = ratingBody.querySelector('.fb-textarea');
    textarea.value = draft.feedback || '';
    textarea.oninput = function(){ draft.feedback = textarea.value; };

    var saveBtn = ratingBody.querySelector('.btn-save-player');
    saveBtn.disabled = false;
    saveBtn.onclick = function(){
      if(draft.rating==null){ return; }
      var quickKeys = Object.keys(draft.quick);
      var quickRatings = quickKeys.map(function(k){
        return {key:k, value:draft.quick[k], weight:pw(profileFor(p.categoria, draft.pos || p.pos), k)};
      });
      var hits = analyzeFeedback(draft.feedback||'', draft.pos || p.pos, quickKeys);
      var newDelta = computeDelta(draft.rating, hits, quickRatings);
      var attrsHitLabels = quickRatings.map(function(q){
        var a = attrsFor(p.categoria).find(function(x){return x.key===q.key;}) || {label:q.key};
        return a.label + ' (' + q.value + '/10)';
      }).concat(hits.map(function(h){return h.label + ' (texto)';}));
      var displayComment = draft.feedback || (quickRatings.length ? '(calificado por atributos, sin comentario escrito)' : '(sin comentario)');
      var quickValuesObj = {};
      quickKeys.forEach(function(k){ quickValuesObj[k] = draft.quick[k]; });

      if(existingEntry){
        p.valoracion += (newDelta - existingEntry.delta);
        p.goles += (draft.goles - (existingEntry.goles||0));
        p.asistencias += (draft.asistencias - (existingEntry.asistencias||0));
        existingEntry.rating = draft.rating;
        existingEntry.delta = newDelta;
        existingEntry.goles = draft.goles;
        existingEntry.asistencias = draft.asistencias;
        existingEntry.feedback = draft.feedback||'';
        existingEntry.comment = displayComment;
        existingEntry.attrsHit = attrsHitLabels;
        existingEntry.quickValues = quickValuesObj;
      } else {
        p.valoracion += newDelta;
        p.goles += draft.goles;
        p.asistencias += draft.asistencias;
        existingEntry = {
          type:'partido', date: dateStr, asistio:true,
          rating: draft.rating, delta: newDelta,
          goles: draft.goles, asistencias: draft.asistencias,
          feedback: draft.feedback||'', comment: displayComment,
          quickValues: quickValuesObj, attrsHit: attrsHitLabels
        };
        p.historial.unshift(existingEntry);
      }
      existingEntry.pos = draft.pos || p.pos; persist();
      saveBtn.textContent = 'Guardado ✓';
      saveBtn.classList.add('saved');
      row.classList.add('done');
    };
    setupAutoSave(ratingBody, draft, existingEntry);
  }

  if(draft.convocado===true) renderRatingBody();
  return row;
}

/* ============ RENDER: CARTAS ============ */
function sparkPath(hist){
  if(hist.length<2) return '';
  var vals = hist.slice().reverse().map(function(h){return h.delta;});
  var running = [];
  var acc = 0;
  vals.forEach(function(v){ acc+=v; running.push(acc); });
  var min = Math.min.apply(null, running), max = Math.max.apply(null, running);
  var range = (max-min)||1;
  var w=200, h=26, step = w/(running.length-1);
  var pts = running.map(function(v,i){
    var x = i*step;
    var y = h - ((v-min)/range)*h;
    return x.toFixed(1)+','+y.toFixed(1);
  });
  return pts.join(' ');
}

function formBadge(hist){
  var recent = hist.slice(0,3);
  if(!recent.length) return {label:'Sin registros aún', cls:''};
  var sum = recent.reduce(function(s,h){return s+(h.delta||0);},0);
  if(sum > 1) return {label:'Buen momento', cls:'up'};
  if(sum < -1) return {label:'En construcción', cls:'down'};
  return {label:'Rendimiento constante', cls:''};
}
function bestAttribute(hist){
  var avgs = attributeAverages(hist);
  return avgs.length ? avgs[0] : null;
}
function recentHighlight(hist){
  var found = hist.find(function(h){ return h.delta > 0 && h.feedback && h.feedback.trim().length > 3; });
  return found || null;
}

// Cuánto mueve la carta un 10 y un 1 en esa característica, según su peso
function effTxt(w){
  if(w < QUICK_THRESHOLD) return 'No se califica aparte en este puesto';
  var q = w>=9 ? 'mucho' : (w>=7 ? 'bastante' : 'poco');
  return 'Pesa <b>' + Math.round(w/RATING_MAX*100) + '%</b> · si le va bien sube <b class="up">' + q + '</b> · si le va mal baja <b class="down">' + q + '</b>';
}

      }).join('') + '</select></div>' : '') +

      '<div class="pos-list" id="posList"></div>' +

    panel.innerHTML = '<h3>' + pos.name + '</h3>' +
      (scope!=='club' ? '<span class="pill" style="margin-bottom:10px;">' + (custom ? 'Personalizado para ' + escHtml(scope) : 'Igual al predeterminado del club') + '</span>' : '') +
      '<div class="desc">' + pos.short + ' — ' + (editable ? 'mueva cada barra de 0 a 10 según qué tanto le exige a un jugador en este puesto. Entre más alta, más sube la carta cuando le va bien en eso y más baja cuando le va mal.' : 'solo lectura.') + ' Desde ' + QUICK_THRESHOLD + '/10, esa cualidad le aparece al profesor como pregunta rápida durante el entrenamiento, sin que tenga que escribir nada.</div>';
    var canEditAttrs = isAdmin ? scope==='club' : true;
    var mine = scope==='club' ? 'club' : 'categoria';
    function attrStore(){
      if(scope==='club'){ state.clubAttrs = state.clubAttrs || {extra:[], labels:{}}; return state.clubAttrs; }
      state.categoryAttrs = state.categoryAttrs || {};
      state.categoryAttrs[scope] = state.categoryAttrs[scope] || {extra:[], labels:{}};
      var st = state.categoryAttrs[scope]; st.extra = st.extra || []; st.labels = st.labels || {};
      return st;
    }
    function setWeight(key, val){
      if(scope!=='club' && !custom){
        // primer cambio en esta posición: la categoría se queda con su propia copia
        state.categoryProfiles = state.categoryProfiles || {};
        state.categoryProfiles[scope] = state.categoryProfiles[scope] || {};
        state.categoryProfiles[scope][pos.code] = Object.assign({}, profile);
        profile = state.categoryProfiles[scope][pos.code];
        custom = true;
      }
      profile[key] = val;
    }
    var head = document.createElement('div');
    head.className = 'attr-head';
    head.innerHTML = '<span>Características</span>' + (canEditAttrs ? '<small>Toca el lápiz para cambiarle el nombre</small>' : '');
    panel.appendChild(head);
    attrsFor(scope).forEach(function(a){
      var row = document.createElement('div');
      row.className = 'attr-row';
      var v = pw(profile, a.key);
      var del = canEditAttrs && a.origen===mine;
      row.innerHTML =
        '<div class="attr-row-top"><span class="name">' + escHtml(a.label) +
          (canEditAttrs ? ' <button class="attr-ic" data-act="ren" title="Cambiar nombre">✎</button>' : '') +
          (del ? '<button class="attr-ic" data-act="del" title="Quitar característica">✕</button>' : '') +
          (a.origen!=='base' ? '<em class="attr-new">' + (a.origen==='club' ? 'del club' : 'propia') + '</em>' : '') +
        '</span><span class="val">' + v + '/10</span></div>' +
        '<input type="range" min="0" max="10" step="1" value="' + v + '"' + (editable?'':' disabled') + ' />' +
        '<div class="attr-eff">' + effTxt(v) + '</div>';
      var input = row.querySelector('input[type=range]');
      var valSpan = row.querySelector('.val'), eff = row.querySelector('.attr-eff');
      input.oninput = function(){
        if(!editable) return;
        var nv = parseInt(input.value,10);
        setWeight(a.key, nv);
        valSpan.textContent = nv + '/10';
        eff.innerHTML = effTxt(nv);
        persist();
        updateSummary();
      };
      var ren = row.querySelector('[data-act=ren]');
      if(ren) ren.onclick = function(){
        var nameEl = row.querySelector('.name');
        nameEl.innerHTML = '<input class="attr-name-in" maxlength="40" value="' + escHtml(a.label) + '" /> <button class="pl-btn small" data-ok>Guardar</button>';
        var inp = nameEl.querySelector('input'); inp.focus(); inp.select();
        function ok(){
          var nl = cleanLabel(inp.value);
          if(nl && nl!==a.label){ attrStore().labels[a.key] = nl; persist(); }
          renderPerfilPanel();
        }
        nameEl.querySelector('[data-ok]').onclick = ok;
        inp.onkeydown = function(e){ if(e.key==='Enter') ok(); if(e.key==='Escape') renderPerfilPanel(); };
      };
      var dl = row.querySelector('[data-act=del]');
      if(dl) dl.onclick = function(){
        if(!dl.classList.contains('sure')){ dl.classList.add('sure'); dl.textContent = '¿Quitar?'; setTimeout(function(){ if(dl.isConnected){ dl.classList.remove('sure'); dl.textContent = '✕'; } }, 3000); return; }
        var st = attrStore();
        st.extra = (st.extra||[]).filter(function(x){ return x.key!==a.key; });
        if(st.labels) delete st.labels[a.key];
        persist(); renderPerfilPanel();
      };
      panel.appendChild(row);
    });
    if(canEditAttrs){
      var addRow = document.createElement('div');
      addRow.className = 'attr-add';
      addRow.innerHTML = '<input maxlength="40" placeholder="Nueva característica (ej: Juego aéreo)" /><button class="pl-btn small">+ Agregar</button>';
      var ain = addRow.querySelector('input');
      function add(){
        var lbl = cleanLabel(ain.value);
        if(!lbl) return;
        if(attrsFor(scope).some(function(x){ return x.label.toLowerCase()===lbl.toLowerCase(); })){ ain.value=''; ain.placeholder = 'Ya existe "' + lbl + '"'; return; }
        var key = 'c_' + lbl.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'_').slice(0,20) + '_' + Date.now().toString(36).slice(-4);
        attrStore().extra.push({key:key, label:lbl});
        persist(); renderPerfilPanel();
      }
      addRow.querySelector('button').onclick = add;
      ain.onkeydown = function(e){ if(e.key==='Enter') add(); };
      panel.appendChild(addRow);
      var note = document.createElement('div');
      note.className = 'attr-note';
      note.textContent = scope==='club'
        ? 'Las que agregues aquí le aparecen a todas las categorías del club. Arrancan en 5/10 en cada posición: ajústalas posición por posición.'
        : 'Las que agregues solo aparecen en ' + scope + '. Arrancan en 5/10 en cada posición: ajústalas posición por posición.';
      panel.appendChild(note);
    }
    var summary = document.createElement('div');
    summary.className = 'summary-box';
    panel.appendChild(summary);
    if(scope!=='club' && editable){
      var resetRow = document.createElement('div');
      resetRow.className = 'save-row';
      resetRow.innerHTML = '<button class="pl-btn ghost small">Volver al predeterminado del club</button>';
      resetRow.querySelector('button').onclick = function(){
        if(!overrides()[pos.code]) return;
        delete state.categoryProfiles[scope][pos.code];
        persist(); render();
      };
      panel.appendChild(resetRow);
    }
    function updateSummary(){
      var sorted = attrsFor(scope).sort(function(x,y){ return pw(profile, y.key)-pw(profile, x.key); });
      var quick = sorted.filter(function(a){ return pw(profile, a.key) >= QUICK_THRESHOLD; });
      var low = sorted.slice(-1)[0];
      var quickTxt = quick.length ? quick.map(function(a){return a.label.toLowerCase();}).join(', ') : 'ninguna todavía';
      summary.innerHTML = 'En "Entrenamiento del día", a un jugador de <b>' + pos.name + '</b> se le va a preguntar directamente por: <b>' + quickTxt + '</b>. Lo que quede por debajo de ' + QUICK_THRESHOLD + '/10 (como <b>' + low.label.toLowerCase() + '</b>, en ' + profile[low.key] + '/10) solo suma si el profesor lo escribe aparte.';
    }
    updateSummary();
  }
  renderPerfilPanel();
  return el;
}

/* ============ RENDER: INFORME SEMESTRAL ============ */
function attributeAverages(hist){
  var sums = {}, counts = {};
  var LIST = attrsFor(activeCategoria());
  LIST.forEach(function(a){ sums[a.key]=0; counts[a.key]=0; });
  hist.forEach(function(h){
    var qv = h.quickValues || {};
    Object.keys(qv).forEach(function(k){
      if(sums[k]===undefined) return;
      sums[k] += qv[k]; counts[k] += 1;
    });
  });
  return LIST.filter(function(a){ return counts[a.key] > 0; })
    .map(function(a){ return {key:a.key, label:a.label, avg: sums[a.key]/counts[a.key], count: counts[a.key]}; })
    .sort(function(x,y){ return y.avg-x.avg; });
}

function renderInforme(){
  var el = document.createElement('div');
  el.innerHTML =
    '<div class="view-head"><div>' +
      '<h1>Informe semestral</h1>' +
      '<p>Se genera solo, a partir de todo lo que se ha registrado del jugador durante el semestre.</p>' +
    '</div></div>' +
    '<div class="informe-select"><select class="cat-select" id="playerSelect"></select></div>' +
    '<div id="informeBody"></div>';

  var players = categoryPlayers();
  var sel = el.querySelector('#playerSelect');
  players.forEach(function(p){
    var o = document.createElement('option');
    o.value = p.id; o.textContent = p.name;
    sel.appendChild(o);
  });
  var body = el.querySelector('#informeBody');

  function renderFor(id){
    var p = players.find(function(x){return x.id===id;});
    var hist = p.historial;
    var entrenamientos = hist.filter(function(h){return h.type==='entrenamiento';});
    var partidos = hist.filter(function(h){return h.type==='partido';});
    var asistidos = entrenamientos.length;
    var diasRegistrados = 0, diasAsistidos = 0;
    Object.keys(state.trainingDays).forEach(function(k){
      if(k.indexOf(activeCategoria()+'::')!==0) return;
      var mark = state.trainingDays[k].attendance ? state.trainingDays[k].attendance[p.id] : undefined;
      if(typeof mark === 'boolean'){ diasRegistrados++; if(mark) diasAsistidos++; }
    });
    var pct = diasRegistrados ? Math.round(diasAsistidos/diasRegistrados*100) : (entrenamientos.length ? 100 : 0);
    pct = Math.max(0, Math.min(100, pct)); // nunca puede pasarse de 100%, así el dato de origen esté incompleto
    var promedio = hist.length ? (hist.reduce(function(s,h){return s+h.rating;},0)/hist.length).toFixed(1) : '—';
    var mejorSesion = hist.slice().sort(function(a,b){return b.delta-a.delta;})[0];
    var startVal = hist.length ? ratingBefore(p, hist.reduce(function(m,h){ return h.date<m ? h.date : m; }, hist[0].date)) : p.valoracion;

    var mentionCount = {};
    hist.forEach(function(h){ (h.attrsHit||[]).forEach(function(a){ mentionCount[a] = (mentionCount[a]||0)+1; }); });
    var topMention = Object.keys(mentionCount).sort(function(a,b){return mentionCount[b]-mentionCount[a];})[0];

    var chron = hist.slice().reverse(); // más antiguo primero, para ver evolución
    var half = Math.ceil(chron.length/2);
    var firstHalf = chron.slice(0, half), secondHalf = chron.slice(half);
    function avgRating(list){ return list.length ? list.reduce(function(s,h){return s+h.rating;},0)/list.length : null; }
    var avgFirst = avgRating(firstHalf), avgSecond = avgRating(secondHalf);
    var tendenciaTxt = 'aún no hay suficientes registros para ver una tendencia clara';
    if(avgFirst!=null && avgSecond!=null && secondHalf.length>=2){
      if(avgSecond - avgFirst >= 0.5) tendenciaTxt = 'ha ido mejorando: pasó de un promedio de ' + avgFirst.toFixed(1) + '/10 a ' + avgSecond.toFixed(1) + '/10 entre la primera y la segunda mitad del semestre';
      else if(avgFirst - avgSecond >= 0.5) tendenciaTxt = 'ha bajado un poco: pasó de un promedio de ' + avgFirst.toFixed(1) + '/10 a ' + avgSecond.toFixed(1) + '/10 entre la primera y la segunda mitad del semestre';
      else tendenciaTxt = 'se ha mantenido estable, alrededor de ' + avgSecond.toFixed(1) + '/10, durante todo el semestre';
    }

    var avgPartidos = avgRating(partidos);
    var mejorPartido = partidos.slice().sort(function(a,b){return b.rating-a.rating;})[0];
    var pctTxt = pct + '%';
    var pctNarrativeTxt = diasRegistrados
      ? ('asistió a ' + diasAsistidos + ' de ' + diasRegistrados + ' entrenamientos programados (' + pct + '%)')
      : (entrenamientos.length ? ('registra ' + entrenamientos.length + ' entrenamientos, todos con asistencia (' + pct + '%) — aún no hay días marcados como "no asistió" en el calendario') : 'todavía no tiene entrenamientos registrados');

    var attrAvgs = attributeAverages(hist);
    var fortalezas = attrAvgs.filter(function(a){ return a.avg >= 7; }).slice(0,3);
    var mejorar = attrAvgs.filter(function(a){ return a.avg < 6; }).sort(function(a,b){return a.avg-b.avg;}).slice(0,3);
    var fortalezasTxt = fortalezas.length ? fortalezas.map(function(a){return a.label + ' (' + a.avg.toFixed(1) + '/10)';}).join(', ') : 'todavía no hay suficientes calificaciones por atributo para destacar una';
    var mejorarTxt = mejorar.length ? mejorar.map(function(a){return a.label + ' (' + a.avg.toFixed(1) + '/10)';}).join(', ') : 'ningún atributo calificado está por debajo de 6/10 todavía';

    function attrListHtml(list, emptyTxt){
      if(!list.length) return '<div style="font-size:12.5px;color:var(--ink-faint);">' + emptyTxt + '</div>';
      return list.map(function(a){
        return '<div class="attr-row-top" style="margin-bottom:6px;"><span class="name">' + a.label + '</span><span class="val">' + a.avg.toFixed(1) + '/10</span></div>';
      }).join('');
    }

    function fullTimelineHtml(){
      if(!hist.length) return '<div style="font-size:12.5px;color:var(--ink-faint);">Todavía no hay entrenamientos ni partidos registrados.</div>';
      return hist.map(function(h){
        var deltaCls = sessionXp(h, p.categoria)>=0?'up':'down';
        var deltaTxt = (sessionXp(h, p.categoria)>=0?'+':'') + sessionXp(h, p.categoria);
        var tipoLabel = h.type==='partido' ? 'Partido' : 'Entrenamiento';
        var golesTxt = h.type==='partido' ? ' · ' + (h.goles||0) + ' gol(es), ' + (h.asistencias||0) + ' asist.' : '';
        return '<div class="tl-item">' +
          '<div class="tl-date"><b>' + tipoLabel + '</b> · ' + fmtDate(h.date) + ' · Calificación ' + h.rating + '/10' + golesTxt + ' · <span class="tl-delta ' + deltaCls + '">' + deltaTxt + ' progreso</span></div>' +
          '<div class="tl-comment">' + h.comment + '</div>' +
          (h.attrsHit && h.attrsHit.length ? '<div style="margin-top:5px;">' + h.attrsHit.map(function(a){return '<span class="attr-chip">' + a + '</span>';}).join('') + '</div>' : '') +
        '</div>';
      }).join('');
    }

    body.innerHTML =
      '<div class="informe-card">' +
        '<div class="informe-header">' +
          '<div><h2>' + p.name + '</h2><div class="sub">' + posName(p.pos) + ' · ' + p.categoria + ' · Semestre en curso</div></div>' +
          '<span class="pill">Valoración ' + startVal + ' → ' + p.valoracion + '</span>' +
        '</div>' +
        '<div class="informe-grid">' +
          '<div class="informe-stat"><div class="n">' + p.goles + '</div><div class="l">Goles</div></div>' +
          '<div class="informe-stat"><div class="n">' + p.asistencias + '</div><div class="l">Asistencias</div></div>' +
          '<div class="informe-stat"><div class="n">' + pctTxt + '</div><div class="l">Asistencia a entreno</div></div>' +
          '<div class="informe-stat"><div class="n">' + promedio + '</div><div class="l">Calificación promedio</div></div>' +
        '</div>' +
        '<svg class="trend-svg" viewBox="0 0 200 40" preserveAspectRatio="none"><polyline points="' + sparkPath(hist).split(' ').map(function(pt){ var xy=pt.split(','); return xy[0]+','+(parseFloat(xy[1])*1.5); }).join(' ') + '" fill="none" stroke="#f65334" stroke-width="2.5"/></svg>' +
        '<div class="informe-narrative">' +
          '<p><b>' + p.name + '</b> juega como <b>' + posName(p.pos) + '</b> en ' + p.categoria + '. En lo que va del semestre acumula ' + hist.length + ' registros — ' + entrenamientos.length + ' entrenamientos y ' + partidos.length + ' partidos — y su valoración pasó de ' + startVal + ' a ' + p.valoracion + ' puntos.</p>' +
          '<p><b>En los entrenamientos:</b> promedia ' + (avgRating(entrenamientos)!=null ? avgRating(entrenamientos).toFixed(1) : '—') + '/10 en calificación general, y ' + tendenciaTxt + '. En cuanto a asistencia, ' + pctNarrativeTxt + '.' + (topMention ? ' La cualidad que más se repitió en las retroalimentaciones del profesor fue <b>' + topMention + '</b>.' : '') + '</p>' +
          (partidos.length ? '<p><b>En los partidos:</b> jugó ' + partidos.length + ' con una calificación promedio de ' + avgPartidos.toFixed(1) + '/10, sumando ' + p.goles + ' goles y ' + p.asistencias + ' asistencias.' + (mejorPartido ? ' Su mejor actuación fue el ' + fmtDate(mejorPartido.date) + ', con calificación ' + mejorPartido.rating + '/10.' : '') + '</p>' : '<p><b>En los partidos:</b> todavía no tiene partidos registrados este semestre.</p>') +
          '<p><b>Fortalezas:</b> ' + fortalezasTxt + '. <b>Puntos a mejorar:</b> ' + mejorarTxt + '.</p>' +
          (mejorSesion ? '<p>Su mejor registro individual fue el ' + fmtDate(mejorSesion.date) + (mejorSesion.type==='partido'?' (partido)':' (entrenamiento)') + ': "' + mejorSesion.comment + '"</p>' : '') +
        '</div>' +
        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px;">' +
          '<div>' +
            '<div class="attr-row-top" style="margin-bottom:8px;"><span class="name">Fortalezas</span></div>' +
            attrListHtml(fortalezas, 'Aún no hay suficientes calificaciones por atributo.') +
          '</div>' +
          '<div>' +
            '<div class="attr-row-top" style="margin-bottom:8px;"><span class="name">Puntos a mejorar</span></div>' +
            attrListHtml(mejorar, 'No hay atributos por debajo de 6/10 todavía.') +
          '</div>' +
        '</div>' +
        '<div style="margin-top:22px;padding-top:16px;border-top:1px solid var(--border);">' +
          '<div class="attr-row-top" style="margin-bottom:10px;"><span class="name">Historial completo — cada entrenamiento y cada partido</span></div>' +
          '<div class="timeline" style="max-height:none;">' + fullTimelineHtml() + '</div>' +
        '</div>' +
      '</div>';
  }
  sel.onchange = function(){ renderFor(sel.value); };
  renderFor(players[0].id);
  return el;
}

/* ============ MAIN RENDER ============ */
function goToLanding(){
  if(window.db) detachClub();
  sessionEnteredClub = null;
  resetClubTheme();
  if(location.hash) history.replaceState(null, '', location.pathname + location.search);
  render();
}
function enterClub(clubId){
  sessionEnteredClub = clubId;
  currentView = 'cartas';
  applyClubTheme(currentClub());
  if(location.hash !== '#/' + clubId) history.replaceState(null, '', '#/' + clubId);
  if(window.db) attachClub();
  render();
}
// Cada club tiene su propia dirección: tusitio/#/jogo-bonito
function routeFromHash(){
  if(location.hash==='#/staff'){
    staffMode = true;
    if(sessionEnteredClub){ if(window.db) detachClub(); sessionEnteredClub = null; resetClubTheme(); }
    render(); staffRedirect(); return;
  }
  staffMode = false;
  var m = location.hash.match(/^#\/([a-z0-9\-]+)$/);
  var id = m ? m[1] : null;
  if(id && id!==sessionEnteredClub) enterClub(id);
  else if(!id && sessionEnteredClub) goToLanding();
}
window.addEventListener('hashchange', routeFromHash);

/* ---------- colores y escudo de cada club ---------- */
function shadeHex(hex, f){ // f negativo oscurece, positivo aclara
  var n = parseInt(String(hex||'').replace('#',''), 16);
  if(isNaN(n)) return hex;
  var rgb = [(n>>16)&255, (n>>8)&255, n&255].map(function(c){ return Math.round(f<0 ? c*(1+f) : c + (255-c)*f); });
  return '#' + rgb.map(function(c){ return ('0' + Math.max(0, Math.min(255, c)).toString(16)).slice(-2); }).join('');
}
function hexLuma(hex){ var n = parseInt(String(hex||'').replace('#',''), 16); return (0.299*((n>>16)&255) + 0.587*((n>>8)&255) + 0.114*(n&255)) / 255; }
var THEME_VARS = ['--orange-500','--navy-950','--navy-900','--navy-800','--navy-700'];
function defaultClubLogo(){ var img = document.querySelector('.brand img'); return img ? (img.dataset.defaultSrc || img.src) : ARENA_LOGO_SRC; }
function clubLogo(c){ return (c && c.escudo) || (c && c.id===DEFAULT_CLUB_ID ? defaultClubLogo() : ARENA_LOGO_SRC); }
function applyClubTheme(club){
  var st = document.documentElement.style;
  if(club && club.colores){
    var base = club.colores.base || '#0e1736';
    var l = hexLuma(base);
    if(l > 0.22) base = shadeHex(base, -Math.min(0.85, (l - 0.12) / l)); // el fondo siempre oscuro para que todo se lea
    st.setProperty('--orange-500', club.colores.acento || '#f65334');
    st.setProperty('--navy-900', base);
    st.setProperty('--navy-950', shadeHex(base, -0.4));
    st.setProperty('--navy-800', shadeHex(base, 0.08));
    st.setProperty('--navy-700', shadeHex(base, 0.16));
  } else {
    THEME_VARS.forEach(function(v){ st.removeProperty(v); });
  }
  var img = document.querySelector('.brand img');
  if(img){ if(!img.dataset.defaultSrc) img.dataset.defaultSrc = img.src; img.src = clubLogo(club); }
  var nm = document.querySelector('.brand .club');
  if(nm && club) nm.textContent = club.nombre;
  if(club) document.title = club.nombre + ' — Cartas y entrenamientos';
}
function resetClubTheme(){
  THEME_VARS.forEach(function(v){ document.documentElement.style.removeProperty(v); });
  document.title = 'Arena Sports — Cartas y entrenamientos';
}
function loadImage(src){ return new Promise(function(ok, bad){ var i = new Image(); i.onload = function(){ ok(i); }; i.onerror = bad; i.src = src; }); }
function fileToDataUrl(file){ return new Promise(function(ok, bad){ var r = new FileReader(); r.onload = function(){ ok(r.result); }; r.onerror = bad; r.readAsDataURL(file); }); }
function shrinkImage(src, max){
  return loadImage(src).then(function(img){
    var s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    var c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(img.naturalWidth*s)); c.height = Math.max(1, Math.round(img.naturalHeight*s));
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL('image/png');
  });
}
// Saca los dos colores principales del escudo: el más oscuro para el fondo, el más vivo para los detalles
function extractColors(src){
  return loadImage(src).then(function(img){
    var c = document.createElement('canvas'); c.width = 64; c.height = 64;
    var ctx = c.getContext('2d'); ctx.drawImage(img, 0, 0, 64, 64);
    var d = ctx.getImageData(0, 0, 64, 64).data, buckets = {};
    for(var i=0; i<d.length; i+=4){
      var r = d[i], g = d[i+1], b = d[i+2], a = d[i+3];
      var mx = Math.max(r,g,b), mn = Math.min(r,g,b);
      if(a < 200 || mx < 28 || (mx > 235 && mn > 215) || mx - mn < 30) continue; // transparente, negro, blanco o gris
      var key = (r>>5) + ',' + (g>>5) + ',' + (b>>5);
      var bk = buckets[key] || (buckets[key] = {n:0, r:0, g:0, b:0});
      bk.n++; bk.r += r; bk.g += g; bk.b += b;
    }
    var list = Object.keys(buckets).map(function(k){ var x = buckets[k]; return {n:x.n, r:x.r/x.n, g:x.g/x.n, b:x.b/x.n}; }).sort(function(a,b){ return b.n - a.n; });
    function hex(x){ return '#' + [x.r, x.g, x.b].map(function(v){ return ('0' + Math.round(v).toString(16)).slice(-2); }).join(''); }
    function dist(a,b){ return Math.abs(a.r-b.r) + Math.abs(a.g-b.g) + Math.abs(a.b-b.b); }
    function luma(x){ return 0.299*x.r + 0.587*x.g + 0.114*x.b; }
    var picks = [];
    list.forEach(function(x){ if(picks.length < 2 && picks.every(function(p){ return dist(p, x) > 120; })) picks.push(x); });
    if(!picks.length) return {acento:'#f65334', base:'#0e1736'};
    if(picks.length === 1) return {acento:hex(picks[0]), base:'#0e1736'};
    var dark = luma(picks[0]) < luma(picks[1]) ? picks[0] : picks[1];
    return {acento:hex(dark===picks[0] ? picks[1] : picks[0]), base:hex(dark)};
  });
}
function slugify(s){
  return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/^club\s+(deportivo\s+)?/, '').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40);
}

/* ---------- plataforma: migración de Jogo Bonito a la estructura multi-club ---------- */
var clubsLoaded = false, platformMigrating = false;
function migrateToMultiClub(){
  if(platformMigrating || !window.db) return;
  platformMigrating = true;
  var id = DEFAULT_CLUB_ID, base = 'clubes/' + id + '/';
  showToast('Pasando los datos de Jogo Bonito a la plataforma multi-club…');
  db.doc('club/general').get().then(function(g){
    if(g.exists){ // estructura segura anterior: se copia documento por documento
      return Promise.all([db.collection('categorias').get(), db.collection('publico').get(), db.collection('fotosJugadores').get()]).then(function(r){
        var jobs = [db.doc(base + 'datos/general').set(g.data())];
        r[0].forEach(function(d){ jobs.push(db.doc(base + 'categorias/' + d.id).set(d.data())); });
        r[1].forEach(function(d){ jobs.push(db.doc(base + 'publico/' + d.id).set(d.data())); });
        r[2].forEach(function(d){ var v = d.data(); jobs.push(db.doc(base + 'fotos/' + d.id).set({data:v.data, categoria:v.categoria || '', actualizada:v.actualizada || Date.now()})); });
        return Promise.all(jobs);
      });
    }
    return db.doc('appState/perfilJugador').get().then(function(a){ // documento único más antiguo
      var s = a.exists ? normalizeState(a.data()) : null;
      if(!s) return;
      if(Array.isArray(s.trainingSchedule)) s.categories.forEach(function(c){ if(!Array.isArray(s.trainingSchedules[c])) s.trainingSchedules[c] = s.trainingSchedule.slice(); });
      var docs = buildDocs(s);
      return Promise.all(Object.keys(docs).map(function(k){ return db.doc(base + k).set(docs[k]); }));
    });
  }).then(function(){
    return db.collection('staff').get().then(function(snap){ // las cuentas existentes quedan asociadas a Jogo Bonito
      var jobs = [];
      snap.forEach(function(d){ var v = d.data(); if(v.role!=='creador' && !v.club) jobs.push(d.ref.update({club:id})); });
      return Promise.all(jobs);
    });
  }).then(function(){
    // el escudo se reduce para guardarlo; si tarda demasiado, se sigue sin él (la migración nunca se queda colgada)
    return Promise.race([shrinkImage(defaultClubLogo(), 160).catch(function(){ return ''; }), new Promise(function(r){ setTimeout(function(){ r(''); }, 4000); })]);
  }).then(function(escudo){
    var doc = {nombre:DEFAULT_CLUB.nombre, tagline:DEFAULT_CLUB.tagline, colores:DEFAULT_CLUB.colores, cupos:DEFAULT_CLUB.cupos, estado:'activo', creado:Date.now()};
    if(escudo) doc.escudo = escudo;
    return db.collection('clubes').doc(id).set(doc); // se crea al final: si algo falla, se reintenta completo
  }).then(function(){
    platformMigrating = false;
    showToast('Listo: Jogo Bonito ya está en la plataforma multi-club.');
  }).catch(function(err){
    platformMigrating = false;
    console.error('No se pudo migrar a multi-club', err);
    showToast('No se pudieron pasar los datos a la plataforma multi-club. Revisa las reglas de Firebase y recarga.');
  });
}

  if(/too-many-requests/.test(c)) return 'Demasiados intentos. Espera unos minutos y vuelve a probar.';

// ---------- Página de inicio: clubes y jugadores de la fecha ----------
// La fecha va de lunes a domingo y se publica el lunes siguiente (se queda hasta el otro lunes).
function lpIso(d){ return d.getFullYear() + '-' + ('0'+(d.getMonth()+1)).slice(-2) + '-' + ('0'+d.getDate()).slice(-2); }
function lpWeekRange(){
  var hoy = new Date(); hoy.setHours(0,0,0,0);
  var lunes = new Date(hoy); lunes.setDate(hoy.getDate() - ((hoy.getDay()+6)%7));
  var ini = new Date(lunes); ini.setDate(lunes.getDate()-7);
  var fin = new Date(lunes); fin.setDate(lunes.getDate()-1);
  var prox = new Date(lunes); prox.setDate(lunes.getDate()+7);
  return {ini:ini, fin:fin, prox:prox, iniS:lpIso(ini), finS:lpIso(fin)};
}
var LP_MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function lpFmt(d){ return d.getDate() + ' ' + LP_MESES[d.getMonth()]; }
var LP_SIL = '<svg class="lp-sil" viewBox="0 0 200 220" aria-hidden="true"><circle cx="100" cy="78" r="40" fill="rgba(255,255,255,.6)"/><path d="M20 220c6-58 40-86 80-86s74 28 80 86z" fill="rgba(255,255,255,.6)"/></svg>';
var LP_BALL = '<svg class="lp-ball" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 7.2l3.6 2.6-1.4 4.2H9.8L8.4 9.8z" fill="currentColor"/><path d="M12 2v5.2M15.6 9.8l5.2-1.8M14.2 14l3.2 4.4M9.8 14l-3.2 4.4M8.4 9.8L3.2 8"/></svg>';
var lpWeekly = {key:null, loading:false, data:null, fotos:{}};
var lpPlayed = false, lpTab = 'sube';

function lpCardHtml(x, cls){
  var t = tierOf(x.v);
  var foto = x.foto ? '<img src="' + x.foto + '" alt="" loading="lazy" />' : LP_SIL;
  return '<div class="lp-card' + (t.id==='bronce' ? '' : ' lp-' + t.id) + (cls ? ' ' + cls : '') + '"><div class="lp-ph">' + foto +

// Lee las cartas públicas de cada club y calcula cuánto subió cada jugador en la fecha
function lpLoadWeekly(clubs){
  if(!window.db) return;
  var wk = lpWeekRange();
  var key = wk.iniS + '|' + clubs.map(function(c){ return c.id; }).join(',');
  if(lpWeekly.key===key || lpWeekly.loading) return;
  lpWeekly.loading = true;
  Promise.all(clubs.map(function(club){
    return db.collection('clubes/' + club.id + '/publico').get().then(function(snap){
      var out = [];
      snap.forEach(function(d){
        var doc = d.data() || {}, cat = doc.nombre || d.id;
        var lv = LEVELS[doc.level] ? doc.level : defaultLevel(cat);
        var w = WEIGHT_MODES[doc.weights] || WEIGHT_MODES.igual;
        (doc.players||[]).forEach(function(p){
          var h = p.historial || [];
          var antes = replayRating(h.filter(function(e){ return e.date < wk.iniS; }), LEVELS[lv].mult, w).valoracion;
          var ahora = replayRating(h.filter(function(e){ return e.date <= wk.finS; }), LEVELS[lv].mult, w).valoracion;
          var goles = 0, jugo = false;
          h.forEach(function(e){ if(e.date >= wk.iniS && e.date <= wk.finS){ jugo = true; goles += (e.goles||0); } });
          if(!jugo) return;
          out.push({id:p.id, club:club, name:p.name, categoria:cat, pos:p.pos, v:ahora, antes:antes, u:ahora-antes, g:goles});
        });
      });
      return out;
    }).catch(function(e){ console.error('No se pudieron leer las cartas de ' + club.id, e); return []; });
  })).then(function(res){
    var all = [].concat.apply([], res);
    var byU = function(a,b){ return (b.u-a.u) || (b.v-a.v); };
    var data = {
      sube: all.filter(function(x){ return x.u>0; }).sort(byU).slice(0,10),
      carta: all.filter(function(x){ return tierOf(x.v).min > tierOf(x.antes).min; }).sort(byU).slice(0,10),
      gol: all.filter(function(x){ return x.g>0; }).sort(function(a,b){ return (b.g-a.g) || (b.v-a.v); }).slice(0,10),
      top: all.slice().sort(function(a,b){ return b.v-a.v; }).slice(0,3)
    };
    // solo se descargan las fotos de los jugadores que salen en la portada
    var need = {};
    [data.sube, data.carta, data.gol, data.top].forEach(function(l){ l.forEach(function(x){ need[x.club.id + '/' + x.id] = x; }); });
    return Promise.all(Object.keys(need).map(function(k){
      if(k in lpWeekly.fotos) return null;
      var x = need[k];
      return db.doc('clubes/' + x.club.id + '/fotos/' + x.id).get().then(function(d){
        lpWeekly.fotos[k] = (d.exists && d.data().data) || '';
      }).catch(function(){ lpWeekly.fotos[k] = ''; });
    })).then(function(){
      Object.keys(need).forEach(function(k){ need[k].foto = lpWeekly.fotos[k] || ''; });
      lpWeekly.data = data; lpWeekly.key = key; lpWeekly.loading = false;
      lpFillWeekly(); lpFillFan();
    });
  }).catch(function(e){ console.error(e); lpWeekly.loading = false; });
}

function lpObserve(el, cb){
  if(!el) return;
  if(!('IntersectionObserver' in window)){ el.classList.add('lp-vis'); if(cb) cb(); return; }
  var io = new IntersectionObserver(function(es){
    es.forEach(function(e){ if(!e.isIntersecting) return; e.target.classList.add('lp-vis'); io.unobserve(e.target); if(cb) setTimeout(cb, 450); });
  }, {threshold:.15});
  io.observe(el);
}

// Entrada escalonada al aparecer en pantalla (sin escuchar el scroll: no traba el celular)
function revealOnScroll(root){
  var items = [].slice.call(root.querySelectorAll('.reveal'));
  if(!items.length) return;
  if(!('IntersectionObserver' in window)){ items.forEach(function(el){ el.classList.add('in'); }); return; }
  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(en){
      if(!en.isIntersecting) return;
      var group = en.target.parentNode;
      var sibs = [].slice.call(group.querySelectorAll(':scope > .reveal'));
      var i = Math.max(0, sibs.indexOf(en.target));
      en.target.style.transitionDelay = Math.min(i * 70, 420) + 'ms';
      en.target.classList.add('in');
      io.unobserve(en.target);
    });
  }, {rootMargin:'0px 0px -8% 0px', threshold:.12});
  items.forEach(function(el){ io.observe(el); });
}
