<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Jogo Bonito — Cartas &amp; Entrenamientos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-950:#080c24;
    --navy-900:#0e1736;
    --navy-800:#141f4a;
    --navy-700:#1b2a5e;
    --orange-500:#f65334;
    --orange-600:#d63f22;
    --orange-100:#ffd9cc;
    --white:#ffffff;
    --ink:#eef0fa;
    --ink-muted:#93a0c9;
    --ink-faint:#5c6796;
    --card-bg:#101a3f;
    --card-bg-raised:#162252;
    --border:rgba(255,255,255,0.09);
    --border-strong:rgba(255,255,255,0.16);
    --good:#5fd39b;
    --bad:#ef6a6a;
    --radius-s:8px;
    --radius-m:14px;
    --radius-l:22px;
    --font-display:'Oswald', sans-serif;
    --font-body:'Inter', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:radial-gradient(1200px 800px at 15% -10%, #142055 0%, var(--navy-950) 55%), var(--navy-950);
    color:var(--ink);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  ::selection{background:var(--orange-500);color:white;}

  a{color:inherit;}
  button{font-family:inherit;}

  /* ---------- Shell ---------- */
  .shell{
    display:flex;
    min-height:100vh;
    max-width:1400px;
    margin:0 auto;
  }
  .sidebar{
    width:248px;
    flex-shrink:0;
    padding:28px 18px;
    display:flex;
    flex-direction:column;
    gap:28px;
    border-right:1px solid var(--border);
    position:sticky;
    top:0;
    align-self:flex-start;
    height:100vh;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:12px;
    padding:0 4px;
    cursor:pointer;
  }
  .brand img{
    width:46px;height:46px;border-radius:50%;
    box-shadow:0 0 0 2px var(--orange-500), 0 4px 14px rgba(0,0,0,.4);
  }
  .brand-text .club{
    font-family:var(--font-display);
    font-size:15px;
    font-weight:600;
    letter-spacing:.02em;
    line-height:1.15;
  }
  .brand-text .tag{
    font-size:11px;
    color:var(--ink-faint);
    margin-top:2px;
  }
  nav.tabs{display:flex;flex-direction:column;gap:4px;}
  .tab-btn{
    display:flex;align-items:center;gap:11px;
    background:transparent;border:none;color:var(--ink-muted);
    padding:11px 12px;border-radius:var(--radius-s);
    font-size:14.5px;font-weight:500;text-align:left;cursor:pointer;
    transition:background .15s ease, color .15s ease;
  }
  .tab-btn .dot{width:6px;height:6px;border-radius:50%;background:transparent;flex-shrink:0;}
  .tab-btn:hover{background:rgba(255,255,255,.05);color:var(--ink);}
  .tab-btn.active{background:var(--card-bg-raised);color:var(--white);}
  .tab-btn.active .dot{background:var(--orange-500);}
  .sidebar-foot{
    margin-top:auto;font-size:11.5px;color:var(--ink-faint);line-height:1.5;
    padding:12px 4px;border-top:1px solid var(--border);
  }
  .chrome-block{margin-bottom:6px;}
  .chrome-label{font-size:10.5px;color:var(--ink-faint);text-transform:none;margin:0 4px 6px;}
  .role-switch{display:flex;flex-direction:column;gap:4px;margin-bottom:16px;}
  .role-btn{
    display:flex;align-items:center;gap:8px;background:transparent;border:1px solid var(--border);
    color:var(--ink-muted);padding:8px 10px;border-radius:var(--radius-s);font-size:12.5px;font-weight:600;
    cursor:pointer;text-align:left;
  }
  .role-btn.active{background:var(--orange-500);border-color:var(--orange-500);color:white;}
  .cat-select-wrap{margin-bottom:16px;}
  .cat-select-wrap select.cat-select{width:100%;}
  .cat-locked{
    font-size:12.5px;color:var(--ink-muted);background:var(--card-bg);border:1px solid var(--border);
    border-radius:var(--radius-s);padding:8px 10px;margin-bottom:16px;
  }
  .chrome-mobile{display:none;}

  .topbar-mobile{display:none;cursor:pointer;}

  /* ---------- Main ---------- */
  main{flex:1;min-width:0;padding:30px 34px 80px;}
  .main-inner{max-width:1080px;margin:0 auto;}

  /* ---------- Landing ---------- */
  .landing{min-height:100vh;display:flex;flex-direction:column;}
  .landing-nav{
    display:flex;align-items:center;justify-content:space-between;
    padding:22px 40px;max-width:1180px;margin:0 auto;width:100%;
  }
  .landing-nav .brand-mark{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-size:14px;letter-spacing:.02em;color:var(--ink-muted);}
  .landing-nav .brand-mark b{color:var(--white);font-weight:600;}
  .landing-hero{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:40px 24px 60px;max-width:720px;margin:0 auto;
  }
  .landing-hero .eyebrow{
    font-size:13px;color:var(--orange-500);font-weight:600;margin-bottom:14px;
  }
  .landing-hero h1{
    font-family:var(--font-display);font-size:clamp(32px,5vw,52px);line-height:1.08;
    margin:0 0 20px;font-weight:600;
  }
  .landing-hero p{
    font-size:16px;color:var(--ink-muted);line-height:1.6;max-width:52ch;margin:0 auto;
  }
  .landing-clubs{
    padding:0 24px 70px;max-width:1180px;margin:0 auto;width:100%;
  }
  .landing-clubs h2{
    font-family:var(--font-display);font-size:14px;font-weight:600;color:var(--ink-faint);
    margin:0 0 18px;
  }
  .club-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px;}
  .club-card{
    background:linear-gradient(160deg,var(--card-bg-raised),var(--card-bg) 75%);
    border:1px solid var(--border);border-radius:var(--radius-l);
    padding:26px;display:flex;align-items:center;gap:16px;cursor:pointer;
    transition:transform .15s ease, border-color .15s ease;
  }
  .club-card:hover{transform:translateY(-2px);border-color:var(--border-strong);}
  .club-card img{width:56px;height:56px;border-radius:50%;box-shadow:0 0 0 2px var(--orange-500);flex-shrink:0;}
  .club-card .name{font-family:var(--font-display);font-size:17px;margin-bottom:3px;}
  .club-card .meta{font-size:12.5px;color:var(--ink-faint);}
  .club-card-add{
    border:1.5px dashed var(--border-strong);background:transparent;border-radius:var(--radius-l);
    padding:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;gap:6px;color:var(--ink-faint);
  }
  .club-card-add b{color:var(--ink-muted);font-size:14px;}
  .club-card-add a{color:var(--orange-500);text-decoration:none;font-size:12.5px;font-weight:600;}
  .landing-foot{
    text-align:center;padding:24px;font-size:11.5px;color:var(--ink-faint);
    border-top:1px solid var(--border);
  }
  .view-head{
    display:flex;justify-content:space-between;align-items:flex-end;gap:16px;
    margin-bottom:22px;flex-wrap:wrap;
  }
  .view-head h1{
    font-family:var(--font-display);
    font-size:26px;font-weight:600;margin:0 0 6px;letter-spacing:.01em;
  }
  .view-head p{margin:0;color:var(--ink-muted);font-size:13.5px;max-width:52ch;}
  .cat-select{
    background:var(--card-bg);border:1px solid var(--border-strong);color:var(--ink);
    padding:9px 14px;border-radius:var(--radius-s);font-size:13.5px;font-family:var(--font-body);
  }

  .pill{
    display:inline-flex;align-items:center;gap:6px;
    font-size:11.5px;font-weight:600;color:var(--orange-500);
    background:rgba(246,83,52,.12);border:1px solid rgba(246,83,52,.35);
    padding:4px 10px;border-radius:100px;letter-spacing:.02em;
  }

  /* ---------- Training view ---------- */
  .focus-box{
    background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius-m);
    padding:14px 16px;margin-bottom:18px;
  }
  .focus-title{font-size:12.5px;color:var(--ink-muted);margin-bottom:9px;}
  .focus-chips{display:flex;flex-wrap:wrap;gap:7px;}
  .focus-chip{
    background:var(--navy-950);border:1px solid var(--border-strong);color:var(--ink-faint);
    font-size:12px;font-weight:600;padding:6px 12px;border-radius:100px;cursor:pointer;
  }
  .focus-chip.on{background:var(--orange-500);border-color:var(--orange-500);color:white;}
  .match-stat-row{display:flex;gap:22px;margin-bottom:4px;}
  .match-stat-row label{font-size:12px;color:var(--ink-muted);display:flex;flex-direction:column;gap:5px;}
  .match-num{
    width:70px;background:var(--navy-950);border:1px solid var(--border-strong);border-radius:var(--radius-s);
    color:var(--ink);padding:7px 9px;font-family:var(--font-body);font-size:14px;
  }

  .player-row{
    background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius-m);
    padding:16px 18px;margin-bottom:12px;
    transition:border-color .15s ease;
  }
  .player-row.done{border-color:rgba(95,211,155,.4);}
  .player-row-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .avatar{
    width:42px;height:42px;border-radius:50%;flex-shrink:0;
    background:linear-gradient(145deg,var(--navy-700),var(--navy-800));
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-display);font-size:15px;color:var(--orange-500);border:1px solid var(--border-strong);
  }
  .player-name-block{flex:1;min-width:140px;}
  .player-name{font-weight:600;font-size:15px;}
  .player-meta{font-size:12px;color:var(--ink-faint);margin-top:1px;}
  .attend-toggle{
    display:flex;background:var(--navy-950);border:1px solid var(--border-strong);
    border-radius:100px;padding:3px;gap:2px;flex-shrink:0;
  }
  .attend-toggle button{
    border:none;background:transparent;color:var(--ink-muted);
    font-size:12.5px;font-weight:600;padding:6px 13px;border-radius:100px;cursor:pointer;
  }
  .attend-toggle button.on-yes.sel{background:var(--good);color:#08170f;}
  .attend-toggle button.on-no.sel{background:var(--bad);color:#2a0808;}

  .rating-block{margin-top:14px;padding-top:14px;border-top:1px dashed var(--border);}
  .rating-label{font-size:12px;color:var(--ink-muted);margin-bottom:8px;}
  .rating-scale{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;}
  .rating-scale button{
    width:32px;height:32px;border-radius:8px;border:1px solid var(--border-strong);
    background:var(--navy-950);color:var(--ink-muted);font-weight:700;cursor:pointer;font-size:13px;
  }
  .rating-scale button.sel{background:var(--orange-500);border-color:var(--orange-500);color:white;}
  .quick-attrs{display:flex;flex-direction:column;gap:10px;margin-bottom:4px;}
  .quick-attr-row{background:var(--navy-950);border:1px solid var(--border);border-radius:var(--radius-s);padding:9px 11px;}
  .quick-attr-label{font-size:12.5px;font-weight:600;margin-bottom:7px;}
  .quick-attr-scale{display:flex;gap:5px;flex-wrap:wrap;}
  .quick-attr-scale button{
    width:27px;height:27px;border-radius:7px;border:1px solid var(--border-strong);
    background:var(--navy-900);color:var(--ink-muted);font-weight:700;cursor:pointer;font-size:11.5px;
  }
  .quick-attr-scale button.sel{background:var(--orange-500);border-color:var(--orange-500);color:white;}
  .fb-textarea{
    width:100%;min-height:64px;resize:vertical;
    background:var(--navy-950);border:1px solid var(--border-strong);border-radius:var(--radius-s);
    color:var(--ink);padding:10px 12px;font-family:var(--font-body);font-size:13.5px;line-height:1.5;
  }
  .fb-textarea::placeholder{color:var(--ink-faint);}
  .analysis-box{
    margin-top:10px;font-size:12.5px;color:var(--ink-muted);
    background:rgba(246,83,52,.07);border:1px solid rgba(246,83,52,.2);
    border-radius:var(--radius-s);padding:9px 12px;display:none;
  }
  .analysis-box.show{display:block;}
  .analysis-box b{color:var(--orange-500);}
  .attr-chip{
    display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;
    background:var(--navy-950);border:1px solid var(--border-strong);border-radius:100px;
    padding:3px 9px;margin:3px 4px 0 0;
  }
  .attr-chip.up{color:var(--good);}
  .attr-chip.down{color:var(--bad);}
  .save-row{display:flex;justify-content:flex-end;margin-top:12px;}
  .btn-save-player{
    background:var(--orange-500);border:none;color:white;font-weight:600;font-size:13px;
    padding:8px 16px;border-radius:var(--radius-s);cursor:pointer;
  }
  .btn-save-player:disabled{opacity:.35;cursor:not-allowed;}
  .btn-save-player.saved{background:var(--good);color:#08170f;}

  /* ---------- Cards / Cartas view ---------- */
  .cards-grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;
  }
  .card-player{
    background:linear-gradient(160deg,var(--card-bg-raised),var(--card-bg) 70%);
    border:1px solid var(--border);border-radius:var(--radius-l);
    padding:18px;cursor:pointer;position:relative;overflow:hidden;
    transition:transform .15s ease, border-color .15s ease;
  }
  .card-player:hover{transform:translateY(-3px);border-color:var(--border-strong);}
  .card-player::after{
    content:'';position:absolute;top:-40px;right:-40px;width:120px;height:120px;border-radius:50%;
    background:radial-gradient(circle, rgba(246,83,52,.16), transparent 70%);
  }
  .card-pos{font-size:11px;font-weight:700;color:var(--orange-500);letter-spacing:.03em;}
  .card-name{font-family:var(--font-display);font-size:19px;margin:4px 0 10px;}
  .card-val-row{display:flex;align-items:baseline;gap:6px;}
  .card-val{font-family:var(--font-display);font-size:38px;color:var(--white);}
  .card-val-max{font-size:12px;color:var(--ink-faint);}
  .card-stats{display:flex;gap:14px;margin-top:12px;font-size:12px;color:var(--ink-muted);}
  .card-stats span b{color:var(--ink);font-size:13px;}
  .spark{margin-top:12px;height:26px;}

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(4,6,20,.72);backdrop-filter:blur(3px);
    display:none;align-items:flex-start;justify-content:center;padding:5vh 16px;z-index:50;overflow-y:auto;
  }
  .modal-overlay.show{display:flex;}
  .modal{
    background:var(--navy-900);border:1px solid var(--border-strong);border-radius:var(--radius-l);
    max-width:560px;width:100%;padding:26px 26px 22px;position:relative;
  }
  .modal-close{
    position:absolute;top:16px;right:16px;background:var(--navy-950);border:1px solid var(--border-strong);
    color:var(--ink-muted);width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:15px;
  }
  .modal h2{font-family:var(--font-display);font-size:24px;margin:0 0 2px;}
  .modal .sub{color:var(--ink-muted);font-size:13px;margin-bottom:18px;}
  .modal-stats{display:flex;gap:22px;margin-bottom:18px;flex-wrap:wrap;}
  .modal-stats div{font-size:12px;color:var(--ink-faint);}
  .modal-stats div b{display:block;color:var(--white);font-family:var(--font-display);font-size:20px;}
  .timeline{border-top:1px solid var(--border);padding-top:14px;max-height:280px;overflow-y:auto;}
  .tl-item{padding:10px 0;border-bottom:1px solid var(--border);font-size:13px;}
  .tl-item:last-child{border-bottom:none;}
  .tl-date{font-size:11px;color:var(--ink-faint);margin-bottom:3px;}
  .tl-comment{color:var(--ink-muted);margin-top:4px;line-height:1.5;}
  .tl-delta{font-weight:700;}
  .tl-delta.up{color:var(--good);}
  .tl-delta.down{color:var(--bad);}

  /* ---------- Perfil view ---------- */
  .perfil-layout{display:flex;gap:22px;flex-wrap:wrap;}
  .pos-list{
    display:flex;flex-direction:column;gap:5px;width:230px;flex-shrink:0;
  }
  .pos-item{
    padding:10px 13px;border-radius:var(--radius-s);border:1px solid var(--border);
    background:var(--card-bg);cursor:pointer;font-size:13.5px;font-weight:500;color:var(--ink-muted);
  }
  .pos-item.active{background:var(--card-bg-raised);border-color:var(--orange-500);color:var(--white);}
  .pos-item small{display:block;font-size:11px;color:var(--ink-faint);font-weight:400;margin-top:1px;}
  .perfil-panel{
    flex:1;min-width:280px;background:var(--card-bg);border:1px solid var(--border);
    border-radius:var(--radius-l);padding:22px 24px;
  }
  .perfil-panel h3{font-family:var(--font-display);font-size:20px;margin:0 0 4px;}
  .perfil-panel .desc{color:var(--ink-muted);font-size:13px;margin-bottom:20px;}
  .attr-row{margin-bottom:18px;}
  .attr-row-top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:7px;}
  .attr-row-top .name{font-weight:600;}
  .attr-row-top .val{font-family:var(--font-display);color:var(--orange-500);}
  input[type=range]{
    width:100%;-webkit-appearance:none;appearance:none;height:7px;border-radius:100px;
    background:var(--navy-950);outline:none;border:1px solid var(--border-strong);
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;width:19px;height:19px;border-radius:50%;
    background:var(--orange-500);border:3px solid var(--navy-900);box-shadow:0 0 0 1px var(--orange-500);cursor:pointer;
  }
  input[type=range]::-moz-range-thumb{
    width:19px;height:19px;border-radius:50%;background:var(--orange-500);border:3px solid var(--navy-900);cursor:pointer;
  }
  .summary-box{
    margin-top:8px;background:var(--navy-950);border:1px solid var(--border);border-radius:var(--radius-s);
    padding:13px 15px;font-size:13px;color:var(--ink-muted);line-height:1.6;
  }
  .summary-box b{color:var(--white);}

  /* ---------- Informe view ---------- */
  .informe-select{margin-bottom:20px;}
  .informe-card{
    background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius-l);
    padding:26px 28px;
  }
  .informe-header{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:16px;margin-bottom:20px;}
  .informe-header h2{font-family:var(--font-display);font-size:24px;margin:0 0 4px;}
  .informe-header .sub{color:var(--ink-muted);font-size:13px;}
  .informe-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:14px;margin-bottom:22px;}
  .informe-stat{background:var(--navy-950);border:1px solid var(--border);border-radius:var(--radius-s);padding:14px;}
  .informe-stat .n{font-family:var(--font-display);font-size:26px;color:var(--orange-500);}
  .informe-stat .l{font-size:11.5px;color:var(--ink-faint);margin-top:2px;}
  .informe-narrative{
    background:var(--navy-950);border:1px solid var(--border);border-radius:var(--radius-m);
    padding:18px 20px;font-size:13.5px;line-height:1.7;color:var(--ink-muted);
  }
  .informe-narrative b{color:var(--white);}
  .trend-svg{width:100%;height:80px;margin:8px 0 4px;}

  .empty-note{
    font-size:12px;color:var(--ink-faint);margin-top:26px;text-align:center;padding-bottom:10px;
  }

  /* ---------- Mobile ---------- */
  @media (max-width:880px){
    .shell{flex-direction:column;}
    .sidebar{
      display:none;
    }
    .topbar-mobile{
      display:flex;align-items:center;gap:10px;
      padding:14px 16px calc(10px + env(safe-area-inset-top,0px));
      border-bottom:1px solid var(--border);
      position:sticky;top:0;background:var(--navy-950);z-index:20;
    }
    .topbar-mobile img{width:34px;height:34px;border-radius:50%;box-shadow:0 0 0 2px var(--orange-500);}
    .topbar-mobile .club{font-family:var(--font-display);font-size:14px;font-weight:600;}
    .chrome-mobile{
      display:flex;gap:8px;padding:10px 16px;border-bottom:1px solid var(--border);
      background:var(--navy-950);position:sticky;top:63px;z-index:19;flex-wrap:wrap;
    }
    .chrome-mobile select{flex:1;min-width:120px;}
    .tabs-mobile{top:calc(63px + 52px);}
    .tabs-mobile{
      display:flex;gap:6px;overflow-x:auto;padding:10px 16px 12px;
      border-bottom:1px solid var(--border);position:sticky;top:63px;background:var(--navy-950);z-index:19;
    }

function seedPlayers(categoria){
  var today = new Date();
  function daysAgo(n){ var d=new Date(today); d.setDate(d.getDate()-n); return d.toISOString().slice(0,10); }
  var seedHist = [
    {pos:'DFC1', comments:['Muy sólido marcando, recuperó muchos balones y mantuvo buena actitud todo el entrenamiento.', 'Le costó un poco el pase largo, pero defendió bien uno contra uno.']},
    {pos:'MCO', comments:['Excelente visión de juego, varios pases entre líneas y buena resistencia durante todo el trabajo.', 'Bajó el ritmo en el segundo tiempo del entrenamiento, se cansó rápido.']},
    {pos:'DC', comments:['Definición muy clara, dos remates a portería en el trabajo de finalización.', 'Poca participación en la recuperación, pero es esperable en su posición.']},
    {pos:'ED', comments:['Muy rápido en las bandas, generó desborde constante.', 'Necesita mejorar la actitud al momento de replegar en defensa.']}
  ];
  return NAMES.map(function(name, i){
    var pos = POSITIONS[i % POSITIONS.length].code;
    var base = 58 + Math.round(Math.random()*14);
    var hist = [];
    var val = base;
    for(var d=5; d>=1; d--){
      var delta = [3,-1,4,2,-2][d-1] || 2;
      val += delta;
      var sample = seedHist[i % seedHist.length];
      var txt = sample.comments[d % sample.comments.length];
      hist.push({
        type:'entrenamiento',
        date: daysAgo(d*4),
        asistio:true,
        rating: 6 + (delta>0?2:0),
        delta: delta,
        feedback: txt,
        comment: txt,
        quickValues: {},
        attrsHit: []
      });
    }
    return {
      id: categoria + '-p' + i,
      name:name,
      categoria: categoria,
      pos:pos,
      goles: Math.round(Math.random()*6),
      asistencias: Math.round(Math.random()*5),
      valoracion: val,
      historial: hist
    };
  });
}

var STORAGE_KEY = 'jogobonito_preview_v4';
var state = null;

function normalizeState(s){
  if(!s || !Array.isArray(s.players) || !s.players.length) return null;
  try{
    var ok = true;
    s.players.forEach(function(p){
      if(!p.categoria || CATEGORIES.indexOf(p.categoria)===-1) ok = false;
      if(typeof p.goles !== 'number') p.goles = 0;
      if(typeof p.asistencias !== 'number') p.asistencias = 0;
      if(!Array.isArray(p.historial)) p.historial = [];
      p.historial.forEach(function(h){
        if(!h.type) h.type = 'entrenamiento';
        if(!h.quickValues) h.quickValues = {};
        if(typeof h.feedback !== 'string') h.feedback = (h.comment && h.comment.indexOf('(')!==0) ? h.comment : '';
      });
    });
    if(!ok) return null; // esquema de categorías nuevo — mejor volver a sembrar que adivinar a cuál pertenece cada jugador
    if(!s.profiles) s.profiles = {};
    POSITIONS.forEach(function(pos){
      var def = DEFAULT_PROFILES[pos.code];
      var cur = s.profiles[pos.code] || {};
      ATTRS.forEach(function(a){ if(typeof cur[a.key] !== 'number') cur[a.key] = def[a.key]; });
      s.profiles[pos.code] = cur;
    });
    if(!s.activePos) s.activePos = 'MCO';
    if(!Array.isArray(s.trainingSchedule)) s.trainingSchedule = [1,3,5]; // lun, mié, vie por defecto
    if(!s.trainingDays || typeof s.trainingDays !== 'object') s.trainingDays = {};
    if(['admin','profesor','visitante'].indexOf(s.role)===-1) s.role = 'admin';
    if(!s.selectedCategoria || CATEGORIES.indexOf(s.selectedCategoria)===-1) s.selectedCategoria = CATEGORIES[0];
    if(!s.profesorCategoria || CATEGORIES.indexOf(s.profesorCategoria)===-1) s.profesorCategoria = CATEGORIES[0];
    if(typeof s.enteredClub === 'undefined') s.enteredClub = null;
    return s;
  }catch(e){ return null; }
}

function freshState(){
  var allPlayers = [];
  CATEGORIES.forEach(function(cat){ allPlayers = allPlayers.concat(seedPlayers(cat)); });
  return {
    players: allPlayers,
    profiles: JSON.parse(JSON.stringify(DEFAULT_PROFILES)),
    activePos:'MCO',
    trainingSchedule: [1,3,5],
    trainingDays: {},
    role: 'admin',
    selectedCategoria: CATEGORIES[0],
    profesorCategoria: CATEGORIES[0],
    enteredClub: null
  };
}

function bootFromLocalOrFresh(){
  var loaded = null;
  try{
    var raw = localStorage.getItem(STORAGE_KEY);
    if(raw) loaded = normalizeState(JSON.parse(raw));
  }catch(e){ loaded = null; }
  state = loaded || freshState();
}

// Firestore: una sola fuente de verdad compartida por todos los que abran esta página.
// db y STATE_DOC_REF se declaran más abajo, justo antes de usarlos, para no depender del orden de carga del SDK.
function persist(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
  try{
    if(window.STATE_DOC_REF) window.STATE_DOC_REF.set(state).catch(function(err){ console.error('No se pudo guardar en Firestore', err); });
  }catch(e){}
}

  {id:'informe', label:'Informe semestral', icon:'●'}
];
function visibleViews(){
  if(state.role==='visitante') return ALL_VIEWS.filter(function(v){return v.id==='cartas';});
  return ALL_VIEWS;
}
function isReadOnly(){ return state.role==='visitante'; }
function activeCategoria(){ return state.role==='profesor' ? state.profesorCategoria : state.selectedCategoria; }
function categoryPlayers(){
  var cat = activeCategoria();
  return state.players.filter(function(p){ return p.categoria===cat; });
}
var currentView = 'entrenamiento';
var trainingDate = todayStr();
var matchDate = todayStr();

/* ============ HELPERS ============ */
function todayStr(){ return new Date().toISOString().slice(0,10); }
var WEEKDAYS = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
function weekdayOf(dateStr){ return new Date(dateStr+'T00:00:00').getDay(); }
function getTrainingDay(dateStr){
  var key = activeCategoria() + '::' + dateStr;
  if(!state.trainingDays[key]){
    var focus = {};
    ATTRS.forEach(function(a){ focus[a.key] = false; }); // todos apagados por defecto — el profesor marca lo que sí se trabajó
    state.trainingDays[key] = { held: null, reason:'', focus: focus, attendance: {}, finalized: false };
  }
  if(!state.trainingDays[key].attendance) state.trainingDays[key].attendance = {};
  return state.trainingDays[key];
}
function posName(code){ var p=POSITIONS.find(function(x){return x.code===code;}); return p?p.name:code; }
function fmtDate(iso){
  var d = new Date(iso+'T00:00:00');
  return d.toLocaleDateString('es-CO', {day:'2-digit', month:'short'});
}
function quickAttrsFor(posCode, focus){
  var profile = state.profiles[posCode];
  return ATTRS.filter(function(a){
    if(profile[a.key] < QUICK_THRESHOLD) return false;
    if(focus && !focus[a.key]) return false; // no se trabajó ese día / no aplica
    return true;
  }).sort(function(a,b){ return profile[b.key]-profile[a.key]; });
}
function analyzeFeedback(text, posCode, skipKeys){
  var profile = state.profiles[posCode];
  var lower = text.toLowerCase();
  var hits = [];
  ATTRS.forEach(function(a){
    if(skipKeys && skipKeys.indexOf(a.key)!==-1) return; // ya se calificó por atributo, no duplicar
    var words = KEYWORDS[a.key];
    var matched = words.some(function(w){ return lower.indexOf(w) !== -1; });
    if(matched){
      var weight = profile[a.key];
      var tier = weight >= 7 ? 'up' : (weight <= 3 ? 'down' : 'neutral');
      hits.push({key:a.key, label:a.label, weight:weight, tier:tier});
    }
  });
  return hits;
}
// Escalones acordados: 4 o menos ya empieza a bajar, 5 es neutro, 6/7 empieza a subir, 10 sube más.
var RATING_STEPS = {1:-2, 2:-2, 3:-1, 4:-1, 5:0, 6:1, 7:1, 8:2, 9:2, 10:3};
function baseDelta(rating){ return RATING_STEPS[rating] !== undefined ? RATING_STEPS[rating] : 0; }
function computeDelta(rating, hits, quickRatings){
  var d = baseDelta(rating);
  (quickRatings||[]).forEach(function(q){
    d += Math.round(baseDelta(q.value) * (q.weight/RATING_MAX) * 0.6);
  });
  hits.forEach(function(h){
    if(h.tier==='up') d += 1; // mención en texto de algo clave para el puesto: bono chico
    // neutral o no-clave: sin bono, para no duplicar lo que ya califican los atributos rápidos
  });
  return d;
}

function renderEntrenamiento(){
  var el = document.createElement('div');

      '<div><span class="pill">' + (programado ? 'Día programado' : 'Día no programado') + '</span>' +
      '<h1 style="margin-top:8px;">Entrenamiento del día</h1>' +
      '<p>Configura qué días entrena el equipo, elige la fecha y marca si hubo entrenamiento ese día — puede que un día programado no se dé, o que se agregue uno extra.</p></div>' +
    '</div>' +
    '<div class="focus-box">' +
      '<div class="focus-title">Días de entrenamiento programados</div>' +
      '<div class="focus-chips" id="scheduleChips"></div>' +
    '</div>' +

      '<div class="focus-title">Fecha a registrar</div>' +
      '<input type="date" id="trainingDateInput" class="cat-select" value="' + trainingDate + '" style="margin-bottom:12px;" />' +
      '<div><div class="attend-toggle" style="display:inline-flex;">' +

        '<button class="on-no' + (day.held===false?' sel':'') + '" id="heldNo">No hubo entrenamiento</button>' +
      '</div></div>' +
      (day.held===false ? '<textarea class="fb-textarea" id="reasonInput" style="margin-top:10px;" placeholder="¿Por qué no hubo entrenamiento? (opcional — aplazado, lluvia, festivo…)">' + (day.reason||'') + '</textarea>' : '') +
    '</div>';

  var schedWrap = el.querySelector('#scheduleChips');
  WEEKDAYS.forEach(function(label, idx){
    var chip = document.createElement('button');
    chip.className = 'focus-chip' + (state.trainingSchedule.indexOf(idx)!==-1 ? ' on':'');
    chip.textContent = label;
    chip.onclick = function(){
      var pos = state.trainingSchedule.indexOf(idx);
      if(pos===-1) state.trainingSchedule.push(idx); else state.trainingSchedule.splice(pos,1);
      persist();
      render();
    };
    schedWrap.appendChild(chip);
  });

  el.querySelector('#trainingDateInput').onchange = function(e){
    trainingDate = e.target.value;
    render();
  };
  el.querySelector('#heldYes').onclick = function(){ day.held = true; persist(); render(); };
  el.querySelector('#heldNo').onclick = function(){ day.held = false; persist(); render(); };
  var reasonInput = el.querySelector('#reasonInput');
  if(reasonInput){ reasonInput.oninput = function(){ day.reason = reasonInput.value; persist(); }; }

  if(day.held===true){
    var summary = computeDayReport(trainingDate, day);
    if(summary){
      var summaryBox = document.createElement('div');
      summaryBox.className = 'focus-box';
      var qualityCls = summary.quality.indexOf('Buen')===0 ? 'up' : (summary.quality.indexOf('flojo')!==-1 ? 'down' : '');
      summaryBox.innerHTML =
        '<div class="focus-title">Resumen del día' + (day.finalized ? ' · <span style="color:var(--good);">Registro finalizado ✓</span>' : '') + '</div>' +
        '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px;">' +
          '<span class="attr-chip ' + qualityCls + '">' + summary.quality + '</span>' +
          '<span class="attr-chip">' + summary.presentes + ' asistieron</span>' +
          '<span class="attr-chip">' + summary.ausentes + ' faltaron</span>' +
          (summary.sinMarcar ? '<span class="attr-chip">' + summary.sinMarcar + ' sin marcar</span>' : '') +
        '</div>' +
        '<div style="font-size:13px;color:var(--ink-muted);">' +
          (summary.avgRating!=null ? 'Calificación promedio del día: <b style="color:var(--white);">' + summary.avgRating.toFixed(1) + '/10</b>. ' : '') +
          (summary.focusLabels.length ? 'Se trabajó: <b style="color:var(--white);">' + summary.focusLabels.join(', ') + '</b>.' : 'No se marcó qué se trabajó ese día.') +
        '</div>';
      el.appendChild(summaryBox);
    }

    if(day.finalized){
      var rosterBox = document.createElement('div');
      rosterBox.className = 'focus-box';
      var entries = categoryPlayers().map(function(p){
        var h = p.historial.find(function(x){ return x.type==='entrenamiento' && x.date===trainingDate; });
        return h ? {p:p, h:h} : null;
      }).filter(Boolean);
      rosterBox.innerHTML =
        '<div class="focus-title">Jugadores registrados este día (' + entries.length + ')</div>' +
        (entries.length ? entries.map(function(e){
          var deltaTxt = (e.h.delta>=0?'+':'') + e.h.delta;
          return '<div class="tl-item"><div class="tl-date"><b>' + e.p.name + '</b> · ' + posName(e.p.pos) + ' · Calificación ' + e.h.rating + '/10 · <span class="tl-delta ' + (e.h.delta>=0?'up':'down') + '">' + deltaTxt + '</span></div>' +
            (e.h.comment ? '<div class="tl-comment">' + e.h.comment + '</div>' : '') + '</div>';
        }).join('') : '<div style="font-size:12.5px;color:var(--ink-faint);">Nadie quedó registrado con calificación este día.</div>') +
        '<div class="save-row" style="margin-top:14px;"><button class="btn-save-player" id="reopenBtn" style="background:var(--navy-700);">Reabrir edición</button></div>';
      el.appendChild(rosterBox);
      el.querySelector('#reopenBtn').onclick = function(){ day.finalized = false; persist(); render(); };
      return el;
    }

    var focusBox = document.createElement('div');
    focusBox.className = 'focus-box';
    focusBox.innerHTML = '<div class="focus-title">¿Qué se trabajó este día? (empieza vacío — marca solo lo que aplique)</div><div class="focus-chips" id="focusChips"></div>';
    el.appendChild(focusBox);
    var chipsWrap = focusBox.querySelector('#focusChips');
    ATTRS.forEach(function(a){
      var chip = document.createElement('button');
      chip.className = 'focus-chip' + (day.focus[a.key] ? ' on':'');
      chip.textContent = a.label;
      chip.onclick = function(){
        day.focus[a.key] = !day.focus[a.key];
        persist();
        render();
      };
      chipsWrap.appendChild(chip);
    });

    var rowsWrap = document.createElement('div');

    });

    finalizeRow.style.marginTop = '16px';
    finalizeRow.innerHTML = '<button class="btn-save-player" id="finalizeBtn">Finalizar registro del día</button>';
    el.appendChild(finalizeRow);
    el.querySelector('#finalizeBtn').onclick = function(){ day.finalized = true; persist(); render(); };
  } else if(day.held===false){
    var note = document.createElement('div');
    note.className = 'empty-note';
    note.style.marginTop = '18px';
    note.textContent = 'No se registra asistencia ni calificación para este día.';
    el.appendChild(note);
  }
  return el;
}

function computeDayReport(dateStr, day){
  var players = categoryPlayers();
  var entries = players.map(function(p){
    return p.historial.find(function(h){ return h.type==='entrenamiento' && h.date===dateStr; });
  }).filter(Boolean);
  var presentes = 0, ausentes = 0;
  presentes = players.filter(function(p){ return day.attendance[p.id]===true; }).length;
  ausentes = players.filter(function(p){ return day.attendance[p.id]===false; }).length;
  var sinMarcar = players.length - presentes - ausentes;
  if(presentes===0 && ausentes===0) return null; // nada registrado todavía este día
  var avgRating = entries.length ? entries.reduce(function(s,e){return s+e.rating;},0)/entries.length : null;
  var quality = 'Sin calificaciones registradas todavía';
  if(avgRating!=null){
    var bd = baseDelta(Math.round(avgRating));
    quality = bd > 0 ? 'Buen entrenamiento' : (bd < 0 ? 'Entrenamiento flojo' : 'Entrenamiento parejo');
  }
  var focusLabels = ATTRS.filter(function(a){ return day.focus[a.key]; }).map(function(a){ return a.label; });
  return { presentes:presentes, ausentes:ausentes, sinMarcar:sinMarcar, avgRating:avgRating, quality:quality, focusLabels:focusLabels };
}

function renderTrainingRow(p, dateStr, day){
  var focus = day.focus;
  var existingEntry = p.historial.find(function(h){ return h.type==='entrenamiento' && h.date===dateStr; });
  var attendanceMark = day.attendance[p.id];
  var draft = {
    asistio: existingEntry ? true : (typeof attendanceMark==='boolean' ? attendanceMark : null),
    rating: existingEntry ? existingEntry.rating : null,
    feedback: existingEntry ? (existingEntry.feedback||'') : '',
    quick: existingEntry ? Object.assign({}, existingEntry.quickValues||{}) : {}
  };

  var row = document.createElement('div');
  row.className = 'player-row' + (existingEntry ? ' done' : '');

  var initials = p.name.replace('Jugador ', '#');

  row.innerHTML =
    '<div class="player-row-top">' +
      '<div class="avatar">' + initials + '</div>' +
      '<div class="player-name-block">' +
        '<div class="player-name">' + p.name + (existingEntry ? ' <span style="font-size:11px;color:var(--ink-faint);font-weight:400;">(ya registrado — editable)</span>' : '') + '</div>' +
        '<div class="player-meta">' + posName(p.pos) + ' · Valoración actual ' + p.valoracion + '</div>' +
      '</div>' +
      '<div class="attend-toggle">' +
        '<button class="on-yes' + (draft.asistio===true?' sel':'') + '">Asistió</button>' +
        '<button class="on-no' + (draft.asistio===false?' sel':'') + '">No asistió</button>' +
      '</div>' +
    '</div>' +
    '<div class="rating-body" style="display:' + (draft.asistio===true?'block':'none') + '"></div>';

  var btnYes = row.querySelector('.on-yes');
  var btnNo = row.querySelector('.on-no');
  var ratingBody = row.querySelector('.rating-body');

  btnYes.onclick = function(){ draft.asistio = true; day.attendance[p.id] = true; persist(); renderRatingBody(); refreshRowChrome(); };
  btnNo.onclick = function(){ draft.asistio = false; draft.rating=null; draft.feedback=''; day.attendance[p.id] = false; persist(); ratingBody.style.display='none'; refreshRowChrome(); };

  function refreshRowChrome(){
    btnYes.className = 'on-yes' + (draft.asistio===true?' sel':'');
    btnNo.className = 'on-no' + (draft.asistio===false?' sel':'');
    ratingBody.style.display = draft.asistio===true ? 'block' : 'none';
  }

  function renderRatingBody(){
    var quickAttrs = quickAttrsFor(p.pos, focus);

    ratingBody.innerHTML =
      '<div class="rating-block">' +
        '<div class="rating-label">¿Qué tal fue su entrenamiento en general? (1 a 10)</div>' +
        '<div class="rating-scale"></div>' +
        '<div class="rating-label" style="margin-top:14px;">Calificación rápida — solo lo que este puesto necesita y se marcó como trabajado hoy</div>' +
        '<div class="quick-attrs"></div>' +
        '<div class="rating-label" style="margin-top:14px;">Retroalimentación escrita (opcional, para algo que las opciones de arriba no cubran)</div>' +
        '<textarea class="fb-textarea" placeholder="Ej: hoy también mostró liderazgo con los más nuevos…"></textarea>' +
        '<div class="save-row"><button class="btn-save-player">' + (existingEntry ? 'Actualizar' : 'Guardar') + '</button></div>' +
      '</div>';

    var scale = ratingBody.querySelector('.rating-scale');
    for(var i=1;i<=RATING_MAX;i++){
      (function(i){
        var b = document.createElement('button');
        b.textContent = i;
        if(draft.rating===i) b.classList.add('sel');
        b.onclick = function(){
          draft.rating = i;
          scale.querySelectorAll('button').forEach(function(x){x.classList.remove('sel');});
          b.classList.add('sel');
        };
        scale.appendChild(b);
      })(i);
    }

    var quickWrap = ratingBody.querySelector('.quick-attrs');
    if(quickAttrs.length===0){
      quickWrap.innerHTML = '<div style="font-size:12px;color:var(--ink-faint);">Nada de lo marcado en "¿Qué se trabajó este día?" aplica a este puesto — puede quedar solo con la calificación general y, si quiere, un comentario.</div>';
    } else {
      quickAttrs.forEach(function(a){
        var qrow = document.createElement('div');
        qrow.className = 'quick-attr-row';
        qrow.innerHTML = '<div class="quick-attr-label">' + a.label + '</div><div class="quick-attr-scale"></div>';
        var qscale = qrow.querySelector('.quick-attr-scale');
        for(var i=1;i<=RATING_MAX;i++){
          (function(i){
            var qb = document.createElement('button');
            qb.textContent = i;
            if(draft.quick[a.key]===i) qb.classList.add('sel');
            qb.onclick = function(){
              draft.quick[a.key] = i;
              qscale.querySelectorAll('button').forEach(function(x){x.classList.remove('sel');});
              qb.classList.add('sel');
            };
            qscale.appendChild(qb);
          })(i);
        }
        quickWrap.appendChild(qrow);
      });
    }

    var textarea = ratingBody.querySelector('.fb-textarea');
    textarea.value = draft.feedback || '';
    textarea.oninput = function(){ draft.feedback = textarea.value; };

    var saveBtn = ratingBody.querySelector('.btn-save-player');
    saveBtn.disabled = false;
    saveBtn.onclick = function(){
      if(draft.rating==null){ return; }
      var quickKeys = Object.keys(draft.quick);
      var quickRatings = quickKeys.map(function(k){
        return {key:k, value:draft.quick[k], weight:state.profiles[p.pos][k]};
      });
      var hits = analyzeFeedback(draft.feedback||'', p.pos, quickKeys);
      var newDelta = computeDelta(draft.rating, hits, quickRatings);
      var attrsHitLabels = quickRatings.map(function(q){
        var a = ATTRS.find(function(x){return x.key===q.key;});
        return a.label + ' (' + q.value + '/10)';
      }).concat(hits.map(function(h){return h.label + ' (texto)';}));
      var displayComment = draft.feedback || (quickRatings.length ? '(calificado por atributos, sin comentario escrito)' : '(sin comentario)');
      var quickValuesObj = {};
      quickKeys.forEach(function(k){ quickValuesObj[k] = draft.quick[k]; });

      if(existingEntry){
        p.valoracion += (newDelta - existingEntry.delta);
        existingEntry.rating = draft.rating;
        existingEntry.delta = newDelta;
        existingEntry.feedback = draft.feedback||'';
        existingEntry.comment = displayComment;
        existingEntry.attrsHit = attrsHitLabels;
        existingEntry.quickValues = quickValuesObj;
      } else {
        p.valoracion += newDelta;
        existingEntry = {
          type:'entrenamiento', date: dateStr, asistio:true,
          rating: draft.rating, delta: newDelta,
          feedback: draft.feedback||'', comment: displayComment,
          quickValues: quickValuesObj, attrsHit: attrsHitLabels
        };
        p.historial.unshift(existingEntry);
      }
      persist();
      saveBtn.textContent = 'Guardado ✓';
      saveBtn.classList.add('saved');
      row.classList.add('done');
    };
  }

  if(draft.asistio===true) renderRatingBody();
  return row;
}

/* ============ RENDER: PARTIDO DEL DÍA ============ */
function allMatchDates(){
  var set = {};
  categoryPlayers().forEach(function(p){
    p.historial.forEach(function(h){ if(h.type==='partido') set[h.date] = true; });
  });
  return Object.keys(set).sort().reverse();
}

function renderPartido(){
  var el = document.createElement('div');
  var loggedDates = allMatchDates();

    '<div class="view-head">' +
      '<div><h1>Partido del día</h1>' +

    '</div>' +

      '<div class="focus-title">Fecha del partido</div>' +
      '<input type="date" id="matchDateInput" class="cat-select" value="' + matchDate + '" />' +
      (loggedDates.length ? '<div class="focus-title" style="margin-top:14px;">Partidos ya registrados</div><div class="focus-chips" id="loggedDates"></div>' : '') +
    '</div>' +
    '<div id="matchRows"></div>';

  el.querySelector('#matchDateInput').onchange = function(e){
    matchDate = e.target.value;
    render();
  };
  if(loggedDates.length){
    var chipsWrap = el.querySelector('#loggedDates');

  var rowsWrap = el.querySelector('#matchRows');
  categoryPlayers().forEach(function(p){
    rowsWrap.appendChild(renderMatchRow(p, matchDate));
  });
  return el;
}

function renderMatchRow(p, dateStr){
  var existingEntry = p.historial.find(function(h){ return h.type==='partido' && h.date===dateStr; });
  var draft = {
    convocado: existingEntry ? true : null,
    rating: existingEntry ? existingEntry.rating : null,
    feedback: existingEntry ? (existingEntry.feedback||'') : '',
    goles: existingEntry ? (existingEntry.goles||0) : 0,
    asistencias: existingEntry ? (existingEntry.asistencias||0) : 0,
    quick: existingEntry ? Object.assign({}, existingEntry.quickValues||{}) : {}
  };

  var row = document.createElement('div');
  row.className = 'player-row' + (existingEntry ? ' done' : '');

  var initials = p.name.replace('Jugador ', '#');

  row.innerHTML =
    '<div class="player-row-top">' +
      '<div class="avatar">' + initials + '</div>' +
      '<div class="player-name-block">' +
        '<div class="player-name">' + p.name + (existingEntry ? ' <span style="font-size:11px;color:var(--ink-faint);font-weight:400;">(ya registrado — editable)</span>' : '') + '</div>' +
        '<div class="player-meta">' + posName(p.pos) + ' · Valoración actual ' + p.valoracion + '</div>' +
      '</div>' +
      '<div class="attend-toggle">' +
        '<button class="on-yes' + (draft.convocado===true?' sel':'') + '">Convocado</button>' +
        '<button class="on-no' + (draft.convocado===false?' sel':'') + '">No convocado</button>' +
      '</div>' +
    '</div>' +
    '<div class="rating-body" style="display:' + (draft.convocado===true?'block':'none') + '"></div>';

  var btnYes = row.querySelector('.on-yes');
  var btnNo = row.querySelector('.on-no');
  var ratingBody = row.querySelector('.rating-body');

  btnYes.onclick = function(){ draft.convocado = true; renderRatingBody(); refreshRowChrome(); };
  btnNo.onclick = function(){ draft.convocado = false; draft.rating=null; draft.feedback=''; ratingBody.style.display='none'; refreshRowChrome(); };

  function refreshRowChrome(){
    btnYes.className = 'on-yes' + (draft.convocado===true?' sel':'');
    btnNo.className = 'on-no' + (draft.convocado===false?' sel':'');
    ratingBody.style.display = draft.convocado===true ? 'block' : 'none';
  }

  function renderRatingBody(){
    var quickAttrs = quickAttrsFor(p.pos, null); // partido: sin filtro de "qué se trabajó", va completo

    ratingBody.innerHTML =
      '<div class="rating-block">' +
        '<div class="rating-label">¿Qué tal fue en el partido? (1 a 10)</div>' +
        '<div class="rating-scale"></div>' +
        '<div class="rating-label" style="margin-top:14px;">Goles y asistencias en este partido (opcional)</div>' +
        '<div class="match-stat-row">' +
          '<label>Goles <input type="number" min="0" class="match-num" id="golesInput" value="' + draft.goles + '" /></label>' +
          '<label>Asistencias <input type="number" min="0" class="match-num" id="asisInput" value="' + draft.asistencias + '" /></label>' +
        '</div>' +
        '<div class="rating-label" style="margin-top:14px;">Calificación rápida — todo lo que le exige este puesto en partido</div>' +
        '<div class="quick-attrs"></div>' +
        '<div class="rating-label" style="margin-top:14px;">Retroalimentación escrita (opcional)</div>' +
        '<textarea class="fb-textarea" placeholder="Ej: bien plantado tácticamente, pero perdió varios duelos aéreos…"></textarea>' +
        '<div class="save-row"><button class="btn-save-player">' + (existingEntry ? 'Actualizar' : 'Guardar') + '</button></div>' +
      '</div>';

    var scale = ratingBody.querySelector('.rating-scale');
    for(var i=1;i<=RATING_MAX;i++){
      (function(i){
        var b = document.createElement('button');
        b.textContent = i;
        if(draft.rating===i) b.classList.add('sel');
        b.onclick = function(){
          draft.rating = i;
          scale.querySelectorAll('button').forEach(function(x){x.classList.remove('sel');});
          b.classList.add('sel');
        };
        scale.appendChild(b);
      })(i);
    }

    var golesInput = ratingBody.querySelector('#golesInput');
    var asisInput = ratingBody.querySelector('#asisInput');
    golesInput.oninput = function(){ draft.goles = parseInt(golesInput.value,10) || 0; };
    asisInput.oninput = function(){ draft.asistencias = parseInt(asisInput.value,10) || 0; };

    var quickWrap = ratingBody.querySelector('.quick-attrs');
    if(quickAttrs.length===0){
      quickWrap.innerHTML = '<div style="font-size:12px;color:var(--ink-faint);">Este puesto no tiene atributos por encima del umbral (≥ ' + QUICK_THRESHOLD + '/10) — configúrelo en "Perfil de exigencia".</div>';
    } else {
      quickAttrs.forEach(function(a){
        var qrow = document.createElement('div');
        qrow.className = 'quick-attr-row';
        qrow.innerHTML = '<div class="quick-attr-label">' + a.label + '</div><div class="quick-attr-scale"></div>';
        var qscale = qrow.querySelector('.quick-attr-scale');
        for(var i=1;i<=RATING_MAX;i++){
          (function(i){
            var qb = document.createElement('button');
            qb.textContent = i;
            if(draft.quick[a.key]===i) qb.classList.add('sel');
            qb.onclick = function(){
              draft.quick[a.key] = i;
              qscale.querySelectorAll('button').forEach(function(x){x.classList.remove('sel');});
              qb.classList.add('sel');
            };
            qscale.appendChild(qb);
          })(i);
        }
        quickWrap.appendChild(qrow);
      });
    }

    var textarea = ratingBody.querySelector('.fb-textarea');
    textarea.value = draft.feedback || '';
    textarea.oninput = function(){ draft.feedback = textarea.value; };

    var saveBtn = ratingBody.querySelector('.btn-save-player');
    saveBtn.disabled = false;
    saveBtn.onclick = function(){
      if(draft.rating==null){ return; }
      var quickKeys = Object.keys(draft.quick);
      var quickRatings = quickKeys.map(function(k){
        return {key:k, value:draft.quick[k], weight:state.profiles[p.pos][k]};
      });
      var hits = analyzeFeedback(draft.feedback||'', p.pos, quickKeys);
      var newDelta = computeDelta(draft.rating, hits, quickRatings);
      var attrsHitLabels = quickRatings.map(function(q){
        var a = ATTRS.find(function(x){return x.key===q.key;});
        return a.label + ' (' + q.value + '/10)';
      }).concat(hits.map(function(h){return h.label + ' (texto)';}));
      var displayComment = draft.feedback || (quickRatings.length ? '(calificado por atributos, sin comentario escrito)' : '(sin comentario)');
      var quickValuesObj = {};
      quickKeys.forEach(function(k){ quickValuesObj[k] = draft.quick[k]; });

      if(existingEntry){
        p.valoracion += (newDelta - existingEntry.delta);
        p.goles += (draft.goles - (existingEntry.goles||0));
        p.asistencias += (draft.asistencias - (existingEntry.asistencias||0));
        existingEntry.rating = draft.rating;
        existingEntry.delta = newDelta;
        existingEntry.goles = draft.goles;
        existingEntry.asistencias = draft.asistencias;
        existingEntry.feedback = draft.feedback||'';
        existingEntry.comment = displayComment;
        existingEntry.attrsHit = attrsHitLabels;
        existingEntry.quickValues = quickValuesObj;
      } else {
        p.valoracion += newDelta;
        p.goles += draft.goles;
        p.asistencias += draft.asistencias;
        existingEntry = {
          type:'partido', date: dateStr, asistio:true,
          rating: draft.rating, delta: newDelta,
          goles: draft.goles, asistencias: draft.asistencias,
          feedback: draft.feedback||'', comment: displayComment,
          quickValues: quickValuesObj, attrsHit: attrsHitLabels
        };
        p.historial.unshift(existingEntry);
      }
      persist();
      saveBtn.textContent = 'Guardado ✓';
      saveBtn.classList.add('saved');
      row.classList.add('done');
    };
  }

  if(draft.convocado===true) renderRatingBody();
  return row;
}

/* ============ RENDER: CARTAS ============ */
function sparkPath(hist){
  if(hist.length<2) return '';
  var vals = hist.slice().reverse().map(function(h){return h.delta;});
  var running = [];
  var acc = 0;
  vals.forEach(function(v){ acc+=v; running.push(acc); });
  var min = Math.min.apply(null, running), max = Math.max.apply(null, running);
  var range = (max-min)||1;
  var w=200, h=26, step = w/(running.length-1);
  var pts = running.map(function(v,i){
    var x = i*step;
    var y = h - ((v-min)/range)*h;
    return x.toFixed(1)+','+y.toFixed(1);
  });
  return pts.join(' ');
}

function formBadge(hist){
  var recent = hist.slice(0,3);
  if(!recent.length) return {label:'Sin registros aún', cls:''};
  var sum = recent.reduce(function(s,h){return s+(h.delta||0);},0);
  if(sum > 1) return {label:'Buen momento', cls:'up'};
  if(sum < -1) return {label:'En construcción', cls:'down'};
  return {label:'Rendimiento constante', cls:''};
}
function bestAttribute(hist){
  var avgs = attributeAverages(hist);
  return avgs.length ? avgs[0] : null;
}
function recentHighlight(hist){
  var found = hist.find(function(h){ return h.delta > 0 && h.feedback && h.feedback.trim().length > 3; });
  return found || null;
}

/* ============ RENDER: INFORME SEMESTRAL ============ */
function attributeAverages(hist){
  var sums = {}, counts = {};
  ATTRS.forEach(function(a){ sums[a.key]=0; counts[a.key]=0; });
  hist.forEach(function(h){
    var qv = h.quickValues || {};
    Object.keys(qv).forEach(function(k){
      if(sums[k]===undefined) return;
      sums[k] += qv[k]; counts[k] += 1;
    });
  });
  return ATTRS.filter(function(a){ return counts[a.key] > 0; })
    .map(function(a){ return {key:a.key, label:a.label, avg: sums[a.key]/counts[a.key], count: counts[a.key]}; })
    .sort(function(x,y){ return y.avg-x.avg; });
}

function renderInforme(){
  var el = document.createElement('div');
  el.innerHTML =
    '<div class="view-head"><div>' +
      '<h1>Informe semestral</h1>' +
      '<p>Se genera solo, a partir de todo lo que se ha registrado del jugador durante el semestre.</p>' +
    '</div></div>' +
    '<div class="informe-select"><select class="cat-select" id="playerSelect"></select></div>' +
    '<div id="informeBody"></div>';

  var players = categoryPlayers();
  var sel = el.querySelector('#playerSelect');
  players.forEach(function(p){
    var o = document.createElement('option');
    o.value = p.id; o.textContent = p.name;
    sel.appendChild(o);
  });
  var body = el.querySelector('#informeBody');

  function renderFor(id){
    var p = players.find(function(x){return x.id===id;});
    var hist = p.historial;
    var entrenamientos = hist.filter(function(h){return h.type==='entrenamiento';});
    var partidos = hist.filter(function(h){return h.type==='partido';});
    var asistidos = entrenamientos.length;
    var diasRegistrados = 0, diasAsistidos = 0;
    Object.keys(state.trainingDays).forEach(function(k){
      if(k.indexOf(activeCategoria()+'::')!==0) return;
      var mark = state.trainingDays[k].attendance ? state.trainingDays[k].attendance[p.id] : undefined;
      if(typeof mark === 'boolean'){ diasRegistrados++; if(mark) diasAsistidos++; }
    });
    var pct = diasRegistrados ? Math.round(diasAsistidos/diasRegistrados*100) : (entrenamientos.length ? 100 : 0);
    pct = Math.max(0, Math.min(100, pct)); // nunca puede pasarse de 100%, así el dato de origen esté incompleto
    var promedio = hist.length ? (hist.reduce(function(s,h){return s+h.rating;},0)/hist.length).toFixed(1) : '—';
    var mejorSesion = hist.slice().sort(function(a,b){return b.delta-a.delta;})[0];
    var startVal = p.valoracion - hist.reduce(function(s,h){return s+h.delta;},0);

    var mentionCount = {};
    hist.forEach(function(h){ (h.attrsHit||[]).forEach(function(a){ mentionCount[a] = (mentionCount[a]||0)+1; }); });
    var topMention = Object.keys(mentionCount).sort(function(a,b){return mentionCount[b]-mentionCount[a];})[0];

    var chron = hist.slice().reverse(); // más antiguo primero, para ver evolución
    var half = Math.ceil(chron.length/2);
    var firstHalf = chron.slice(0, half), secondHalf = chron.slice(half);
    function avgRating(list){ return list.length ? list.reduce(function(s,h){return s+h.rating;},0)/list.length : null; }
    var avgFirst = avgRating(firstHalf), avgSecond = avgRating(secondHalf);
    var tendenciaTxt = 'aún no hay suficientes registros para ver una tendencia clara';
    if(avgFirst!=null && avgSecond!=null && secondHalf.length>=2){
      if(avgSecond - avgFirst >= 0.5) tendenciaTxt = 'ha ido mejorando: pasó de un promedio de ' + avgFirst.toFixed(1) + '/10 a ' + avgSecond.toFixed(1) + '/10 entre la primera y la segunda mitad del semestre';
      else if(avgFirst - avgSecond >= 0.5) tendenciaTxt = 'ha bajado un poco: pasó de un promedio de ' + avgFirst.toFixed(1) + '/10 a ' + avgSecond.toFixed(1) + '/10 entre la primera y la segunda mitad del semestre';
      else tendenciaTxt = 'se ha mantenido estable, alrededor de ' + avgSecond.toFixed(1) + '/10, durante todo el semestre';
    }

    var avgPartidos = avgRating(partidos);
    var mejorPartido = partidos.slice().sort(function(a,b){return b.rating-a.rating;})[0];
    var pctTxt = pct + '%';
    var pctNarrativeTxt = diasRegistrados
      ? ('asistió a ' + diasAsistidos + ' de ' + diasRegistrados + ' entrenamientos programados (' + pct + '%)')
      : (entrenamientos.length ? ('registra ' + entrenamientos.length + ' entrenamientos, todos con asistencia (' + pct + '%) — aún no hay días marcados como "no asistió" en el calendario') : 'todavía no tiene entrenamientos registrados');

    var attrAvgs = attributeAverages(hist);
    var fortalezas = attrAvgs.filter(function(a){ return a.avg >= 7; }).slice(0,3);
    var mejorar = attrAvgs.filter(function(a){ return a.avg < 6; }).sort(function(a,b){return a.avg-b.avg;}).slice(0,3);
    var fortalezasTxt = fortalezas.length ? fortalezas.map(function(a){return a.label + ' (' + a.avg.toFixed(1) + '/10)';}).join(', ') : 'todavía no hay suficientes calificaciones por atributo para destacar una';
    var mejorarTxt = mejorar.length ? mejorar.map(function(a){return a.label + ' (' + a.avg.toFixed(1) + '/10)';}).join(', ') : 'ningún atributo calificado está por debajo de 6/10 todavía';

    function attrListHtml(list, emptyTxt){
      if(!list.length) return '<div style="font-size:12.5px;color:var(--ink-faint);">' + emptyTxt + '</div>';
      return list.map(function(a){
        return '<div class="attr-row-top" style="margin-bottom:6px;"><span class="name">' + a.label + '</span><span class="val">' + a.avg.toFixed(1) + '/10</span></div>';
      }).join('');
    }

    function fullTimelineHtml(){
      if(!hist.length) return '<div style="font-size:12.5px;color:var(--ink-faint);">Todavía no hay entrenamientos ni partidos registrados.</div>';
      return hist.map(function(h){
        var deltaCls = h.delta>=0?'up':'down';
        var deltaTxt = (h.delta>=0?'+':'') + h.delta;
        var tipoLabel = h.type==='partido' ? 'Partido' : 'Entrenamiento';
        var golesTxt = h.type==='partido' ? ' · ' + (h.goles||0) + ' gol(es), ' + (h.asistencias||0) + ' asist.' : '';
        return '<div class="tl-item">' +
          '<div class="tl-date"><b>' + tipoLabel + '</b> · ' + fmtDate(h.date) + ' · Calificación ' + h.rating + '/10' + golesTxt + ' · <span class="tl-delta ' + deltaCls + '">' + deltaTxt + ' valoración</span></div>' +
          '<div class="tl-comment">' + h.comment + '</div>' +
          (h.attrsHit && h.attrsHit.length ? '<div style="margin-top:5px;">' + h.attrsHit.map(function(a){return '<span class="attr-chip">' + a + '</span>';}).join('') + '</div>' : '') +
        '</div>';
      }).join('');
    }

    body.innerHTML =
      '<div class="informe-card">' +
        '<div class="informe-header">' +
          '<div><h2>' + p.name + '</h2><div class="sub">' + posName(p.pos) + ' · ' + p.categoria + ' · Semestre en curso</div></div>' +
          '<span class="pill">Valoración ' + startVal + ' → ' + p.valoracion + '</span>' +
        '</div>' +
        '<div class="informe-grid">' +
          '<div class="informe-stat"><div class="n">' + p.goles + '</div><div class="l">Goles</div></div>' +
          '<div class="informe-stat"><div class="n">' + p.asistencias + '</div><div class="l">Asistencias</div></div>' +
          '<div class="informe-stat"><div class="n">' + pctTxt + '</div><div class="l">Asistencia a entreno</div></div>' +
          '<div class="informe-stat"><div class="n">' + promedio + '</div><div class="l">Calificación promedio</div></div>' +
        '</div>' +
        '<svg class="trend-svg" viewBox="0 0 200 40" preserveAspectRatio="none"><polyline points="' + sparkPath(hist).split(' ').map(function(pt){ var xy=pt.split(','); return xy[0]+','+(parseFloat(xy[1])*1.5); }).join(' ') + '" fill="none" stroke="#f65334" stroke-width="2.5"/></svg>' +
        '<div class="informe-narrative">' +
          '<p><b>' + p.name + '</b> juega como <b>' + posName(p.pos) + '</b> en ' + p.categoria + '. En lo que va del semestre acumula ' + hist.length + ' registros — ' + entrenamientos.length + ' entrenamientos y ' + partidos.length + ' partidos — y su valoración pasó de ' + startVal + ' a ' + p.valoracion + ' puntos.</p>' +
          '<p><b>En los entrenamientos:</b> promedia ' + (avgRating(entrenamientos)!=null ? avgRating(entrenamientos).toFixed(1) : '—') + '/10 en calificación general, y ' + tendenciaTxt + '. En cuanto a asistencia, ' + pctNarrativeTxt + '.' + (topMention ? ' La cualidad que más se repitió en las retroalimentaciones del profesor fue <b>' + topMention + '</b>.' : '') + '</p>' +
          (partidos.length ? '<p><b>En los partidos:</b> jugó ' + partidos.length + ' con una calificación promedio de ' + avgPartidos.toFixed(1) + '/10, sumando ' + p.goles + ' goles y ' + p.asistencias + ' asistencias.' + (mejorPartido ? ' Su mejor actuación fue el ' + fmtDate(mejorPartido.date) + ', con calificación ' + mejorPartido.rating + '/10.' : '') + '</p>' : '<p><b>En los partidos:</b> todavía no tiene partidos registrados este semestre.</p>') +
          '<p><b>Fortalezas:</b> ' + fortalezasTxt + '. <b>Puntos a mejorar:</b> ' + mejorarTxt + '.</p>' +
          (mejorSesion ? '<p>Su mejor registro individual fue el ' + fmtDate(mejorSesion.date) + (mejorSesion.type==='partido'?' (partido)':' (entrenamiento)') + ': "' + mejorSesion.comment + '"</p>' : '') +
        '</div>' +
        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px;">' +
          '<div>' +
            '<div class="attr-row-top" style="margin-bottom:8px;"><span class="name">Fortalezas</span></div>' +
            attrListHtml(fortalezas, 'Aún no hay suficientes calificaciones por atributo.') +
          '</div>' +
          '<div>' +
            '<div class="attr-row-top" style="margin-bottom:8px;"><span class="name">Puntos a mejorar</span></div>' +
            attrListHtml(mejorar, 'No hay atributos por debajo de 6/10 todavía.') +
          '</div>' +
        '</div>' +
        '<div style="margin-top:22px;padding-top:16px;border-top:1px solid var(--border);">' +
          '<div class="attr-row-top" style="margin-bottom:10px;"><span class="name">Historial completo — cada entrenamiento y cada partido</span></div>' +
          '<div class="timeline" style="max-height:none;">' + fullTimelineHtml() + '</div>' +
        '</div>' +
      '</div>';
  }
  sel.onchange = function(){ renderFor(sel.value); };
  renderFor(players[0].id);
  return el;
}

/* ============ MAIN RENDER ============ */
function goToLanding(){
  state.enteredClub = null;
  persist();
  render();
}
function enterClub(clubId){
  state.enteredClub = clubId;
  currentView = 'entrenamiento';
  persist();
  render();
}

function renderLanding(){
  var root = document.getElementById('landingRoot');
  root.innerHTML =
    '<div class="landing">' +
      '<div class="landing-nav"><div class="brand-mark"><b>Arena Sports</b> · Perfil de Jugador</div></div>' +
      '<div class="landing-hero">' +
        '<div class="eyebrow">Plataforma de cartas deportivas</div>' +
        '<h1>Cada jugador, con su propia carta</h1>' +
        '<p>Cada club lleva el control de entrenamientos y partidos de sus jugadores, y cada jugador tiene una carta que sube o baja según su desempeño real — no una foto fija, algo vivo.</p>' +
      '</div>' +
      '<div class="landing-clubs">' +
        '<h2>Clubes afiliados</h2>' +
        '<div class="club-grid" id="clubGrid"></div>' +
      '</div>' +
      '<div class="landing-foot">Arena Sports — sistema de cartas y entrenamientos</div>' +
    '</div>';

  var grid = root.querySelector('#clubGrid');
  var logoImg = document.querySelector('.brand img');
  var logoSrc = logoImg ? logoImg.src : '';
  CLUBS.forEach(function(club){
    var card = document.createElement('div');
    card.className = 'club-card';
    card.innerHTML =
      '<img alt="' + club.name + '" />' +
      '<div><div class="name">' + club.name + '</div><div class="meta">' + club.tagline + ' · ' + club.categories.length + ' categorías</div></div>';
    card.querySelector('img').src = logoSrc;
    card.onclick = function(){ enterClub(club.id); };
    grid.appendChild(card);
  });

  var addCard = document.createElement('div');
  addCard.className = 'club-card-add';
  addCard.innerHTML = '<b>¿Tu club quiere sumarse?</b><a href="mailto:contacto@arenasports.co">Escríbenos</a>';
  grid.appendChild(addCard);
}

function render(){
  if(!state.enteredClub){
    document.getElementById('appRoot').style.display = 'none';
    document.getElementById('landingRoot').style.display = 'block';
    renderLanding();
    return;
  }
  document.getElementById('landingRoot').style.display = 'none';
  document.getElementById('appRoot').style.display = '';

  var vv = visibleViews();
  if(!vv.some(function(v){return v.id===currentView;})) currentView = vv[0].id;
  renderChrome();
  renderNav();
  var main = document.getElementById('mainView');
  main.innerHTML = '';
  var inner = document.createElement('div');
  inner.className = 'main-inner';
  main.appendChild(inner);
  var view;
  if(currentView==='entrenamiento') view = renderEntrenamiento();
  else if(currentView==='partido') view = renderPartido();
  else if(currentView==='cartas') view = renderCartas();
  else if(currentView==='perfil') view = renderPerfil();
  else view = renderInforme();
  inner.appendChild(view);

  var backTopbar = document.querySelector('.topbar-mobile');
  var backSidebar = document.querySelector('.brand');
  if(backTopbar) backTopbar.onclick = goToLanding;
  if(backSidebar) backSidebar.onclick = goToLanding;
}

function showBrokenDataScreen(){
  try{ localStorage.removeItem(STORAGE_KEY); }catch(e2){}
  document.getElementById('mainView').innerHTML =
    '<div style="max-width:420px;margin:60px auto;text-align:center;">' +
      '<p style="color:var(--ink-muted);font-size:14px;margin-bottom:16px;">Esta vista previa tenía datos guardados de una versión anterior y no cargó bien. Se limpiaron esos datos de prueba — recarga la página para empezar de cero.</p>' +
      '<button onclick="location.reload()" style="background:var(--orange-500);border:none;color:white;font-weight:600;padding:10px 20px;border-radius:8px;cursor:pointer;">Recargar</button>' +
    '</div>';
}
function safeRender(){
  try{ render(); }catch(e){ showBrokenDataScreen(); }
}

document.getElementById('landingRoot').innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--ink-faint);font-size:13px;">Cargando…</div>';
document.getElementById('landingRoot').style.display = 'block';

if(window.firebase && window.FIREBASE_CONFIG){
  try{
    firebase.initializeApp(window.FIREBASE_CONFIG);
    window.db = firebase.firestore();
    window.STATE_DOC_REF = db.collection('appState').doc('perfilJugador');

    STATE_DOC_REF.get().then(function(doc){
      if(doc.exists){
        state = normalizeState(doc.data()) || freshState();
      } else {
        bootFromLocalOrFresh();
        persist(); // siembra el documento en Firestore la primera vez
      }
    }).catch(function(err){
      console.error('No se pudo leer Firestore, usando datos locales', err);
      bootFromLocalOrFresh();
    }).then(function(){
      safeRender();
      STATE_DOC_REF.onSnapshot({includeMetadataChanges:true}, function(snap){
        if(snap.metadata.hasPendingWrites) return; // eco de nuestra propia escritura, ya se renderizó
        if(snap.exists){
          var normalized = normalizeState(snap.data());
          if(normalized){ state = normalized; safeRender(); }
        }
      });
    });
  }catch(e){
    console.error('Firebase no se pudo inicializar, usando solo almacenamiento local', e);
    bootFromLocalOrFresh();
    safeRender();
  }
} else {
  bootFromLocalOrFresh();
  safeRender();
}
})();
</script>
</body>
</html>
